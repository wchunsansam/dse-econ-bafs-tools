<h1 id="page-title">🏦 DSE ECON｜銀行存款創造模擬器</h1>

  </div>

      <div class="ratio-row">
        <label id="label-init-c">初始存款 ($)：</label>
        <input type="number" id="current-init" value="10000" style="padding:6px;width:100%;font-size:14px;">
      </div>
      <div class="ratio-row">
        <label id="label-rr-c">法定儲備率：</label>
        <div class="ratio-inputs">
          <input type="number" id="current-rr-pct" value="10" step="0.01">
          <span>%</span>
          <input type="number" id="current-rr-dec" value="0.1" step="0.0001">
          <span id="label-dec">實數</span>
        </div>
      </div>
      <div class="ratio-row">
        <label id="label-er-c">超額儲備率：</label>
        <div class="ratio-inputs">
          <input type="number" id="current-er-pct" value="0" step="0.01">
          <span>%</span>
          <input type="number" id="current-er-dec" value="0" step="0.0001">
          <span>實數</span>
        </div>
      </div>
      <div class="ratio-row">
        <label id="label-cl-c">現金外流率：</label>
        <div class="ratio-inputs">
          <input type="number" id="current-cl-pct" value="0" step="0.01">
          <span>%</span>
          <input type="number" id="current-cl-dec" value="0" step="0.0001">
          <span>實數</span>
        </div>
      </div>
    </div>

    <div class="scenario-box new">
      <div class="scenario-title" id="title-new">🔄 新增情況（變化後）</div>
      <div class="ratio-row">
        <label id="label-init-n">初始存款 ($)：</label>
        <input type="number" id="new-init" value="10000" style="padding:6px;width:100%;font-size:14px;">
      </div>
      <div class="ratio-row">
        <label id="label-rr-n">法定儲備率：</label>
        <div class="ratio-inputs">
          <input type="number" id="new-rr-pct" value="20" step="0.01">
          <span>%</span>
          <input type="number" id="new-rr-dec" value="0.2" step="0.0001">
          <span>實數</span>
        </div>
      </div>
      <div class="ratio-row">
        <label id="label-er-n">超額儲備率：</label>
        <div class="ratio-inputs">
          <input type="number" id="new-er-pct" value="0" step="0.01">
          <span>%</span>
          <input type="number" id="new-er-dec" value="0" step="0.0001">
          <span>實數</span>
        </div>
      </div>
      <div class="ratio-row">
        <label id="label-cl-n">現金外流率：</label>
        <div class="ratio-inputs">
          <input type="number" id="new-cl-pct" value="0" step="0.01">
          <span>%</span>
          <input type="number" id="new-cl-dec" value="0" step="0.0001">
          <span>實數</span>
        </div>
      </div>
    </div>
  </div>

  <button class="run-btn" onclick="runSimulation()" id="btn-run">執行模擬及對比</button>
</div>

<div id="output"></div>

<!-- ===== 答題技巧模組 ===== -->

// ========== 比率雙向換算 ==========
function initRatioSync() {
  const pairs = ['current-rr','current-er','current-cl','new-rr','new-er','new-cl'];
  pairs.forEach(prefix => {
    const pctEl = document.getElementById(prefix + '-pct');
    const decEl = document.getElementById(prefix + '-dec');
    pctEl.addEventListener('input', function() {
      const val = Number(this.value);
      if(!isNaN(val)) decEl.value = (val / 100).toFixed(4);
    });
    decEl.addEventListener('input', function() {
      const val = Number(this.value);
      if(!isNaN(val)) pctEl.value = (val * 100).toFixed(2);
    });
  });
}

function getScenarioParams(prefix) {
  return {
    initDeposit: Number(document.getElementById(prefix + '-init').value),
    rr: Number(document.getElementById(prefix + '-rr-dec').value),
    er: Number(document.getElementById(prefix + '-er-dec').value),
    cl: Number(document.getElementById(prefix + '-cl-dec').value)
  };
}

function calculateScenario(params, displayRounds) {
  const { initDeposit, rr, er, cl } = params;
  const MAX_ROUNDS = 50;
  if(rr <=0 || rr >=1 || er <0 || er >=1 || cl <0 || cl >=1) return null;

  const maxDepMult = 1 / rr;
  const maxLoanMult = maxDepMult - 1;
  const actualDepMult = 1 / (rr + er + cl);
  const actualLoanMult = actualDepMult - 1;
  const totalDeposit = initDeposit * actualDepMult;
  const totalReserve = totalDeposit * (rr + er);
  const totalLoan = totalDeposit - totalReserve;

  let currentNewDeposit = initDeposit;
  let cumDeposit=0, cumReqRes=0, cumExcRes=0, cumCashLeak=0, cumLend=0;
  let rows = [];
  for(let r=1; r<=MAX_ROUNDS; r++){
    const reqRes = currentNewDeposit * rr;
    const excRes = currentNewDeposit * er;
    const cashLeak = currentNewDeposit * cl;
    const lendOut = currentNewDeposit - reqRes - excRes - cashLeak;
    cumDeposit += currentNewDeposit; cumReqRes += reqRes; cumExcRes += excRes;
    cumCashLeak += cashLeak; cumLend += lendOut;
    if(r <= displayRounds){
      rows.push({round:r, newDep:currentNewDeposit, reqRes, excRes, cashLeak, lend:lendOut});
    }
    currentNewDeposit = lendOut;
    if(currentNewDeposit < 0.01) break;
  }
  return {maxDepMult, maxLoanMult, actualDepMult, actualLoanMult, totalDeposit, totalReserve, totalLoan, cumDeposit, cumReqRes, cumExcRes, cumCashLeak, cumLend, rows};
}

  data.rows.forEach((row, idx) => {

      <td>$${row.lend.toLocaleString(undefined,{maximumFractionDigits:2})}</td>

  html += `</tbody><tfoot><tr><td>${txt.totalRow}</td>

  return html;
}

function renderComparisonTable(cur, nw, txt) {
  function fmtC(oldV, newV) {
    const d = newV - oldV, p = oldV !== 0 ? (d/oldV*100) : 0;
    const cls = d > 0 ? 'change-up' : (d < 0 ? 'change-down' : '');
    const s = d > 0 ? '+' : '';
    return `<td class="${cls}">${s}${d.toFixed(3)}</td><td class="${cls}">${s}${p.toFixed(1)}%</td>`;
  }
  function fmtM(oldV, newV) {
    const d = newV - oldV, p = oldV !== 0 ? (d/oldV*100) : 0;
    const cls = d > 0 ? 'change-up' : (d < 0 ? 'change-down' : '');
    const s = d > 0 ? '+' : '';
    return `<td class="${cls}">${s}$${d.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td class="${cls}">${s}${p.toFixed(1)}%</td>`;
  }
  return `<table class="comparison-table"><thead><tr>
    <th>${txt.indicator}</th><th>${txt.currentVal}</th><th>${txt.newVal}</th><th>${txt.change}</th><th>${txt.changePct}</th></tr></thead><tbody>
    <tr><td>${txt.depMult}</td><td>${cur.actualDepMult.toFixed(3)}</td><td>${nw.actualDepMult.toFixed(3)}</td>${fmtC(cur.actualDepMult,nw.actualDepMult)}</tr>
    <tr><td>${txt.loanMult}</td><td>${cur.actualLoanMult.toFixed(3)}</td><td>${nw.actualLoanMult.toFixed(3)}</td>${fmtC(cur.actualLoanMult,nw.actualLoanMult)}</tr>
    <tr><td>${txt.totalDeposit}</td><td>$${cur.totalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtM(cur.totalDeposit,nw.totalDeposit)}</tr>
    <tr><td>${txt.totalLoan}</td><td>$${cur.totalLoan.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalLoan.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtM(cur.totalLoan,nw.totalLoan)}</tr>
    <tr><td>${txt.totalReserve}</td><td>$${cur.totalReserve.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalReserve.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtM(cur.totalReserve,nw.totalReserve)}</tr>
  </tbody></table>`;
}

// ========== 答題技巧：題型檢測 ==========
function detectQuestionTypes(cur, nw) {
  const types = [];
  // 基礎型：無超額、無現金外流
  if(cur.er === 0 && cur.cl === 0) types.push('type1');
  // 超額儲備型
  if(cur.er > 0) types.push('type2','type5');
  // 現金外流型
  if(cur.cl > 0) types.push('type3');
  // 提高儲備率型
  if(nw.rr > cur.rr) types.push('type4','type6');
  // 對比變化型
  if(nw.rr !== cur.rr || nw.er !== cur.er || nw.cl !== cur.cl) types.push('type6');
  
  return [...new Set(types)];
}

function renderSkillContent(cur, nw, txt) {
  const detected = detectQuestionTypes(cur, nw);
  
  // 題型標籤
  let typeHtml = `<p><strong>${txt.matchedType}</strong></p>`;
  detected.forEach(t => { typeHtml += `<span class="question-type-badge">${txt[t]}</span>`; });
  document.getElementById('question-type-area').innerHTML = typeHtml;
  
  // Tab 0: 答題步驟（根據檢測到的第一個題型顯示對應步驟）
  renderStepsTab(detected[0] || 'type1', cur, nw, txt);
  
  // Tab 1: 公式速查
  document.getElementById('tabcontent-1').innerHTML = `
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle1}</div><span class="formula-text">${txt.formulaText1}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle2}</div><span class="formula-text">${txt.formulaText2}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle3}</div><span class="formula-text">${txt.formulaText3}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle4}</div><span class="formula-text">${txt.formulaText4}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle5}</div><span class="formula-text">${txt.formulaText5}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle6}</div><span class="formula-text">${txt.formulaText6}</span></div>
  `;
  
  // Tab 2: 歷屆真題
  document.getElementById('tabcontent-2').innerHTML = `
    <div class="exam-question">
      <div class="exam-year">${txt.exam1Year}</div>
      <div class="exam-text">${txt.exam1Text}</div>
      <button class="toggle-answer" onclick="toggleAnswer(this)">${txt.showAnswer}</button>
      <div class="exam-answer">${txt.exam1Ans.map(a=>`<div class="ans-step">${a}</div>`).join('')}</div>
    </div>
    <div class="exam-question">
      <div class="exam-year">${txt.exam2Year}</div>
      <div class="exam-text">${txt.exam2Text}</div>
      <button class="toggle-answer" onclick="toggleAnswer(this)">${txt.showAnswer}</button>
      <div class="exam-answer">${txt.exam2Ans.map(a=>`<div class="ans-step">${a}</div>`).join('')}</div>
    </div>
    <div class="exam-question">
      <div class="exam-year">${txt.exam3Year}</div>
      <div class="exam-text">${txt.exam3Text}</div>
      <button class="toggle-answer" onclick="toggleAnswer(this)">${txt.showAnswer}</button>
      <div class="exam-answer">${txt.exam3Ans.map(a=>`<div class="ans-step">${a}</div>`).join('')}</div>
    </div>
  `;
  
  // Tab 3: 常見錯誤
  document.getElementById('tabcontent-3').innerHTML = `
    <h4>${txt.errorTitle}</h4>
    <ul class="error-list">
      <li><span class="wrong">✗ ${txt.error1Wrong}</span><br><span class="right">✓ ${txt.error1Right}</span></li>
      <li><span class="wrong">✗ ${txt.error2Wrong}</span><br><span class="right">✓ ${txt.error2Right}</span></li>
      <li><span class="wrong">✗ ${txt.error3Wrong}</span><br><span class="right">✓ ${txt.error3Right}</span></li>
      <li><span class="wrong">✗ ${txt.error4Wrong}</span><br><span class="right">✓ ${txt.error4Right}</span></li>
      <li><span class="wrong">✗ ${txt.error5Wrong}</span><br><span class="right">✓ ${txt.error5Right}</span></li>
    </ul>
  `;
}

function renderStepsTab(type, cur, nw, txt) {
  // 根據題型生成對應的答題步驟，帶入實際參數
  let steps = [];
  const rrPct = (cur.rr*100).toFixed(1);
  const newRRpct = (nw.rr*100).toFixed(1);
  
  if(type === 'type1') {
    steps = [
      {text: `實際儲備率 = 儲備 ÷ 存款 = ${rrPct}%`, mark: '1分', explain: '先從資產負債表計算實際儲備率，這是後續所有計算的基礎。'},
      {text: `最大存款乘數 = 1 ÷ ${rrPct}% = ${(1/cur.rr).toFixed(3)}`, mark: '2分', explain: '在無超額儲備、無現金外流的假設下，乘數 = 1/法定儲備率。'},
      {text: `最大存款總額 = 初始存款 × 乘數 = $${cur.initDeposit.toLocaleString()} × ${(1/cur.rr).toFixed(3)} = $${(cur.initDeposit/cur.rr).toLocaleString(undefined,{maximumFractionDigits:2})}`, mark: '1分', explain: '初始存款乘以乘數就是銀行體系可創造的最大存款總額。'}
    ];
  } else if(type === 'type2' || type === 'type5') {
    const erPct = (cur.er*100).toFixed(1);
    const excessAmt = cur.initDeposit * cur.er;
    steps = [
      {text: `實際儲備率 = 法定儲備率 + 超額儲備率 = ${rrPct}% + ${erPct}% = ${((cur.rr+cur.er)*100).toFixed(1)}%`, mark: '1分', explain: '實際儲備率包含法定要求和銀行自願持有的超額部分。'},
      {text: `超額儲備 = 存款 × 超額儲備率 = $${cur.initDeposit.toLocaleString()} × ${erPct}% = $${excessAmt.toLocaleString(undefined,{maximumFractionDigits:2})}`, mark: '2分', explain: '超額儲備是銀行超過法定要求持有的儲備，公式為 存款 × 超額儲備率。'},
      {text: `超額儲備可創造存款 = 超額儲備 × (1/${rrPct}%) = $${excessAmt.toLocaleString(undefined,{maximumFractionDigits:2})} × ${(1/cur.rr).toFixed(3)}`, mark: '2分', explain: '當銀行貸出超額儲備時，這部分成為新的存款創造基礎。'}
    ];
  } else if(type === 'type3') {
    const clPct = (cur.cl*100).toFixed(1);
    steps = [
      {text: `提款後新儲備 = 原儲備 - 提款金額`, mark: '1分', explain: '提款會同時減少銀行的儲備和存款，必須同時更新兩者。'},
      {text: `實際乘數 = 1 ÷ (法定儲備率 + 現金外流率) = 1 ÷ (${rrPct}% + ${clPct}%) = ${(1/(cur.rr+cur.cl)).toFixed(3)}`, mark: '2分', explain: '現金外流是漏出，會降低實際乘數，公式為 1/(rr+cl)。'},
      {text: `新最大存款 = 新儲備 × 乘數`, mark: '2分', explain: '用更新後的儲備量乘以實際乘數，得到收縮後的最大存款。'},
      {text: `解釋：現金外流意味著公眾持有現金，這部分資金不再進入銀行體系循環`, mark: '1分', explain: '必須解釋背後的經濟邏輯，不能只給計算答案。'}
    ];
  } else if(type === 'type4' || type === 'type6') {
    const rrDiff = ((nw.rr - cur.rr)*100).toFixed(1);
    steps = [
      {text: `新法定儲備率 = ${rrPct}% + ${rrDiff}% = ${newRRpct}%`, mark: '1分', explain: '先計算提高後的新法定儲備率。'},
      {text: `儲備不足：實際儲備 < 新法定要求，銀行需收回貸款／出售資產`, mark: '1分', explain: '提高儲備率後，銀行原有儲備不足以應付新要求。'},
      {text: `公眾提取存款還款 → 銀行存款進一步減少 → 過程持續直至實際儲備 = 法定儲備`, mark: '2分', explain: '這是存款收縮的因果鏈，步驟順序必須正確，順序錯不給分。'},
      {text: `新最大存款 = 儲備 × (1/${newRRpct}%) = $${cur.initDeposit.toLocaleString()} × ${(1/nw.rr).toFixed(3)} = $${(cur.initDeposit/nw.rr).toLocaleString(undefined,{maximumFractionDigits:2})}`, mark: '2分', explain: '用原有儲備量乘以新乘數，得到收縮後的最大存款。'},
      {text: `ΔDd = 新存款 - 舊存款 = $${(cur.initDeposit/nw.rr - cur.initDeposit/cur.rr).toLocaleString(undefined,{maximumFractionDigits:2})}`, mark: '1分', explain: '計算存款的變化量。'},
      {text: `MS = Cp + Dd，Cp不變 → ΔMS = ΔDd`, mark: '2分', explain: '必須寫明貨幣供應公式和Cp不變的假設，才能得出ΔMS=ΔDd的結論。'}
    ];
  }
  
  let html = `<p><strong>${txt[type]}</strong> — 標準答題步驟（含分數標註）：</p>`;
  steps.forEach((s, i) => {
    html += `<div class="step-item">
      <span class="step-num">${i+1}</span>${s.text}<span class="step-mark">${s.mark}</span>
      <span class="step-toggle" onclick="toggleStepExplain(this)">${txt.showExplain}</span>
      <div class="step-explain">${s.explain}</div>
    </div>`;
  });
  document.getElementById('tabcontent-0').innerHTML = html;
}

function toggleStepExplain(el) {
  const explain = el.nextElementSibling;
  const txt = langPack[currentLang];
  if(explain.classList.contains('show')) {
    explain.classList.remove('show');
    el.innerText = txt.showExplain;
  } else {
    explain.classList.add('show');
    el.innerText = txt.hideExplain;
  }
}

function toggleAnswer(btn) {
  const answer = btn.nextElementSibling;
  const txt = langPack[currentLang];
  if(answer.classList.contains('show')) {
    answer.classList.remove('show');
    btn.innerText = txt.showAnswer;
  } else {
    answer.classList.add('show');
    btn.innerText = txt.hideAnswer;
  }
}

function toggleSkill() {
  const content = document.getElementById('skill-content');
  const toggle = document.getElementById('skill-toggle');
  content.classList.toggle('show');
  toggle.classList.toggle('open');
}

function switchSkillTab(idx) {
  const txt = langPack[currentLang];
  document.querySelectorAll('.skill-tab').forEach((t,i) => {
    t.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.skill-tab-content').forEach((c,i) => {
    c.classList.toggle('active', i === idx);
  });
}

// ========== 主執行函數 ==========
function runSimulation(){
  const txt = langPack[currentLang];
  const displayRounds = Math.max(1, Math.min(50, Number(document.getElementById('displayRounds').value) || 20));
  
  const curParams = getScenarioParams('current');
  const newParams = getScenarioParams('new');
  
  const curData = calculateScenario(curParams, displayRounds);
  const newData = calculateScenario(newParams, displayRounds);
  
  if(!curData || !newData){
    document.getElementById('output').innerHTML = `<div class="box"><p class="error">${txt.errorMsg}</p></div>`;
    return;
  }

  let html = `<div class="box"><h3>${txt.comparisonTitle}</h3>${renderComparisonTable(curData, newData, txt)}</div>`;
  
  html += `<div class="box"><div class="scenario-grid">
    <div><h4>${txt.titleCurrent}</h4>${renderMultiplierCards(curData, txt, false)}</div>
    <div><h4>${txt.titleNew}</h4>${renderMultiplierCards(newData, txt, true)}</div>
  </div></div>`;
  
  html += `<div class="box"><div class="scenario-grid">
    <div><h4>${txt.bsTitleCurrent}</h4>${renderBalanceSheet(curData, txt)}</div>
    <div><h4>${txt.bsTitleNew}</h4>${renderBalanceSheet(newData, txt)}</div>
  </div></div>`;
  
  html += `<div class="box"><h4>${txt.processTitleCurrent}</h4>${renderProcessTable(curData, txt)}
    <div class="section-divider"></div>
    <h4>${txt.processTitleNew}</h4>${renderProcessTable(newData, txt)}</div>`;
  
  html += `<div class="box note"><strong>${txt.noteTitle}</strong>${txt.noteContent}</div>`;
  
  document.getElementById('output').innerHTML = html;
  
  // 更新答題技巧內容
  renderSkillContent(curParams, newParams, txt);
}

// ========== 語言切換 ==========
function switchLanguage(lang) {
  if(!langPack[lang]) return;
  currentLang = lang;
  const txt = langPack[lang];

  document.title = txt.htmlTitle;
  document.getElementById('page-title').innerText = txt.pageTitle;
  document.getElementById('assumption-text').innerText = txt.assumption;
  document.getElementById('label-rounds').innerText = txt.labelRounds;
  document.getElementById('title-current').innerText = txt.titleCurrent;
  document.getElementById('title-new').innerText = txt.titleNew;
  document.getElementById('btn-run').innerText = txt.btnRun;
  document.getElementById('skill-title').innerText = txt.skillTitle;
  
  document.getElementById('tab-0').innerText = txt.tabSteps;
  document.getElementById('tab-1').innerText = txt.tabFormula;
  document.getElementById('tab-2').innerText = txt.tabExam;
  document.getElementById('tab-3').innerText = txt.tabError;
  
  document.querySelectorAll('[id^="label-rr-"], [id^="label-er-"], [id^="label-cl-"], [id^="label-init-"]').forEach(el => {
    const id = el.id;
    if(id.includes('rr')) el.innerText = txt.labelRR;
    else if(id.includes('er')) el.innerText = txt.labelER;
    else if(id.includes('cl')) el.innerText = txt.labelCL;
    else if(id.includes('init')) el.innerText = txt.labelInit;
  });
  
  document.querySelectorAll('.ratio-inputs span:last-child').forEach(el => {
    if(['實數','实数','Decimal'].includes(el.innerText)) el.innerText = txt.labelDec;
  });

  document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+lang).classList.add('active');

  runSimulation();
}

function getLangFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang');
  if(lang && langPack[lang]) return lang;
  return 'zh-hk';
}

window.onload = function(){
  initRatioSync();
  switchLanguage(getLangFromUrl());
};
</script>
