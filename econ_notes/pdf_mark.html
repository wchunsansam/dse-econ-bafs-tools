<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.HTMS_PAGE="app";</script>
<script src="../lib/htms-gate.js"></script>
<title>DSE ECON｜PDF 筆記器</title>
<link rel="stylesheet" href="lib/pdf_mark.css">
</head>
<body class="pdf-mark mark-studio-open">
<div id="mark-overlay" class="mark-overlay is-mouse">
  <div class="mark-chrome" id="mark-chrome">
    <div class="mark-bar">
      <a class="back-link" id="link-back" href="../index.html"><span class="zh">← 返回</span><span class="en" hidden>← Back</span></a>
      <span class="ttl" id="mark-title"></span>
      <div class="seg" id="tb-switch" role="group" aria-label="Textbook" hidden>
        <a id="link-tb-ex" href="#"><span class="zh">書本練習</span><span class="en" hidden>Tb Ex</span></a>
        <a id="link-tb-ans" href="#"><span class="zh">書本答案</span><span class="en" hidden>Tb Ans</span></a>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="btn-zh" class="active">繁</button>
        <button type="button" id="btn-en">EN</button>
      </div>
      <button type="button" class="btn" id="mark-draw-lock"></button>
      <span class="sep"></span>
      <button type="button" class="btn" id="mark-zoom-out">−</button>
      <span id="mark-zoom-lab"></span>
      <button type="button" class="btn" id="mark-zoom-in">+</button>
      <button type="button" class="btn" id="mark-zoom-fit"></button>
      <span class="sep"></span>
      <button type="button" class="btn" id="mark-prev"></button>
      <span id="mark-page-lab"></span>
      <button type="button" class="btn" id="mark-next"></button>
      <span class="sep"></span>
      <button type="button" class="btn primary" id="mark-save"></button>
      <button type="button" class="btn" id="mark-download"></button>
    </div>
    <p class="mark-hint" id="mark-hint"></p>
  </div>
  <div class="mark-stage" id="mark-stage">
    <div class="mark-page" id="mark-page">
      <canvas id="mark-pdf"></canvas>
      <canvas id="mark-ink"></canvas>
    </div>
    <p id="pdf-status" class="mark-status"></p>
  </div>
  <div class="mark-dock" id="mark-dock">
    <button type="button" class="btn" id="mark-tool-pen"></button>
    <button type="button" class="btn" id="mark-tool-line"></button>
    <button type="button" class="btn" id="mark-tool-circle"></button>
    <button type="button" class="btn" id="mark-dash"></button>
    <span class="sep"></span>
    <div class="mark-colors" id="mark-colors"></div>
    <button type="button" class="btn" id="mark-tool-eraser"></button>
    <span class="sep"></span>
    <button type="button" class="btn" id="mark-w1"></button>
    <button type="button" class="btn" id="mark-w2"></button>
    <button type="button" class="btn" id="mark-w3"></button>
    <span class="sep"></span>
    <button type="button" class="btn" id="mark-undo"></button>
    <button type="button" class="btn" id="mark-redo"></button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="lib/pdf_mark.js"></script>
</body>
</html>
