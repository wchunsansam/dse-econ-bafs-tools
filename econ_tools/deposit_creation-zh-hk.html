<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>DSE ECON 存款創造模擬器</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 900px; margin:24px auto; padding:0 16px; }
.box { background:#f7f9fc; padding:20px; border-radius:12px; margin-bottom:16px; }
input { padding:8px; width:220px; font-size:16px; margin:6px 0; }
button { padding:10px 20px; background:#2563eb; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
button:hover { background:#1d4ed8; }
table { width:100%; border-collapse:collapse; margin:12px 0; }
th,td { border:1px solid #ccc; padding:10px; text-align:right; }
th { background:#e2e8f0; }
.note { background:#fff3cd; padding:12px; border-radius:8px; margin-top:12px; }
</style>
</head>
<body>
<h1>🏦 DSE ECON｜銀行存款創造模擬器</h1>
<div class="box">
  <p>✅模擬假設：無現金外流，銀行把全部超額儲備貸出（DSE課本標準假設）</p>
  <div>
    <label>初始存款 ($)：</label><br>
    <input type="number" id="initDeposit" value="10000">
  </div>
  <div>
    <label>法定儲備率 (%)：</label><br>
    <input type="number" id="reservePercent" value="10">
  </div>
  <br>
  <button onclick="runSimulation()">執行模擬</button>
</div>

<div id="output"></div>

<script>
function runSimulation(){
  const initDeposit = Number(document.getElementById("initDeposit").value);
  const reservePercent = Number(document.getElementById("reservePercent").value);
  const reserveRatio = reservePercent / 100;
  const MAX_ROUNDS = 25;

  if(reserveRatio <=0 || reserveRatio >=1){
    document.getElementById("output").innerHTML = "<p style='color:red'>法定儲備率需要介於 0-100 之間</p>";
    return;
  }

  const moneyMultiplier = 1 / reserveRatio;
  const theoreticalTotal = initDeposit * moneyMultiplier;

  let currentNewDeposit = initDeposit;
  let cumulativeDeposit = 0;
  let rows = [];

  for(let r=1; r<=MAX_ROUNDS; r++){
    const reserve = currentNewDeposit * reserveRatio;
    const lendOut = currentNewDeposit - reserve;
    cumulativeDeposit += currentNewDeposit;
    rows.push({
      round:r,
      newDep:currentNewDeposit,
      res:reserve,
      lend:lendOut
    })
    currentNewDeposit = lendOut;
    if(currentNewDeposit < 0.01) break;
  }

  let html = `<div class="box">
  <h3>📊模擬結果</h3>
  <p>初始存款：$${initDeposit.toLocaleString()}</p>
  <p>法定儲備率：${reservePercent} %</p>
  <p>貨幣乘數 (1/rr)：${moneyMultiplier.toFixed(3)}</p>
  <p>理論最終存款總額：$${theoreticalTotal.toLocaleString()}</p>
  <p>模擬累計存款：$${cumulativeDeposit.toLocaleString()}</p>

  <table>
    <tr>
      <th>輪數</th>
      <th>新增存款</th>
      <th>法定儲備</th>
      <th>可貸出金額</th>
    </tr>`;

  for(const row of rows){
    html += `<tr>
      <td>${row.round}</td>
      <td>$${row.newDep.toLocaleString()}</td>
      <td>$${row.res.toLocaleString()}</td>
      <td>$${row.lend.toLocaleString()}</td>
    </tr>`;
  }

  html += `</table>
  <div class="note">
  ⚠️DSE課堂備註：
  本模擬假設沒有現金外流、銀行不留超額儲備。現實世界，現金外流或銀行持有超額儲備，會令實際貨幣乘數比數值更小。
  </div>
  </div>`;

  document.getElementById("output").innerHTML = html;
}
window.onload = runSimulation;
</script>
</body>
</html>
