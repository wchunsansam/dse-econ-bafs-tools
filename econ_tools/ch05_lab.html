<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.HTMS_PAGE="app";</script>
<script src="../lib/htms-gate.js"></script>
<title>DSE ECON｜Ch.5 互動教具</title>
<style>
:root{
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1e40af;
  --bg:#f7f9fc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --radius:12px;
}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;color:var(--text);background:var(--bg);line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:16px 18px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.back-link{color:var(--primary);text-decoration:none;font-size:14px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:44px;touch-action:manipulation}
.seg button+button{border-left:1px solid var(--border)}
.seg button.active{background:var(--primary);color:#fff}
h1{font-size:24px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:44px;touch-action:manipulation}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.panel.active{display:block}
h2{font-size:20px;margin:0 0 8px;color:var(--primary-dark)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
button.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;min-height:44px;touch-action:manipulation}
button.btn.primary{background:var(--primary);color:#fff}
button.btn.ghost{background:#fff;border:1px solid var(--border)}
.quiz{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fff;min-height:44px}
.item.ok{background:#ecfdf5;border-color:#86efac}
.item.bad{background:#fef2f2;border-color:#fca5a5}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{font-size:13px;min-height:44px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0 0 12px}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px}
input[type=number]{font-size:18px;padding:10px;border:1px solid var(--border);border-radius:8px;width:100%}
.result{margin-top:14px;padding:14px;border-radius:10px;background:var(--primary-light);border:1px solid #bfdbfe}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--border);padding:8px;text-align:center}
.en[hidden],.zh[hidden]{display:none!important}
.muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back-link" id="link-home" href="../index.html"><span class="zh">← 返回首頁</span><span class="en" hidden>← Home</span></a>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="back-link" id="link-notes" href="../econ_notes/ch05_short_run_long_run.html"><span class="zh">開啟筆記</span><span class="en" hidden>Open notes</span></a>
      <div class="seg">
        <button type="button" id="btn-zh" class="active">繁</button>
        <button type="button" id="btn-en">EN</button>
      </div>
    </div>
  </div>
  <h1><span class="zh">第 5 章互動教具</span><span class="en" hidden>Chapter 5 interactive lab</span></h1>
  <p class="lead"><span class="zh">課堂投影或學生自用。先選一個教具。繁／EN 會切換全部介面。</span><span class="en" hidden>For projection or student use. Pick a tool. 繁 / EN switches the whole interface.</span></p>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<script>
const TOOLS = [
  {id:"run", zh:"短期還是長期", en:"Short run or long run"},
  {id:"mp", zh:"邊際產量何時下降", en:"When marginal product falls"},
  {id:"scale", zh:"規模經濟還是規模負經濟", en:"Economies or diseconomies"}
];
let lang = "zh";
const t = (zh, en) => lang === "en" ? en : zh;
const $ = (id) => document.getElementById(id);

function setLang(en, keepTool){
  lang = en ? "en" : "zh";
  document.documentElement.lang = en ? "en" : "zh-HK";
  document.querySelectorAll(".zh").forEach(el => { el.hidden = !!en; });
  document.querySelectorAll(".en").forEach(el => { el.hidden = !en; });
  $("btn-en").classList.toggle("active", en);
  $("btn-zh").classList.toggle("active", !en);
  const params = new URLSearchParams(location.search);
  params.set("lang", en ? "en" : "zh-hk");
  const active = document.querySelector(".tabs button.active");
  const id = (keepTool && active) ? active.dataset.id : ((location.hash||"#run").replace("#","") || "run");
  history.replaceState(null, "", "?" + params.toString() + "#" + id);
  $("link-home").href = "../index.html?lang=" + (en ? "en" : "zh-hk");
  $("link-notes").href = "../econ_notes/ch05_short_run_long_run.html?lang=" + (en ? "en" : "zh-hk");
  document.title = t("DSE ECON｜Ch.5 互動教具","DSE ECON | Ch.5 interactive lab");
  renderShell();
  show(TOOLS.some(x=>x.id===id)?id:"run");
}
function renderShell(){
  $("tabs").innerHTML = TOOLS.map(x => `<button type="button" data-id="${x.id}">${t(x.zh, x.en)}</button>`).join("");
  $("tabs").onclick = (e) => { const b = e.target.closest("button"); if(b) show(b.dataset.id); };
}
function show(id){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const mount = $("panels");
  mount.oninput = null;
  mount.onclick = null;
  const makers = {run:runHTML, mp:mpHTML, scale:scaleHTML};
  const inits = {run:initRun, mp:initMp, scale:initScale};
  mount.innerHTML = makers[id]();
  mount.querySelector(".panel").classList.add("active");
  inits[id]();
  document.querySelectorAll(".zh").forEach(el => { el.hidden = lang === "en"; });
  document.querySelectorAll(".en").forEach(el => { el.hidden = lang !== "en"; });
  const params = new URLSearchParams(location.search);
  history.replaceState(null, "", "?" + params.toString() + "#" + id);
}
function paintQuiz(listId, scoreId, items, state, labels){
  const el = $(listId);
  el.innerHTML = items.map((g,i)=>{
    const st = state[i];
    const done = st.pick != null;
    const ok = st.pick === g.ans;
    const cls = !done ? "" : ok ? "ok" : "bad";
    const btns = labels.map(k => `<button class="btn ${st.pick===k?"primary":"ghost"}" data-i="${i}" data-v="${k}">${t(g.lab[k].zh, g.lab[k].en)}</button>`).join("");
    const why = done && ok ? `<div class="muted">${t(g.why_zh, g.why_en)}</div>` : "";
    return `<div class="item ${cls}"><div><strong>${t(g.zh,g.en)}</strong>${why}</div><div class="choice">${btns}</div></div>`;
  }).join("");
  const scored = items.map((g,i)=> state[i].pick == null ? null : state[i].pick === g.ans);
  const done = scored.filter(x => x !== null).length;
  const ok = scored.filter(x => x === true).length;
  $(scoreId).textContent = done ? t(`已答 ${done}／${items.length}，答對 ${ok}`, `${done}/${items.length} answered, ${ok} correct`) : t("點按鈕分類","Tap a button to classify");
}

const RL = {
  vf:{zh:"可變",en:"Variable"},
  ff:{zh:"固定",en:"Fixed"},
  sr:{zh:"短期",en:"Short run"},
  lr:{zh:"長期",en:"Long run"}
};
const RUN = [
  {zh:"請茶延長一小時的電費", en:"Try Tea’s electricity fee for one extra hour", ans:"vf", lab:RL, why_zh:"隨多開的時段上升。", why_en:"It rises with the extra hour."},
  {zh:"請茶的舖租", en:"The rent of the Try Tea shop", ans:"ff", lab:RL, why_zh:"不隨這一小時的杯數改變。", why_en:"It does not change with the cups sold in that hour."},
  {zh:"同一間舖，小麗多請小新", en:"Eslyn hires Sam in the same shop", ans:"sr", lab:RL, why_zh:"舖是固定生產要素。", why_en:"The shop is a fixed factor."},
  {zh:"小麗加開分店，同時多請人和多租舖", en:"Eslyn opens another branch, hires more people and rents more space", ans:"lr", lab:RL, why_zh:"題目裡的生產要素全部變動。", why_en:"Every factor mentioned varies."},
  {zh:"印刷公司多租機器，員工人數不變", en:"A printer rents more machines and keeps the same staff", ans:"sr", lab:RL, why_zh:"員工是固定生產要素。時間長短不是準則。", why_en:"Staff are a fixed factor. The length of time is not the test."}
];
function runHTML(){
  return `<div class="panel">
    <h2>${t("有一個固定生產要素，就是短期","One fixed factor means the short run")}</h2>
    <p class="hint">${t("證明：電費可以是可變成本，租金可以是固定成本；兩個月或數年都不是短期和長期的分別。","Shows that electricity can be a variable cost and rent a fixed cost, and that two months or several years is not what separates the short run from the long run.")}</p>
    <div class="quiz" id="run-list"></div>
    <p id="run-score" class="hint"></p>
  </div>`;
}
function initRun(){
  const state = RUN.map(()=>({pick:null}));
  const paint = () => paintQuiz("run-list","run-score",RUN,state,["vf","ff","sr","lr"]);
  $("run-list").onclick = (e) => {
    const b = e.target.closest("button");
    if(!b) return;
    state[+b.dataset.i].pick = b.dataset.v;
    paint();
  };
  paint();
}

function mpHTML(){
  return `<div class="panel">
    <h2>${t("邊際產量下降時，總產量仍可以上升","Total product can still rise when marginal product falls")}</h2>
    <p class="hint">${t("請茶同一間舖。改每多一人的總杯數。邊際產量 = 這一單位的總產量 − 上一單位的總產量。","The same Try Tea shop. Change total cups as each extra person is added. Marginal product = this unit’s total product − the previous unit’s.")}</p>
    <div class="row" id="mp-inputs"></div>
    <div class="result" id="mp-out"></div>
  </div>`;
}
function initMp(){
  const defaults = [8, 20, 36, 48, 56, 60];
  $("mp-inputs").innerHTML = defaults.map((v,i)=>`<label class="field">${t("第","Unit ")}${i+1}${t("人的總杯數"," total cups")}<input data-i="${i}" type="number" value="${v}"></label>`).join("");
  const paint = () => {
    const tp = [...$("mp-inputs").querySelectorAll("input")].map(el => Number(el.value));
    const mp = tp.map((v,i) => v - (i ? tp[i-1] : 0));
    const ap = tp.map((v,i) => v / (i+1));
    let fall = 0;
    for(let i=1;i<mp.length;i++){ if(mp[i] < mp[i-1]){ fall = i+1; break; } }
    const rows = tp.map((v,i)=>`<tr><td>${i+1}</td><td>${v}</td><td>${Math.round(ap[i]*100)/100}</td><td>${mp[i]}</td></tr>`).join("");
    const head = lang==="en"
      ? "<tr><th>People</th><th>Total product</th><th>Average product</th><th>Marginal product</th></tr>"
      : "<tr><th>人數</th><th>總產量</th><th>平均產量</th><th>邊際產量</th></tr>";
    let line;
    if(!fall){
      line = lang==="en" ? "Marginal product has not fallen yet. The law has not set in on these numbers." : "這些數字裡，邊際產量尚未下降。定律還未開始適用。";
    } else {
      const still = tp[fall-1] > tp[fall-2];
      line = lang==="en"
        ? `Marginal product starts to fall at person ${fall}. Total product is ${still ? "still rising" : "no longer rising"}.`
        : `邊際產量在第 ${fall} 人開始下降。總產量${still ? "仍然上升" : "不再上升"}。`;
    }
    $("mp-out").innerHTML = `<table>${head}${rows}</table><p>${line}</p><p class="muted">${lang==="en" ? "A fall in marginal product is not, by itself, diseconomies of scale. The shop is still fixed." : "邊際產量下降本身不是規模負經濟。舖仍然是固定的。"}</p>`;
  };
  $("panels").oninput = paint;
  paint();
}

function scaleHTML(){
  return `<div class="panel">
    <h2>${t("先比較兩個百分比，再問是誰在擴大","Compare the two percentages, then ask who is expanding")}</h2>
    <p class="hint">${t("長期，所有生產要素都可變。產量上升的百分比大於總成本，長期平均成本下降。","In the long run every factor can vary. If output rises by a larger percentage than total cost, long run average cost falls.")}</p>
    <div class="row">
      <label class="field">${t("原來產量","Output before")}<input id="q1" type="number" value="100"></label>
      <label class="field">${t("原來總成本","Total cost before")}<input id="c1" type="number" value="600"></label>
      <label class="field">${t("其後產量","Output after")}<input id="q2" type="number" value="140"></label>
      <label class="field">${t("其後總成本","Total cost after")}<input id="c2" type="number" value="780"></label>
    </div>
    <div class="result" id="scale-out"></div>
    <div class="quiz" id="scale-list" style="margin-top:16px"></div>
    <p id="scale-score" class="hint"></p>
  </div>`;
}
const SL = {
  ie:{zh:"內部規模經濟",en:"Internal economies"},
  id:{zh:"內部規模負經濟",en:"Internal diseconomies"},
  ee:{zh:"外部規模經濟",en:"External economies"},
  ed:{zh:"外部規模負經濟",en:"External diseconomies"}
};
const SCALE = [
  {zh:"請茶自己多開分店，廣告費攤分到更多杯", en:"Try Tea itself opens more branches and spreads advertising over more cups", ans:"ie", lab:SL, why_zh:"自己的規模擴大，平均成本下降。", why_en:"Its own scale rises and average cost falls."},
  {zh:"請茶分店太多，小麗要開三次會才改到菜單", en:"Try Tea has so many branches that Eslyn needs three meetings to change the menu", ans:"id", lab:SL, why_zh:"自己的規模過大，管理效率下降。", why_en:"Its own scale is too large, so managerial efficiency falls."},
  {zh:"整條街都是茶店後，茶葉供應商願意送貨上門", en:"After the whole street becomes tea shops, tea suppliers will deliver", ans:"ee", lab:SL, why_zh:"好處來自行業聚集，不是請茶單獨擴大。", why_en:"The advantage comes from the industry cluster, not from Try Tea expanding alone."},
  {zh:"更多茶店開業後，請茶要提高時薪才請到人", en:"After more tea shops open, Try Tea must raise hourly wages to hire", ans:"ed", lab:SL, why_zh:"行業擴大，勞力需求上升，工資上升。", why_en:"The industry expands, the demand for labour rises, and wages rise."}
];
function initScale(){
  const paint = () => {
    const q1 = Number($("q1").value), c1 = Number($("c1").value), q2 = Number($("q2").value), c2 = Number($("c2").value);
    const pq = q1 ? (q2-q1)/q1*100 : 0;
    const pc = c1 ? (c2-c1)/c1*100 : 0;
    const ac1 = q1 ? c1/q1 : 0, ac2 = q2 ? c2/q2 : 0;
    let kind;
    if(ac2 < ac1) kind = lang==="en" ? "Economies of scale: long run average cost falls." : "規模經濟：長期平均成本下降。";
    else if(ac2 > ac1) kind = lang==="en" ? "Diseconomies of scale: long run average cost rises." : "規模負經濟：長期平均成本上升。";
    else kind = lang==="en" ? "Long run average cost is unchanged." : "長期平均成本不變。";
    const r = (n) => Math.round(n*10)/10;
    $("scale-out").innerHTML = lang==="en"
      ? `<p>Output changes by ${r(pq)}%. Total cost changes by ${r(pc)}%.</p><p>Average cost moves from ${r(ac1)} to ${r(ac2)}.</p><p><strong>${kind}</strong></p>`
      : `<p>產量變動 ${r(pq)}%。總成本變動 ${r(pc)}%。</p><p>平均成本由 ${r(ac1)} 變為 ${r(ac2)}。</p><p><strong>${kind}</strong></p>`;
  };
  $("panels").oninput = paint;
  paint();
  const state = SCALE.map(()=>({pick:null}));
  const paintQ = () => paintQuiz("scale-list","scale-score",SCALE,state,["ie","id","ee","ed"]);
  $("scale-list").onclick = (e) => {
    const b = e.target.closest("button");
    if(!b) return;
    state[+b.dataset.i].pick = b.dataset.v;
    paintQ();
  };
  paintQ();
}

$("btn-zh").onclick = () => setLang(false, true);
$("btn-en").onclick = () => setLang(true, true);
window.addEventListener("hashchange", () => {
  const id = (location.hash || "#run").replace("#","");
  if(TOOLS.some(x => x.id === id)) show(id);
});
const q = new URLSearchParams(location.search);
const start = (location.hash||"#run").replace("#","");
setLang(q.get("lang")==="en", false);
if(TOOLS.some(x=>x.id===start)) show(start);
</script>
</body>
</html>
