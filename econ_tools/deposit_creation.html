<title>DSE ECON 存款創造模擬器</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 1150px; margin:24px auto; padding:0 16px; }
.lang-bar { text-align:right; margin-bottom:12px; }

.mode-btn.active-contraction { border-color:#dc2626; background:#fef2f2; color:#991b1b; }
.scenario-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
.scenario-box { background:white; padding:16px; border-radius:10px; border:2px solid #e2e8f0; }
.scenario-box.current { border-color:#3b82f6; }
.scenario-box.new { border-color:#10b981; }
.scenario-title { font-weight:bold; font-size:17px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #e2e8f0; }
.scenario-box.current .scenario-title { color:#1d4ed8; }
.scenario-box.new .scenario-title { color:#047857; }
.ratio-row { margin:8px 0; }
.ratio-row label { display:block; font-size:14px; margin-bottom:4px; font-weight:500; }
.ratio-inputs { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.ratio-inputs input { padding:6px; width:90px; font-size:14px; }
.ratio-inputs span { font-size:13px; color:#555; }
.common-settings { display:flex; align-items:center; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
.common-settings input { padding:6px; width:80px; font-size:14px; }
.toggle-compare-btn { width:100%; padding:10px; background:#f1f5f9; border:2px dashed #94a3b8; border-radius:8px; cursor:pointer; font-size:14px; color:#475569; margin-top:12px; }
.toggle-compare-btn:hover { background:#e2e8f0; }
.comparison-area { display:none; }
.comparison-area.show { display:block; }
button.run-btn { padding:12px 28px; background:#2563eb; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-top:12px; }
button.run-btn:hover { background:#1d4ed8; }
table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; }
th,td { border:1px solid #ccc; padding:8px; text-align:right; }
th:first-child, td:first-child { text-align:center; }
th:last-child, td:last-child { text-align:left; }
th { background:#e2e8f0; }
tfoot td { font-weight:bold; background:#eef2ff; }
.bs-table { width:100%; margin:8px 0; font-size:13px; }
.bs-table th { background:#dce5f5; }
.contraction-stages { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:12px 0; }
.stage-card { background:white; border:1px solid #e5e7eb; border-radius:8px; padding:10px; font-size:13px; }
.stage-card.stage-final { border:2px solid #dc2626; background:#fef2f2; }
.stage-card h5 { margin:0 0 6px 0; font-size:13px; }
.note { background:#fff3cd; padding:12px; border-radius:8px; margin-top:12px; }
.error { color:red; }
.multiplier-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
.multi-card { background:#eef2ff; padding:12px; border-radius:8px; }
.multi-card.max { background:#ecfdf5; }
.multi-card.new-card { background:#f0fdf4; border:1px solid #86efac; }
h3 { margin-top:20px; margin-bottom:8px; }
h4 { margin:8px 0; }
.comparison-table { width:100%; margin:12px 0; }
.comparison-table th { background:#dbeafe; }
.comparison-table .change-up { color:#dc2626; font-weight:bold; }
.comparison-table .change-down { color:#16a34a; font-weight:bold; }
.section-divider { border-top:2px dashed #cbd5e1; margin:24px 0; padding-top:8px; }
.hidden { display:none !important; }
.skill-section { background:#fffbeb; border:2px solid #fbbf24; border-radius:12px; padding:20px; margin-bottom:16px; }
.skill-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.skill-header h2 { margin:0; font-size:20px; color:#92400e; }
.skill-toggle { font-size:24px; color:#92400e; transition:transform 0.3s; }
.skill-toggle.open { transform:rotate(45deg); }
.skill-content { display:none; margin-top:16px; }
.skill-content.show { display:block; }
.question-type-badge { display:inline-block; background:#fef3c7; border:1px solid #f59e0b; color:#92400e; padding:8px 16px; border-radius:20px; font-weight:bold; margin:8px 4px; font-size:14px; }
.skill-tabs { display:flex; gap:4px; margin:16px 0; flex-wrap:wrap; }
.skill-tab { padding:8px 16px; background:#e5e7eb; border:none; border-radius:8px 8px 0 0; cursor:pointer; font-size:14px; font-weight:500; }
.skill-tab.active { background:#fbbf24; color:#78350f; }
.skill-tab-content { display:none; background:white; padding:16px; border-radius:0 8px 8px 8px; border:1px solid #e5e7eb; }
.skill-tab-content.active { display:block; }
.step-item { background:#f9fafb; border-left:4px solid #3b82f6; padding:10px 14px; margin:8px 0; border-radius:0 6px 6px 0; }
.step-item .step-num { display:inline-block; background:#3b82f6; color:white; width:24px; height:24px; border-radius:50%; text-align:center; line-height:24px; font-size:13px; font-weight:bold; margin-right:8px; }
.step-item .step-mark { display:inline-block; background:#dbeafe; color:#1e40af; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:bold; margin-left:8px; }
.step-explain { color:#6b7280; font-size:13px; margin-top:6px; padding-left:32px; display:none; }
.step-explain.show { display:block; }
.step-toggle { color:#3b82f6; font-size:12px; cursor:pointer; margin-left:8px; }
.formula-card { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:14px; margin:10px 0; }
.formula-card .formula-title { font-weight:bold; color:#1e40af; margin-bottom:6px; }
.formula-card .formula-text { font-family:monospace; font-size:15px; background:white; padding:8px; border-radius:4px; display:block; }
.exam-question { background:#fafafa; border:1px solid #e5e7eb; border-radius:8px; padding:14px; margin:12px 0; }
.exam-question .exam-year { font-weight:bold; color:#7c3aed; font-size:14px; }
.exam-question .exam-text { margin:8px 0; line-height:1.7; }
.exam-answer { display:none; background:#f0fdf4; border-left:4px solid #22c55e; padding:12px; margin-top:10px; border-radius:0 6px 6px 0; }
.exam-answer.show { display:block; }
.exam-answer .ans-step { margin:4px 0; padding-left:16px; }
.toggle-answer { background:#22c55e; color:white; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-top:8px; }
.error-list { list-style:none; padding:0; }
.error-list li { background:#fef2f2; border-left:4px solid #ef4444; padding:10px 14px; margin:8px 0; border-radius:0 6px 6px 0; }
.error-list li .wrong { color:#dc2626; font-weight:bold; }
.error-list li .right { color:#16a34a; font-weight:bold; }
</style>
</head>
<body>

<div class="lang-bar">
  <button onclick="switchLanguage('zh-hk')" id="btn-zh-hk">繁</button>
  <button onclick="switchLanguage('zh-cn')" id="btn-zh-cn">简</button>
  <button onclick="switchLanguage('en')" id="btn-en">EN</button>
</div>

<h1 id="page-title">🏦 DSE ECON｜銀行存款創造模擬器</h1>

<div class="box">
  <p id="assumption-text">✅基礎假設：銀行將可貸出金額全數貸出</p>
  
  <div class="mode-bar">
    <button class="mode-btn active-expansion" id="mode-expansion" onclick="switchMode('expansion')">📈 新增存款（擴張）</button>
    <button class="mode-btn" id="mode-contraction" onclick="switchMode('contraction')">📉 減少存款（提款收縮）</button>
  </div>

  <div class="common-settings">
    <label id="label-rounds">顯示輪數：</label>
    <input type="number" id="displayRounds" value="20" min="1" max="50">
  </div>

  <!-- ===== 基線參數：新增存款模式 ===== -->
  <div id="params-expansion">
    <div class="ratio-row">
      <label id="label-init-e">初始存款 ($)：</label>
      <input type="number" id="exp-init" value="1000" style="padding:6px;width:100%;font-size:14px;">
    </div>
    <div class="ratio-row">
      <label id="label-rr-e">法定儲備：</label>
      <div class="ratio-inputs">
        <input type="number" id="exp-rr-pct" value="10" step="0.01"><span>%</span>
        <input type="number" id="exp-rr-amt" value="100" step="0.01"><span>$</span>
      </div>
    </div>
    <div class="ratio-row">
      <label id="label-er-e">超額儲備：</label>
      <div class="ratio-inputs">
        <input type="number" id="exp-er-pct" value="0" step="0.01"><span>%</span>
        <input type="number" id="exp-er-amt" value="0" step="0.01"><span>$</span>
      </div>
    </div>
    <div class="ratio-row">
      <label id="label-cl-e">現金外流：</label>
      <div class="ratio-inputs">
        <input type="number" id="exp-cl-pct" value="0" step="0.01"><span>%</span>
        <input type="number" id="exp-cl-amt" value="0" step="0.01"><span>$</span>
      </div>
    </div>
  </div>

  <!-- ===== 基線參數：減少存款模式 ===== -->
  <div id="params-contraction" class="hidden">
    <div class="ratio-row">
      <label id="label-bd">基線存款 ($)：</label>
      <input type="number" id="con-baseline-dep" value="8000" style="padding:6px;width:100%;font-size:14px;">
    </div>
    <div class="ratio-row">
      <label id="label-br">基線儲備 ($)：</label>
      <input type="number" id="con-baseline-res" value="2000" style="padding:6px;width:100%;font-size:14px;">
    </div>
    <div class="ratio-row">
      <label id="label-wd">提款金額 ($)：</label>
      <input type="number" id="con-withdrawal" value="0" style="padding:6px;width:100%;font-size:14px;">
    </div>
    <div class="ratio-row">
      <label id="label-rr-c">法定儲備率：</label>
      <div class="ratio-inputs">
        <input type="number" id="con-rr-pct" value="25" step="0.01"><span>%</span>
      </div>
    </div>
    <div class="ratio-row">
      <label id="label-er-c">超額儲備率：</label>
      <div class="ratio-inputs">
        <input type="number" id="con-er-pct" value="0" step="0.01"><span>%</span>
      </div>
    </div>
    <div class="ratio-row">
      <label id="label-cl-c">現金外流率：</label>
      <div class="ratio-inputs">
        <input type="number" id="con-cl-pct" value="0" step="0.01"><span>%</span>
      </div>
    </div>
  </div>

  <!-- ===== 可選：變化情況對比 ===== -->
  <button class="toggle-compare-btn" id="toggle-compare" onclick="toggleComparison()">➕ 加入變化情況對比</button>
  
  <div class="comparison-area" id="comparison-area">
    <div class="scenario-grid" style="margin-top:16px;">
      <div class="scenario-box current">
        <div class="scenario-title" id="title-current">📌 現時情況（基準）</div>
        <div id="compare-current-params"></div>
      </div>
      <div class="scenario-box new">
        <div class="scenario-title" id="title-new">🔄 新增情況（變化後）</div>
        <div id="compare-new-params"></div>
      </div>
    </div>
  </div>

  <button class="run-btn" onclick="runSimulation()" id="btn-run">執行模擬</button>
</div>

<div id="output"></div>

<div class="skill-section">
  <div class="skill-header" onclick="toggleSkill()">
    <h2 id="skill-title">📝 DSE 答題技巧與真題精解</h2>
    <span class="skill-toggle" id="skill-toggle">+</span>
  </div>
  <div class="skill-content" id="skill-content">
    <div id="question-type-area"></div>
    <div class="skill-tabs">
      <button class="skill-tab active" onclick="switchSkillTab(0)" id="tab-0">答题步骤</button>
      <button class="skill-tab" onclick="switchSkillTab(1)" id="tab-1">公式速查</button>
      <button class="skill-tab" onclick="switchSkillTab(2)" id="tab-2">历届真题</button>
      <button class="skill-tab" onclick="switchSkillTab(3)" id="tab-3">常见错误</button>
    </div>
    <div class="skill-tab-content active" id="tabcontent-0"></div>
    <div class="skill-tab-content" id="tabcontent-1"></div>
    <div class="skill-tab-content" id="tabcontent-2"></div>
    <div class="skill-tab-content" id="tabcontent-3"></div>
  </div>
</div>

<script>
const langPack = {

// ========== % ↔ $ 雙向換算 ==========
function initRatioSync() {
  const pairs = ['exp-rr','exp-er','exp-cl'];
  pairs.forEach(prefix => {
    const pctEl = document.getElementById(prefix + '-pct');
    const amtEl = document.getElementById(prefix + '-amt');
    const initEl = document.getElementById('exp-init');
    pctEl.addEventListener('input', function() {
      const pct = Number(this.value), init = Number(initEl.value) || 0;
      if(!isNaN(pct)) amtEl.value = (init * pct / 100).toFixed(2);
    });
    amtEl.addEventListener('input', function() {
      const amt = Number(this.value), init = Number(initEl.value) || 0;
      if(!isNaN(amt) && init > 0) pctEl.value = (amt / init * 100).toFixed(2);
    });
  });
  document.getElementById('exp-init').addEventListener('input', function() {
    const init = Number(this.value) || 0;
    ['rr','er','cl'].forEach(type => {
      const pctEl = document.getElementById('exp-' + type + '-pct');
      const amtEl = document.getElementById('exp-' + type + '-amt');
      amtEl.value = (init * (Number(pctEl.value) || 0) / 100).toFixed(2);
    });
  });
}

function initCmpRatioSync() {
  ['cmp-cur','cmp-new'].forEach(prefix => {
    const initEl = document.getElementById(prefix + '-init');
    if(!initEl) return;
    ['rr','er','cl'].forEach(type => {
      const pctEl = document.getElementById(prefix + '-' + type + '-pct');
      const amtEl = document.getElementById(prefix + '-' + type + '-amt');
      pctEl.addEventListener('input', function() {
        amtEl.value = ((Number(initEl.value)||0) * Number(this.value) / 100).toFixed(2);
      });
      amtEl.addEventListener('input', function() {
        const init = Number(initEl.value)||0;
        if(init>0) pctEl.value = (Number(this.value)/init*100).toFixed(2);
      });
    });
    initEl.addEventListener('input', function() {
      const init = Number(this.value)||0;
      ['rr','er','cl'].forEach(type => {
        const pctEl = document.getElementById(prefix+'-'+type+'-pct');
        document.getElementById(prefix+'-'+type+'-amt').value = (init*(Number(pctEl.value)||0)/100).toFixed(2);
      });
    });
  });
}

function getExpansionParams(prefix) {
  return {
    initDeposit: Number(document.getElementById(prefix + '-init').value),
    rr: Number(document.getElementById(prefix + '-rr-pct').value) / 100,
    er: Number(document.getElementById(prefix + '-er-pct').value) / 100,
    cl: Number(document.getElementById(prefix + '-cl-pct').value) / 100
  };
}

function getContractionParams(prefix) {
  return {
    baselineDep: Number(document.getElementById(prefix + '-bd').value),
    baselineRes: Number(document.getElementById(prefix + '-br').value),
    withdrawal: Number(document.getElementById(prefix + '-wd').value),
    rr: Number(document.getElementById(prefix + '-rr-pct').value) / 100,
    er: Number(document.getElementById(prefix + '-er-pct')?.value || 0) / 100,
    cl: Number(document.getElementById(prefix + '-cl-pct')?.value || 0) / 100
  };
}

// ========== 擴張模式計算 ==========
function calculateExpansion(params, displayRounds) {
  const { initDeposit, rr, er, cl } = params;
  const MAX_ROUNDS = 50;
  if(rr <=0 || rr >=1 || er <0 || er >=1 || cl <0 || cl >=1) return null;
  const maxDepMult = 1/rr, maxLoanMult = maxDepMult-1;
  const actualDepMult = 1/(rr+er+cl), actualLoanMult = actualDepMult-1;
  const totalDeposit = initDeposit*actualDepMult;
  const totalReserve = totalDeposit*(rr+er);
  const totalLoan = totalDeposit-totalReserve;
  let currentNewDeposit = initDeposit;
  let cumDeposit=0,cumReqRes=0,cumExcRes=0,cumCashLeak=0,cumLend=0;
  let rows = [];
  for(let r=1;r<=MAX_ROUNDS;r++){
    const reqRes=currentNewDeposit*rr, excRes=currentNewDeposit*er;
    const cashLeak=currentNewDeposit*cl, lendOut=currentNewDeposit-reqRes-excRes-cashLeak;
    cumDeposit+=currentNewDeposit; cumReqRes+=reqRes; cumExcRes+=excRes; cumCashLeak+=cashLeak; cumLend+=lendOut;
    if(r<=displayRounds) rows.push({round:r,newDep:currentNewDeposit,reqRes,excRes,cashLeak,lend:lendOut});
    currentNewDeposit=lendOut;
    if(currentNewDeposit<0.01) break;
  }
  return {maxDepMult,maxLoanMult,actualDepMult,actualLoanMult,totalDeposit,totalReserve,totalLoan,cumDeposit,cumReqRes,cumExcRes,cumCashLeak,cumLend,rows};
}

// ========== 收縮模式計算 ==========
function calculateContraction(params) {
  const { baselineDep, baselineRes, withdrawal, rr, er, cl } = params;
  if(rr <=0 || rr >=1) return null;
  const actualRR = baselineDep > 0 ? baselineRes / baselineDep : 0;
  // 提款後即時：存款和儲備同時減少
  const depAfterWD = baselineDep - withdrawal;
  const resAfterWD = baselineRes - withdrawal;
  // 最終最大存款 = 提款後儲備 ÷ (法定儲備率+超額儲備率+現金外流率)
  const totalLeakage = rr + er + cl;
  const finalDeposit = totalLeakage > 0 ? resAfterWD / totalLeakage : depAfterWD;
  const finalReserve = finalDeposit * (rr + er);
  const finalLoan = finalDeposit - finalReserve;
  const depositChange = finalDeposit - baselineDep;
  const maxDepMult = 1/rr;
  const actualDepMult = totalLeakage > 0 ? 1/totalLeakage : 0;
  return {
    baselineDep, baselineRes, actualRR, withdrawal,
    depAfterWD, resAfterWD,
    finalDeposit, finalReserve, finalLoan, depositChange,
    maxDepMult, actualDepMult, rr, er, cl
  };
}

// ========== 渲染資產負債表 ==========
function renderBS(deposit, reserve, loan, txt) {
  return `<table class="bs-table">
    <tr><th>${txt.assets}</th><th>${txt.amount}</th><th>${txt.liabilities}</th><th>${txt.amount}</th></tr>
    <tr><td>${txt.totalReservesBS}</td><td>$${reserve.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>${txt.totalDepositsBS}</td><td>$${deposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td></tr>
    <tr><td>${txt.totalLoansBS}</td><td>$${loan.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td></td><td></td></tr>
    <tr><th>${txt.totalAssets}</th><th>$${(reserve+loan).toLocaleString(undefined,{maximumFractionDigits:2})}</th>
      <th>${txt.totalLiabilities}</th><th>$${deposit.toLocaleString(undefined,{maximumFractionDigits:2})}</th></tr></table>`;
}

// ========== 主執行函數 ==========
function runSimulation(){
  const txt = langPack[currentLang];
  const displayRounds = Math.max(1, Math.min(50, Number(document.getElementById('displayRounds').value) || 20));
  let html = '';

  if(currentMode === 'expansion') {
    const params = getExpansionParams('exp');
    const data = calculateExpansion(params, displayRounds);
    if(!data){ html = `<div class="box"><p class="error">${txt.errorMsg}</p></div>`; document.getElementById('output').innerHTML=html; return; }
    
    html += `<div class="box">
      <div class="multiplier-grid">
        <div class="multi-card max"><h4>${txt.maxMultTitle}</h4>
          <p>${txt.maxDepMult}<strong>${data.maxDepMult.toFixed(3)}</strong></p>
          <p>${txt.maxLoanMult}<strong>${data.maxLoanMult.toFixed(3)}</strong></p></div>
        <div class="multi-card"><h4>${txt.actualMultTitle}</h4>
          <p>${txt.actualDepMult}<strong>${data.actualDepMult.toFixed(3)}</strong></p>
          <p>${txt.actualLoanMult}<strong>${data.actualLoanMult.toFixed(3)}</strong></p></div>
      </div>
      <h4>${txt.bsTitleCurrent}</h4>${renderBS(data.totalDeposit, data.totalReserve, data.totalLoan, txt)}
      <h4>${txt.processTitle}</h4>${renderProcessTable(data, txt)}
    </div>`;

    if(comparisonEnabled) {
      const curP = getExpansionParams('cmp-cur'), newP = getExpansionParams('cmp-new');
      const curD = calculateExpansion(curP, displayRounds), newD = calculateExpansion(newP, displayRounds);
      if(curD && newD) {
        html += `<div class="box"><h3>${txt.comparisonTitle}</h3>${renderComparisonTable(curD, newD, txt)}</div>`;
        html += `<div class="box"><div class="scenario-grid">
          <div><h4>${txt.titleCurrent}</h4>${renderBS(curD.totalDeposit,curD.totalReserve,curD.totalLoan,txt)}</div>
          <div><h4>${txt.titleNew}</h4>${renderBS(newD.totalDeposit,newD.totalReserve,newD.totalLoan,txt)}</div>
        </div></div>`;
      }
    }
  } else {
    // 收縮模式
    const params = getContractionParams('con');
    const data = calculateContraction(params);
    if(!data){ html = `<div class="box"><p class="error">${txt.errorMsg}</p></div>`; document.getElementById('output').innerHTML=html; return; }
    
    const baselineLoan = data.baselineDep - data.baselineRes;
    const loanAfterWD = data.depAfterWD - data.resAfterWD;
    
    html += `<div class="box">
      <h3>${txt.contractionTitle}</h3>
      <p><strong>${txt.actualRR}：</strong>${(data.actualRR*100).toFixed(2)}%</p>
      <div class="contraction-stages">
        <div class="stage-card"><h5>${txt.stageBaseline}</h5>
          <p>${txt.totalDepositsBS}: $${data.baselineDep.toLocaleString()}</p>
          <p>${txt.totalReservesBS}: $${data.baselineRes.toLocaleString()}</p>
          <p>${txt.totalLoansBS}: $${baselineLoan.toLocaleString()}</p></div>
        <div class="stage-card"><h5>${txt.stageAfterWithdraw}</h5>
          <p>${txt.totalDepositsBS}: $${data.depAfterWD.toLocaleString()}</p>
          <p>${txt.totalReservesBS}: $${data.resAfterWD.toLocaleString()}</p>
          <p>${txt.totalLoansBS}: $${loanAfterWD.toLocaleString()}</p></div>
        <div class="stage-card stage-final"><h5>${txt.stageFinal}</h5>
          <p>${txt.totalDepositsBS}: $${data.finalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</p>
          <p>${txt.totalReservesBS}: $${data.finalReserve.toLocaleString(undefined,{maximumFractionDigits:2})}</p>
          <p>${txt.totalLoansBS}: $${data.finalLoan.toLocaleString(undefined,{maximumFractionDigits:2})}</p></div>
      </div>
      <p><strong>${txt.change}：</strong><span class="${data.depositChange<0?'change-down':'change-up'}">$${data.depositChange.toLocaleString(undefined,{maximumFractionDigits:2})}</span></p>
      <p>${txt.maxDepMult}<strong>${data.maxDepMult.toFixed(3)}</strong>　${txt.actualDepMult}<strong>${data.actualDepMult.toFixed(3)}</strong></p>
      <h4>${txt.bsTitleCurrent}</h4>${renderBS(data.finalDeposit, data.finalReserve, data.finalLoan, txt)}
    </div>`;

    if(comparisonEnabled) {
      const curP = getContractionParams('cmp-cur'), newP = getContractionParams('cmp-new');
      const curD = calculateContraction(curP), newD = calculateContraction(newP);
      if(curD && newD) {
        html += `<div class="box"><h3>${txt.comparisonTitle}</h3>
          <table class="comparison-table"><thead><tr><th>${txt.indicator}</th><th>${txt.currentVal}</th><th>${txt.newVal}</th><th>${txt.change}</th></tr></thead><tbody>
          <tr><td>${txt.totalDeposit}</td><td>$${curD.finalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${newD.finalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
            <td class="${(newD.finalDeposit-curD.finalDeposit)<0?'change-down':'change-up'}">$${(newD.finalDeposit-curD.finalDeposit).toLocaleString(undefined,{maximumFractionDigits:2})}</td></tr>
          <tr><td>${txt.totalReserve}</td><td>$${curD.finalReserve.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${newD.finalReserve.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
            <td class="${(newD.finalReserve-curD.finalReserve)<0?'change-down':'change-up'}">$${(newD.finalReserve-curD.finalReserve).toLocaleString(undefined,{maximumFractionDigits:2})}</td></tr>
          </tbody></table></div>`;
      }
    }
  }

  html += `<div class="box note"><strong>${txt.noteTitle}</strong>${txt.noteContent}</div>`;
  document.getElementById('output').innerHTML = html;
  renderSkillContent();
}

function renderProcessTable(data, txt) {
  let html = `<table><thead><tr><th>${txt.thRound}</th><th>${txt.thNewDep}</th><th>${txt.thReqRes}</th><th>${txt.thExcessRes}</th><th>${txt.thCashLeak}</th><th>${txt.thLend}</th><th>${txt.thDesc}</th></tr></thead><tbody>`;
  data.rows.forEach((row, idx) => {
    const desc = idx === 0 ? txt.descFirst : txt.descOther;
    html += `<tr><td>${row.round}</td><td>$${row.newDep.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.reqRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.excRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.cashLeak.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.lend.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>${desc}</td></tr>`;
  });
  html += `</tbody><tfoot><tr><td>${txt.totalRow}</td>
    <td>$${data.cumDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumReqRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumExcRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumCashLeak.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumLend.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td></td></tr></tfoot></table>`;
  return html;
}

function renderComparisonTable(cur, nw, txt) {
  function fmtC(o,n){const d=n-o;const c=d>0?'change-up':(d<0?'change-down':'');const s=d>0?'+':'';return `<td class="${c}">${s}${d.toFixed(3)}</td>`;}
  function fmtM(o,n){const d=n-o;const c=d>0?'change-up':(d<0?'change-down':'');const s=d>0?'+':'';return `<td class="${c}">${s}$${d.toLocaleString(undefined,{maximumFractionDigits:2})}</td>`;}
  return `<table class="comparison-table"><thead><tr><th>${txt.indicator}</th><th>${txt.currentVal}</th><th>${txt.newVal}</th><th>${txt.change}</th></tr></thead><tbody>
    <tr><td>${txt.depMult}</td><td>${cur.actualDepMult.toFixed(3)}</td><td>${nw.actualDepMult.toFixed(3)}</td>${fmtC(cur.actualDepMult,nw.actualDepMult)}</tr>
    <tr><td>${txt.totalDeposit}</td><td>$${cur.totalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtM(cur.totalDeposit,nw.totalDeposit)}</tr>
    <tr><td>${txt.totalLoan}</td><td>$${cur.totalLoan.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalLoan.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtM(cur.totalLoan,nw.totalLoan)}</tr>
  </tbody></table>`;
}

// ========== 答題技巧 ==========
function renderSkillContent() {
  const txt = langPack[currentLang];
  let types = [];
  if(currentMode === 'expansion') {
    const p = getExpansionParams('exp');
    if(p.er===0 && p.cl===0) types.push('type1');
    if(p.er>0) types.push('type2','type5');
    if(p.cl>0) types.push('type3');
  } else {
    types.push('type3');
    const p = getContractionParams('con');
    if(p.withdrawal===0 && p.rr > p.baselineRes/p.baselineDep) types.push('type4','type6');
  }
  types = [...new Set(types)];
  if(types.length===0) types.push('type1');

  let typeHtml = `<p><strong>${txt.matchedType}</strong></p>`;
  types.forEach(t => { typeHtml += `<span class="question-type-badge">${txt[t]}</span>`; });
  document.getElementById('question-type-area').innerHTML = typeHtml;

  // 答題步驟
  let steps = [];
  if(currentMode === 'contraction') {
    const p = getContractionParams('con');
    const rrPct = (p.rr*100).toFixed(1);
    steps = [
      {text:`實際儲備率 = 基線儲備 ÷ 基線存款 = $${p.baselineRes.toLocaleString()} ÷ $${p.baselineDep.toLocaleString()} = ${(p.baselineRes/p.baselineDep*100).toFixed(2)}%`, mark:'1分', explain:'先從資產負債表計算實際儲備率。'},
      {text:`提款後儲備 = 原儲備 - 提款額 = $${p.baselineRes.toLocaleString()} - $${p.withdrawal.toLocaleString()} = $${(p.baselineRes-p.withdrawal).toLocaleString()}`, mark:'1分', explain:'提款同時減少儲備和存款，必須同時更新。'},
      {text:`新最大存款 = 提款後儲備 ÷ 法定儲備率 = $${(p.baselineRes-p.withdrawal).toLocaleString()} ÷ ${rrPct}% = $${((p.baselineRes-p.withdrawal)/p.rr).toLocaleString(undefined,{maximumFractionDigits:2})}`, mark:'3分', explain:'用提款後的儲備量乘以乘數（除以儲備率），得到收縮後的最大存款。'},
      {text:`存款變化 = 最終存款 - 原存款 = $${((p.baselineRes-p.withdrawal)/p.rr - p.baselineDep).toLocaleString(undefined,{maximumFractionDigits:2})}`, mark:'1分', explain:'計算存款的變化量，負值代表收縮。'},
      {text:`解釋收縮過程：儲備不足 → 銀行收回貸款/出售資產 → 存款被提取 → 持續直至儲備足夠`, mark:'2分', explain:'步驟順序必須正確，從「存款被提取」開始只給最多2分。'}
    ];
  } else {
    const p = getExpansionParams('exp');
    const rrPct = (p.rr*100).toFixed(1);
    steps = [
      {text:`最大存款乘數 = 1 ÷ 法定儲備率 = 1 ÷ ${rrPct}% = ${(1/p.rr).toFixed(3)}`, mark:'2分', explain:'在無超額儲備、無現金外流的假設下，乘數 = 1/法定儲備率。'},
      {text:`最大存款總額 = 初始存款 × 乘數 = $${p.initDeposit.toLocaleString()} × ${(1/p.rr).toFixed(3)} = $${(p.initDeposit/p.rr).toLocaleString(undefined,{maximumFractionDigits:2})}`, mark:'2分', explain:'初始存款乘以乘數就是銀行體系可創造的最大存款總額。'}
    ];
  }
  let stepsHtml = `<p><strong>${txt[types[0]]}</strong> — 標準答題步驟：</p>`;
  steps.forEach((s,i) => {
    stepsHtml += `<div class="step-item"><span class="step-num">${i+1}</span>${s.text}<span class="step-mark">${s.mark}</span>
      <span class="step-toggle" onclick="toggleStepExplain(this)">${txt.showExplain}</span>
      <div class="step-explain">${s.explain}</div></div>`;
  });
  document.getElementById('tabcontent-0').innerHTML = stepsHtml;

  // 公式速查
  document.getElementById('tabcontent-1').innerHTML = `
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle1}</div><span class="formula-text">${txt.formulaText1}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle2}</div><span class="formula-text">${txt.formulaText2}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle3}</div><span class="formula-text">${txt.formulaText3}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle4}</div><span class="formula-text">${txt.formulaText4}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle6}</div><span class="formula-text">${txt.formulaText6}</span></div>
    <div class="formula-card"><div class="formula-title">${txt.formulaTitle5}</div><span class="formula-text">${txt.formulaText5}</span></div>`;

  // 歷屆真題
  document.getElementById('tabcontent-2').innerHTML = `
    <div class="exam-question"><div class="exam-year">${txt.exam1Year}</div><div class="exam-text">${txt.exam1Text}</div>
      <button class="toggle-answer" onclick="toggleAnswer(this)">${txt.showAnswer}</button>
      <div class="exam-answer">${txt.exam1Ans.map(a=>`<div class="ans-step">${a}</div>`).join('')}</div></div>
    <div class="exam-question"><div class="exam-year">${txt.exam2Year}</div><div class="exam-text">${txt.exam2Text}</div>
      <button class="toggle-answer" onclick="toggleAnswer(this)">${txt.showAnswer}</button>
      <div class="exam-answer">${txt.exam2Ans.map(a=>`<div class="ans-step">${a}</div>`).join('')}</div></div>
    <div class="exam-question"><div class="exam-year">${txt.exam3Year}</div><div class="exam-text">${txt.exam3Text}</div>
      <button class="toggle-answer" onclick="toggleAnswer(this)">${txt.showAnswer}</button>
      <div class="exam-answer">${txt.exam3Ans.map(a=>`<div class="ans-step">${a}</div>`).join('')}</div></div>`;

  // 常見錯誤
  document.getElementById('tabcontent-3').innerHTML = `<h4>${txt.errorTitle}</h4><ul class="error-list">
    <li><span class="wrong">✗ ${txt.error1Wrong}</span><br><span class="right">✓ ${txt.error1Right}</span></li>
    <li><span class="wrong">✗ ${txt.error2Wrong}</span><br><span class="right">✓ ${txt.error2Right}</span></li>
    <li><span class="wrong">✗ ${txt.error3Wrong}</span><br><span class="right">✓ ${txt.error3Right}</span></li>
    <li><span class="wrong">✗ ${txt.error4Wrong}</span><br><span class="right">✓ ${txt.error4Right}</span></li>
    <li><span class="wrong">✗ ${txt.error5Wrong}</span><br><span class="right">✓ ${txt.error5Right}</span></li></ul>`;
}

function toggleStepExplain(el) {
  const explain = el.nextElementSibling, txt = langPack[currentLang];
  if(explain.classList.contains('show')) { explain.classList.remove('show'); el.innerText = txt.showExplain; }
  else { explain.classList.add('show'); el.innerText = txt.hideExplain; }
}

function toggleAnswer(btn) {
  const answer = btn.nextElementSibling, txt = langPack[currentLang];
  if(answer.classList.contains('show')) { answer.classList.remove('show'); btn.innerText = txt.showAnswer; }
  else { answer.classList.add('show'); btn.innerText = txt.hideAnswer; }
}

function toggleSkill() {
  document.getElementById('skill-content').classList.toggle('show');
  document.getElementById('skill-toggle').classList.toggle('open');
}

function switchSkillTab(idx) {
  document.querySelectorAll('.skill-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.skill-tab-content').forEach((c,i) => c.classList.toggle('active', i===idx));
}

// ========== 語言切換 ==========
function switchLanguage(lang) {
  if(!langPack[lang]) return;
  currentLang = lang;
  const txt = langPack[lang];
  document.title = txt.htmlTitle;
  document.getElementById('page-title').innerText = txt.pageTitle;
  document.getElementById('assumption-text').innerText = txt.assumption;
  document.getElementById('label-rounds').innerText = txt.labelRounds;
  document.getElementById('btn-run').innerText = txt.btnRun;
  document.getElementById('skill-title').innerText = txt.skillTitle;
  document.getElementById('tab-0').innerText = txt.tabSteps;
  document.getElementById('tab-1').innerText = txt.tabFormula;
  document.getElementById('tab-2').innerText = txt.tabExam;
  document.getElementById('tab-3').innerText = txt.tabError;
  document.getElementById('mode-expansion').innerText = txt.modeExpansion;
  document.getElementById('mode-contraction').innerText = txt.modeContraction;
  document.getElementById('toggle-compare').innerText = comparisonEnabled ? txt.toggleCompareOff : txt.toggleCompareOn;
  document.getElementById('title-current').innerText = txt.titleCurrent;
  document.getElementById('title-new').innerText = txt.titleNew;
  // 更新擴張模式標籤
  document.getElementById('label-init-e').innerText = txt.labelInit;
  document.getElementById('label-rr-e').innerText = txt.labelRR;
  document.getElementById('label-er-e').innerText = txt.labelER;
  document.getElementById('label-cl-e').innerText = txt.labelCL;
  // 更新收縮模式標籤
  document.getElementById('label-bd').innerText = txt.labelBaselineDep;
  document.getElementById('label-br').innerText = txt.labelBaselineRes;
  document.getElementById('label-wd').innerText = txt.labelWithdrawal;
  document.getElementById('label-rr-c').innerText = txt.labelRRC;
  document.getElementById('label-er-c').innerText = txt.labelERC;
  document.getElementById('label-cl-c').innerText = txt.labelCLC;
  document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+lang).classList.add('active');
  if(comparisonEnabled) renderComparisonParams();
  runSimulation();
}

function getLangFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang');
  if(lang && langPack[lang]) return lang;
  return 'zh-hk';
}

window.onload = function(){
  initRatioSync();
  switchLanguage(getLangFromUrl());
};
