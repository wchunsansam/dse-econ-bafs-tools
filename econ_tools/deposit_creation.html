<body>
<div class="lang-bar">
<button onclick="switchLanguage('zh-hk')" id="btn-zh-hk">繁</button>
<button onclick="switchLanguage('zh-cn')" id="btn-zh-cn">简</button>
<button onclick="switchLanguage('en')" id="btn-en">EN</button>
</div>
<h1 id="page-title">🏦 DSE ECON｜銀行存款創造模擬器</h1>
<div class="box">
<p id="assumption-text">✅基礎假設：銀行將可貸出金額全數貸出</p>
<div class="mode-bar">
<button class="mode-btn active-expansion" id="mode-expansion" onclick="switchMode('expansion')">📈 新增存款（擴張）</button>
<button class="mode-btn" id="mode-contraction" onclick="switchMode('contraction')">📉 減少存款（提款收縮）</button>
</div>
<div class="common-settings"><label id="label-rounds">顯示輪數：</label><input type="number" id="displayRounds" value="20" min="1" max="50"></div>
<div id="params-expansion">
<div class="ratio-row"><label id="label-init-e">初始存款 ($)：</label><input type="number" id="exp-init" value="1000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-rr-e">法定儲備：</label><div class="ratio-inputs"><input type="number" id="exp-rr-pct" value="10" step="0.01"><span>%</span><input type="number" id="exp-rr-amt" value="100" step="0.01"><span>$</span></div></div>
<div class="ratio-row"><label id="label-er-e">超額儲備：</label><div class="ratio-inputs"><input type="number" id="exp-er-pct" value="0" step="0.01"><span>%</span><input type="number" id="exp-er-amt" value="0" step="0.01"><span>$</span></div></div>
<div class="ratio-row"><label id="label-cl-e">現金外流：</label><div class="ratio-inputs"><input type="number" id="exp-cl-pct" value="0" step="0.01"><span>%</span><input type="number" id="exp-cl-amt" value="0" step="0.01"><span>$</span></div></div>
</div>
<div id="params-contraction" class="hidden">
<div class="ratio-row"><label id="label-bd">基線存款 ($)：</label><input type="number" id="con-bd" value="8000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-br">基線儲備 ($)：</label><input type="number" id="con-br" value="2000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-wd">提款金額 ($)：</label><input type="number" id="con-wd" value="0" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-rr-c">法定儲備率：</label><div class="ratio-inputs"><input type="number" id="con-rr-pct" value="25" step="0.01"><span>%</span></div></div>
<div class="ratio-row"><label id="label-er-c">超額儲備率：</label><div class="ratio-inputs"><input type="number" id="con-er-pct" value="0" step="0.01"><span>%</span></div></div>
<div class="ratio-row"><label id="label-cl-c">現金外流率：</label><div class="ratio-inputs"><input type="number" id="con-cl-pct" value="0" step="0.01"><span>%</span></div></div>
</div>
<button class="toggle-compare-btn" id="toggle-compare" onclick="toggleComparison()">➕ 加入變化情況對比</button>
<div class="comparison-area" id="comparison-area"><div class="scenario-grid" style="margin-top:16px;">
<div class="scenario-box current"><div class="scenario-title" id="title-current">📌 現時情況（基準）</div><div id="compare-current-params"></div></div>
<div class="scenario-box new"><div class="scenario-title" id="title-new">🔄 新增情況（變化後）</div><div id="compare-new-params"></div></div>
</div></div>
<button class="run-btn" onclick="runSim()">執行模擬</button>
<p style="font-size:12px;color:#6b7280;margin-top:8px;">💡 修改參數後會自動更新，無需每次按按鈕</p>
</div>
<div id="output"></div>
<div class="skill-section">
<div class="skill-header" onclick="toggleSkill()"><h2 id="skill-title">📝 DSE 答題技巧與真題精解</h2><span class="skill-toggle" id="skill-toggle">+</span></div>
<div class="skill-content" id="skill-content">
<div id="question-type-area"></div>
<div class="skill-tabs">
<button class="skill-tab active" onclick="switchSkillTab(0)" id="tab-0">答题步骤</button>
<button class="skill-tab" onclick="switchSkillTab(1)" id="tab-1">公式速查</button>
<button class="skill-tab" onclick="switchSkillTab(2)" id="tab-2">历届真题</button>
<button class="skill-tab" onclick="switchSkillTab(3)" id="tab-3">常见错误</button>
<button class="skill-tab" onclick="switchSkillTab(4)" id="tab-4">关键概念</button>
</div>
<div class="skill-tab-content active" id="tabcontent-0"></div>
<div class="skill-tab-content" id="tabcontent-1"></div>
<div class="skill-tab-content" id="tabcontent-2"></div>
<div class="skill-tab-content" id="tabcontent-3"></div>
<div class="skill-tab-content" id="tabcontent-4"></div>
</div>

<script>
// ===== MCQ題庫（54題，標記需核對的題目）=====
const MCQ=[
{y:"1990/CE/II/45",t:6,q:"Which of the following will increase the money supply in an economy?",o:["A citizen withdraws cash from a bank and keeps it in a safe.","A manufacturer repays a bank loan.","A bank grants a loan to a real estate developer.","A bank increases the amount of excess reserves it holds."],a:"C",e:"銀行貸款創造存款，MS增加。A：Cp↑Dd↓，MS不變。B：還款消滅存款，MS↓。D：超額儲備不直接影響MS。"},
{y:"1991/CE/II/31",t:3,q:"The withdrawal of money from banks causes",o:["a decrease in the value of the maximum possible banking multiplier.","a decrease in the cash reserves held by banks.","an increase in the deposits created.","a decrease in the minimum legal reserve ratio."],a:"B",e:"提款直接減少銀行現金儲備。最大乘數=1/法定儲備率，不變。"},
{y:"1991/CE/II/32",t:2,q:"Bank A has total deposits of $1 000m. Its reserves are $240m. Suppose the reserve ratio required by the government is 25%. Which of the following will help Bank A fulfil reserve requirement?",o:["Bank A increases its lending to customers by $40m.","Bank A borrows $10m from the inter-bank market.","Customers increase deposits with Bank A by $10m.","Customers withdraw deposits from Bank A by $40m."],a:"B",e:"要求儲備=1000×25%=250，實際=240，不足10。B借入10，儲備增至250，剛好滿足。"},
{y:"1992/CE/II/34",t:5,q:"Assuming that a 20% reserve ratio is required by law, when the banking system has excess reserves of $20 000, it can at most increase its deposits by",o:["$80 000.","$100 000.","the amount of its total reserves.","the amount of its excess reserves."],a:"B",e:"乘數=1/20%=5。超額儲備$20000可創造存款=20000×5=$100000。"},
{y:"1992/CE/II/35",t:2,q:"Balance sheet: Reserves $200, Loans $300, Deposits $500. From the table, we can say that",o:["the legal minimum reserves are $200.","the bank holds excess reserves of $100.","the actual banking multiplier is 4.","the actual reserve ratio is 40%."],a:"D",e:"實際儲備率=200/500=40%。無法從表中得知法定儲備率。實際乘數=1/40%=2.5。"},
{y:"1992/CE/II/32",t:3,q:"Balance sheet: Reserves $150, Loans $850, Deposits $1000. Required reserve ratio is 20%. Which statement is correct?",o:["It has excess reserves.","It has to increase its reserves by $100.","It has to reduce loans by a total of $250.","The deposit multiplier is 4."],a:"C",e:"要求儲備=200，實際=150，不足50。要消除不足需收回貸款=50/20%=$250。乘數=5。"},
{y:"1994/CE/II/40",t:1,q:"If the required reserve ratio for banks is 100%, which of the following is correct?",o:["The money supply will not change if banks accept deposits from the public.","The total amount of bank loans must be equal to the total amount of deposits.","Banks have no chance to make profits.","The banking multiplier is zero."],a:"A",e:"100%儲備率下銀行不能貸款，接受存款只是Cp→Dd，MS不變。貸款=0。乘數=1。"},
{y:"1994/CE/II/42",t:2,q:"Required minimum reserve ratio 25%. Balance sheet: Reserves $600, Loans $900, Deposits $1500. Which is correct?",o:["The actual reserve ratio of the bank is 45%.","The excess reserves of the bank is $300.","The banking multiplier is 5.","The banking system can expand its loan by a maximum of $900."],a:"D",e:"實際儲備率=40%。超額=600-375=225。乘數=4。可擴張貸款=225×4=$900。"},
{y:"1995/CE/II/42",t:6,q:"Legal reserve ratio 100%. A person deposits $500 cash. (1) currency in circulation decreases by $500. (2) bank deposits remain unchanged. (3) bank loans increase by $500. (4) money supply remains unchanged.",o:["(1) and (2) only","(1) and (4) only","(2) and (3) only","(3) and (4) only"],a:"B",e:"100%儲備率：(1)流通現金↓$500✓；(2)存款↑$500✗；(3)貸款不變✗；(4)MS=Cp+Dd，一減一增，MS不變✓。"},
{y:"1996/CE/II/35",t:3,q:"Balance sheet: Cash reserve $250, Loans $750, Deposits $1000. Legal RR 25%. A person withdraws $40. How much would cash reserve fall short of legal requirement?",o:["$10","$20","$30","$40"],a:"C",e:"提款後：儲備=210，存款=960。要求儲備=960×25%=240。不足=240-210=$30。"},
{y:"1996/CE/II/36",t:3,q:"(Follow above) What would be the maximum amount of deposits after the withdrawal?",o:["$750","$840","$880","$960"],a:"B",e:"提款後儲備=210。最大存款=210÷25%=$840。"},
{y:"1997/CE/II/33",t:1,q:"Legal RR 25%. A person deposits $200 cash into savings account. The maximum possible change in",o:["bank loans is an increase of $800.","bank reserves is an increase of $200.","M1 is a decrease of $50.","M2 is an increase of $800."],a:"C",e:"乘數=4。存款增加=800。貸款增加=800-200=600。$200現金存入儲蓄戶口(M2)，M1(通貨+活期)減少。"},
{y:"1997/CE/II/34",t:1,q:"A $100 deposit of newly-printed money results in a $400 increase in total deposit. We can conclude that",o:["the banking multiplier is 4.","the legal reserve ratio is 0.25.","the money supply increases by $500.","there is no cash leakage."],a:"B",e:"總存款增加$400(含初始$100)，乘數=4。法定儲備率=1/4=0.25。MS增加=存款增加=400(新印貨幣，Cp不變)。"},
{y:"1998/CE/II/33",t:4,q:"Balance sheet: Reserves $1000, Loans $2000, Deposits $3000. Required RR raised from 20% to 25%. Decrease in excess reserves?",o:["$150","$250","$400","$600"],a:"A",e:"原超額=1000-600=400。新超額=1000-750=250。減少=400-250=$150。"},
{y:"1998/CE/II/34",t:2,q:"Required RR 20%. Balance sheet: Reserves $500, Loans $500, Deposits $1000. Which is correct?",o:["Excess reserves is $200.","Actual banking multiplier is 5.","Banking system can expand total deposits to $5000.","Maximum amount of loans is $2000."],a:"C",e:"實際儲備率=50%。超額=500-200=300。貸出超額後最大存款=500÷20%=$2500？重新計算：儲備$500，20%下可支持存款=2500。⚠️此題解析需核對。",check:true},
{y:"1998/CE/II/52",t:1,q:"An amount of cash deposited into a bank will NOT lead to",o:["an increase in bank loan made to the public","an increase in total deposits of the banks.","an increase in the value of the maximum banking multiplier.","an increase in the cash reserves held by banks."],a:"C",e:"存款增加會增加貸款、總存款、現金儲備。但最大乘數=1/法定儲備率，與存款金額無關。"},
{y:"1999/CE/II/36",t:5,q:"Balance sheet: Reserves $100, Loans $300, Deposits $400. Legal RR 20%. All banks loan out excess reserves, all loans re-deposited. After credit creation, reserves = ___ and loans increase by ___.",o:["less than $100 ...... more than $100","equal to $100 ...... $100","equal to $100 ...... more than $100","more than $100 ...... less than $100"],a:"B",e:"超額=100-80=20。乘數=5。可創造存款=20×5=100。儲備總額不變=$100。貸款增加=新存款-新儲備=100-20=$80？⚠️此題解析需核對。",check:true},
{y:"1999/CE/II/38",t:1,q:"Which would reduce the amount of deposits created in multiple credit creation?",o:["An increase in the holding of cash by the public","An increase in the use of cheques by the public","An increase in the use of electronic money by the public","An increase in the bank loans made to the public"],a:"A",e:"公眾持有更多現金=現金外流增加，可貸出金額減少，存款創造減少。"},
{y:"2000/CE/II/29",t:1,q:"A bank accepts $1000 deposit from a foreign country. Through credit creation, total deposit increases by $4000. We can conclude that",o:["The legal reserve ratio is 25%","Banks do not keep excess reserves.","The total money supply has increased by at least $4000.","There is a cash leakage in the credit creation process."],a:"C",e:"外國存款$1000，存款增加$4000，實際乘數=4。法定儲備率可能≤25%。MS增加=存款增加(外國流入，Cp不變)=至少$4000。"},
{y:"2000/CE/II/30",t:6,q:"As the use of Octopus card becomes much more popular,",o:["The money supply will increase because the card can perform the functions of money.","The volume of the legal tender in circulation will drop.","The value of money will drop because the demand for cash will be smaller.","The maximum amount of deposits created will decrease."],a:"B",e:"八達通普及→公眾持有現金減少→現金存入銀行。法定貨幣(現金)流通量下降。存款創造會增加。"},
{y:"2001/CE/II/26",t:5,q:"Balance sheet: Reserves $200, Loans $400, Deposits $600. Legal RR 20%. If all banks no longer hold excess reserves, maximum increase in bank deposits is",o:["$80","$160","$400","$1 000"],a:"C",e:"實際儲備率=33.3%。超額=200-120=80。乘數=5。可創造存款=80×5=$400。"},
{y:"2002/CE/II/35",t:2,q:"Banking system has excess reserve of $200. Balance sheet: Reserves $500, Loans $700, Deposits $1200. The required reserve ratio is",o:["15%","20%","25%","30%"],a:"C",e:"超額=200=500-1200×rr → rr=300/1200=25%。"},
{y:"2002/CE/II/36",t:3,q:"(Follow above) Someone withdraws $250. Maximum possible amount of bank deposits?",o:["$200","$600","$800","$1 000"],a:"D",e:"提款後：儲備=250，存款=950。最大存款=250÷25%=$1000。"},
{y:"2002/CE/II/37",t:1,q:"Which will reduce deposit creation ability? (1) increase in use of credit cards (2) increase in cash held by public (3) increase in legal reserve requirement",o:["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],a:"C",e:"(1)信用卡普及→現金持有↓→存款創造↑。(2)現金持有↑→外流↑→存款創造↓。(3)法定儲備率↑→乘數↓→存款創造↓。"},
{y:"2002/CE/II/38",t:6,q:"During Lunar New Year, many people withdraw cash. Cash held by public increases. Which is a definite consequence?",o:["Maximum banking multiplier decreases.","Maximum possible amount of deposits decreases.","Amount of bank loans made to public decreases.","Money supply decreases."],a:"B",e:"提款→銀行儲備減少→可支持的最大存款減少。最大乘數不變。貸款/MS不一定減少(取決於是否收縮)。"},
{y:"2003/CE/II/34",t:2,q:"If actual reserve is larger than required reserve in a banking system, it follows that",o:["there is cash leakage.","some banks decide to hold excess reserves.","the demand for loans is insufficient.","the banking system can create more deposits."],a:"D",e:"實際儲備>要求儲備=有超額儲備→銀行可以貸出更多→創造更多存款。A/B/C是可能原因，D是必然結果。"},
{y:"2003/CE/II/35",t:2,q:"Balance sheet: Reserves $500, Loans $1500, Deposits $2000. Required RR 20%. Which is correct?",o:["Maximum banking multiplier is 4.","Maximum possible increase in loans = maximum possible increase in deposits.","Actual reserve ratio = required reserve ratio.","Reserves will decrease if all banks loan out excess reserves."],a:"B",e:"實際儲備率=25%>20%，超額=100。最大乘數=5。貸出超額後儲備總額不變。⚠️此題解析需核對。",check:true},
{y:"2003/CE/II/36",t:4,q:"(Follow above) If government increases required RR to 40%, which is correct?",o:["Reserves will increase to $800.","Deposits will not change.","Maximum amount of loans will be $750.","Maximum amount of deposits will be $1600."],a:"C",e:"儲備率提高到40%，儲備金額不變=$500。最大存款=500÷40%=$1250。最大貸款=1250-500=$750。"},
{y:"2004/CE/II/38",t:3,q:"Balance sheet: Cash reserves $500, Loans and investments $750, Deposits $1250. Customers withdraw $50 cash. Immediately after withdrawal, cash reserves and deposits are ___ and ___.",o:["$450 ...... $1 200","$450 ...... $1 250","$500 ...... $1 200","$500 ...... $1 250"],a:"A",e:"提款$50：現金儲備=500-50=450，存款=1250-50=1200。兩者同時減少。"},
{y:"2004/CE/II/39",t:3,q:"Banking system has excess reserve of $200. Balance sheet: Reserves $500, Loans $1000, Deposits $1500. $300 deposits withdrawn. Maximum possible amount of bank deposits?",o:["$500","$1 000","$1 200","$6 000"],a:"B",e:"法定儲備率：200=500-1500×rr → rr=20%。提款$300後：儲備=200。最大存款=200÷20%=$1000。"},
{y:"2005/CE/II/37",t:3,q:"Balance sheet: Cash reserves $500, Loans $1500, Deposits $2000. No excess reserves. After withdrawal of $100, maximum possible amount of deposits?",o:["$1 600","$1 700","$1 900","$1 800"],a:"A",e:"無超額→法定儲備率=500/2000=25%。提款$100後：儲備=400。最大存款=400÷25%=$1600。"},
{y:"2005/CE/II/50",t:4,q:"Central bank increases legal reserve ratio. Banking system has no excess reserves. This measure would NOT reduce",o:["the ability of deposit creation.","the amount of reserves of the banking system.","the banking multiplier.","the money supply."],a:"B",e:"提高法定儲備率：存款創造能力↓、乘數↓、MS可能↓。但儲備金額不變(只是要求儲備增加了)。"},
{y:"2006/CE/II/36",t:2,q:"Banking system has excess reserves of $800. Balance sheet: Reserves $1000, Loans $1000, Deposits $2000. Which is correct?",o:["Required reserve ratio is 50%.","Maximum amount of deposits is $8000.","Maximum banking multiplier is 5.","Actual banking multiplier is 2."],a:"B",e:"超額=800=1000-2000×rr → rr=10%。最大存款=儲備÷rr=1000÷10%=$10000？可增加存款=800×10=8000。⚠️此題解析需核對。",check:true},
{y:"2006/CE/II/37",t:6,q:"During Lunar New Year, many people withdraw cash. Which is a definite consequence?",o:["Maximum banking multiplier decreases.","Maximum possible amount of deposits decreases.","Amount of bank loans decreases.","Money supply decreases."],a:"C",e:"提款後銀行儲備減少，如果銀行原本fully loaned up，則必須收回貸款，貸款減少。這是更直接的後果。"},
{y:"2006/CE/II/38",t:1,q:"Which may reduce the size of the actual banking multiplier?",o:["an increase in the use of cheques by the public","an increase in the demand for bank loans","an increase in the risk of non-repayment of bank loans","a reduction in the required reserve ratio"],a:"C",e:"實際乘數=1/(法定+超額+現金外流)。壞賬風險↑→銀行持有更多超額儲備→乘數↓。"},
{y:"2007/CE/II/36",t:2,q:"Banking system has excess reserve of $50. Balance sheet: Reserves $250, Loans $750, Deposits $1000. Which is correct?",o:["Required reserve ratio is 25%.","Actual reserve ratio is 20%.","If $100 cash deposited, total deposits will be $1500.","If $100 withdrawn, maximum possible total deposits will be $750."],a:"D",e:"超額=50=250-1000×rr → rr=20%。實際=25%。提款$100後：儲備=150。最大存款=150÷20%=$750。"},
{y:"2008/CE/II/38",t:3,q:"Banking system never holds excess reserves. Balance sheet: Reserves $600, Loans $2400, Deposits $3000. Public always holds same amount of cash. $200 withdrawn. Maximum amount of loans?",o:["$1 200","$1 600","$2 000","$2 200"],a:"B",e:"無超額→法定儲備率=600/3000=20%。提款$200後：儲備=400。最大存款=400÷20%=2000。最大貸款=2000-400=$1600。"},
{y:"2008/CE/II/39",t:1,q:"Which will increase the maximum banking multiplier?",o:["Octopus cards are widely used.","The economy grows fast and investment opportunities flourish.","Banks keep more reserves to avoid bank runs.","Commercial banks are allowed to increase the proportion of deposits that can be loaned out."],a:"D",e:"最大乘數=1/法定儲備率。可貸出比例增加=法定儲備率降低→最大乘數↑。A/B影響實際乘數，不影響最大乘數。"},
{y:"2009/CE/II/38",t:1,q:"Actual banking multiplier is smaller than maximum banking multiplier. Possible reason?",o:["There is insufficient demand for bank loans.","The banking system is facing a reserve shortage.","The maximum possible amount of total deposits will decrease.","The actual reserve ratio is smaller than the required reserve ratio."],a:"A",e:"實際乘數<最大乘數的原因：超額儲備(貸款需求不足→銀行貸不出)、現金外流。"},
{y:"2009/CE/II/39",t:5,q:"Banking system has $50 excess reserves. Balance sheet: Reserves $350, Loans $850, Deposits $1200. All banks lend out excess reserves, all loans re-deposited. After deposit creation, reserves = ___ and loans = ___.",o:["$300 ...... $1 400","$350 ...... $1 400","$350 ...... $1 050","$350 ...... $1 050"],a:"D",e:"法定儲備率：50=350-1200×rr → rr=25%。貸出超額$50，乘數=4，可創造存款=200。總存款=1400。儲備不變=$350。總貸款=1400-350=$1050。⚠️此題解析需核對。",check:true},
{y:"2010/CE/II/35",t:1,q:"The maximum banking multiplier will decrease when",o:["the amount of excess reserves held by banks increases.","the required reserve ratio increases.","the amount of cash leakage increases.","the demand for loans decreases."],a:"B",e:"最大乘數=1/法定儲備率。只有法定儲備率增加會使最大乘數減小。A/C/D影響實際乘數。"},
{y:"2010/CE/II/36",t:3,q:"Banking system has excess reserve of $500. Balance sheet: Reserves $2500, Loans $7500, Deposits $10000. Public withdraw $1000 cash. No excess reserves, no cash leakage. What happens after deposit contraction?",o:["Bank deposits will fall by $5 000.","Bank loans will fall by $2 500.","The money supply will fall by $1 500.","Both B and C are correct."],a:"C",e:"法定儲備率：500=2500-10000×rr → rr=20%。提款$1000後：儲備=1500。最大存款=1500÷20%=7500。存款變化=-2500。貸款變化=(7500-1500)-(10000-2500)=6000-7500=-1500。MS變化=Cp(+1000)+Dd(-2500)=-1500。"},
{y:"2012/DSE/I/27",t:2,q:"Balance sheet ($m): Reserves 400, Loans 600, Deposits 1000. Required RR 25%. Which is correct?",o:["Excess reserves are $200m.","Actual banking multiplier is 4.","Banking system can expand total deposits to $1600m.","Maximum amount of loans is $1000m."],a:"C",e:"實際儲備率=40%。超額=400-250=150。貸出超額$150，乘數=4，可創造存款=600，總存款=1000+600=1600。"},
{y:"2013/DSE/I/26",t:6,q:"Initially excess reserve $160m, public holds $200m cash. Balance sheet ($m): Reserves 400, Loans 800, Deposits 1200. $100m withdrawn and held as cash. What will money supply be if banks lend out all excess reserves?",o:["$1 500m","$1 700m","$1 800m","$2 300m"],a:"D",e:"法定儲備率：160=400-1200×rr → rr=20%。原MS=200+1200=1400。提款$100後：Cp=300，儲備=300，存款=1100。超額=300-220=80。貸出可創造存款=80×5=400。總存款=1500。MS=300+1500=1800？⚠️此題解析需核對。",check:true},
{y:"2014/DSE/I/30",t:5,q:"Balance sheet ($m): Reserves 400, Loans 800, Deposits 1200. Required RR 25%. All banks loan out excess reserves. Which is correct?",o:["Amount of reserves held by banks will decrease.","Maximum banking multiplier will increase.","Money supply will remain unchanged.","Maximum possible increase in loans = maximum possible increase in deposits."],a:"A",e:"實際儲備率=33.3%。超額=400-300=100。貸出超額儲備後，如果貸出的錢部分被公眾持有為現金(現金外流)，銀行儲備會減少。"},
{y:"2016/DSE/I/31",t:2,q:"Banking system has excess reserve $125m. Balance sheet ($m): Reserves 250, Loans 250, Deposits 500. Which is INCORRECT?",o:["Required reserve ratio is 25%.","Maximum amount of loans is $750m.","Banking system can expand total deposit to $1000m.","Actual banking multiplier is 4."],a:"D",e:"超額=125=250-500×rr → rr=25%。最大存款=250÷25%=1000。最大貸款=1000-250=750。實際乘數=1/(250/500)=2（不是4）。題目問INCORRECT，選D。"},
{y:"2017/DSE/I/31",t:4,q:"Balance sheet ($m): Reserves 300, Loans 600, Deposits 900. Public does not hold cash. Required RR reduced to 25%. After deposit creation, loans = $750. Which is correct?",o:["Money supply increases by $300.","Actual banking multiplier is 3.5.","Deposits increase by $600.","Bank reserves are $450."],a:"B",e:"原rr=300/900=33.3%。降到25%後超額=300-225=75。最終貸款=750，儲備不變=300，最終存款=1050。實際乘數=1050/300=3.5。"},
{y:"2019/DSE/I/28",t:6,q:"Country A banking system. MS=$2800, banks hold no excess reserves. Balance sheet: Reserves $500, Loans $2000, Deposits $2500. Public deposits $200 cash. After deposit creation, which is correct?",o:["Deposits would increase by $3500.","Money supply would increase by $1000.","Monetary base would increase by $200.","Loans will increase by $800."],a:"D",e:"MS=2800=Cp+2500→Cp=300。rr=500/2500=20%。存款$200後：Cp=100，儲備=700，存款=2700。最大存款=700÷20%=3500。存款增加=1000。MS變化=-200+1000=800。MB=Cp+儲備，一減一增，MB不變。貸款增加=(3500-700)-(2500-500)=2800-2000=800。"},
{y:"2020/DSE/I/33",t:1,q:"Which will increase the actual banking multiplier?",o:["The public tends to hold more cash.","The use of credit card becomes more popular.","The central bank increases the required reserve ratio.","The interest rate of bank deposit decreases."],a:"B",e:"實際乘數=1/(法定+超額+現金外流)。信用卡普及→公眾持有現金↓→現金外流↓→乘數↑。"},
{y:"2022/DSE/I/30",t:6,q:"Balance sheet ($m): Reserves 500, Loans 1500, Deposits 2000. Required RR 20%, public holds no cash initially. Customer withdraws $200m and holds as cash. No excess reserves. Money supply after credit creation/contraction?",o:["$1 200m","$1 400m","$1 500m","$1 700m"],a:"D",e:"原MS=2000。提款$200後：Cp=200，儲備=300，存款=1800。原本超額=500-400=100。提款後超額=300-360=-60(不足)。最大存款=300÷20%=1500。MS=200+1500=$1700m。"},
{y:"2022/DSE/I/32",t:1,q:"Central bank requires commercial banks to keep all deposits as reserves. Which is INCORRECT?",o:["Monetary base will be equal to money supply.","Required reserve ratio will be equal to one.","Maximum banking multiplier will be equal to zero.","Money creation ability will be smaller than fractional reserve system."],a:"C",e:"100%儲備率：MB=Cp+儲備=Cp+Dd=MS。rr=1。最大乘數=1/1=1（不是0）。貨幣創造能力<部分儲備制。題目問INCORRECT，選C。"},
{y:"2023/DSE/I/34",t:2,q:"Banking system has excess reserves $125m. Balance sheet ($m): Reserves 500, Loans 1000, Deposits 1500. Which is correct?",o:["Actual banking multiplier is 4.","If banks loan out all excess reserves, reserves will decrease after deposit creation.","If banks loan out all excess reserves, maximum possible increase in loans will be $500m.","If public withdraws $125m and holds as cash, excess reserves will decrease to zero immediately."],a:"C",e:"超額=125=500-1500×rr → rr=25%。實際乘數=1/(500/1500)=3。貸出超額$125，乘數=4，可創造存款=500，貸款增加=500-125=375？⚠️此題解析需核對。",check:true},
{y:"2024/DSE/I/34",t:5,q:"Banking system has excess reserves $20m, public holds fixed amount of cash. Balance sheet ($m): Reserves 40, Loans 60, Deposits 100. Some banks lend out excess reserves. After deposit creation, loans increase by $20m. Which is correct?",o:["Reserves become $20m.","Excess reserves become $16m.","Banking system has reserve shortage of $8m.","Deposits become $200m."],a:"B",e:"超額=20=40-100×rr → rr=20%。貸款增加$20，最終貸款=80，儲備不變=40，存款=120。超額=40-120×20%=40-24=16。"},
{y:"2025/DSE/I/34",t:1,q:"Balance sheet: Reserves $250, Loans $750, Deposits $1000. Initially excess reserve $50. Public reduces cash holdings by depositing $100 cash. When maximum deposit is reached, new balance sheet?",o:["A: Reserves 300, Loans 900, Deposits 1200","B: Reserves 350, Loans 1050, Deposits 1400","C: Reserves 300, Loans 1200, Deposits 1500","D: Reserves 350, Loans 1400, Deposits 1750"],a:"D",e:"超額=50=250-1000×rr → rr=20%。存款$100後：儲備=350，存款=1100。最大存款=350÷20%=1750。儲備=350，貸款=1750-350=1400。"}
];

ans_zh:["步驟1：初始提款$M","步驟2：銀行失去儲備（實際儲備 < 要求儲備）","步驟3：銀行收回貸款 / 向公眾出售銀行資產","步驟4：進一步提取銀行存款以償還貸款 / 購買銀行資產","步驟5：收縮過程持續進行","最終：總存款收縮 = $M × (1÷20%) = $5M"],
ans_en:["Step 1: Initial withdrawal of $M","Step 2: Banks lose reserves (actual < required)","Step 3: Banks call back loans / sell assets to public","Step 4: Further withdrawals to repay loans / buy assets","Step 5: Contraction process continues","Final: total deposits contract by $M × (1÷20%) = $5M"],
tip_zh:"💡 收縮過程的步驟順序必須正確，否則不給分。提款→儲備不足→收回貸款→進一步提款→持續。",
tip_en:"💡 Contraction sequence must be correct or no marks. W/D → reserve shortage → call loans → further W/D → continues."},
{year:"1996/CE/I/11(c)",marks:"~3 marks",type:"type4",inferred:true,
q_zh:"解釋為什麼某種變化後，起初可能有存款收縮，但之後被存款擴張抵消；以及銀行獲得超額儲備的情況。（題目內容為AI反推，建議核對原文）",
q_en:"Explain why after a certain change, there may be deposit contraction at first, but then offset by deposit expansion later; and banks gain excess reserves. (Inferred, please verify)",
bs:null,
ans_zh:["(i) 起初可能有存款收縮，但之後會被隨後的存款擴張所抵消","(ii) 銀行獲得超額儲備"],
ans_en:["(i) There may be some deposit contraction at first, but then it would be offset by the deposit expansion later on","(ii) Banks gain excess reserves"],
tip_zh:"💡 注意區分短期和長期效果。某些政策（如公開市場操作）可能先收縮後擴張。",
tip_en:"💡 Distinguish short-term vs long-term effects. Some policies may contract first then expand."},
{year:"1997/CE/I/9(c)",marks:"max 4 marks",type:"type2",inferred:true,
q_zh:"銀行貸出$R。解釋為什麼實際總存款可能小於最大值，列舉因素並詳細解釋任何一個因素。（題目內容為AI反推，建議核對原文）",
q_en:"Banks lend out $R. Explain why actual total deposits may be smaller than the maximum. List factors and elaborate on any one. (Inferred, please verify)",
bs:null,
ans_zh:["但由於以下因素，重新存款金額小於$R：","- 現金外流（cash drain）","詳細解釋任何一個因素如何導致總銀行存款小於最大值（2分，最多4分）"],
ans_en:["But due to the following factor(s), the redeposit amount is smaller than $R:","- cash drain","Elaboration on how any one factor leads to total bank deposits smaller than maximum (2@, max:4)"],
tip_zh:"💡 實際<最大的原因：超額儲備、現金外流、貸款需求不足。必須解釋其中一個如何影響乘數。",
tip_en:"💡 Reasons actual < max: excess reserves, cash leakage, insufficient loan demand. Must explain how one affects the multiplier."},
{year:"1998/CE/I/9(a)",marks:"2 marks",type:"type1",inferred:true,
q_zh:"解釋並計算存款創造後的最終總存款。（題目內容為AI反推，建議核對原文）",
q_en:"Explain and calculate final total deposits after deposit creation. (Inferred, please verify)",
bs:null,
ans_zh:["最終總存款 = 初始存款 × (1 ÷ 儲備率)"],
ans_en:["Final total deposits created = initial deposit × (1 ÷ reserve ratio)"],
tip_zh:"💡 基礎公式：最大存款=初始存款×乘數。必須寫出公式再代入數字。",
tip_en:"💡 Basic formula: max deposits = initial × multiplier. Show formula then substitute."},
{year:"1999/CE/I/6(a)",marks:"2 marks",type:"type5",inferred:true,
q_zh:"銀行原有存款$10000，有人存入$1000，法定儲備率25%。計算貸出後的某個值（可能是貸款或存款）。（題目內容為AI反推，建議核對原文）",
q_en:"Bank originally has $10000 deposits, someone deposits $1000, RR 25%. Calculate a value after lending (possibly loans or deposits). (Inferred, please verify)",
bs:null,
ans_zh:["$10000 + [$1000 × (1 - 25%)] = $10750"],
ans_en:["$10000 + [$1000 × (1 - 25%)] = $10750"],
tip_zh:"💡 新存款中，儲備部分不能貸出，可貸出=新存款×(1-儲備率)。",
tip_en:"💡 Of new deposits, reserve portion cannot be lent. Loanable = new deposit × (1-RR)."},
{year:"2000/CE/I/10(a)",marks:"~7 marks",type:"type6",inferred:true,
q_zh:"銀行體系：儲備$200m、存款$1000m，法定儲備率20%。有人提取$10m並持有為現金。(i) 計算銀行存款的最大變化。(ii) 計算貨幣供應的變化。另考慮：如果公眾用$50m現金償還貸款，結果如何？（題目內容為AI反推，建議核對原文）",
q_en:"BS: Reserves $200m, Deposits $1000m, RR 20%. Someone withdraws $10m and holds as cash. (i) Calculate max change in bank deposits. (ii) Calculate change in MS. Alternative: if public uses $50m cash to repay loans, what happens? (Inferred, please verify)",
bs:{reserves:200,loans:800,deposits:1000,unit:"$m"},
ans_zh:["(i) 存款變化 = -$10m × [1 - (200/1000)] = -$8m？或最大變化 = -$10m × (1÷20%) = -$50m","(ii) 貨幣供應變化 = 現金變化 + 存款變化 = (+$10m) + (-$50m) = -$40m","Answer 2（假設公眾用$50m現金償還貸款）：最大變化相同，但實際變化取決於多少現金用於償還貸款。最小變化 = -$10m。"],
ans_en:["(i) Change in deposits = -$10m × [1-(200/1000)] = -$8m? Or max change = -$10m × (1÷20%) = -$50m","(ii) Change in MS = Change in cash + Change in deposits = (+$10m) + (-$50m) = -$40m","Answer 2 (assume public uses $50m cash to repay loans): max change same, actual depends on how much cash used. Min change = -$10m."],
tip_zh:"💡 MS=Cp+Dd。提款時Cp↑但Dd↓（若銀行收縮）。注意題目是否考慮公眾用現金還款的情況。",
tip_en:"💡 MS=Cp+Dd. Withdrawal: Cp↑ but Dd↓ (if banks contract). Note whether question considers public using cash to repay loans."},
{year:"2001/CE/I/10(b)",marks:"8 marks",type:"type3",
q_zh:"銀行體系資產負債表（$m）：儲備250、貸款750、存款1000。法定儲備率20%。(i) 計算實際儲備率及超額儲備。(ii) 一名存戶提取$40m並投資海外，若所有銀行貸出剩餘超額儲備，銀行體系最大可能總存款是多少？解釋答案。",
q_en:"BS ($m): Reserves 250, Loans 750, Deposits 1000. RR 20%. (i) Calculate actual RR and excess reserves. (ii) A depositor withdraws $40m and invests overseas. If banks lend out remaining excess reserves, what is the max possible total deposits? Explain.",
bs:{reserves:250,loans:750,deposits:1000,unit:"$m"},
ans_zh:["(i) 實際儲備率 = $250m ÷ $1000m = 25%（1分）","超額儲備 = (25% - 20%) × $1000m = $50m（2分）","(ii) 提款後儲備 = $250m - $40m = $210m（1分）","新最大存款 = $210m × (1 ÷ 20%) = $1050m（3分）","解釋：提款同時減少儲備和存款，新儲備量決定可支持的最大存款（1分）"],
ans_en:["(i) Actual RR = $250m ÷ $1000m = 25% (1 mark)","Excess reserves = (25% - 20%) × $1000m = $50m (2 marks)","(ii) Reserves after withdrawal = $250m - $40m = $210m (1 mark)","New max deposits = $210m × (1 ÷ 20%) = $1050m (3 marks)","Explanation: Withdrawal reduces both reserves and deposits; new reserves determine max deposits (1 mark)"],
tip_zh:"💡 提款後必須用「新儲備量」去乘乘數，不是用原儲備。投資海外=現金外流，不會重新存入銀行。",
tip_en:"💡 Use NEW reserves after withdrawal × multiplier, not original reserves. Overseas investment = cash leakage."},
{year:"2002/CE/I/10(a)",marks:"9 marks",type:"type6",
q_zh:"銀行體系資產負債表（$mn）：儲備20、貸款80、存款100。公眾將$10m現金存入銀行。(i) 假設銀行不持有超額儲備，計算貨幣供應的最大可能變化並解釋。(ii) 列舉兩個實際變化可能小於最大值的原因。",
q_en:"BS ($mn): Reserves 20, Loans 80, Deposits 100. Public deposits $10m cash. (i) No excess reserves. Calculate max possible change in MS and explain. (ii) Give TWO reasons actual change may be less than max.",
bs:{reserves:20,loans:80,deposits:100,unit:"$mn"},
ans_zh:["(i) 法定儲備率 = 20/100 = 20%，乘數 = 5（1分）","最大存款增加 = $10m × 5 = $50m（1分）","最大貨幣供應變化 = 最大存款增加 - 公眾現金減少 = $50m - $10m = $40m（1分）","解釋：MS = Cp + Dd。Cp減少$10m，Dd增加$50m，淨增加$40m（2分）","(ii) 任何兩個：- 有現金外流（公眾持有部分貸款為現金）（2分）- 銀行決定持有超額儲備（2分）- 貸款需求不足（2分）"],
ans_en:["(i) Required RR = 20/100 = 20%, multiplier = 5 (1 mark)","Max deposit increase = $10m × 5 = $50m (1 mark)","Max MS change = Max deposit increase - decrease in public cash = $50m - $10m = $40m (1 mark)","Explanation: MS = Cp + Dd. Cp falls $10m, Dd rises $50m, net +$40m (2 marks)","(ii) Any TWO: - Cash leakage (public holds some loans as cash) (2 marks) - Banks hold excess reserves (2 marks) - Insufficient loan demand (2 marks)"],
tip_zh:"💡 貨幣供應變化=存款變化-公眾現金變化（因為存入銀行的現金來自公眾）。必須寫明MS=Cp+Dd的假設。",
tip_en:"💡 ΔMS = ΔDd - ΔCp (cash deposited comes from public). Must state MS = Cp + Dd assumption."},
{year:"2003/CE/I/11(c)",marks:"2 marks",type:"type5",inferred:true,
q_zh:"銀行體系有儲備$250m，法定儲備率20%。計算最大可支持的存款。（題目內容為AI反推，建議核對原文）",
q_en:"Banking system has reserves $250m, RR 20%. Calculate max supportable deposits. (Inferred, please verify)",
bs:null,
ans_zh:["最大存款 = $250m × (1 ÷ 20%) = $1250m"],
ans_en:["Max deposits = $250m × (1 ÷ 20%) = $1250m"],
tip_zh:"💡 最大存款=儲備÷儲備率。這是最基礎的公式。",
tip_en:"💡 Max deposits = reserves ÷ RR. Most basic formula."},
{year:"2004/CE/I/6(b)",marks:"~4 marks",type:"type3",inferred:true,
q_zh:"解釋提款如何導致存款收縮的過程。（題目內容為AI反推，建議核對原文）",
q_en:"Explain how withdrawal leads to deposit contraction process. (Inferred, please verify)",
bs:null,
ans_zh:["初始提取存款","銀行失去儲備 / 儲備不足 / 實際儲備小於要求儲備","銀行須收回貸款 / 向公眾出售資產","進一步提取存款","過程持續進行"],
ans_en:["Initial withdrawal of deposit","Banks lose reserves / insufficient reserves / actual < required","Banks have to call back loans / sell assets to public","Further withdrawals of deposits","The process goes on and on"],
tip_zh:"💡 收縮過程必須按因果順序寫：提款→儲備不足→收回貸款→進一步提款→持續。",
tip_en:"💡 Contraction must follow causal sequence: W/D → shortage → call loans → further W/D → continues."},
{year:"2005/CE/I/5",marks:"~4 marks",type:"type5",inferred:true,
q_zh:"銀行體系（$m）：儲備120、貸款880、存款1000，法定儲備率10%。(a) 計算超額儲備。(b) 若貸出所有超額儲備，最大總存款是多少？（題目內容為AI反推，建議核對原文）",
q_en:"BS ($m): Reserves 120, Loans 880, Deposits 1000, RR 10%. (a) Calculate excess reserves. (b) If all excess reserves are lent out, what is max total deposits? (Inferred, please verify)",
bs:{reserves:120,loans:880,deposits:1000,unit:"$m"},
ans_zh:["(a) 超額儲備 = $[120 - (1000 × 10%)]m = $20m","(b) 最大可能銀行存款 = $120m × (1 ÷ 10%) = $1200m"],
ans_en:["(a) Excess reserve = $[120 - (1000 × 10%)]m = $20m","(b) Maximum possible amount of bank deposits = $120m × (1 ÷ 10%) = $1200m"],
tip_zh:"💡 有超額儲備時，最大存款=實際儲備÷法定儲備率（不是用超額儲備去乘）。",
tip_en:"💡 With excess reserves, max deposits = actual reserves ÷ required RR (not excess × multiplier)."},
{year:"2006/CE/I/6",marks:"~4 marks",type:"type2",inferred:true,
q_zh:"銀行體系：儲備$500、存款$5000，法定儲備率10%。有人提取$350。(a) 法定儲備率是多少？(b) 提款後銀行是否仍有超額儲備？解釋。（題目內容為AI反推，建議核對原文）",
q_en:"BS: Reserves $500, Deposits $5000, RR 10%. Someone withdraws $350. (a) What is the required RR? (b) After withdrawal, do banks still have excess reserves? Explain. (Inferred, please verify)",
bs:{reserves:500,loans:4500,deposits:5000},
ans_zh:["(a) 10%","(b) 是的，因為儲備資產只減少到$150（= $500 - $350），仍有超額儲備$35"],
ans_en:["(a) 10%","(b) Yes, because the reserve assets only reduce to $150 (= $500 - $350), there is still an excess reserve of $35"],
tip_zh:"💡 提款後要重新計算超額儲備=實際儲備-新存款×法定儲備率。",
tip_en:"💡 After W/D, recalculate excess = actual - new deposits × RR."},
{year:"2007/CE/I/7",marks:"~5 marks",type:"type3",inferred:true,
q_zh:"銀行體系：儲備$200、存款$1000，法定儲備率20%。有人提取$100。(a) 原儲備是多少？(b)(i) 存款變化？(ii) 貸款變化？（題目內容為AI反推，建議核對原文）",
q_en:"BS: Reserves $200, Deposits $1000, RR 20%. Someone withdraws $100. (a) Original reserves? (b)(i) Change in deposits? (ii) Change in loans? (Inferred, please verify)",
bs:{reserves:200,loans:800,deposits:1000},
ans_zh:["(a) $200","(b)(i) -$100（即時提款）或最大變化 = -$100 × (1÷20%) = -$500","(b)(ii) -$30（貸款變化）"],
ans_en:["(a) $200","(b)(i) -$100 (immediate) or max change = -$100 × (1÷20%) = -$500","(b)(ii) -$30 (change in loans)"],
tip_zh:"💡 注意區分即時變化和最大變化。提款後即時：存款和儲備都減$100。最大變化要乘乘數。",
tip_en:"💡 Distinguish immediate vs max change. Immediate: both deposits and reserves fall by $100. Max change × multiplier."},
{year:"2008/CE/I/10",marks:"9 marks",type:"type4",
q_zh:"政府減少貨幣供應以冷卻過熱經濟。銀行體系資產負債表（$m）：儲備1000、貸款4000、存款5000。公眾持有固定現金，銀行不持有超額儲備。央行將最低儲備率提高5%。(a) 簡要解釋儲備率變化導致的存款收縮過程。(b) 計算並解釋貨幣供應的變化。",
q_en:"Government reduces MS to cool economy. BS ($m): Reserves 1000, Loans 4000, Deposits 5000. Public holds fixed cash, no excess reserves. Central bank raises minimum RR by 5%. (a) Explain deposit contraction process. (b) Calculate and explain change in MS.",
bs:{reserves:1000,loans:4000,deposits:5000,unit:"$m"},
ans_zh:["(a) 儲備率提高 → 實際儲備 < 要求儲備（1分）→ 銀行須收回貸款/向公眾出售資產（1分）→ 存款被提取（1分）→ 過程持續直至實際儲備 = 要求儲備（1分）","(b) 原儲備率 = 1000/5000 = 20%，新儲備率 = 25%（1分）","新最大存款 = $1000m ÷ 25% = $4000m（1分）","存款變化 = $4000m - $5000m = -$1000m（1分）","MS變化 = 存款變化（Cp不變）= -$1000m（1分）"],
ans_en:["(a) RR increases → actual reserves < required reserves (1 mark) → banks call back loans / sell assets to public (1 mark) → withdrawals of deposits (1 mark) → process continues until actual = required (1 mark)","(b) Original RR = 1000/5000 = 20%, New RR = 25% (1 mark)","New max deposits = $1000m ÷ 25% = $4000m (1 mark)","Change in deposits = $4000m - $5000m = -$1000m (1 mark)","Change in MS = change in deposits (Cp unchanged) = -$1000m (1 mark)"],
tip_zh:"💡 提高儲備率不會即時改變儲備金額！是「要求儲備」增加了，令實際儲備不足。收縮過程的步驟順序必須正確，否則不給分。",
tip_en:"💡 Raising RR does NOT immediately change reserve amount! It increases REQUIRED reserves, making actual insufficient. Contraction sequence must be correct or no marks."},
{year:"2009/CE/I/6",marks:"~4 marks",type:"type5",inferred:true,
q_zh:"銀行體系：儲備$300、貸款$700、存款$1000，法定儲備率20%。(a) 計算最低要求儲備。(b) 若貸出所有超額儲備，最大總存款是多少？（題目內容為AI反推，建議核對原文）",
q_en:"BS: Reserves $300, Loans $700, Deposits $1000, RR 20%. (a) Calculate minimum required reserves. (b) If all excess reserves lent out, max total deposits? (Inferred, please verify)",
bs:{reserves:300,loans:700,deposits:1000},
ans_zh:["(a) 最低要求儲備 = $1000 × 20% = $200","(b) 超額儲備 = $300 - $200 = $100","最大總存款 = $1000 + $100 × (1÷20%) = $1000 + $500 = $1500"],
ans_en:["(a) Minimum required reserve = $1000 × 20% = $200","(b) Excess reserves = $300 - $200 = $100","Max total deposits = $1000 + $100 × (1÷20%) = $1000 + $500 = $1500"],
tip_zh:"💡 最大總存款=原存款+超額儲備×乘數。或直接=實際儲備÷法定儲備率。",
tip_en:"💡 Max total deposits = original + excess × multiplier. Or directly = actual reserves ÷ required RR."},
{year:"2010/CE/I/11(b)",marks:"7 marks",type:"type4",
q_zh:"2008金融海嘯衝擊A國經濟。銀行體系資產負債表（$m）：儲備2000、貸款6000、存款8000。金融危機期間，銀行將儲備率提高至40%以策安全，導致銀行存款變化。(i) 計算銀行存款的最大可能變化。(ii) 簡要解釋儲備率變化導致的存款收縮過程。",
q_en:"2008 financial tsunami hits Economy A. BS ($m): Reserves 2000, Loans 6000, Deposits 8000. During crisis, banks increase RR to 40% for safety, causing change in bank deposits. (i) Calculate max possible change in bank deposits. (ii) Explain deposit contraction process from RR change.",
bs:{reserves:2000,loans:6000,deposits:8000,unit:"$m"},
ans_zh:["(i) 銀行乘數 = 1 ÷ 40% = 2.5（1分）","$2000m儲備在40%儲備率下可支持 = $2000m × 2.5 = $5000m（1分）","存款最大變化 = $5000m - $8000m = -$3000m（1分）","(ii) 儲備率提高 → 實際儲備 < 要求儲備（1分）→ 銀行須收回貸款/向公眾出售資產（1分）→ 存款被提取（1分）→ 過程持續直至實際儲備 = 要求儲備（1分）","※注意：步驟順序必須正確，若從「存款被提取」開始只給最多2分"],
ans_en:["(i) Banking multiplier = 1 ÷ 40% = 2.5 (1 mark)","Max deposits supported by $2000m at 40% = $2000m × 2.5 = $5000m (1 mark)","Max change in deposits = $5000m - $8000m = -$3000m (1 mark)","(ii) RR increases → actual reserves < required reserves (1 mark) → banks call back loans / sell assets (1 mark) → deposits withdrawn (1 mark) → continues until actual = required (1 mark)","※Note: Correct sequence required; starting from 'withdrawals' awards max 2 marks"],
tip_zh:"💡 這題是DSE經典題。注意「銀行自發提高儲備率」和「央行提高法定儲備率」效果相同。評分標準特別強調步驟順序，考生常因順序錯而丟分。",
tip_en:"💡 DSE classic. Banks voluntarily raising RR = same effect as central bank raising required RR. Marking scheme emphasizes sequence — candidates often lose marks for wrong order."},
{year:"2017/DSE/I/8",marks:"3 marks",type:"type2",inferred:true,
q_zh:"銀行體系：儲備$1000、貸款$2000、存款$3000，有超額儲備$250。(a) 求法定儲備率。(b) 若貸出超額儲備，存款最大變化是多少？（題目內容為AI反推，建議核對原文）",
q_en:"BS: Reserves $1000, Loans $2000, Deposits $3000, excess reserves $250. (a) Find required RR. (b) If excess reserves lent out, max change in deposits? (Inferred, please verify)",
bs:{reserves:1000,loans:2000,deposits:3000},
ans_zh:["(a) 法定儲備率 = ($1000 - $250) ÷ $3000 = 0.25 = 25%","(b) 存款變化 = $250 × (1 ÷ 0.25) = $1000"],

let curLang="zh-hk",curMode="expansion",cmpOn=false,mcqFilter=0;
function t(k){return L[curLang][k]||k;}
function $(id){return document.getElementById(id);}
function fmt(n){return n.toLocaleString(undefined,{maximumFractionDigits:2});}

function switchMode(m){
  curMode=m;
  $("params-expansion").classList.toggle("hidden",m!=="expansion");
  $("params-contraction").classList.toggle("hidden",m!=="contraction");
  $("mode-expansion").className="mode-btn"+(m==="expansion"?" active-expansion":"");
  $("mode-contraction").className="mode-btn"+(m==="contraction"?" active-contraction":"");
  $("mode-expansion").innerText=t("modeExpansion");
  $("mode-contraction").innerText=t("modeContraction");
  runSim();
}
function toggleComparison(){
  cmpOn=!cmpOn;
  $("comparison-area").classList.toggle("show",cmpOn);
  $("toggle-compare").innerText=cmpOn?t("toggleCompareOff"):t("toggleCompareOn");
  if(cmpOn)renderCmpParams();
  runSim();
}
function renderCmpParams(){
  if(curMode==="expansion"){
    $("compare-current-params").innerHTML=cmpExpHTML("cmp-cur",1000,10,0,0);
    $("compare-new-params").innerHTML=cmpExpHTML("cmp-new",1000,20,0,0);
    initCmpSync();
  }else{
    $("compare-current-params").innerHTML=cmpConHTML("cmp-cur",8000,2000,0,25);
    $("compare-new-params").innerHTML=cmpConHTML("cmp-new",8000,2000,0,40);
  }
}
function cmpExpHTML(prefix,init,rr,er,cl){
  return `<div class="ratio-row"><label>${t("labelInit")}</label><input type="number" id="${prefix}-init" value="${init}" style="padding:6px;width:100%;font-size:14px;"></div>
  <div class="ratio-row"><label>${t("labelRR")}</label><div class="ratio-inputs"><input type="number" id="${prefix}-rr-pct" value="${rr}" step="0.01"><span>%</span><input type="number" id="${prefix}-rr-amt" value="${init*rr/100}" step="0.01"><span>$</span></div></div>
  <div class="ratio-row"><label>${t("labelER")}</label><div class="ratio-inputs"><input type="number" id="${prefix}-er-pct" value="${er}" step="0.01"><span>%</span><input type="number" id="${prefix}-er-amt" value="${init*er/100}" step="0.01"><span>$</span></div></div>
  <div class="ratio-row"><label>${t("labelCL")}</label><div class="ratio-inputs"><input type="number" id="${prefix}-cl-pct" value="${cl}" step="0.01"><span>%</span><input type="number" id="${prefix}-cl-amt" value="${init*cl/100}" step="0.01"><span>$</span></div></div>`;
}
function cmpConHTML(prefix,bd,br,wd,rr){
  return `<div class="ratio-row"><label>${t("labelBaselineDep")}</label><input type="number" id="${prefix}-bd" value="${bd}" style="padding:6px;width:100%;font-size:14px;"></div>
  <div class="ratio-row"><label>${t("labelBaselineRes")}</label><input type="number" id="${prefix}-br" value="${br}" style="padding:6px;width:100%;font-size:14px;"></div>
  <div class="ratio-row"><label>${t("labelWithdrawal")}</label><input type="number" id="${prefix}-wd" value="${wd}" style="padding:6px;width:100%;font-size:14px;"></div>
  <div class="ratio-row"><label>${t("labelRRC")}</label><div class="ratio-inputs"><input type="number" id="${prefix}-rr-pct" value="${rr}" step="0.01"><span>%</span></div></div>`;
}
function initSync(){
  ["rr","er","cl"].forEach(type=>{
    const pct=$("exp-"+type+"-pct"),amt=$("exp-"+type+"-amt"),init=$("exp-init");
    pct.addEventListener("input",()=>{amt.value=(Number(init.value)*Number(pct.value)/100).toFixed(2);runSim();});
    amt.addEventListener("input",()=>{const i=Number(init.value);if(i>0){pct.value=(Number(amt.value)/i*100).toFixed(2);runSim();}});
  });
  $("exp-init").addEventListener("input",()=>{
    const i=Number($("exp-init").value);
    ["rr","er","cl"].forEach(type=>{$("exp-"+type+"-amt").value=(i*Number($("exp-"+type+"-pct").value)/100).toFixed(2);});
    runSim();
  });
  ["con-bd","con-br","con-wd","con-rr-pct","con-er-pct","con-cl-pct","displayRounds"].forEach(id=>{
    const el=$(id);if(el)el.addEventListener("input",runSim);
  });
}
function initCmpSync(){
  ["cmp-cur","cmp-new"].forEach(p=>{
    const init=$(p+"-init");if(!init)return;
    ["rr","er","cl"].forEach(type=>{
      const pct=$(p+"-"+type+"-pct"),amt=$(p+"-"+type+"-amt");
      pct.addEventListener("input",()=>{amt.value=(Number(init.value)*Number(pct.value)/100).toFixed(2);runSim();});
      amt.addEventListener("input",()=>{const i=Number(init.value);if(i>0){pct.value=(Number(amt.value)/i*100).toFixed(2);runSim();}});
    });
    init.addEventListener("input",()=>{
      const i=Number(init.value);
      ["rr","er","cl"].forEach(type=>{$(p+"-"+type+"-amt").value=(i*Number($(p+"-"+type+"-pct").value)/100).toFixed(2);});
      runSim();
    });
    [p+"-bd",p+"-br",p+"-wd",p+"-rr-pct"].forEach(id=>{const el=$(id);if(el)el.addEventListener("input",runSim);});
  });
}
function getExp(p){return{init:Number($(p+"-init").value),rr:Number($(p+"-rr-pct").value)/100,er:Number($(p+"-er-pct").value)/100,cl:Number($(p+"-cl-pct").value)/100};}
function getCon(p){return{bd:Number($(p+"-bd").value),br:Number($(p+"-br").value),wd:Number($(p+"-wd").value),rr:Number($(p+"-rr-pct").value)/100,er:Number($(p+"-er-pct")?.value||0)/100,cl:Number($(p+"-cl-pct")?.value||0)/100};}
function calcExp(p,rounds){
  const{init,rr,er,cl}=p;
  if(rr<=0||rr>=1||er<0||er>=1||cl<0||cl>=1)return null;
  const maxDM=1/rr,maxLM=maxDM-1,actDM=1/(rr+er+cl),actLM=actDM-1;
  const totalDep=init*actDM,totalRes=totalDep*(rr+er),totalLoan=totalDep-totalRes;
  let cur=init,cumD=0,cumR=0,cumE=0,cumC=0,cumL=0,rows=[];
  for(let r=1;r<=50;r++){
    const req=cur*rr,exc=cur*er,cash=cur*cl,lend=cur-req-exc-cash;
    cumD+=cur;cumR+=req;cumE+=exc;cumC+=cash;cumL+=lend;
    if(r<=rounds)rows.push({r,newD:cur,req,exc,cash,lend});
    cur=lend;if(cur<0.01)break;
  }
  return{maxDM,maxLM,actDM,actLM,totalDep,totalRes,totalLoan,cumD,cumR,cumE,cumC,cumL,rows};
}
function calcCon(p,rounds){
  const{bd,br,wd,rr,er,cl}=p;
  if(rr<=0||rr>=1)return null;
  const actRR=bd>0?br/bd:0,d1=bd-wd,r1=br-wd,tot=rr+er+cl;
  const finalDep=tot>0?r1/tot:d1,finalRes=finalDep*(rr+er),finalLoan=finalDep-finalRes,depChg=finalDep-bd;
  let cRows=[],curD=d1,curR=r1,rn=1;
  const req1=curD*rr,sh1=curR-req1;
  cRows.push({r:rn,curD,req:req1,res:curR,sh:sh1,call:0,desc:wd>0?t("descWithdraw"):t("descShortfall")});
  while(rn<rounds&&curD*rr>curR+0.01){
    rn++;const req=curD*rr,short=req-curR,call=Math.min(short,curD*0.5);
    curD-=call;const nreq=curD*rr,nsh=curR-nreq;
    cRows.push({r:rn,curD,req:nreq,res:curR,sh:nsh,call,desc:t("descContraction")});
  }
  if(cRows.length<rounds&&Math.abs(curD-finalDep)>1){rn++;cRows.push({r:rn,curD:finalDep,req:finalDep*rr,res:finalRes,sh:0,call:curD-finalDep,desc:t("descBalance")});}
  return{bd,br,actRR,wd,d1,r1,finalDep,finalRes,finalLoan,depChg,maxDM:1/rr,actDM:tot>0?1/tot:0,rr,er,cl,cRows};
}

}
function renderConTable(d){
  let h=`<h4>${t("contractionProcessTitle")}</h4><table><thead><tr><th>${t("thRound")}</th><th>${t("thCurDep")}</th><th>${t("thReqReserve")}</th><th>${t("thActReserve")}</th><th>${t("thShortfall")}</th><th>${t("thCallLoan")}</th><th>${t("thDesc")}</th></tr></thead><tbody>`;
  d.cRows.forEach(row=>{
    const sh=row.sh>=0?`+$${fmt(row.sh)}`:`-$${fmt(Math.abs(row.sh))}`;
    const cls=row.sh>=0?"change-down":"change-up";
    h+=`<tr><td>${row.r}</td><td>$${fmt(row.curD)}</td><td>$${fmt(row.req)}</td><td>$${fmt(row.res)}</td><td class="${cls}">${sh}</td><td>$${fmt(row.call)}</td><td>${row.desc}</td></tr>`;
  });
  h+=`</tbody></table>`;return h;
}
function runSim(){
  const rounds=Math.max(1,Math.min(50,Number($("displayRounds").value)||20));
  let h="";
  if(curMode==="expansion"){
    const d=calcExp(getExp("exp"),rounds);
    if(!d){h=`<div class="box"><p class="error">${t("errorMsg")}</p></div>`;$("output").innerHTML=h;return;}
    h=`<div class="box"><div class="multiplier-grid">
      <div class="multi-card max"><h4>${t("maxMultTitle")}</h4><p>${t("maxDepMult")}<strong>${d.maxDM.toFixed(3)}</strong></p><p>${t("maxLoanMult")}<strong>${d.maxLM.toFixed(3)}</strong></p></div>
      <div class="multi-card"><h4>${t("actualMultTitle")}</h4><p>${t("actualDepMult")}<strong>${d.actDM.toFixed(3)}</strong></p><p>${t("actualLoanMult")}<strong>${d.actLM.toFixed(3)}</strong></p></div></div>
      <h4>${t("bsTitleCurrent")}</h4>${renderBS(d.totalDep,d.totalRes,d.totalLoan)}
      <h4>${t("processTitle")}</h4>${renderProcTable(d)}</div>`;
    if(cmpOn){
      const c=calcExp(getExp("cmp-cur"),rounds),n=calcExp(getExp("cmp-new"),rounds);
      if(c&&n){
        h+=`<div class="box"><h3>${t("comparisonTitle")}</h3><table class="comparison-table"><thead><tr><th>${t("indicator")}</th><th>${t("currentVal")}</th><th>${t("newVal")}</th><th>${t("change")}</th></tr></thead><tbody>
        <tr><td>${t("depMult")}</td><td>${c.actDM.toFixed(3)}</td><td>${n.actDM.toFixed(3)}</td><td>${n.actDM-c.actDM>=0?'+':''}${(n.actDM-c.actDM).toFixed(3)}</td></tr>
        <tr><td>${t("totalDeposit")}</td><td>$${fmt(c.totalDep)}</td><td>$${fmt(n.totalDep)}</td><td class="${n.totalDep-c.totalDep>=0?'change-up':'change-down'}">${n.totalDep-c.totalDep>=0?'+':''}$${fmt(n.totalDep-c.totalDep)}</td></tr>
        <tr><td>${t("totalLoan")}</td><td>$${fmt(c.totalLoan)}</td><td>$${fmt(n.totalLoan)}</td><td class="${n.totalLoan-c.totalLoan>=0?'change-up':'change-down'}">${n.totalLoan-c.totalLoan>=0?'+':''}$${fmt(n.totalLoan-c.totalLoan)}</td></tr>
        </tbody></table></div>`;
      }
    }
  }else{
    const d=calcCon(getCon("con"),rounds);
    if(!d){h=`<div class="box"><p class="error">${t("errorMsg")}</p></div>`;$("output").innerHTML=h;return;}
    const bl=d.bd-d.br,la=d.d1-d.r1;
    h=`<div class="box"><h3>${t("contractionTitle")}</h3><p><strong>${t("actualRR")}：</strong>${(d.actRR*100).toFixed(2)}%</p>
      <div class="contraction-stages">
      <div class="stage-card"><h5>${t("stageBaseline")}</h5><p>${t("totalDepositsBS")}: $${fmt(d.bd)}</p><p>${t("totalReservesBS")}: $${fmt(d.br)}</p><p>${t("totalLoansBS")}: $${fmt(bl)}</p></div>
      <div class="stage-card"><h5>${t("stageAfterWithdraw")}</h5><p>${t("totalDepositsBS")}: $${fmt(d.d1)}</p><p>${t("totalReservesBS")}: $${fmt(d.r1)}</p><p>${t("totalLoansBS")}: $${fmt(la)}</p></div>
      <div class="stage-card stage-final"><h5>${t("stageFinal")}</h5><p>${t("totalDepositsBS")}: $${fmt(d.finalDep)}</p><p>${t("totalReservesBS")}: $${fmt(d.finalRes)}</p><p>${t("totalLoansBS")}: $${fmt(d.finalLoan)}</p></div></div>
      <p><strong>${t("change")}：</strong><span class="${d.depChg<0?'change-down':'change-up'}">$${fmt(d.depChg)}</span></p>
      <p>${t("maxDepMult")}<strong>${d.maxDM.toFixed(3)}</strong>　${t("actualDepMult")}<strong>${d.actDM.toFixed(3)}</strong></p>
      ${renderConTable(d)}
      <h4>${t("bsTitleCurrent")}</h4>${renderBS(d.finalDep,d.finalRes,d.finalLoan)}</div>`;
    if(cmpOn){
      const c=calcCon(getCon("cmp-cur"),rounds),n=calcCon(getCon("cmp-new"),rounds);
      if(c&&n){
        h+=`<div class="box"><h3>${t("comparisonTitle")}</h3><table class="comparison-table"><thead><tr><th>${t("indicator")}</th><th>${t("currentVal")}</th><th>${t("newVal")}</th><th>${t("change")}</th></tr></thead><tbody>
        <tr><td>${t("totalDeposit")}</td><td>$${fmt(c.finalDep)}</td><td>$${fmt(n.finalDep)}</td><td class="${n.finalDep-c.finalDep>=0?'change-up':'change-down'}">${n.finalDep-c.finalDep>=0?'+':''}$${fmt(n.finalDep-c.finalDep)}</td></tr>
        <tr><td>${t("totalReserve")}</td><td>$${fmt(c.finalRes)}</td><td>$${fmt(n.finalRes)}</td><td class="${n.finalRes-c.finalRes>=0?'change-up':'change-down'}">${n.finalRes-c.finalRes>=0?'+':''}$${fmt(n.finalRes-c.finalRes)}</td></tr>
        </tbody></table></div>`;
      }
    }
  }
  h+=`<div class="box note"><strong>${t("noteTitle")}</strong>${t("noteContent")}</div>`;
  $("output").innerHTML=h;
  renderSkill();
}
