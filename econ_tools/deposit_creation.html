<h1 id="page-title">🏦 DSE ECON｜銀行存款創造模擬器</h1>
<div class="box">
<p id="assumption-text">✅基礎假設：銀行將可貸出金額全數貸出</p>
<div class="mode-bar">
<button class="mode-btn active-expansion" id="mode-expansion" onclick="switchMode('expansion')">📈 新增存款（擴張）</button>
<button class="mode-btn" id="mode-contraction" onclick="switchMode('contraction')">📉 減少存款（提款收縮）</button>
</div>
<div class="common-settings"><label id="label-rounds">顯示輪數：</label><input type="number" id="displayRounds" value="20" min="1" max="50"></div>
<div id="params-expansion">
<div class="ratio-row"><label id="label-init-e">初始存款 ($)：</label><input type="number" id="exp-init" value="1000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-rr-e">法定儲備：</label><div class="ratio-inputs"><input type="number" id="exp-rr-pct" value="10" step="0.01"><span>%</span><input type="number" id="exp-rr-amt" value="100" step="0.01"><span>$</span></div></div>
<div class="ratio-row"><label id="label-er-e">超額儲備：</label><div class="ratio-inputs"><input type="number" id="exp-er-pct" value="0" step="0.01"><span>%</span><input type="number" id="exp-er-amt" value="0" step="0.01"><span>$</span></div></div>
<div class="ratio-row"><label id="label-cl-e">現金外流：</label><div class="ratio-inputs"><input type="number" id="exp-cl-pct" value="0" step="0.01"><span>%</span><input type="number" id="exp-cl-amt" value="0" step="0.01"><span>$</span></div></div>
</div>
<div id="params-contraction" class="hidden">
<div class="ratio-row"><label id="label-bd">基線存款 ($)：</label><input type="number" id="con-bd" value="8000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-br">基線儲備 ($)：</label><input type="number" id="con-br" value="2000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-wd">提款金額 ($)：</label><input type="number" id="con-wd" value="0" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-rr-c">法定儲備率：</label><div class="ratio-inputs"><input type="number" id="con-rr-pct" value="25" step="0.01"><span>%</span></div></div>
<div class="ratio-row"><label id="label-er-c">超額儲備率：</label><div class="ratio-inputs"><input type="number" id="con-er-pct" value="0" step="0.01"><span>%</span></div></div>
<div class="ratio-row"><label id="label-cl-c">現金外流率：</label><div class="ratio-inputs"><input type="number" id="con-cl-pct" value="0" step="0.01"><span>%</span></div></div>
</div>
<button class="toggle-compare-btn" id="toggle-compare" onclick="toggleComparison()">➕ <span id="toggle-compare-text">加入變化情況對比</span></button>
<div class="comparison-area" id="comparison-area"><div class="scenario-grid" style="margin-top:16px;">
<div class="scenario-box current"><div class="scenario-title" id="title-current">📌 現時情況（基準）</div><div id="compare-current-params"></div></div>
<div class="scenario-box new"><div class="scenario-title" id="title-new">🔄 新增情況（變化後）</div><div id="compare-new-params"></div></div>
</div>

</div>

<div class="skill-header" onclick="toggleSkill()"><h2 id="skill-title">📝 DSE 答題技巧與真題精解</h2><span class="skill-toggle" id="skill-toggle">+</span></div>

<button class="skill-tab active" onclick="switchSkillTab(0)" id="tab-0">答題步驟</button>

<script>




// ===== 關鍵概念（10個）=====
const CONCEPTS=[
{title:"法定儲備率",en:"Required Reserve Ratio (RR)",
def:"央行規定銀行必須保留的存款比例，不能貸出。是決定最大存款乘數的關鍵因素。",
def_en:"The minimum percentage of deposits that banks are required to keep as reserves and cannot lend out. It is the key factor determining the maximum deposit multiplier.",
formula:"法定儲備率 = 法定要求儲備 ÷ 存款總額",
formula_en:"Required Reserve Ratio (RR) = Required Reserves ÷ Total Deposits",
example:"1994/CE/I/5：銀行儲備$240、存款$1200，實際儲備率=20%。若無超額儲備，法定儲備率=實際儲備率=20%，最大乘數=1/20%=5。",
example_en:"1994/CE/I/5: Bank reserves $240, deposits $1200, actual reserve ratio = 20%. If no excess reserves, RR = actual RR = 20%, max multiplier = 1/20% = 5."},
{title:"實際儲備率",en:"Actual Reserve Ratio",
def:"銀行實際持有的儲備佔存款的比例。可能高於（有超額儲備）或等於法定儲備率。",
def_en:"The ratio of reserves actually held by banks to deposits. It may be higher than (with excess reserves) or equal to the required reserve ratio.",
formula:"實際儲備率 = 實際儲備 ÷ 存款總額",
formula_en:"Actual Reserve Ratio = Actual Reserves ÷ Total Deposits",
example:"1992/CE/II/35：儲備$200、存款$500，實際儲備率=40%。如果法定儲備率是20%，則銀行持有超額儲備。",
example_en:"1992/CE/II/35: Reserves $200, deposits $500, actual reserve ratio = 40%. If required reserve ratio is 20%, the bank holds excess reserves."},
{title:"超額儲備",en:"Excess Reserves (ER)",
def:"實際儲備超過法定要求儲備的部分。銀行可以選擇貸出（創造存款）或持有（防範風險）。",
def_en:"The portion of actual reserves that exceeds the required reserves. Banks can choose to lend them out (creating deposits) or hold them (for risk prevention).",
formula:"超額儲備 = 實際儲備 - 存款 × 法定儲備率",
formula_en:"Excess Reserves (ER) = Actual Reserves - Deposits × Required Reserve Ratio (RR)",
example:"2001/CE/I/10(b)：儲備$250m、存款$1000m、法定儲備率20%。超額儲備=250-1000×20%=$50m。貸出超額儲備可創造更多存款。",
example_en:"2001/CE/I/10(b): Reserves $250m, deposits $1000m, RR 20%. Excess reserves = 250 - 1000×20% = $50m. Lending out excess reserves can create more deposits."},
{title:"最大存款乘數",en:"Maximum Deposit Multiplier",
def:"在無超額儲備、無現金外流的理想情況下，存款創造的乘數。只取決於法定儲備率。",
def_en:"The deposit creation multiplier under ideal conditions with no excess reserves and no cash leakage. It depends only on the required reserve ratio.",
formula:"最大存款乘數 = 1 ÷ 法定儲備率",
formula_en:"Maximum Deposit Multiplier = 1 ÷ Required Reserve Ratio (RR)",
example:"2010/CE/II/35：只有法定儲備率增加會使最大乘數減小。超額儲備、現金外流、貸款需求只影響實際乘數，不影響最大乘數。",
example_en:"2010/CE/II/35: Only an increase in required reserve ratio reduces the maximum multiplier. Excess reserves, cash leakage, and loan demand only affect the actual multiplier, not the maximum multiplier."},
{title:"實際存款乘數",en:"Actual Deposit Multiplier",
def:"考慮超額儲備和現金外流後的實際乘數。通常小於最大乘數。",
def_en:"The actual multiplier after accounting for excess reserves and cash leakage. It is usually smaller than the maximum multiplier.",
formula:"實際乘數 = 1 ÷ (法定儲備率 + 超額儲備率 + 現金外流率)",
formula_en:"Actual Multiplier = 1 ÷ (Required Reserve Ratio + Excess Reserve Ratio + Cash Leakage Ratio)",
example:"2009/CE/II/38：實際乘數<最大乘數的可能原因是貸款需求不足（銀行持有超額儲備）或現金外流。",
example_en:"2009/CE/II/38: Possible reasons for actual multiplier < maximum multiplier are insufficient loan demand (banks holding excess reserves) or cash leakage."},
{title:"存款創造",en:"Deposit Creation",
def:"銀行將超額儲備貸出，貸款重新存入銀行體系，形成新一輪存款，如此循環，使總存款成倍增加。",
def_en:"Banks lend out excess reserves, loans are re-deposited into the banking system, forming a new round of deposits, and this cycle repeats, causing total deposits to increase multiplicatively.",
formula:"最大存款總額 = 初始存款 × 最大乘數",
formula_en:"Maximum Total Deposits = Initial Deposit × Maximum Multiplier",
example:"1994/CE/I/5：初始存款$100，乘數=5，最大存款總額=$500。每輪：存款→計提儲備→貸出→重新存入。",
example_en:"1994/CE/I/5: Initial deposit $100, multiplier = 5, maximum total deposits = $500. Each round: Deposit → Hold reserves → Lend out → Re-deposit."},
{title:"存款收縮",en:"Deposit Contraction",
def:"提款或提高儲備率導致銀行儲備不足，銀行收回貸款，存款被提取，如此循環，使總存款成倍減少。",
def_en:"Withdrawals or increases in reserve ratio cause banks to have insufficient reserves, banks call back loans, deposits are withdrawn, and this cycle repeats, causing total deposits to decrease multiplicatively.",
formula:"收縮後最大存款 = 提款後儲備 ÷ 法定儲備率",
formula_en:"Maximum Deposits after Contraction = Reserves after Withdrawal ÷ Required Reserve Ratio (RR)",
example:"2010/CE/I/11(b)：儲備率從25%提高到40%，$2000m儲備只能支持$5000m存款（原$8000m），存款收縮$3000m。",
example_en:"2010/CE/I/11(b): Reserve ratio increased from 25% to 40%, $2000m reserves can only support $5000m deposits (originally $8000m), deposits contract by $3000m."},
{title:"貨幣供應",en:"Money Supply (MS)",
def:"經濟體系中的貨幣總量，包括公眾持有的現金和銀行存款。",
def_en:"The total amount of money in an economy, including cash held by the public and bank deposits.",
formula:"貨幣供應(MS) = 公眾持有現金(Cp) + 銀行存款(Dd)",
formula_en:"Money Supply (MS) = Currency held by Public (Cp) + Bank Deposits (Dd)",
example:"2019/DSE/I/28：MS=$2800=Cp+$2500→Cp=$300。公眾存款$200後：Cp=$100，Dd最大=$3500，MS=$3600，增加$800。",
example_en:"2019/DSE/I/28: MS=$2800=Cp+$2500 → Cp=$300. After public deposits $200: Cp=$100, max Dd=$3500, MS=$3600, increase $800."},
{title:"現金外流/漏出",en:"Cash Leakage (CL)",
def:"貸出的款項沒有全部重新存入銀行，部分被公眾以現金形式持有。現金外流會減少可貸出金額，降低實際乘數。",
def_en:"Not all lent funds are re-deposited into banks; some are held by the public as cash. Cash leakage reduces loanable funds and lowers the actual multiplier.",
formula:"實際乘數（有現金外流）= 1 ÷ (法定儲備率 + 現金外流率)",
formula_en:"Actual Multiplier (with Cash Leakage) = 1 ÷ (Required Reserve Ratio + Cash Leakage Ratio)",
example:"1999/CE/II/38：公眾持有更多現金會增加現金外流，減少存款創造。八達通/信用卡普及會減少公眾現金持有，增加存款創造。",
example_en:"1999/CE/II/38: Public holding more cash increases cash leakage and reduces deposit creation. Popularity of Octopus/credit cards reduces public cash holding and increases deposit creation."},
{title:"100%儲備率",en:"100% Reserve Ratio",
def:"銀行必須將所有存款作為儲備，不能貸出任何款項。此時沒有存款創造，乘數=1。",

function calcExp(p,rounds){
  const{init,rr,er,cl}=p;
  if(rr<=0||rr>=1||er<0||er>=1||cl<0||cl>=1)return null;
  const maxDM=1/rr,maxLM=maxDM-1,actDM=1/(rr+er+cl),actLM=actDM-1;
  const totalDep=init*actDM,totalRes=totalDep*(rr+er),totalLoan=totalDep-totalRes;
  let cur=init,cumD=0,cumR=0,cumE=0,cumC=0,cumL=0,rows=[];
  for(let r=1;r<=50;r++){
    const req=cur*rr,exc=cur*er,cash=cur*cl,lend=cur-req-exc-cash;
    cumD+=cur;cumR+=req;cumE+=exc;cumC+=cash;cumL+=lend;
    if(r<=rounds)rows.push({r,newD:cur,req,exc,cash,lend});
    cur=lend;if(cur<0.01)break;
  }
  // 三階段數據
  const bd=0,br=0,bl=0; // 基線狀態（v12版本無基線概念，預設為0）
  const d1=init,r1=init; // 存款後即時
  return{maxDM,maxLM,actDM,actLM,totalDep,totalRes,totalLoan,
    init,bd,br,bl,d1,r1,
    cumD,cumR,cumE,cumC,cumL,rows};
}

    desc0=t("descWithdrawD").replace(/\$\$\{wd\}/g,"$"+fmt(wd)).replace(/\$\$\{bd\}/g,"$"+fmt(bd)).replace(/\$\$\{d1\}/g,"$"+fmt(d1)).replace(/\$\$\{br\}/g,"$"+fmt(br)).replace(/\$\$\{r1\}/g,"$"+fmt(r1));
  }else{
    desc0=t("descShortfallD").replace(/\$\$\{sh\}/g,"$"+fmt(Math.abs(sh1))).replace(/\$\$\{res\}/g,"$"+fmt(curR)).replace(/\$\$\{req\}/g,"$"+fmt(req1));
  }
  cRows.push({r:rn,curD,req:req1,res:curR,sh:sh1,call:0,desc:desc0});
  while(rn<rounds&&curD*rr>curR+0.01){
    rn++;const req=curD*rr,short=req-curR,call=Math.min(short,curD*0.5);
    curD-=call;const nreq=curD*rr,nsh=curR-nreq;
    let descC=t("descContractionD").replace(/\$\$\{call\}/g,"$"+fmt(call)).replace(/\$\$\{curD\}/g,"$"+fmt(curD)).replace(/\$\$\{res\}/g,"$"+fmt(curR));
    cRows.push({r:rn,curD,req:nreq,res:curR,sh:nsh,call,desc:descC});
  }
  if(cRows.length<rounds&&Math.abs(curD-finalDep)>1){
    rn++;
    let descB=t("descBalanceD").replace(/\$\$\{res\}/g,"$"+fmt(finalRes)).replace(/\$\$\{curD\}/g,"$"+fmt(finalDep)).replace(/\$\{rr\}/g,(rr*100).toFixed(1));
    cRows.push({r:rn,curD:finalDep,req:finalDep*rr,res:finalRes,sh:0,call:curD-finalDep,desc:descB});
  }
  return{bd,br,actRR,wd,d1,r1,finalDep,finalRes,finalLoan,depChg,maxDM:1/rr,actDM:tot>0?1/tot:0,rr,er,cl,cRows};
}

function renderConTable(d){
  let h=`<h4>${t("contractionProcessTitle")}</h4><table><thead><tr><th>${t("thRound")}</th><th>${t("thCurDep")}</th><th>${t("thReqReserve")}</th><th>${t("thActReserve")}</th><th>${t("thShortfall")}</th><th>${t("thCallLoan")}</th><th>${t("thDesc")}</th></tr></thead><tbody>`;
  let totalCall=0;
  d.cRows.forEach(row=>{
    totalCall+=row.call;
    const sh=row.sh>=0?`+$${fmt(row.sh)}`:`-$${fmt(Math.abs(row.sh))}`;
    const cls=row.sh>=0?"change-down":"change-up";
    h+=`<tr><td>${row.r}</td><td>$${fmt(row.curD)}</td><td>$${fmt(row.req)}</td><td>$${fmt(row.res)}</td><td class="${cls}">${sh}</td><td>$${fmt(row.call)}</td><td>${row.desc}</td></tr>`;
  });
  const finalReq=d.finalDep*d.rr;
  h+=`</tbody><tfoot><tr><td>${t("totalRow")}</td><td>$${fmt(d.finalDep)}</td><td>$${fmt(finalReq)}</td><td>$${fmt(d.finalRes)}</td><td>$0</td><td>$${fmt(totalCall)}</td><td></td></tr></tfoot></table>`;return h;
}

function renderSkill(){
  // 渲染題型標籤
  let types=[];
  if(curMode==="expansion"){
    const p=getExp("exp");
    if(p.er===0&&p.cl===0)types.push("type1");
    if(p.er>0)types.push("type2","type5");
    if(p.cl>0)types.push("type3");
  }else{types.push("type3");const p=getCon("con");if(p.wd===0&&p.rr>p.br/p.bd)types.push("type4","type6");}
  types=[...new Set(types)];if(types.length===0)types.push("type1");
  let th=`<p><strong>${t("matchedType")}</strong></p>`;
  types.forEach(tp=>{th+=`<span class="question-type-badge">${t(tp)}</span>`;});
  $("question-type-area").innerHTML=th;
  
  // 直接渲染所有標籤頁的內容（確保內容能正常顯示）
  renderStepsTab();
  renderFormulaTab();
  renderErrorTab();
  renderConceptTab();
}

function renderSkillTab(idx){
  if(idx===0)renderStepsTab();
  else if(idx===1)renderFormulaTab();
  else if(idx===2)renderErrorTab();
  else if(idx===3)renderConceptTab();
  skillTabRendered[idx]=true;
}

function switchSkillTab(idx){
  document.querySelectorAll(".skill-tab").forEach((t,i)=>t.classList.toggle("active",i===idx));
  document.querySelectorAll(".skill-tab-content").forEach((c,i)=>c.classList.toggle("active",i===idx));
  if(!skillTabRendered[idx])renderSkillTab(idx);
}

     wrong_en:"Directly writing answer for money supply change without stating assumptions",right_en:"Must state MS = Cp + Dd, and explain whether Cp changes"},
    {wrong_zh:"超額儲備計算公式用錯",right_zh:"超額儲備 = 實際儲備 - 存款 × 法定儲備率，不要用初始存款去乘",
     wrong_en:"Wrong formula for calculating excess reserves",right_en:"Excess reserves = Actual reserves - Deposits × Required Reserve Ratio, do not multiply by initial deposit"},
    {wrong_zh:"以為「最大存款乘數」等於「實際存款乘數」",right_zh:"最大乘數=1/法定儲備率；實際乘數=1/(法定+超額+現金外流)，實際更小",
     wrong_en:"Assuming 'maximum deposit multiplier' equals 'actual deposit multiplier'",right_en:"Max multiplier = 1/Required RR; Actual multiplier = 1/(Required + Excess + Cash Leakage), actual is smaller"},
    {wrong_zh:"提高儲備率時，以為儲備金額會改變",right_zh:"提高法定儲備率不會即時改變儲備金額，只會令「實際儲備 < 要求儲備」",
     wrong_en:"Assuming reserve amount changes when increasing reserve ratio",right_en:"Increasing required reserve ratio does not immediately change reserve amount, it only makes 'actual reserves < required reserves'"},
    {wrong_zh:"計算提款後最大存款時，用原儲備去乘乘數",right_zh:"必須用「提款後的儲備」= 原儲備 - 提款額，再除以儲備率",
     wrong_en:"Using original reserves to multiply by multiplier when calculating max deposits after withdrawal",right_en:"Must use 'reserves after withdrawal' = Original reserves - Withdrawal, then divide by reserve ratio"},
    {wrong_zh:"以為公眾持有現金增加會增加貨幣供應",right_zh:"公眾從銀行提款：Cp↑但Dd↓，若銀行收縮，MS可能不變甚至減少",
     wrong_en:"Assuming increase in public cash holding increases money supply",right_en:"Public withdrawing from banks: Cp↑ but Dd↓, if banks contract, MS may stay unchanged or even decrease"},
    {wrong_zh:"結構題只寫答案不寫步驟",right_zh:"DSE結構題按步驟給分，必須寫出公式→代入數字→結果",
     wrong_en:"Only writing answers without steps in structured questions",right_en:"DSE structured questions give marks by steps, must write formula → substitute numbers → result"}
  ];
  let eh2=`<h4>${t("errorTitle")}</h4><ul class="error-list">`;
  errors.forEach(e=>{
    const wrong=isEn?e.wrong_en:e.wrong_zh;
    const right=isEn?e.right_en:e.right_zh;
    eh2+=`<li><span class="wrong">✗ ${wrong}</span><br><span class="right">✓ ${right}</span></li>`;
  });
  eh2+=`</ul>`;
  $("tabcontent-3").innerHTML=eh2;
}

// 標籤頁5：關鍵概念
function renderConceptTab(){
  let ch=`<h4>${t("conceptTitle")}</h4>`;
  const isEn=curLang==="en";
  CONCEPTS.forEach(c=>{
    const def=isEn&&c.def_en?c.def_en:c.def;
    const formula=isEn&&c.formula_en?c.formula_en:c.formula;
    const example=isEn&&c.example_en?c.example_en:c.example;
    const title=isEn?c.en:c.title;
    ch+=`<div class="concept-card"><div class="concept-title">${title}${isEn?'':'<span class="concept-en">'+c.en+'</span>'}</div>
      <p><strong>${t("conceptDef")}：</strong>${def}</p>
      <div class="concept-formula"><strong>${t("conceptFormula")}：</strong>${formula}</div>
      <div class="concept-example"><strong>${t("conceptExample")}：</strong>${example}</div></div>`;
  });
  $("tabcontent-4").innerHTML=ch;
}

function toggleSkill(){
  $("skill-content").classList.toggle("show");
  $("skill-toggle").classList.toggle("open");
}

function switchLanguage(lang){
  const langMap={'zh-hk':'zh-HK','en':'en'};
  const targetLang=langMap[lang]||lang;
  curLang=targetLang;
  if(i18nReady&&typeof i18next!=='undefined')i18next.changeLanguage(targetLang);
  document.title=t("htmlTitle");
  $("page-title").innerText=t("pageTitle");
  $("assumption-text").innerText=t("assumption");
  $("label-rounds").innerText=t("labelRounds");
  if($("btn-run-text"))$("btn-run-text").innerText=t("btnRun");
  $("skill-title").innerText=t("skillTitle");
  $("tab-0").innerText=t("tabSteps");
  $("tab-1").innerText=t("tabFormula");
  $("tab-3").innerText=t("tabError");
  $("tab-4").innerText=t("tabConcept");
  $("mode-expansion").innerText=t("modeExpansion");
  $("mode-contraction").innerText=t("modeContraction");
  $("toggle-compare").innerText=cmpOn?t("toggleCompareOff"):t("toggleCompareOn");
  $("title-current").innerText=t("titleCurrent");
  $("title-new").innerText=t("titleNew");
  $("label-init-e").innerText=t("labelInit");
  $("label-rr-e").innerText=t("labelRR");
  $("label-er-e").innerText=t("labelER");
  $("label-cl-e").innerText=t("labelCL");
  $("label-bd").innerText=t("labelBaselineDep");
  $("label-br").innerText=t("labelBaselineRes");
  $("label-wd").innerText=t("labelWithdrawal");
  $("label-rr-c").innerText=t("labelRRC");
  $("label-er-c").innerText=t("labelERC");
  $("label-cl-c").innerText=t("labelCLC");
  // 更新HTML中的輸入框標籤
  if($("label-init-deposit"))$("label-init-deposit").innerText=t("labelInit")+" ($):";
  if($("label-rr"))$("label-rr").innerText=t("labelRR")+":";
  if($("label-er"))$("label-er").innerText=t("labelER")+":";
  if($("label-cl"))$("label-cl").innerText=t("labelCL")+":";
  if($("label-baseline-dep"))$("label-baseline-dep").innerText=t("labelBaselineDep")+" ($):";
  if($("label-baseline-res"))$("label-baseline-res").innerText=t("labelBaselineRes")+" ($):";
  if($("label-withdrawal"))$("label-withdrawal").innerText=t("labelWithdrawal")+" ($):";
  if($("label-rr-c"))$("label-rr-c").innerText=t("labelRRC")+":";
  if($("label-er-c"))$("label-er-c").innerText=t("labelERC")+":";
  if($("label-cl-c"))$("label-cl-c").innerText=t("labelCLC")+":";
  if($("toggle-compare-text"))$("toggle-compare-text").innerText=cmpOn?t("toggleCompareOff"):t("toggleCompareOn");
  if($("btn-run-text"))$("btn-run-text").innerText=t("btnRun");
  if($("auto-update-hint"))$("auto-update-hint").innerText=t("autoUpdateHint");
  document.querySelectorAll(".lang-bar button").forEach(b=>b.classList.remove("active"));
  $("btn-"+lang).classList.add("active");
  if(cmpOn)renderCmpParams();
  renderStepsTab();
  renderFormulaTab();
  renderErrorTab();
  renderConceptTab();
  runSim();
}
// 頁面初始化（i18next就緒後執行）
function initApp(){
  initSync();
  const params=new URLSearchParams(window.location.search);
  const lang=params.get("lang");
  const validLangs=['zh-hk','en'];
  switchLanguage(validLangs.includes(lang)?lang:'zh-hk');
}
window.onload=function(){
  if(i18nReady)initApp();
  // 否則等待i18next回調調用initApp
};
</script>
