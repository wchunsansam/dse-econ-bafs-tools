<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.HTMS_PAGE="mc-grader";</script>
<script src="../lib/htms-gate.js"></script>
<title>MC 答題紙批改</title>
<style>
:root{
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1e40af;
  --danger:#dc2626;--success:#16a34a;--warning:#f59e0b;
  --bg:#f7f9fc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --radius:12px;
}
*{box-sizing:border-box}
body{font-family:system-ui,"Microsoft JhengHei","PingFang HK",sans-serif;margin:0;color:var(--text);background:var(--bg);line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:16px 18px 72px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.back-link{color:var(--primary);text-decoration:none;font-size:14px;background:none;border:0;cursor:pointer;font-weight:600}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:44px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.active{background:var(--primary);color:#fff}
h1{font-size:24px;margin:0 0 4px}
.lead,.hint,.warn{color:var(--muted);font-size:14px}
.warn{color:#b45309;background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 12px}
.who{font-size:13px;font-weight:700;color:var(--primary-dark)}
.card,.unlock-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.unlock-card{max-width:420px;margin:36px auto;text-align:center}
.unlock-card h2{margin:0 0 8px;color:var(--primary-dark)}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px;margin-top:4px
}
label{display:block;font-size:13px;font-weight:700;margin:0 0 12px}
.chk{font-weight:600;display:flex;align-items:center;gap:8px}
.chk input{width:18px;height:18px;margin:0}
.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;min-height:44px;background:#fff;border:1px solid var(--border)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff}
.web-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 20px;margin:12px 0 20px}
.web-card h2{margin:0 0 4px;font-size:18px;color:var(--primary-dark)}
.web-meta{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin:12px 0 8px}
.web-block h3{margin:0 0 6px;font-size:13px}
.web-idex{font-size:13px;font-weight:800;margin:0 0 8px}
.web-cols{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.web-col{display:flex;flex-direction:column;gap:4px;align-items:center}
.web-col .cap{font-size:11px;font-weight:800;margin-bottom:2px;color:#334155}
.web-bub{
  width:40px;height:40px;min-height:40px;border-radius:50%;border:2px solid #111;
  background:#fff;font-weight:800;font-size:13px;cursor:pointer;padding:0;line-height:1;color:#111
}
.web-bub.on{background:#111;color:#fff}
.web-sum{font-size:14px;font-weight:700;margin:4px 0 12px;color:var(--primary-dark)}
.web-qs{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-flow:column;gap:6px 14px;margin:8px 0 14px
}
.web-q{display:flex;align-items:center;gap:6px}
.web-q .qn{width:28px;text-align:right;font-weight:800;font-size:13px;flex:none}
.web-q .web-bub{width:36px;height:36px;min-height:36px;font-size:12px}
.paper-sec{margin-top:8px;padding-top:4px;border-top:1px dashed var(--border)}
.paper-sec h2{font-size:16px;margin:12px 0 6px}
@media(max-width:700px){
  .web-meta{grid-template-columns:1fr}
  .web-qs{grid-template-columns:1fr;grid-auto-flow:row}
}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:18px;background:#fff;margin:0 0 12px;cursor:pointer}
.drop.over{border-color:var(--primary);background:var(--primary-light)}
.drop p{margin:6px 0 10px;color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:44px}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.row-split{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:12px}
#mc-status{min-height:1.4em;font-size:14px;margin:8px 0 0;color:var(--primary-dark)}
#mc-status.err{color:var(--danger)}
#mc-pass-err{color:var(--danger);font-size:13px}
.key-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin:8px 0 14px;max-height:360px;overflow:auto}
.key-row{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.key-row .opt{min-width:36px;min-height:36px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-weight:800}
.key-row .opt.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.statline div{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.statline b{display:block;font-size:22px}
.statline span{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:10px}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left}
.bar-row{display:grid;grid-template-columns:42px 22px 1fr 52px minmax(120px,auto);gap:8px;align-items:center;font-size:12px;margin:4px 0}
.bar{background:#e2e8f0;border-radius:6px;height:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--success)}
.bar i.mid{background:var(--warning)}
.bar i.low{background:var(--danger)}
.rev{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0}
.rev.bad{border-color:#fecaca;background:#fef2f2}
.ansline{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-word}
.preview-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);background:#cbd5e1;padding:12px}
.mc-sheet.preview{transform-origin:top left;transform:scale(.42);margin-bottom:-160mm}
.plain{padding-left:1.2em}
.en[hidden],.zh[hidden]{display:none!important}
#gate[hidden],#app-student[hidden],#app-teacher[hidden]{display:none!important}
@media(max-width:700px){
  .row-split,.statline,.bar-row{grid-template-columns:1fr}
  .mc-sheet.preview{transform:scale(.32);margin-bottom:-190mm}
}

/* A4 sheet */
#print-root{display:none}
.mc-sheet{
  position:relative;width:210mm;height:297mm;background:#fff;color:#000;
  overflow:hidden;font-family:"Microsoft JhengHei","PMingLiU","PingFang HK",sans-serif;
  box-shadow:0 0 0 1px #ddd;
}
.mc-fid{position:absolute;background:#000}
.mc-bubble{
  position:absolute;border:0.32mm solid #111;border-radius:50%;background:#fff;box-sizing:border-box
}
.mc-bit{position:absolute;border:0.35mm solid #000;background:#fff;box-sizing:border-box}
.mc-bit.filled{background:#000}
.mc-head{position:absolute;left:24mm;top:10.5mm;width:56mm}
.mc-school{font-size:16pt;font-weight:800;letter-spacing:.04em;line-height:1.15}
.mc-sub{font-size:11pt;font-weight:700;margin-top:1mm}
.mc-title{font-size:10pt;min-height:5mm;margin-top:1mm}
.mc-name-row{display:flex;align-items:flex-end;gap:3mm;margin-top:2.5mm;font-size:10pt;font-weight:700}
.mc-name-line{flex:1;border-bottom:0.4mm solid #000;height:6mm}
.mc-hint{font-size:6.6pt;margin-top:1.6mm;line-height:1.3}
.mc-hwlab{position:absolute;left:82mm;top:15.8mm;width:40mm;font-size:7.5pt;font-weight:800;line-height:1.15;text-align:center;white-space:nowrap}
.mc-idlab{position:absolute;left:124mm;top:10.2mm;width:64mm;font-size:7.5pt;font-weight:800;line-height:1.15;text-align:center;white-space:nowrap}
.mc-idex{display:block;margin-top:1.1mm;font-size:7pt;font-weight:700;letter-spacing:.02em}
.mc-idv,.mc-qnum{position:absolute;font-size:7pt;font-weight:700;line-height:1;white-space:nowrap}
.mc-idv{width:5mm;text-align:right;line-height:3mm}
.mc-hwkind{width:6mm;font-weight:800}
.mc-qnum{font-size:8.5pt;width:10mm;text-align:right}
.mc-labsvg{position:absolute;inset:0;width:210mm;height:297mm;overflow:visible;pointer-events:none}
.mc-lines{
  position:absolute;left:16mm;right:16mm;top:68mm;bottom:14mm;
  pointer-events:none;
}
.mc-lines-full{top:68mm}
.mc-rule{
  height:8mm;box-sizing:border-box;
  border-bottom:0.45mm solid #3f3f46;
}
.mc-write-foot{position:absolute;left:16mm;bottom:6mm;font-size:8pt}

@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff;margin:0}
  .no-print{display:none!important}
  #print-root{display:block!important}
  .mc-sheet{box-shadow:none;page-break-after:always;break-after:page}
  .mc-sheet:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<div class="wrap no-print">
  <div class="top">
    <a class="back-link" id="link-home" href="../index.html"><span class="zh">← 返回首頁</span><span class="en" hidden>← Home</span></a>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="who" id="who"></span>
      <button type="button" class="back-link" id="btn-logout"><span class="zh">登出</span><span class="en" hidden>Log out</span></button>
      <div class="seg">
        <button type="button" id="btn-zh" class="active">繁</button>
        <button type="button" id="btn-en">EN</button>
      </div>
    </div>
  </div>
  <h1><span class="zh">MC 答題紙自動批改</span><span class="en" hidden>MC answer-sheet grader</span></h1>
  <p id="mc-status"></p>

  <div id="gate">
    <form class="unlock-card" id="mc-login">
      <h2><span class="zh">進入此工具</span><span class="en" hidden>Enter this tool</span></h2>
      <p class="hint"><span class="zh">學生輸入交功課密碼；老師輸入老師密碼。</span><span class="en" hidden>Students enter the homework password; teachers enter the teacher password.</span></p>
      <input id="mc-pass" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
      <button type="submit" class="btn primary" style="width:100%;margin-top:10px"><span class="zh">進入</span><span class="en" hidden>Enter</span></button>
      <p id="mc-pass-err" hidden><span class="zh">密碼不正確。</span><span class="en" hidden>Incorrect password.</span></p>
    </form>
  </div>

  <div id="app-student" hidden></div>
  <div id="app-teacher" hidden></div>
</div>

<div id="print-root"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="lib/mc-grader.js?v=20260907s"></script>
<script>MCGrader.start();</script>
</body>
</html>
