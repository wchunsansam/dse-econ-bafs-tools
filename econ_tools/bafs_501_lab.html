<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.HTMS_PAGE="app";</script>
<script src="../lib/htms-gate.js"></script>
<title>DSE BAFS｜501 財務分析教具</title>
<style>
:root{
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1e40af;
  --danger:#dc2626;--success:#16a34a;--warning:#f59e0b;--purple:#7c3aed;
  --bg:#f7f9fc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --radius:12px;
}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;color:var(--text);background:var(--bg);line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.back-link{color:var(--primary);text-decoration:none;font-size:14px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:44px;touch-action:manipulation}
.seg button+button{border-left:1px solid var(--border)}
.seg button.active{background:var(--primary);color:#fff}
h1{font-size:24px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:44px;touch-action:manipulation}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.panel.active{display:block}
h2{font-size:20px;margin:0 0 8px;color:var(--primary-dark)}
h3{font-size:15px;margin:14px 0 8px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fafafa}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px}
input[type=range]{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
button.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;min-height:44px;touch-action:manipulation}
button.btn.primary{background:var(--primary);color:#fff}
button.btn.ghost{background:#fff;border:1px solid var(--border)}
.result{margin-top:14px;padding:14px;border-radius:10px;background:var(--primary-light);border:1px solid #bfdbfe}
.result.warn{background:#fff7ed;border-color:#fdba74}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.ok{background:#ecfdf5;border-color:#86efac}
.big{font-size:22px;font-weight:800;margin:4px 0}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
th,td{border:1px solid #dbe3ee;padding:8px 10px;vertical-align:top}
th[colspan]{background:#dbeafe;color:var(--primary-dark);font-size:13px}
.moved{font-weight:800;color:#c2410c}
.same{color:var(--muted)}
.en[hidden],.zh[hidden]{display:none!important}
.muted{color:var(--muted);font-size:12px}
.result ul{margin:8px 0 0;padding-left:1.2em}
.result li{margin:0 0 6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp .box h3{margin:0 0 8px}
.stmts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;align-items:start}
.stmt-paper{border:1px solid #cbd5e1;border-radius:10px;padding:14px 14px 16px;background:#fff}
.stmt-head{text-align:center;margin:0 0 10px}
.stmt-head .co{font-weight:800;font-size:16px;line-height:1.3}
.stmt-head .title{font-weight:800;font-size:15px;margin-top:2px}
.stmt-head .period{font-size:13px;color:var(--muted)}
.stmt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stmt td,.stmt th{border:0;padding:3px 6px;vertical-align:middle}
.stmt thead th{border-bottom:1px solid #1e293b;font-weight:700}
.stmt .m{width:118px;text-align:right}
.stmt .ind{padding-left:1.35em}
.stmt .ind2{padding-left:2.4em}
.stmt .sec td{font-weight:700;padding-top:10px}
.stmt .sub td.m:not(:empty){border-top:1px solid #94a3b8}
.stmt .tot td{font-weight:800}
.stmt .tot td.m:last-child{border-top:1px solid #1e293b}
.stmt .dbl td{font-weight:800}
.stmt .dbl td.m:last-child{border-top:1px solid #1e293b;border-bottom:3px double #1e293b;padding-bottom:4px}
.stmt input[type=number]{width:100%;padding:6px 8px;border:1px dashed #94a3b8;border-radius:6px;background:#f8fafc;text-align:right;font-size:16px;min-height:36px}
.stmt .fig{display:inline-block;min-width:4.5em}
.balance{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}
.balance.ok{background:#ecfdf5;border:1px solid #86efac}
.balance.bad{background:#fef2f2;border:1px solid #fca5a5}
.ratio-group{font-size:13px;font-weight:800;color:var(--primary-dark);margin:16px 0 6px}
.ratio-cols,.ratio-card summary{
  display:grid;
  grid-template-columns:minmax(7em,.9fr) minmax(11em,1.6fr) 8.8em 6.2em 1.5em;
  align-items:start;
  gap:10px;
  padding:12px 14px;
}
.ratio-cols{padding:4px 14px 8px;font-size:12px;font-weight:700;color:var(--muted);align-items:end}
.ratio-cols span:nth-child(3),.ratio-cols span:nth-child(4){text-align:right}
.ratio-card{border:1px solid var(--border);border-radius:10px;background:#fff;margin:0 0 8px}
.ratio-card summary{cursor:pointer;list-style:none;min-height:44px;font-weight:700;touch-action:manipulation}
.ratio-card summary::-webkit-details-marker{display:none}
.ratio-card .r-name{min-width:0;padding-top:1px}
.ratio-card .r-desc{min-width:0;font-weight:500;font-size:13px;line-height:1.4;color:var(--text)}
.ratio-card .r-val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.ratio-card .r-chg{text-align:right;font-weight:600;white-space:nowrap;padding-top:1px}
.ratio-card summary::after{content:"＋";color:var(--muted);font-weight:800;text-align:right}
.ratio-card[open] summary::after{content:"－"}
.ratio-card .work{padding:0 14px 12px;font-size:14px;border-top:1px solid var(--border)}
.ratio-card .work p{margin:8px 0}
.ratio-card ol{margin:6px 0 8px;padding-left:1.3em}
.ratio-card li{margin:0 0 4px}
@media(max-width:900px){
  .grid-2,.grid-3,.cmp,.stmts{grid-template-columns:1fr}
  .ratio-cols,.ratio-card summary{grid-template-columns:minmax(6em,.85fr) minmax(8em,1.4fr) 7.4em 4.8em 1.4em;padding:10px 12px;gap:6px}
  .ratio-card .r-desc{font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back-link" id="link-home" href="../index.html"><span class="zh">← 返回首頁</span><span class="en" hidden>← Home</span></a>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="back-link" id="link-notes" href="../econ_notes/bafs_501_financial_analysis.html"><span class="zh">開啟筆記</span><span class="en" hidden>Open notes</span></a>
      <div class="seg">
        <button type="button" id="btn-zh" class="active">繁</button>
        <button type="button" id="btn-en">EN</button>
      </div>
    </div>
  </div>
  <h1><span class="zh">501 財務分析教具</span><span class="en" hidden>501 Financial Analysis lab</span></h1>
  <p class="lead"><span class="zh">課堂投影或學生自用。先選一個教具。繁／EN 會切換全部介面。</span><span class="en" hidden>For projection or student use. Pick a tool. 繁 / EN switches the whole interface.</span></p>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<script>
const TOOLS = [
  {id:"ratios", zh:"報表 → 四類比率", en:"Statements → four ratio types"},
  {id:"profit", zh:"盈利能力高低", en:"Profitability high / low"},
  {id:"liquidity", zh:"變現能力過高／過低", en:"Liquidity too high / too low"},
  {id:"solvency", zh:"償債能力／槓桿", en:"Solvency / gearing"},
  {id:"efficiency", zh:"管理效率高低", en:"Management efficiency"}
];
let lang = "zh";
const t = (zh, en) => lang === "en" ? en : zh;
const $ = (id) => document.getElementById(id);
const n = (id) => Number($(id).value || 0);
const pct = (x) => isFinite(x) ? (x * 100).toFixed(2) + "%" : "—";
const times = (x) => isFinite(x) ? x.toFixed(2) + (lang === "en" ? " times" : " 次") : "—";
const days = (x) => isFinite(x) ? x.toFixed(1) + (lang === "en" ? " days" : " 日") : "—";
const ratio1 = (x) => isFinite(x) ? x.toFixed(2) + " : 1" : "—";

function setLang(en, keepTool){
  lang = en ? "en" : "zh";
  document.documentElement.lang = en ? "en" : "zh-HK";
  document.querySelectorAll(".zh").forEach(el => { el.hidden = !!en; });
  document.querySelectorAll(".en").forEach(el => { el.hidden = !en; });
  $("btn-en").classList.toggle("active", en);
  $("btn-zh").classList.toggle("active", !en);
  const params = new URLSearchParams(location.search);
  params.set("lang", en ? "en" : "zh-hk");
  const active = document.querySelector(".tabs button.active");
  const id = (keepTool && active) ? active.dataset.id : ((location.hash||"#ratios").replace("#","") || "ratios");
  history.replaceState(null, "", "?" + params.toString() + "#" + id);
  $("link-home").href = "../index.html?lang=" + (en ? "en" : "zh-hk");
  $("link-notes").href = "../econ_notes/bafs_501_financial_analysis.html?lang=" + (en ? "en" : "zh-hk");
  document.title = t("DSE BAFS｜501 財務分析教具","DSE BAFS | 501 Financial Analysis lab");
  renderShell();
  show(TOOLS.some(x=>x.id===id)?id:"ratios");
}

function renderShell(){
  $("tabs").innerHTML = TOOLS.map(x =>
    `<button type="button" data-id="${x.id}">${t(x.zh, x.en)}</button>`
  ).join("");
  $("tabs").onclick = (e) => {
    const b = e.target.closest("button");
    if(b) show(b.dataset.id);
  };
}

function slider(id, zh, en, min, max, step, val){
  return `<div class="box">
    <label>${t(zh,en)} <span id="${id}-v"></span></label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">
  </div>`;
}
function showMoney(id){ $(id+"-v").textContent = "$" + n(id).toLocaleString(); }
function showPct(id){ $(id+"-v").textContent = n(id).toFixed(0) + "%"; }
function showTimes(id){ $(id+"-v").textContent = n(id).toFixed(1) + (lang==="en"?" times":" 次"); }

function show(id){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const mount = $("panels");
  mount.oninput = null;
  mount.onclick = null;
  const pages = {
    ratios: [ratiosHTML, initRatios],
    profit: [profitHTML, initProfit],
    liquidity: [liquidityHTML, initLiquidity],
    solvency: [solvencyHTML, initSolvency],
    efficiency: [efficiencyHTML, initEfficiency]
  };
  const page = pages[id] || pages.ratios;
  mount.innerHTML = page[0]();
  mount.querySelector(".panel").classList.add("active");
  page[1]();
  const params = new URLSearchParams(location.search);
  history.replaceState(null, "", "?" + params.toString() + "#" + id);
}

function field(id, zh, en, val){
  return `<div><label>${t(zh,en)}</label><input type="number" id="${id}" value="${val}"></div>`;
}
function sIn(id, val){
  return `<input type="number" id="${id}" value="${val}">`;
}
function sOut(id){
  return `<span class="fig" id="${id}">—</span>`;
}
function $amt(x){
  if(!isFinite(x)) return "—";
  const v = Math.round(x);
  const body = Math.abs(v).toLocaleString();
  return v < 0 ? "(" + body + ")" : body;
}
function $n(x){ return isFinite(x) ? "$" + $amt(x) : "—"; }

function ratiosHTML(){
  const moneyHeads = `<thead><tr><th></th><th class="m">$</th><th class="m">$</th></tr></thead>`;
  return `<div class="panel">
    <h2>${t("同一張表，四類故事","One set of statements, four stories")}</h2>
    <p class="hint">${t("預設是澄茶有限公司，報表用 HKDSE 直版完整格式。銷貨成本由期初存貨＋購貨−期末存貨計出；財務狀況表兩邊總額必須相等才算平衡。改一個數字，下面比率會顯示步驟與解釋。","Preset: Ching Cha Limited, in HKDSE vertical format. Cost of goods sold = opening inventory + purchases − closing inventory. The two SOFP totals must be equal. Change a figure and the ratios below show workings and comments.")}</p>
    <div class="row">
      <button class="btn ghost" id="r-reset">${t("還原澄茶預設","Reset Ching Cha preset")}</button>
    </div>
    <div class="stmts">
      <div class="stmt-paper">
        <div class="stmt-head">
          <div class="co">${t("澄茶有限公司","Ching Cha Limited")}</div>
          <div class="title">${t("損益表","Income statement")}</div>
          <div class="period">${t("截至 20X5 年 12 月 31 日止年度","for the year ended 31 December 20X5")}</div>
        </div>
        <table class="stmt">
          ${moneyHeads}
          <tbody>
            <tr><td>${t("銷貨","Sales")}</td><td class="m"></td><td class="m">${sIn("sales",500000)}</td></tr>
            <tr><td>${t("減：銷貨成本","Less: Cost of goods sold")}</td><td class="m"></td><td class="m"></td></tr>
            <tr><td class="ind">${t("期初存貨","Opening inventory")}</td><td class="m">${sIn("inv0",40000)}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("加：購貨","Add: Purchases")}</td><td class="m">${sIn("cpur",310000)}</td><td class="m"></td></tr>
            <tr class="sub"><td class="ind">${t("可供銷售貨品","Goods available for sale")}</td><td class="m">${sOut("r-avail")}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("減：期末存貨","Less: Closing inventory")}</td><td class="m">${sIn("inv1",50000)}</td><td class="m"></td></tr>
            <tr class="sub"><td></td><td class="m"></td><td class="m">${sOut("r-cogs")}</td></tr>
            <tr class="tot"><td>${t("毛利","Gross profit")}</td><td class="m"></td><td class="m">${sOut("r-gp")}</td></tr>
            <tr><td>${t("減：營業費用","Less: Operating expenses")}</td><td class="m"></td><td class="m">${sIn("opex",120000)}</td></tr>
            <tr class="tot"><td>${t("營業利潤（息稅前利潤）","Operating profit (profit before interest and tax)")}</td><td class="m"></td><td class="m">${sOut("r-ebit")}</td></tr>
            <tr><td>${t("減：利息","Less: Interest")}</td><td class="m"></td><td class="m">${sIn("interest",10000)}</td></tr>
            <tr class="tot"><td>${t("稅前利潤","Profit before tax")}</td><td class="m"></td><td class="m">${sOut("r-pbt")}</td></tr>
            <tr><td>${t("減：稅項","Less: Tax")}</td><td class="m"></td><td class="m">${sIn("tax",14000)}</td></tr>
            <tr class="dbl"><td>${t("稅後利潤","Profit after tax")}</td><td class="m"></td><td class="m">${sOut("r-pat")}</td></tr>
          </tbody>
        </table>
      </div>
      <div class="stmt-paper">
        <div class="stmt-head">
          <div class="co">${t("澄茶有限公司","Ching Cha Limited")}</div>
          <div class="title">${t("財務狀況表","Statement of financial position")}</div>
          <div class="period">${t("於 20X5 年 12 月 31 日","as at 31 December 20X5")}</div>
        </div>
        <table class="stmt">
          ${moneyHeads}
          <tbody>
            <tr class="sec"><td>${t("非流動資產","Non-current assets")}</td><td class="m"></td><td class="m">${sIn("nca",400000)}</td></tr>
            <tr class="sec"><td>${t("流動資產","Current assets")}</td><td class="m"></td><td class="m"></td></tr>
            <tr><td class="ind">${t("存貨（與損益表期末存貨相同）","Inventories (same as closing inventory)")}</td><td class="m">${sOut("r-inv1-sofp")}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("應收貨款","Trade receivables")}</td><td class="m">${sIn("rec1",60000)}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("現金","Cash")}</td><td class="m">${sIn("cash",40000)}</td><td class="m"></td></tr>
            <tr class="sub"><td></td><td class="m"></td><td class="m">${sOut("r-ca")}</td></tr>
            <tr class="dbl"><td>${t("資產總額","Total assets")}</td><td class="m"></td><td class="m">${sOut("r-ta")}</td></tr>
            <tr class="sec"><td>${t("權益","Equity")}</td><td class="m"></td><td class="m"></td></tr>
            <tr><td class="ind">${t("股本","Share capital")}</td><td class="m">${sIn("sc",200000)}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("股本溢價","Share premium")}</td><td class="m">${sIn("prem",50000)}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("儲備","Reserves")}</td><td class="m">${sIn("res",0)}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("留存利潤","Retained profits")}</td><td class="m">${sIn("re",125000)}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("優先股本","Preference share capital")}</td><td class="m">${sIn("pref",0)}</td><td class="m"></td></tr>
            <tr class="sub"><td></td><td class="m"></td><td class="m">${sOut("r-eq")}</td></tr>
            <tr class="sec"><td>${t("非流動負債","Non-current liabilities")}</td><td class="m"></td><td class="m">${sIn("ncl",100000)}</td></tr>
            <tr class="sec"><td>${t("流動負債","Current liabilities")}</td><td class="m"></td><td class="m"></td></tr>
            <tr><td class="ind">${t("應付貨款","Trade payables")}</td><td class="m">${sIn("pay1",45000)}</td><td class="m"></td></tr>
            <tr><td class="ind">${t("其他流動負債","Other current liabilities")}</td><td class="m">${sIn("ocl",30000)}</td><td class="m"></td></tr>
            <tr class="sub"><td></td><td class="m"></td><td class="m">${sOut("r-cl")}</td></tr>
            <tr class="dbl"><td>${t("權益及負債總額","Total equity and liabilities")}</td><td class="m"></td><td class="m">${sOut("r-tel")}</td></tr>
          </tbody>
        </table>
        <div class="balance" id="r-balance"></div>
      </div>
    </div>
    <div class="box" style="margin-top:14px">
      <h3>${t("上年結餘（不列本年財務狀況表；計算平均用）","Prior year balances (not on this year’s SOFP; used for averages)")}</h3>
      <p class="hint" style="margin-top:0">${t("期初應收／應付來自上年度期末。","Opening receivables / payables are last year’s closing figures.")}</p>
      <div class="grid grid-2">
        ${field("rec0", "期初應收貨款", "Opening trade receivables", 60000)}
        ${field("pay0", "期初應付貨款", "Opening trade payables", 45000)}
      </div>
    </div>
    <div class="box" style="margin-top:12px">
      <h3>${t("本年度賒銷／賒購（計算周轉用）","This year’s credit sales / credit purchases (used for turnover)")}</h3>
      <p class="hint" style="margin-top:0">${t("全數賒銷則賒銷等於銷貨。賒購與上面損益表的購貨同步：改一邊，另一邊跟著改。","If all sales are on credit, credit sales equal sales. Credit purchases stay in sync with Purchases on the income statement: change either side and the other follows.")}</p>
      <div class="grid grid-2">
        ${field("csales", "賒銷", "Credit sales", 500000)}
        ${field("cpur-cr", "賒購", "Credit purchases", 310000)}
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" type="button" data-act="open-all">${t("展開全部步驟","Expand all workings")}</button>
      <button class="btn ghost" type="button" data-act="close-all">${t("收起步驟","Collapse workings")}</button>
    </div>
    <div id="r-out"></div>
  </div>`;
}

function snapshotRatios(){
  const sales = n("sales"), opex = n("opex"), interest = n("interest"), tax = n("tax");
  const inv0 = n("inv0"), inv1 = n("inv1"), csales = n("csales"), cpur = n("cpur");
  const nca = n("nca"), rec0 = n("rec0"), rec1 = n("rec1"), cash = n("cash"), pay0 = n("pay0"), pay1 = n("pay1"), ocl = n("ocl");
  const ncl = n("ncl"), sc = n("sc"), prem = n("prem"), res = n("res"), re = n("re"), pref = n("pref");
  const avail = inv0 + cpur;
  const cogs = avail - inv1;
  const gp = sales - cogs;
  const ebit = gp - opex;
  const pbt = ebit - interest;
  const pat = pbt - tax;
  const ca = inv1 + rec1 + cash;
  const cl = pay1 + ocl;
  const equity = sc + prem + res + re + pref;
  const ta = nca + ca;
  const tel = equity + ncl + cl;
  const ce = ncl + equity;
  const avgInv = (inv0 + inv1) / 2;
  const avgRec = (rec0 + rec1) / 2;
  const avgPay = (pay0 + pay1) / 2;
  const invt = avgInv ? cogs / avgInv : NaN;
  const art = avgRec ? csales / avgRec : NaN;
  const apt = avgPay ? cpur / avgPay : NaN;
  const diff = ta - tel;
  return {
    sales, opex, interest, tax, inv0, inv1, cpur, csales, nca, rec0, rec1, cash, pay0, pay1, ocl, ncl, sc, prem, res, re, pref,
    avail, cogs, gp, ebit, pbt, pat, ca, cl, equity, ta, tel, ce, avgInv, avgRec, avgPay, diff,
    balanced: Math.abs(diff) < 0.5,
    gpr: sales ? gp / sales : NaN,
    npr: sales ? pbt / sales : NaN,
    roce: ce ? ebit / ce : NaN,
    current: cl ? ca / cl : NaN,
    quick: cl ? (ca - inv1) / cl : NaN,
    gear: ce ? (ncl + pref) / ce : NaN,
    invt,
    invd: invt ? 365 / invt : NaN,
    art,
    ard: art ? 365 / art : NaN,
    apt,
    apd: apt ? 365 / apt : NaN,
    tat: ta ? sales / ta : NaN
  };
}

function ratioCard(rid, zh, en, descZh, descEn, valueStr, moved, formulaZh, formulaEn, steps, whyZh, whyEn){
  const cls = moved ? "moved" : "same";

  return `<details class="ratio-card" data-rid="${rid}">
    <summary><span class="r-name">${t(zh,en)}</span><span class="r-desc">${t(descZh,descEn)}</span><span class="r-val">${valueStr}</span><span class="r-chg ${cls}">${tag}</span></summary>

      <p><strong>${t("步驟","Workings")}</strong></p>
      <ol>${steps.map(x => `<li>${x}</li>`).join("")}</ol>
      <p><strong>${t("解釋","Interpretation")}</strong>　${t(whyZh,whyEn)}</p>
    </div>
  </details>`;
}

function band(x){
  if(!isFinite(x)) return "na";
  if(x < 1) return "low";
  if(x > 2) return "high";
  return "ok";
}
function initLiquidity(){
  function paint(){
    let ca = n("l-ca"), inv = n("l-inv"), cl = n("l-cl");
    if(inv > ca){ inv = ca; $("l-inv").value = ca; }
    $("l-ca-v").textContent = "$" + ca.toLocaleString();
    $("l-inv-v").textContent = "$" + inv.toLocaleString();
    $("l-cl-v").textContent = "$" + cl.toLocaleString();
    const current = cl ? ca / cl : NaN;
    const quick = cl ? (ca - inv) / cl : NaN;
    const cb = band(current), qb = band(quick);
    let cls = "ok";
    if(cb === "low" || qb === "low") cls = "bad";
    else if(cb === "high" || qb === "high") cls = "warn";
    let comment;
    if(cb === "low" || qb === "low"){
      comment = t("過低：可能沒有足夠流動資產償還短期債務（即使有固定資產）。","Too low: the firm may have difficulty repaying short-term debts with current assets, even if it has valuable fixed assets.");
    } else if(cb === "high"){
      comment = t("過高：持有太多流動資產，沒有好好用來賺取利潤（例如購買非流動資產），長遠盈利能力或會降低。","Too high: capital is tied up in current assets, so the firm may not generate profit efficiently in the long term (e.g. should acquire non-current assets).");
    } else {
      comment = t("大約在 1 到 2：變現能力位置較理想。","Around 1 to 2: a better liquidity position.");
    }
    if(current > 2 && quick < 1){
      comment += " " + t("高流動但低速動：存貨佔流動資產比例較高，把存貨變現需要時間。","High current but low quick: a higher proportion of inventory; it takes time to convert inventory into cash.");
    }
    if(qb === "high"){
      comment += " " + t("速動比率高有兩個角度：變現能力較好，但管理效率上可能有過多閒置流動資產。","A high quick ratio has two lenses: better liquidity, but management efficiency may be weaker if current assets sit idle.");
    }
    $("l-out").className = "result " + cls;
    $("l-out").innerHTML = `
      <p class="big">${t("流動比率","Current ratio")} ${ratio1(current)}</p>
      <p class="big">${t("速動比率","Quick ratio")} ${ratio1(quick)}</p>
      <p>${comment}</p>
    `;
  }
  $("panels").oninput = paint;
  paint();
}

function firmFrom(prefix){
  const sales = n(prefix+"-sales");
  if(n(prefix+"-cogs") > sales) $(prefix+"-cogs").value = sales;
  const cogs = n(prefix+"-cogs"), opex = n(prefix+"-opex");
  const interest = n(prefix+"-int"), ce = n(prefix+"-ce");
  const gp = Math.max(0, sales - cogs);
  const ebit = gp - opex;
  const pbt = ebit - interest;
  return {
    sales, gp, ebit, pbt, ce,
    gpr: sales ? gp / sales : NaN,
    npr: sales ? pbt / sales : NaN,
    roce: ce ? ebit / ce : NaN
  };
}

    $("e-out").innerHTML = `
      <table>
        <thead><tr><th>${t("比率","Ratio")}</th><th>${t("本公司","This firm")}</th><th>${t("周轉日數","Days")}</th><th>${t("行業","Industry")}</th></tr></thead>
        <tbody>
          <tr><td>${t("存貨周轉","Inventory turnover")}</td><td>${times(invt)}</td><td>${days(invt?365/invt:NaN)}</td><td>${times(iInv)}</td></tr>
          <tr><td>${t("應收貨款周轉","Receivables turnover")}</td><td>${times(art)}</td><td>${days(art?365/art:NaN)}</td><td>${times(iAr)}</td></tr>
          <tr><td>${t("應付貨款周轉","Payables turnover")}</td><td>${times(apt)}</td><td>${days(apt?365/apt:NaN)}</td><td>${times(iAp)}</td></tr>
          <tr><td>${t("總資產周轉","Total assets turnover")}</td><td>${times(tat)}</td><td class="muted">—</td><td>${times(iTa)}</td></tr>
        </tbody>
      </table>
      <ul>${pts.map(x=>`<li>${x}</li>`).join("")}</ul>
    `;
  }
  $("panels").oninput = paint;
  paint();
}

$("btn-zh").onclick = () => setLang(false, true);
$("btn-en").onclick = () => setLang(true, true);
window.addEventListener("hashchange", () => {
  const id = (location.hash || "#ratios").replace("#","");
  if(TOOLS.some(x => x.id === id)) show(id);
});
const q = new URLSearchParams(location.search);
const start = (location.hash||"#ratios").replace("#","");
setLang(q.get("lang")==="en", false);
if(TOOLS.some(x=>x.id===start)) show(start);
</script>
