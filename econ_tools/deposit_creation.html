.box { background:#f7f9fc; padding:20px; border-radius:12px; margin-bottom:16px; }
.scenario-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
.scenario-box { background:white; padding:16px; border-radius:10px; border:2px solid #e2e8f0; }
.scenario-box.current { border-color:#3b82f6; }
.scenario-box.new { border-color:#10b981; }

.scenario-box.current .scenario-title { color:#1d4ed8; }
.scenario-box.new .scenario-title { color:#047857; }
.ratio-row { margin:8px 0; }
.ratio-row label { display:block; font-size:14px; margin-bottom:4px; font-weight:500; }
.ratio-inputs { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.ratio-inputs input { padding:6px; width:90px; font-size:14px; }
.ratio-inputs span { font-size:13px; color:#555; }
.common-settings { display:flex; align-items:center; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
.common-settings input { padding:6px; width:80px; font-size:14px; }
button.run-btn { padding:12px 28px; background:#2563eb; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-top:12px; }
button.run-btn:hover { background:#1d4ed8; }
table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; }
th,td { border:1px solid #ccc; padding:8px; text-align:right; }
th:first-child, td:first-child { text-align:center; }
th:last-child, td:last-child { text-align:left; }
th { background:#e2e8f0; }
tfoot td { font-weight:bold; background:#eef2ff; }
.bs-table { width:100%; margin:8px 0; font-size:13px; }
.bs-table th { background:#dce5f5; }
.note { background:#fff3cd; padding:12px; border-radius:8px; margin-top:12px; }
.error { color:red; }
.multiplier-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
.multi-card { background:#eef2ff; padding:12px; border-radius:8px; }

// ========== 比率雙向換算（% ↔ 實數）==========
function initRatioSync() {
  const pairs = [
    'current-rr', 'current-er', 'current-cl',
    'new-rr', 'new-er', 'new-cl'
  ];
  pairs.forEach(prefix => {
    const pctEl = document.getElementById(prefix + '-pct');
    const decEl = document.getElementById(prefix + '-dec');
    
    pctEl.addEventListener('input', function() {
      const val = Number(this.value);
      if(!isNaN(val)) decEl.value = (val / 100).toFixed(4);
    });
    
    decEl.addEventListener('input', function() {
      const val = Number(this.value);
      if(!isNaN(val)) pctEl.value = (val * 100).toFixed(2);
    });
  });
}

// ========== 讀取單一情況參數 ==========
function getScenarioParams(prefix) {
  return {
    initDeposit: Number(document.getElementById(prefix + '-init').value),
    rr: Number(document.getElementById(prefix + '-rr-dec').value),
    er: Number(document.getElementById(prefix + '-er-dec').value),
    cl: Number(document.getElementById(prefix + '-cl-dec').value)
  };
}

// ========== 計算單一情況 ==========
function calculateScenario(params, displayRounds) {
  const { initDeposit, rr, er, cl } = params;
  const MAX_ROUNDS = 50;
  
  if(rr <=0 || rr >=1 || er <0 || er >=1 || cl <0 || cl >=1) return null;

  const maxDepMult = 1 / rr;
  const maxLoanMult = maxDepMult - 1;
  const actualDepMult = 1 / (rr + er + cl);
  const actualLoanMult = actualDepMult - 1;
  
  const totalDeposit = initDeposit * actualDepMult;
  const totalReserve = totalDeposit * (rr + er);
  const totalLoan = totalDeposit - totalReserve;

  let currentNewDeposit = initDeposit;
  let cumDeposit = 0, cumReqRes = 0, cumExcRes = 0, cumCashLeak = 0, cumLend = 0;
  let rows = [];

  for(let r=1; r<=MAX_ROUNDS; r++){
    const reqRes = currentNewDeposit * rr;
    const excRes = currentNewDeposit * er;
    const cashLeak = currentNewDeposit * cl;
    const lendOut = currentNewDeposit - reqRes - excRes - cashLeak;
    
    cumDeposit += currentNewDeposit;
    cumReqRes += reqRes;
    cumExcRes += excRes;
    cumCashLeak += cashLeak;
    cumLend += lendOut;
    
    if(r <= displayRounds){
      rows.push({ round:r, newDep:currentNewDeposit, reqRes, excRes, cashLeak, lend:lendOut });
    }
    currentNewDeposit = lendOut;
    if(currentNewDeposit < 0.01) break;
  }

  return {
    maxDepMult, maxLoanMult, actualDepMult, actualLoanMult,
    totalDeposit, totalReserve, totalLoan,
    cumDeposit, cumReqRes, cumExcRes, cumCashLeak, cumLend,
    rows
  };
}

    </tr>

      <td></td><td></td>
    </tr>
    <tr>
      <th>${txt.totalAssets}</th>
      <th>$${(data.totalReserve + data.totalLoan).toLocaleString(undefined,{maximumFractionDigits:2})}</th>
      <th>${txt.totalLiabilities}</th>

}

// ========== 生成逐輪過程表格HTML ==========
function renderProcessTable(data, txt) {
  let html = `<table>
    <thead><tr>
      <th>${txt.thRound}</th><th>${txt.thNewDep}</th><th>${txt.thReqRes}</th>
      <th>${txt.thExcessRes}</th><th>${txt.thCashLeak}</th><th>${txt.thLend}</th><th>${txt.thDesc}</th>
    </tr></thead><tbody>`;
  
  data.rows.forEach((row, idx) => {
    const desc = idx === 0 ? txt.descFirst : txt.descOther;
    html += `<tr>
      <td>${row.round}</td>
      <td>$${row.newDep.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.reqRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.excRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.cashLeak.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>$${row.lend.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td>${desc}</td>
    </tr>`;
  });

  html += `</tbody><tfoot><tr>
    <td>${txt.totalRow}</td>
    <td>$${data.cumDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumReqRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumExcRes.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumCashLeak.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td>$${data.cumLend.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
    <td></td>
  </tr></tfoot></table>`;
  return html;
}

// ========== 生成對比總覽表格 ==========
function renderComparisonTable(cur, nw, txt) {
  function fmtChange(oldVal, newVal) {
    const diff = newVal - oldVal;
    const pct = oldVal !== 0 ? (diff / oldVal * 100) : 0;
    const cls = diff > 0 ? 'change-up' : (diff < 0 ? 'change-down' : '');
    const sign = diff > 0 ? '+' : '';
    return `<td class="${cls}">${sign}${diff.toFixed(3)}</td><td class="${cls}">${sign}${pct.toFixed(1)}%</td>`;
  }
  function fmtMoneyChange(oldVal, newVal) {
    const diff = newVal - oldVal;
    const pct = oldVal !== 0 ? (diff / oldVal * 100) : 0;
    const cls = diff > 0 ? 'change-up' : (diff < 0 ? 'change-down' : '');
    const sign = diff > 0 ? '+' : '';
    return `<td class="${cls}">${sign}$${diff.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td class="${cls}">${sign}${pct.toFixed(1)}%</td>`;
  }

  return `<table class="comparison-table">
    <thead><tr>
      <th>${txt.indicator}</th><th>${txt.currentVal}</th><th>${txt.newVal}</th><th>${txt.change}</th><th>${txt.changePct}</th>
    </tr></thead>
    <tbody>
      <tr><td>${txt.depMult}</td><td>${cur.actualDepMult.toFixed(3)}</td><td>${nw.actualDepMult.toFixed(3)}</td>${fmtChange(cur.actualDepMult, nw.actualDepMult)}</tr>
      <tr><td>${txt.loanMult}</td><td>${cur.actualLoanMult.toFixed(3)}</td><td>${nw.actualLoanMult.toFixed(3)}</td>${fmtChange(cur.actualLoanMult, nw.actualLoanMult)}</tr>
      <tr><td>${txt.totalDeposit}</td><td>$${cur.totalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalDeposit.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtMoneyChange(cur.totalDeposit, nw.totalDeposit)}</tr>
      <tr><td>${txt.totalLoan}</td><td>$${cur.totalLoan.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalLoan.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtMoneyChange(cur.totalLoan, nw.totalLoan)}</tr>
      <tr><td>${txt.totalReserve}</td><td>$${cur.totalReserve.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>$${nw.totalReserve.toLocaleString(undefined,{maximumFractionDigits:2})}</td>${fmtMoneyChange(cur.totalReserve, nw.totalReserve)}</tr>
    </tbody>
  </table>`;
}

// ========== 主執行函數 ==========
function runSimulation(){
  const txt = langPack[currentLang];
  const displayRounds = Math.max(1, Math.min(50, Number(document.getElementById('displayRounds').value) || 20));
  
  const curParams = getScenarioParams('current');
  const newParams = getScenarioParams('new');
  
  const curData = calculateScenario(curParams, displayRounds);
  const newData = calculateScenario(newParams, displayRounds);
  
  if(!curData || !newData){
    document.getElementById('output').innerHTML = `<div class="box"><p class="error">${txt.errorMsg}</p></div>`;
    return;
  }

  let html = `<div class="box">
    <h3>${txt.comparisonTitle}</h3>
    ${renderComparisonTable(curData, newData, txt)}
  </div>`;

  // 乘數對比
  html += `<div class="box">
    <div class="scenario-grid">
      <div>
        <h4>${txt.titleCurrent}</h4>
        ${renderMultiplierCards(curData, txt, false)}
      </div>
      <div>
        <h4>${txt.titleNew}</h4>
        ${renderMultiplierCards(newData, txt, true)}
      </div>
    </div>
  </div>`;

  // 資產負債表對比
  html += `<div class="box">
    <div class="scenario-grid">
      <div>
        <h4>${txt.bsTitleCurrent}</h4>
        ${renderBalanceSheet(curData, txt)}
      </div>
      <div>
        <h4>${txt.bsTitleNew}</h4>
        ${renderBalanceSheet(newData, txt)}
      </div>
    </div>
  </div>`;

  // 逐輪過程
  html += `<div class="box">
    <h4>${txt.processTitleCurrent}</h4>
    ${renderProcessTable(curData, txt)}
    <div class="section-divider"></div>
    <h4>${txt.processTitleNew}</h4>
    ${renderProcessTable(newData, txt)}
  </div>`;

  html += `<div class="box note">
    <strong>${txt.noteTitle}</strong>${txt.noteContent}
  </div>`;

  document.getElementById('output').innerHTML = html;
}

// ========== 語言切換 ==========
function switchLanguage(lang) {
  if(!langPack[lang]) return;
  currentLang = lang;
  const txt = langPack[lang];

  document.title = txt.htmlTitle;
  document.getElementById('page-title').innerText = txt.pageTitle;
  document.getElementById('assumption-text').innerText = txt.assumption;
  document.getElementById('label-rounds').innerText = txt.labelRounds;
  document.getElementById('title-current').innerText = txt.titleCurrent;
  document.getElementById('title-new').innerText = txt.titleNew;
  document.getElementById('btn-run').innerText = txt.btnRun;
  
  // 更新所有比率標籤
  document.querySelectorAll('[id^="label-rr-"], [id^="label-er-"], [id^="label-cl-"], [id^="label-init-"]').forEach(el => {
    const id = el.id;
    if(id.includes('rr')) el.innerText = txt.labelRR;
    else if(id.includes('er')) el.innerText = txt.labelER;
    else if(id.includes('cl')) el.innerText = txt.labelCL;
    else if(id.includes('init')) el.innerText = txt.labelInit;
  });
  
  // 更新"實數"標籤
  document.querySelectorAll('.ratio-inputs span:last-child').forEach(el => {
    if(el.innerText === '實數' || el.innerText === '实数' || el.innerText === 'Decimal') {
      el.innerText = txt.labelDec;
    }
  });

  document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+lang).classList.add('active');

  runSimulation();
}

// ========== 頁面載入初始化 ==========
function getLangFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang');
  if(lang && langPack[lang]) return lang;
  return 'zh-hk';
}

window.onload = function(){
  initRatioSync();
  switchLanguage(getLangFromUrl());
};
</script>
