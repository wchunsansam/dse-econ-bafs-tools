<div class="lang-bar">

<h1 id="page-title">🏦 DSE ECON｜銀行存款創造模擬器</h1>
<div class="box">
<p id="assumption-text">✅基礎假設：銀行將可貸出金額全數貸出</p>
<div class="mode-bar">
<button class="mode-btn active-expansion" id="mode-expansion" onclick="switchMode('expansion')">📈 新增存款（擴張）</button>
<button class="mode-btn" id="mode-contraction" onclick="switchMode('contraction')">📉 減少存款（提款收縮）</button>
</div>
<div class="common-settings"><label id="label-rounds">顯示輪數：</label><input type="number" id="displayRounds" value="20" min="1" max="50"></div>
<div id="params-expansion">
<div class="ratio-row"><label id="label-init-e">初始存款 ($)：</label><input type="number" id="exp-init" value="1000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-rr-e">法定儲備：</label><div class="ratio-inputs"><input type="number" id="exp-rr-pct" value="10" step="0.01"><span>%</span><input type="number" id="exp-rr-amt" value="100" step="0.01"><span>$</span></div></div>
<div class="ratio-row"><label id="label-er-e">超額儲備：</label><div class="ratio-inputs"><input type="number" id="exp-er-pct" value="0" step="0.01"><span>%</span><input type="number" id="exp-er-amt" value="0" step="0.01"><span>$</span></div></div>
<div class="ratio-row"><label id="label-cl-e">現金外流：</label><div class="ratio-inputs"><input type="number" id="exp-cl-pct" value="0" step="0.01"><span>%</span><input type="number" id="exp-cl-amt" value="0" step="0.01"><span>$</span></div></div>
</div>
<div id="params-contraction" class="hidden">
<div class="ratio-row"><label id="label-bd">基線存款 ($)：</label><input type="number" id="con-bd" value="8000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-br">基線儲備 ($)：</label><input type="number" id="con-br" value="2000" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-wd">提款金額 ($)：</label><input type="number" id="con-wd" value="0" style="padding:6px;width:100%;font-size:14px;"></div>
<div class="ratio-row"><label id="label-rr-c">法定儲備率：</label><div class="ratio-inputs"><input type="number" id="con-rr-pct" value="25" step="0.01"><span>%</span></div></div>
<div class="ratio-row"><label id="label-er-c">超額儲備率：</label><div class="ratio-inputs"><input type="number" id="con-er-pct" value="0" step="0.01"><span>%</span></div></div>
<div class="ratio-row"><label id="label-cl-c">現金外流率：</label><div class="ratio-inputs"><input type="number" id="con-cl-pct" value="0" step="0.01"><span>%</span></div></div>
</div>
<button class="toggle-compare-btn" id="toggle-compare" onclick="toggleComparison()">➕ 加入變化情況對比</button>
<div class="comparison-area" id="comparison-area"><div class="scenario-grid" style="margin-top:16px;">
<div class="scenario-box current"><div class="scenario-title" id="title-current">📌 現時情況（基準）</div><div id="compare-current-params"></div></div>
<div class="scenario-box new"><div class="scenario-title" id="title-new">🔄 新增情況（變化後）</div><div id="compare-new-params"></div></div>
</div></div>
<button class="run-btn" onclick="runSim()">執行模擬</button>
<p style="font-size:12px;color:#6b7280;margin-top:8px;">💡 修改參數後會自動更新，無需每次按按鈕</p>
</div>
<div id="output"></div>
<div class="skill-section">
<div class="skill-header" onclick="toggleSkill()"><h2 id="skill-title">📝 DSE 答題技巧與真題精解</h2><span class="skill-toggle" id="skill-toggle">+</span></div>
<div class="skill-content" id="skill-content">
<div id="question-type-area"></div>
<div class="skill-tabs">
<button class="skill-tab active" onclick="switchSkillTab(0)" id="tab-0">答題步驟</button>
<button class="skill-tab" onclick="switchSkillTab(1)" id="tab-1">公式速查</button>
<button class="skill-tab" onclick="switchSkillTab(2)" id="tab-2">歷屆真題</button>
<button class="skill-tab" onclick="switchSkillTab(3)" id="tab-3">常見錯誤</button>
<button class="skill-tab" onclick="switchSkillTab(4)" id="tab-4">關鍵概念</button>
</div>

<script>
// ===== MCQ題庫（54題，標記需核對的題目）=====
const MCQ=[
{y:"1990/CE/II/45",t:6,q:"Which of the following will increase the money supply in an economy?",o:["A citizen withdraws cash from a bank and keeps it in a safe.","A manufacturer repays a bank loan.","A bank grants a loan to a real estate developer.","A bank increases the amount of excess reserves it holds."],a:"C",e:"銀行貸款創造存款，MS增加。A：Cp↑Dd↓，MS不變。B：還款消滅存款，MS↓。D：超額儲備不直接影響MS。"},
{y:"1991/CE/II/31",t:3,q:"The withdrawal of money from banks causes",o:["a decrease in the value of the maximum possible banking multiplier.","a decrease in the cash reserves held by banks.","an increase in the deposits created.","a decrease in the minimum legal reserve ratio."],a:"B",e:"提款直接減少銀行現金儲備。最大乘數=1/法定儲備率，不變。"},
{y:"1991/CE/II/32",t:2,q:"Bank A has total deposits of $1 000m. Its reserves are $240m. Suppose the reserve ratio required by the government is 25%. Which of the following will help Bank A fulfil reserve requirement?",o:["Bank A increases its lending to customers by $40m.","Bank A borrows $10m from the inter-bank market.","Customers increase deposits with Bank A by $10m.","Customers withdraw deposits from Bank A by $40m."],a:"B",e:"要求儲備=1000×25%=250，實際=240，不足10。B借入10，儲備增至250，剛好滿足。"},
{y:"1992/CE/II/34",t:5,q:"Assuming that a 20% reserve ratio is required by law, when the banking system has excess reserves of $20 000, it can at most increase its deposits by",o:["$80 000.","$100 000.","the amount of its total reserves.","the amount of its excess reserves."],a:"B",e:"乘數=1/20%=5。超額儲備$20000可創造存款=20000×5=$100000。"},
{y:"1992/CE/II/35",t:2,q:"Balance sheet: Reserves $200, Loans $300, Deposits $500. From the table, we can say that",o:["the legal minimum reserves are $200.","the bank holds excess reserves of $100.","the actual banking multiplier is 4.","the actual reserve ratio is 40%."],a:"D",e:"實際儲備率=200/500=40%。無法從表中得知法定儲備率。實際乘數=1/40%=2.5。"},
{y:"1992/CE/II/32",t:3,q:"Balance sheet: Reserves $150, Loans $850, Deposits $1000. Required reserve ratio is 20%. Which statement is correct?",o:["It has excess reserves.","It has to increase its reserves by $100.","It has to reduce loans by a total of $250.","The deposit multiplier is 4."],a:"C",e:"要求儲備=200，實際=150，不足50。要消除不足需收回貸款=50/20%=$250。乘數=5。"},
{y:"1994/CE/II/40",t:1,q:"If the required reserve ratio for banks is 100%, which of the following is correct?",o:["The money supply will not change if banks accept deposits from the public.","The total amount of bank loans must be equal to the total amount of deposits.","Banks have no chance to make profits.","The banking multiplier is zero."],a:"A",e:"100%儲備率下銀行不能貸款，接受存款只是Cp→Dd，MS不變。貸款=0。乘數=1。"},
{y:"1994/CE/II/42",t:2,q:"Required minimum reserve ratio 25%. Balance sheet: Reserves $600, Loans $900, Deposits $1500. Which is correct?",o:["The actual reserve ratio of the bank is 45%.","The excess reserves of the bank is $300.","The banking multiplier is 5.","The banking system can expand its loan by a maximum of $900."],a:"D",e:"實際儲備率=40%。超額=600-375=225。乘數=4。可擴張貸款=225×4=$900。"},
{y:"1995/CE/I/42",t:6,q:"Legal reserve ratio 100%. A person deposits $500 cash. (1) currency in circulation decreases by $500. (2) bank deposits remain unchanged. (3) bank loans increase by $500. (4) money supply remains unchanged.",o:["(1) and (2) only","(1) and (4) only","(2) and (3) only","(3) and (4) only"],a:"B",e:"100%儲備率：(1)流通現金↓$500✓；(2)存款↑$500✗；(3)貸款不變✗；(4)MS=Cp+Dd，一減一增，MS不變✓。"},
{y:"1996/CE/II/35",t:3,q:"Balance sheet: Cash reserve $250, Loans $750, Deposits $1000. Legal RR 25%. A person withdraws $40. How much would cash reserve fall short of legal requirement?",o:["$10","$20","$30","$40"],a:"C",e:"提款後：儲備=210，存款=960。要求儲備=960×25%=240。不足=240-210=$30。"},
{y:"1996/CE/II/36",t:3,q:"(Follow above) What would be the maximum amount of deposits after the withdrawal?",o:["$750","$840","$880","$960"],a:"B",e:"提款後儲備=210。最大存款=210÷25%=$840。"},
{y:"1997/CE/II/33",t:1,q:"Legal RR 25%. A person deposits $200 cash into savings account. The maximum possible change in",o:["bank loans is an increase of $800.","bank reserves is an increase of $200.","M1 is a decrease of $50.","M2 is an increase of $800."],a:"C",e:"乘數=4。存款增加=800。貸款增加=800-200=600。$200現金存入儲蓄戶口(M2)，M1(通貨+活期)減少。"},
{y:"1997/CE/II/34",t:1,q:"A $100 deposit of newly-printed money results in a $400 increase in total deposit. We can conclude that",o:["the banking multiplier is 4.","the legal reserve ratio is 0.25.","the money supply increases by $500.","there is no cash leakage."],a:"B",e:"總存款增加$400(含初始$100)，乘數=4。法定儲備率=1/4=0.25。MS增加=存款增加=400(新印貨幣，Cp不變)。"},
{y:"1998/CE/II/33",t:4,q:"Balance sheet: Reserves $1000, Loans $2000, Deposits $3000. Required RR raised from 20% to 25%. Decrease in excess reserves?",o:["$150","$250","$400","$600"],a:"A",e:"原超額=1000-600=400。新超額=1000-750=250。減少=400-250=$150。"},
{y:"1998/CE/II/34",t:2,q:"Required RR 20%. Balance sheet: Reserves $500, Loans $500, Deposits $1000. Which is correct?",o:["Excess reserves is $200.","Actual banking multiplier is 5.","Banking system can expand total deposits to $5000.","Maximum amount of loans is $2000."],a:"C",e:"實際儲備率=50%。超額=500-200=300。貸出超額後最大存款=500÷20%=$2500？重新計算：儲備$500，20%下可支持存款=2500。⚠️此題解析需核對。",check:true},
{y:"1998/CE/II/52",t:1,q:"An amount of cash deposited into a bank will NOT lead to",o:["an increase in bank loan made to the public","an increase in total deposits of the banks.","an increase in the value of the maximum banking multiplier.","an increase in the cash reserves held by banks."],a:"C",e:"存款增加會增加貸款、總存款、現金儲備。但最大乘數=1/法定儲備率，與存款金額無關。"},
{y:"1999/CE/II/36",t:5,q:"Balance sheet: Reserves $100, Loans $300, Deposits $400. Legal RR 20%. All banks loan out excess reserves, all loans re-deposited. After credit creation, reserves = ___ and loans increase by ___.",o:["less than $100 ...... more than $100","equal to $100 ...... $100","equal to $100 ...... more than $100","more than $100 ...... less than $100"],a:"B",e:"超額=100-80=20。乘數=5。可創造存款=20×5=100。儲備總額不變=$100。貸款增加=新存款-新儲備=100-20=$80？⚠️此題解析需核對。",check:true},
{y:"1999/CE/II/38",t:1,q:"Which would reduce the amount of deposits created in multiple credit creation?",o:["An increase in the holding of cash by the public","An increase in the use of cheques by the public","An increase in the use of electronic money by the public","An increase in the bank loans made to the public"],a:"A",e:"公眾持有更多現金=現金外流增加，可貸出金額減少，存款創造減少。"},
{y:"2000/CE/II/29",t:1,q:"A bank accepts $1000 deposit from a foreign country. Through credit creation, total deposit increases by $4000. We can conclude that",o:["The legal reserve ratio is 25%","Banks do not keep excess reserves.","The total money supply has increased by at least $4000.","There is a cash leakage in the credit creation process."],a:"C",e:"外國存款$1000，存款增加$4000，實際乘數=4。法定儲備率可能≤25%。MS增加=存款增加(外國流入，Cp不變)=至少$4000。"},
{y:"2000/CE/II/30",t:6,q:"As the use of Octopus card becomes much more popular,",o:["The money supply will increase because the card can perform the functions of money.","The volume of the legal tender in circulation will drop.","The value of money will drop because the demand for cash will be smaller.","The maximum amount of deposits created will decrease."],a:"B",e:"八達通普及→公眾持有現金減少→現金存入銀行。法定貨幣(現金)流通量下降。存款創造會增加。"},
{y:"2001/CE/II/26",t:5,q:"Balance sheet: Reserves $200, Loans $400, Deposits $600. Legal RR 20%. If all banks no longer hold excess reserves, maximum increase in bank deposits is",o:["$80","$160","$400","$1 000"],a:"C",e:"實際儲備率=33.3%。超額=200-120=80。乘數=5。可創造存款=80×5=$400。"},
{y:"2002/CE/II/35",t:2,q:"Banking system has excess reserve of $200. Balance sheet: Reserves $500, Loans $700, Deposits $1200. The required reserve ratio is",o:["15%","20%","25%","30%"],a:"C",e:"超額=200=500-1200×rr → rr=300/1200=25%。"},
{y:"2002/CE/II/36",t:3,q:"(Follow above) Someone withdraws $250. Maximum possible amount of bank deposits?",o:["$200","$600","$800","$1 000"],a:"D",e:"提款後：儲備=250，存款=950。最大存款=250÷25%=$1000。"},
{y:"2002/CE/II/37",t:1,q:"Which will reduce deposit creation ability? (1) increase in use of credit cards (2) increase in cash held by public (3) increase in legal reserve requirement",o:["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],a:"C",e:"(1)信用卡普及→現金持有↓→存款創造↑。(2)現金持有↑→外流↑→存款創造↓。(3)法定儲備率↑→乘數↓→存款創造↓。"},
{y:"2002/CE/II/38",t:6,q:"During Lunar New Year, many people withdraw cash. Cash held by public increases. Which is a definite consequence?",o:["Maximum banking multiplier decreases.","Maximum possible amount of deposits decreases.","Amount of bank loans made to public decreases.","Money supply decreases."],a:"B",e:"提款→銀行儲備減少→可支持的最大存款減少。最大乘數不變。貸款/MS不一定減少(取決於是否收縮)。"},
{y:"2003/CE/II/34",t:2,q:"If actual reserve is larger than required reserve in a banking system, it follows that",o:["there is cash leakage.","some banks decide to hold excess reserves.","the demand for loans is insufficient.","the banking system can create more deposits."],a:"D",e:"實際儲備>要求儲備=有超額儲備→銀行可以貸出更多→創造更多存款。A/B/C是可能原因，D是必然結果。"},
{y:"2003/CE/II/35",t:2,q:"Balance sheet: Reserves $500, Loans $1500, Deposits $2000. Required RR 20%. Which is correct?",o:["Maximum banking multiplier is 4.","Maximum possible increase in loans = maximum possible increase in deposits.","Actual reserve ratio = required reserve ratio.","Reserves will decrease if all banks loan out excess reserves."],a:"B",e:"實際儲備率=25%>20%，超額=100。最大乘數=5。貸出超額後儲備總額不變。⚠️此題解析需核對。",check:true},
{y:"2003/CE/II/36",t:4,q:"(Follow above) If government increases required RR to 40%, which is correct?",o:["Reserves will increase to $800.","Deposits will not change.","Maximum amount of loans will be $750.","Maximum amount of deposits will be $1600."],a:"C",e:"儲備率提高到40%，儲備金額不變=$500。最大存款=500÷40%=$1250。最大貸款=1250-500=$750。"},
{y:"2004/CE/II/38",t:3,q:"Balance sheet: Cash reserves $500, Loans and investments $750, Deposits $1250. Customers withdraw $50 cash. Immediately after withdrawal, cash reserves and deposits are ___ and ___.",o:["$450 ...... $1 200","$450 ...... $1 250","$500 ...... $1 200","$500 ...... $1 250"],a:"A",e:"提款$50：現金儲備=500-50=450，存款=1250-50=1200。兩者同時減少。"},
{y:"2004/CE/II/39",t:3,q:"Banking system has excess reserve of $200. Balance sheet: Reserves $500, Loans $1000, Deposits $1500. $300 deposits withdrawn. Maximum possible amount of bank deposits?",o:["$500","$1 000","$1 200","$6 000"],a:"B",e:"法定儲備率：200=500-1500×rr → rr=20%。提款$300後：儲備=200。最大存款=200÷20%=$1000。"},
{y:"2005/CE/II/37",t:3,q:"Balance sheet: Cash reserves $500, Loans $1500, Deposits $2000. No excess reserves. After withdrawal of $100, maximum possible amount of deposits?",o:["$1 600","$1 700","$1 900","$1 800"],a:"A",e:"無超額→法定儲備率=500/2000=25%。提款$100後：儲備=400。最大存款=400÷25%=$1600。"},
{y:"2005/CE/II/50",t:4,q:"Central bank increases legal reserve ratio. Banking system has no excess reserves. This measure would NOT reduce",o:["the ability of deposit creation.","the amount of reserves of the banking system.","the banking multiplier.","the money supply."],a:"B",e:"提高法定儲備率：存款創造能力↓、乘數↓、MS可能↓。但儲備金額不變(只是要求儲備增加了)。"},
{y:"2006/CE/II/36",t:2,q:"Banking system has excess reserves of $800. Balance sheet: Reserves $1000, Loans $1000, Deposits $2000. Which is correct?",o:["Required reserve ratio is 50%.","Maximum amount of deposits is $8000.","Maximum banking multiplier is 5.","Actual banking multiplier is 2."],a:"B",e:"超額=800=1000-2000×rr → rr=10%。最大存款=儲備÷rr=1000÷10%=$10000？可增加存款=800×10=8000。⚠️此題解析需核對。",check:true},
{y:"2006/CE/II/37",t:6,q:"During Lunar New Year, many people withdraw cash. Which is a definite consequence?",o:["Maximum banking multiplier decreases.","Maximum possible amount of deposits decreases.","Amount of bank loans decreases.","Money supply decreases."],a:"C",e:"提款後銀行儲備減少，如果銀行原本fully loaned up，則必須收回貸款，貸款減少。這是更直接的後果。"},
{y:"2006/CE/II/38",t:1,q:"Which may reduce the size of the actual banking multiplier?",o:["an increase in the use of cheques by the public","an increase in the demand for bank loans","an increase in the risk of non-repayment of bank loans","a reduction in the required reserve ratio"],a:"C",e:"實際乘數=1/(法定+超額+現金外流)。壞賬風險↑→銀行持有更多超額儲備→乘數↓。"},
{y:"2007/CE/II/36",t:2,q:"Banking system has excess reserve of $50. Balance sheet: Reserves $250, Loans $750, Deposits $1000. Which is correct?",o:["Required reserve ratio is 25%.","Actual reserve ratio is 20%.","If $100 cash deposited, total deposits will be $1500.","If $100 withdrawn, maximum possible total deposits will be $750."],a:"D",e:"超額=50=250-1000×rr → rr=20%。實際=25%。提款$100後：儲備=150。最大存款=150÷20%=$750。"},
{y:"2008/CE/II/38",t:3,q:"Banking system never holds excess reserves. Balance sheet: Reserves $600, Loans $2400, Deposits $3000. Public always holds same amount of cash. $200 withdrawn. Maximum amount of loans?",o:["$1 200","$1 600","$2 000","$2 200"],a:"B",e:"無超額→法定儲備率=600/3000=20%。提款$200後：儲備=400。最大存款=400÷20%=2000。最大貸款=2000-400=$1600。"},
{y:"2008/CE/II/39",t:1,q:"Which will increase the maximum banking multiplier?",o:["Octopus cards are widely used.","The economy grows fast and investment opportunities flourish.","Banks keep more reserves to avoid bank runs.","Commercial banks are allowed to increase the proportion of deposits that can be loaned out."],a:"D",e:"最大乘數=1/法定儲備率。可貸出比例增加=法定儲備率降低→最大乘數↑。A/B影響實際乘數，不影響最大乘數。"},
{y:"2009/CE/II/38",t:1,q:"Actual banking multiplier is smaller than maximum banking multiplier. Possible reason?",o:["There is insufficient demand for bank loans.","The banking system is facing a reserve shortage.","The maximum possible amount of total deposits will decrease.","The actual reserve ratio is smaller than the required reserve ratio."],a:"A",e:"實際乘數<最大乘數的原因：超額儲備(貸款需求不足→銀行貸不出)、現金外流。"},
{y:"2009/CE/II/39",t:5,q:"Banking system has $50 excess reserves. Balance sheet: Reserves $350, Loans $850, Deposits $1200. All banks lend out excess reserves, all loans re-deposited. After deposit creation, reserves = ___ and loans = ___.",o:["$300 ...... $1 400","$350 ...... $1 400","$350 ...... $1 050","$350 ...... $1 050"],a:"D",e:"法定儲備率：50=350-1200×rr → rr=25%。貸出超額$50，乘數=4，可創造存款=200。總存款=1400。儲備不變=$350。總貸款=1400-350=$1050。⚠️此題解析需核對。",check:true},
{y:"2010/CE/II/35",t:1,q:"The maximum banking multiplier will decrease when",o:["the amount of excess reserves held by banks increases.","the required reserve ratio increases.","the amount of cash leakage increases.","the demand for loans decreases."],a:"B",e:"最大乘數=1/法定儲備率。只有法定儲備率增加會使最大乘數減小。A/C/D影響實際乘數。"},
{y:"2010/CE/II/36",t:3,q:"Banking system has excess reserve of $500. Balance sheet: Reserves $2500, Loans $7500, Deposits $10000. Public withdraw $1000 cash. No excess reserves, no cash leakage. What happens after deposit contraction?",o:["Bank deposits will fall by $5 000.","Bank loans will fall by $2 500.","The money supply will fall by $1 500.","Both B and C are correct."],a:"C",e:"法定儲備率：500=2500-10000×rr → rr=20%。提款$1000後：儲備=1500。最大存款=1500÷20%=7500。存款變化=-2500。貸款變化=(7500-1500)-(10000-2500)=6000-7500=-1500。MS變化=Cp(+1000)+Dd(-2500)=-1500。"},
{y:"2012/DSE/I/27",t:2,q:"Balance sheet ($m): Reserves 400, Loans 600, Deposits 1000. Required RR 25%. Which is correct?",o:["Excess reserves are $200m.","Actual banking multiplier is 4.","Banking system can expand total deposits to $1600m.","Maximum amount of loans is $1000m."],a:"C",e:"實際儲備率=40%。超額=400-250=150。貸出超額$150，乘數=4，可創造存款=600，總存款=1000+600=1600。"},
{y:"2013/DSE/I/26",t:6,q:"Initially excess reserve $160m, public holds $200m cash. Balance sheet ($m): Reserves 400, Loans 800, Deposits 1200. $100m withdrawn and held as cash. What will money supply be if banks lend out all excess reserves?",o:["$1 500m","$1 700m","$1 800m","$2 300m"],a:"D",e:"法定儲備率：160=400-1200×rr → rr=20%。原MS=200+1200=1400。提款$100後：Cp=300，儲備=300，存款=1100。超額=300-220=80。貸出可創造存款=80×5=400。總存款=1500。MS=300+1500=1800？⚠️此題解析需核對。",check:true},
{y:"2014/DSE/I/30",t:5,q:"Balance sheet ($m): Reserves 400, Loans 800, Deposits 1200. Required RR 25%. All banks loan out excess reserves. Which is correct?",o:["Amount of reserves held by banks will decrease.","Maximum banking multiplier will increase.","Money supply will remain unchanged.","Maximum possible increase in loans = maximum possible increase in deposits."],a:"A",e:"實際儲備率=33.3%。超額=400-300=100。貸出超額儲備後，如果貸出的錢部分被公眾持有為現金(現金外流)，銀行儲備會減少。"},
{y:"2016/DSE/I/31",t:2,q:"Banking system has excess reserve $125m. Balance sheet ($m): Reserves 250, Loans 250, Deposits 500. Which is INCORRECT?",o:["Required reserve ratio is 25%.","Maximum amount of loans is $750m.","Banking system can expand total deposit to $1000m.","Actual banking multiplier is 4."],a:"D",e:"超額=125=250-500×rr → rr=25%。最大存款=250÷25%=1000。最大貸款=1000-250=750。實際乘數=1/(250/500)=2（不是4）。題目問INCORRECT，選D。"},
{y:"2017/DSE/I/31",t:4,q:"Balance sheet ($m): Reserves 300, Loans 600, Deposits 900. Public does not hold cash. Required RR reduced to 25%. After deposit creation, loans = $750. Which is correct?",o:["Money supply increases by $300.","Actual banking multiplier is 3.5.","Deposits increase by $600.","Bank reserves are $450."],a:"B",e:"原rr=300/900=33.3%。降到25%後超額=300-225=75。最終貸款=750，儲備不變=300，最終存款=1050。實際乘數=1050/300=3.5。"},
{y:"2019/DSE/I/28",t:6,q:"Country A banking system. MS=$2800, banks hold no excess reserves. Balance sheet: Reserves $500, Loans $2000, Deposits $2500. Public deposits $200 cash. After deposit creation, which is correct?",o:["Deposits would increase by $3500.","Money supply would increase by $1000.","Monetary base would increase by $200.","Loans will increase by $800."],a:"D",e:"MS=2800=Cp+2500→Cp=300。rr=500/2500=20%。存款$200後：Cp=100，儲備=700，存款=2700。最大存款=700÷20%=3500。存款增加=1000。MS變化=-200+1000=800。MB=Cp+儲備，一減一增，MB不變。貸款增加=(3500-700)-(2500-500)=2800-2000=800。"},
{y:"2020/DSE/I/33",t:1,q:"Which will increase the actual banking multiplier?",o:["The public tends to hold more cash.","The use of credit card becomes more popular.","The central bank increases the required reserve ratio.","The interest rate of bank deposit decreases."],a:"B",e:"實際乘數=1/(法定+超額+現金外流)。信用卡普及→公眾持有現金↓→現金外流↓→乘數↑。"},
{y:"2022/DSE/I/30",t:6,q:"Balance sheet ($m): Reserves 500, Loans 1500, Deposits 2000. Required RR 20%, public holds no cash initially. Customer withdraws $200m and holds as cash. No excess reserves. Money supply after credit creation/contraction?",o:["$1 200m","$1 400m","$1 500m","$1 700m"],a:"D",e:"原MS=2000。提款$200後：Cp=200，儲備=300，存款=1800。原本超額=500-400=100。提款後超額=300-360=-60(不足)。最大存款=300÷20%=1500。MS=200+1500=$1700m。"},
{y:"2022/DSE/I/32",t:1,q:"Central bank requires commercial banks to keep all deposits as reserves. Which is INCORRECT?",o:["Monetary base will be equal to money supply.","Required reserve ratio will be equal to one.","Maximum banking multiplier will be equal to zero.","Money creation ability will be smaller than fractional reserve system."],a:"C",e:"100%儲備率：MB=Cp+儲備=Cp+Dd=MS。rr=1。最大乘數=1/1=1（不是0）。貨幣創造能力<部分儲備制。題目問INCORRECT，選C。"},
{y:"2023/DSE/I/34",t:2,q:"Banking system has excess reserves $125m. Balance sheet ($m): Reserves 500, Loans 1000, Deposits 1500. Which is correct?",o:["Actual banking multiplier is 4.","If banks loan out all excess reserves, reserves will decrease after deposit creation.","If banks loan out all excess reserves, maximum possible increase in loans will be $500m.","If public withdraws $125m and holds as cash, excess reserves will decrease to zero immediately."],a:"C",e:"超額=125=500-1500×rr → rr=25%。實際乘數=1/(500/1500)=3。貸出超額$125，乘數=4，可創造存款=500，貸款增加=500-125=375？⚠️此題解析需核對。",check:true},
{y:"2024/DSE/I/34",t:5,q:"Banking system has excess reserves $20m, public holds fixed amount of cash. Balance sheet ($m): Reserves 40, Loans 60, Deposits 100. Some banks lend out excess reserves. After deposit creation, loans increase by $20m. Which is correct?",o:["Reserves become $20m.","Excess reserves become $16m.","Banking system has reserve shortage of $8m.","Deposits become $200m."],a:"B",e:"超額=20=40-100×rr → rr=20%。貸款增加$20，最終貸款=80，儲備不變=40，存款=120。超額=40-120×20%=40-24=16。"},
{y:"2025/DSE/I/34",t:1,q:"Balance sheet: Reserves $250, Loans $750, Deposits $1000. Initially excess reserve $50. Public reduces cash holdings by depositing $100 cash. When maximum deposit is reached, new balance sheet?",o:["A: Reserves 300, Loans 900, Deposits 1200","B: Reserves 350, Loans 1050, Deposits 1400","C: Reserves 300, Loans 1200, Deposits 1500","D: Reserves 350, Loans 1400, Deposits 1750"],a:"D",e:"超額=50=250-1000×rr → rr=20%。存款$100後：儲備=350，存款=1100。最大存款=350÷20%=1750。儲備=350，貸款=1750-350=1400。"}
];

// ===== 結構題（6題）=====
const STRUCTS=[
{"year": "1990/CE/2/(d)(ii)", "marks": "8 marks", "type": "type3", "q_zh": "假設香港銀行不持有超額儲備，法定最低儲備率25%。陳先生從銀行A的儲蓄戶口提取HK$10,000並存放在家。(I) 計算銀行A的儲備短缺金額，並建議一個銀行A可以重新滿足儲備要求的方法。(II) 計算銀行業總存款的最大可能變化。", "q_en": "Suppose banks in HK do not hold excess reserves, legal minimum RR 25%. Mr Chan withdraws HK$10,000 from Bank A savings account and keeps at home. (I) Calculate Bank A's reserve shortage, suggest ONE way Bank A can satisfy RR again. (II) Calculate max possible change in total deposits of banking sector.", "bs": null, "ans_zh": ["(I) 短缺 = $10000 × (1 - 25%) = $7500", "可能方法：收回貸款 / 出售投資資產", "(II) 最大變化 = $10000 × (1 / 25%) = $40000（存款減少）"], "ans_en": ["(I) Shortage = $10000 × (1-25%) = $7500", "Possible way: recall loans / sell investment assets", "(II) Max change = $10000 × (1/25%) = $40000 (decrease)"], "tip_zh": "💡 提款後單間銀行儲備短缺，可收回貸款或出售資產。整個銀行業的存款收縮要乘乘數。", "tip_en": "💡 Single bank shortage after W/D, can call loans or sell assets. Whole banking sector contraction × multiplier."},
{"year": "1991/CE/I/5(b)", "marks": "11 marks", "type": "type2", "q_zh": "假設經濟體系只有兩間銀行A和B，受相同法定現金儲備率約束。銀行B沒有超額現金儲備。銀行A：現金$50、貸款$50、存款$100；銀行B：現金$200、貸款$600、存款$800。(i) 計算法定現金儲備率。(ii) 計算銀行A的超額現金儲備。(iii) 假設銀行A不持有超額儲備，計算整個銀行業可創造存款的最大增加。列出兩個上述以外的假設。", "q_en": "Only two banks A and B, same required cash RR. Bank B has no excess. Bank A: Cash $50, Loans $50, Deposits $100; Bank B: Cash $200, Loans $600, Deposits $800. (i) Calculate required cash RR. (ii) Calculate Bank A's excess cash reserves. (iii) Assume Bank A holds no excess, calculate max increase in deposits created by whole banking system. State TWO assumptions other than above.", "bs": {"reserves": 250, "loans": 650, "deposits": 900}, "ans_zh": ["(i) 法定儲備率 = $200 / $800 = 25%", "(ii) 超額儲備 = $50 - ($100 × 25%) = $25", "(iii) 可創造存款 = $25 × (1 / 25%) = $100", "假設：- 沒有現金外流 - 人們願意借貸"], "ans_en": ["(i) Required RR = $200 / $800 = 25%", "(ii) Excess = $50 - ($100 × 25%) = $25", "(iii) Deposits created = $25 × (1/25%) = $100", "Assumptions: - no cash drain - people willing to borrow"], "tip_zh": "💡 從沒有超額儲備的銀行B計算法定儲備率。超額儲備×乘數=可創造存款。", "tip_en": "💡 Calculate RR from Bank B (no excess). Excess × multiplier = deposits created."},
{"year": "1992/CE/I/3(b)(ii)", "marks": "6 marks", "type": "type2", "q_zh": "在香港，王小姐把$1000現金存入匯豐銀行作為活期存款。解釋兩種情況，在這兩種情況下這$1000存款不會導致存款進一步增加。", "q_en": "In HK, Miss Wong puts $1000 cash into HSBC as demand deposit. Explain TWO situations under which this $1000 deposit will NOT lead to further increase in deposits.", "bs": null, "ans_zh": ["情況1：100%儲備率要求（政府要求銀行保留全部存款作為儲備）", "情況2：銀行保留全部$1000作為儲備（不貸出）", "情況3：沒有人向銀行借貸（貸款需求為零）", "情況4：貸出的款項沒有重新存入銀行體系（現金外流）", "（任何兩個，每個3分）"], "ans_en": ["1: 100% RR required by government", "2: Bank keeps all $1000 as reserves (no lending)", "3: No one borrows (zero loan demand)", "4: Loans not redeposited (cash leakage)", "(Any TWO, 3 marks each)"], "tip_zh": "💡 存款創造需要三個條件：部分儲備制、銀行願意貸出、貸款重新存入。任何一個不滿足就不會進一步增加。", "tip_en": "💡 Deposit creation needs: fractional reserve, banks lend, loans redeposited. Any fails → no further increase."},
{"year": "1993/CE/I/5(c)(ii)", "marks": "3 marks", "type": "type1", "q_zh": "陳先生把加拿大的公寓賣給朋友，收到HK$300萬海外匯款，存入香港銀行的儲蓄戶口。已知儲備率25%，計算本地銀行業存款的可能最大增加（包括初始$300萬）。顯示計算步驟。", "q_en": "Mr Chan sells flat to friend in Canada, receives HK$3m overseas remittance, deposits in HK bank savings account. Given RR 25%, calculate possible max increase in deposits of local banking system (including initial $3m). Show working.", "bs": null, "ans_zh": ["最大存款增加 = $3 million × (1 / 25%) = $12 million"], "ans_en": ["Max deposit increase = $3m × (1/25%) = $12m"], "tip_zh": "💡 海外匯款=新資金流入，Cp不變，MS增加=存款增加。最大存款=初始存款×乘數。", "tip_en": "💡 Overseas remittance = new money inflow, Cp unchanged, MS increase = deposit increase. Max deposits = initial × multiplier."},
{"year": "1994/CE/I/5", "marks": "4 marks", "type": "type1", "q_zh": "假設某經濟體系所有銀行均不持有超額儲備，資產負債表：儲備$240、貸款$960、存款$1200。若有人將$100現金存入銀行，銀行體系可創造的最大存款總額（包括初始$100）是多少？顯示計算步驟。", "q_en": "All banks keep no excess reserves. BS: Reserves $240, Loans $960, Deposits $1200. Someone deposits $100 cash. Max total deposits (including initial $100)? Show working.", "bs": {"reserves": 240, "loans": 960, "deposits": 1200}, "ans_zh": ["步驟1：實際儲備率 = $240 ÷ $1200 = 20%", "步驟2：最大存款乘數 = 1 ÷ 20% = 5", "步驟3：最大存款總額 = $100 × 5 = $500"], "ans_en": ["Step 1: Actual RR = $240 ÷ $1200 = 20%", "Step 2: Max multiplier = 1 ÷ 20% = 5", "Step 3: Max total deposits = $100 × 5 = $500"], "tip_zh": "💡 必須先從資產負債表計算實際儲備率。乘數=1/實際儲備率（無超額儲備）。", "tip_en": "💡 Calculate actual RR from BS first. Multiplier = 1/actual RR (no excess)."},
{"year": "1995/CE/I/10(a)(iii)", "marks": "8 marks", "type": "type3", "q_zh": "觀眾從美國銀行存款提取$M購買演唱會門票。假設美國銀行法定儲備率20%，不持有超額儲備，沒有現金外流。提款並捐款給盧旺達後，美國銀行總存款會發生什麼變化？簡要解釋變化過程。", "q_en": "Audience withdrew $M from US bank deposits to buy concert tickets. Suppose US banks required RR 20%, no excess, no cash drain. What happens to total deposits of US banks after withdrawal and donation to Rwanda? Explain briefly the changing process.", "bs": null, "ans_zh": ["步驟1：初始提款$M", "步驟2：銀行失去儲備（實際儲備 < 要求儲備）", "步驟3：銀行收回貸款 / 向公眾出售銀行資產", "步驟4：進一步提取銀行存款以償還貸款 / 購買銀行資產", "步驟5：收縮過程持續進行", "最終：總存款收縮 = $M × (1 / 20%) = $5M"], "ans_en": ["Step 1: Initial withdrawal of $M", "Step 2: Banks lose reserves (actual < required)", "Step 3: Banks call back loans / sell assets to public", "Step 4: Further withdrawals to repay loans / buy assets", "Step 5: Contraction continues", "Final: total deposits contract by $M × (1/20%) = $5M"], "tip_zh": "💡 捐款海外=現金外流，不會重新存入。收縮過程步驟順序必須正確。", "tip_en": "💡 Donation overseas = cash leakage, not redeposited. Contraction sequence must be correct."},
{"year": "1996/CE/I/11(c)", "marks": "7 marks", "type": "type4", "q_zh": "假設報紙出版商發行股票集資$500萬，全數存入香港銀行。假設香港銀行法定儲備率25%，不持有超額儲備，沒有現金外流。解釋股票發行完成後，香港銀行總存款會發生什麼變化，如果：(i) 所有股票由本地人購買，他們從香港銀行提款；(ii) 所有股票由外國人購買，從海外匯款結算。", "q_en": "Suppose newspaper publisher raises $5m by issuing shares, deposits full amount into HK banks. Suppose HK banks required RR 25%, no excess, no cash leakage. Explain what happens to total deposits of HK banks after share issuance if: (i) all shares purchased by locals who withdraw deposits from HK banks; (ii) all shares purchased by foreigners who remit money from overseas.", "bs": null, "ans_zh": ["(i) 總存款不變，因為只是從一個銀行存款轉到另一個銀行存款。或者：起初可能有存款收縮，但之後被存款擴張抵消。", "(ii) 銀行獲得超額儲備 → 總存款增加，增加金額 = $5m × (1 / 25%) = $20m"], "ans_en": ["(i) No change in total bank deposits, because it is only a switch from one bank deposit to another's. OR: there may be some deposit contraction at first, but then offset by deposit expansion later.", "(ii) Banks gain excess reserves → increase in total bank deposits by $5m × (1/25%) = $20m"], "tip_zh": "💡 本地人購買=存款轉帳，總存款不變。外國人購買=新資金流入，總存款增加。", "tip_en": "💡 Local purchase = deposit transfer, total unchanged. Foreign purchase = new inflow, total increases."},
{"year": "1997/CE/I/9(c)", "marks": "8 marks", "type": "type2", "q_zh": "假設政府在新界西北興建鐵路。假設香港銀行沒有超額儲備，最低儲備率25%，從海外借入$100億興建鐵路。用存款創造過程，解釋為什麼香港實際創造的銀行存款金額小於可創造的最大銀行存款金額。", "q_en": "Suppose government builds railway in NW NT. Suppose HK banks have no excess reserves, minimum RR 25%, borrow $10b from overseas to build railway. Using deposit creation process, explain why actual amount of bank deposits created in HK is smaller than maximum amount of bank deposits that can be created.", "bs": null, "ans_zh": ["需要的邏輯順序：注入新資金（如$10b）到本地銀行 → 銀行獲得超額儲備 → 銀行貸出超額儲備 → 貸款重新存入銀行體系", "但由於以下因素，重新存款金額小於$R：- 最初並非所有新資金都存入本地銀行 - 本地銀行持有超額儲備 - 貸款需求不足 - 現金外流", "（任何一個因素的詳細解釋，最多8分）"], "ans_en": ["Logical sequence: Injection of new money (e.g. $10b) to local banks → banks gain excess reserves (SR) → banks loan out excess → loan redeposited into banking system", "But due to following factors, redeposit amount smaller than $R: - initially not all new money deposited to local banks - local banks hold excess reserves - insufficient demand for loans - cash drain", "(Elaboration on any one factor, max 8 marks)"], "tip_zh": "💡 實際<最大的原因：超額儲備、現金外流、貸款需求不足。必須解釋其中一個如何影響乘數。", "tip_en": "💡 Reasons actual < max: excess reserves, cash leakage, insufficient loan demand. Must explain how one affects multiplier."},
{"year": "1998/CE/I/9(a)", "marks": "8 marks", "type": "type1", "q_zh": "王先生收到海外匯款HK$100萬，全數存入香港銀行。後來他用部分錢買股票，其餘開餐廳。假設香港銀行法定儲備率25%，沒有現金外流，不持有超額儲備。簡要解釋$100萬注入導致的本地銀行存款創造過程。計算創造的總存款（包括初始$100萬）。", "q_en": "Mr Wong received HK$1m remittance from abroad, deposited entire sum in HK bank. Later used part to buy shares, rest to set up restaurant. Suppose HK banks required RR 25%, no cash leakage, no excess reserves. Briefly explain deposit creation process of local banking system caused by injection of $1m. Calculate total deposits created (including initial $1m).", "bs": null, "ans_zh": ["步驟1：銀行接受王先生的$100萬存款後，第一輪貸出/投資75%，即$0.75m", "步驟2：$0.75m貸款/投資被重新存入銀行體系", "過程（步驟1→步驟2→步驟1...）持續進行，直到", "最終總存款 = 初始存款 × (1 / 儲備率) = $1m × (1 / 25%) = $4m"], "ans_en": ["Step 1: After bank accepts Mr Wong's $1m deposit, it lends out/invests 75% or $0.75m in first round", "Step 2: $0.75m loan/investment redeposited into banking system", "Process (Step 1 → Step 2 → Step 1...) goes on until", "finally total deposit created = initial deposit × (1/reserve ratio) = $1m × (1/25%) = $4m"], "tip_zh": "💡 基礎公式：最大存款=初始存款×乘數。必須寫出過程再計算結果。", "tip_en": "💡 Basic formula: max deposits = initial × multiplier. Must explain process then calculate."},
{"year": "1999/CE/I/6(a)", "marks": "4 marks", "type": "type5", "q_zh": "假設銀行法定儲備率25%，銀行A不持有超額儲備。Aaron獲得海外獎學金$10000，存入銀行A。銀行A把所有超額儲備貸給GiGi。GiGi把錢存入銀行B，但銀行B找不到借款人。計算經濟體系中創造的存款金額。", "q_en": "Suppose legal RR for banks is 25%, Bank A does not keep excess. Aaron won overseas scholarship, received remittance of $10000, deposited in Bank A. Bank A lent out all excess reserves to GiGi. She then deposited money into Bank B, but Bank B could not find any borrowers. Calculate amount of deposits thus created in the economy.", "bs": null, "ans_zh": ["銀行A收到$10000存款後，貸出超額儲備 = $10000 × (1 - 25%) = $7500", "GiGi把$7500存入銀行B", "銀行B找不到借款人，所以沒有進一步存款創造", "總存款 = $10000 + $7500 = $17500"], "ans_en": ["Bank A receives $10000 deposit, lends out excess = $10000 × (1-25%) = $7500", "GiGi deposits $7500 into Bank B", "Bank B cannot find borrowers, so no further deposit creation", "Total deposits = $10000 + $7500 = $17500"], "tip_zh": "💡 貸款需求不足會中斷存款創造過程。只有兩輪存款：初始$10000 + 第一輪貸款$7500。", "tip_en": "💡 Insufficient loan demand interrupts deposit creation. Only two rounds: initial $10000 + first loan $7500."},
{"year": "2000/CE/I/10(a)", "marks": "7 marks", "type": "type6", "q_zh": "經濟體系A的銀行體系資產負債表：現金儲備$200m、貸款$800m、存款$1000m。假設所有銀行不持有超額儲備，公眾持有$50m現金。假設公眾現在從銀行提取$10m現金。(i) 計算銀行體系總存款的變化。(ii) 計算並解釋貨幣供應的變化。", "q_en": "BS of banking system of Economy A: Cash reserves $200m, Loans $800m, Deposits $1000m. Suppose all banks do not hold excess reserves and public holds $50m cash. Suppose public now withdraws $10m cash from banks. (i) Calculate change in total deposits of banking system. (ii) Calculate with explanation change in money supply.", "bs": {"reserves": 200, "loans": 800, "deposits": 1000, "unit": "$m"}, "ans_zh": ["(i) 存款變化 = -$10m × [1 - (200 / 1000)] = -$50m", "(ii) 貨幣供應變化 = 現金變化 + 存款變化 = (+$10m) + (-$50m) = -$40m（收縮$40m）", "Answer 2（假設公眾用$50m現金償還貸款）：最大變化相同，但實際變化取決於多少現金用於償還貸款。最小變化 = -$10m。"], "ans_en": ["(i) Change in deposits = -$10m × [1-(200/1000)] = -$50m", "(ii) Change in MS = Change in cash + Change in deposits = (+$10m) + (-$50m) = -$40m (contraction of $40m)", "Answer 2 (assume public uses $50m cash to repay loans): max change same, actual depends on how much cash used. Min change = -$10m."], "tip_zh": "💡 MS=Cp+Dd。提款時Cp↑但Dd↓。注意題目是否考慮公眾用現金還款的情況。", "tip_en": "💡 MS=Cp+Dd. Withdrawal: Cp↑ but Dd↓. Note whether question considers public using cash to repay loans."},
{"year": "2001/CE/I/10(b)", "marks": "8 marks", "type": "type3", "q_zh": "銀行體系資產負債表（$m）：儲備250、貸款750、存款1000。法定儲備率20%。(i) 計算實際儲備率及超額儲備。(ii) 一名存戶提取$40m並投資海外，若所有銀行貸出剩餘超額儲備，銀行體系最大可能總存款是多少？解釋答案。", "q_en": "BS ($m): Reserves 250, Loans 750, Deposits 1000. RR 20%. (i) Calculate actual RR and excess reserves. (ii) A depositor withdraws $40m and invests overseas. If banks lend out remaining excess reserves, what is max possible total deposits? Explain.", "bs": {"reserves": 250, "loans": 750, "deposits": 1000, "unit": "$m"}, "ans_zh": ["(i) 實際儲備率 = 250 / 1000 = 0.25", "超額儲備 = (0.25 - 0.2) × $1000m = $50m", "(ii) 提款後儲備 = $250m - $40m = $210m", "新儲備可支持存款 = $210m × (1 / 20%) = $1050m"], "ans_en": ["(i) Actual RR = 250/1000 = 0.25", "Excess reserve = (0.25-0.2) × $1000m = $50m", "(ii) Reserves after withdrawal = $250m - $40m = $210m", "New reserves can back up $210m × (1/20%) = $1050m of deposits"], "tip_zh": "💡 提款後必須用新儲備量去乘乘數。投資海外=現金外流。", "tip_en": "💡 Use NEW reserves after W/D × multiplier. Overseas investment = cash leakage."},
{"year": "2002/CE/I/10(a)", "marks": "9 marks", "type": "type6", "q_zh": "銀行體系資產負債表（$mn）：儲備20、貸款80、存款100。公眾將$10m現金存入銀行。(i) 假設銀行不持有超額儲備，計算貨幣供應的最大可能變化並解釋。(ii) 列舉兩個實際變化可能小於最大值的原因。", "q_en": "BS ($mn): Reserves 20, Loans 80, Deposits 100. Public deposits $10m cash. (i) No excess reserves. Calculate max possible change in MS and explain. (ii) Give TWO reasons actual change may be less than max.", "bs": {"reserves": 20, "loans": 80, "deposits": 100, "unit": "$mn"}, "ans_zh": ["(i) 法定儲備率 = 20/100 = 0.2，乘數 = 5", "最大存款創造 = $10m × 5 = $50m", "最大貨幣供應創造 = 最大存款創造 - 公眾流通現金減少 = ($50m - $10m) = $40m", "(ii) 任何兩個：- 有現金外流 - 銀行決定持有超額儲備 - 貸款需求不足"], "ans_en": ["(i) Required RR = (20/100) = 0.2 or multiplier = 5", "Max amount of deposits created = $10m × 5 = $50m", "Max amount of money supply created = Max deposits created - decrease in cash in public circulation = ($50m - $10m) = $40m", "(ii) Any TWO: - cash leakage - banks hold excess reserves - insufficient demand for loans"], "tip_zh": "💡 MS變化=存款變化-公眾現金變化。必須寫明MS=Cp+Dd。", "tip_en": "💡 ΔMS = ΔDd - ΔCp. Must state MS = Cp + Dd."},
{"year": "2003/CE/I/11", "marks": "8 marks", "type": "type5", "q_zh": "(b) 用存款創造過程，解釋貸款需求下降如何影響銀行體系的存款創造能力。(c) 假設銀行體系有超額儲備$50m，資產負債表：儲備$250m、貸款$750m、存款$1000m。如果沒有銀行持有超額儲備，銀行體系最大可能總存款是多少？顯示計算步驟。", "q_en": "(b) Using process of deposit creation, explain how a decrease in demand for loans could affect deposit creation ability of banking system. (c) Suppose banking system has excess reserve of $50m, BS: Reserves $250m, Loans $750m, Deposits $1000m. What is max possible amount of total deposits if no banks hold excess reserves? Show workings.", "bs": {"reserves": 250, "loans": 750, "deposits": 1000, "unit": "$m"}, "ans_zh": ["(b) 步驟1：銀行可貸出的金額減少", "步驟2：重新存入銀行體系的金額減少", "正確順序：步驟1→步驟2", "因此，存款創造能力下降", "(c) 法定儲備率 = 0.2", "最大存款 = $250m × (1 / 20%) = $1250m"], "ans_en": ["(b) Step 1: loans that can be made by banks would decrease", "Step 2: money re-deposited into banking system would decrease", "Correct sequence: Step 1 → Step 2", "Therefore, deposit creation ability decreases", "(c) Legal reserve ratio = 0.2", "Max deposit = $250m × (1/20%) = $1250m"], "tip_zh": "💡 貸款需求下降→銀行貸不出→超額儲備增加→實際乘數下降。(b)部分要注意步驟順序。", "tip_en": "💡 Lower loan demand → banks can't lend → excess reserves increase → actual multiplier falls. Note sequence in (b)."},
{"year": "2004/CE/I/6(b)", "marks": "4 marks", "type": "type3", "q_zh": "經濟體系A的銀行體系資產負債表：儲備$500m、貸款$1500m、存款$2000m。公眾總是持有$50m現金。最初銀行超額儲備$100m。假設從這些銀行提取$140m存款並匯款海外。簡要解釋上述提款的存款收縮過程。", "q_en": "BS of Economy A's banking system: Reserves $500m, Loans $1500m, Deposits $2000m. Public always holds $50m cash. Initially excess reserve of banks is $100m. Suppose $140m worth of deposits withdrawn from these banks and remitted overseas. Explain briefly process of deposit contraction of the above withdrawal.", "bs": {"reserves": 500, "loans": 1500, "deposits": 2000, "unit": "$m"}, "ans_zh": ["初始提取存款", "→ 銀行失去儲備 / 儲備不足 / 實際儲備小於要求儲備", "→ 銀行須收回貸款 / 向公眾出售資產", "→ 進一步提取存款", "過程持續進行"], "ans_en": ["Initial withdrawal of deposits", "→ banks lose reserves / insufficient reserves / actual reserves smaller than required reserves", "→ banks have to call back loans / sell assets to public", "→ further withdrawals of deposits", "The process goes on and on"], "tip_zh": "💡 收縮過程必須按因果順序寫：提款→儲備不足→收回貸款→進一步提款→持續。", "tip_en": "💡 Contraction must follow causal sequence: W/D → shortage → call loans → further W/D → continues."},
{"year": "2005/CE/I/5", "marks": "4 marks", "type": "type5", "q_zh": "銀行體系資產負債表（$mn）：儲備120、貸款880、存款1000。法定儲備率10%。(a) 計算銀行體系的超額儲備金額。(b) 假設所有銀行貸出所有超額儲備，計算銀行體系最大可能總存款。", "q_en": "BS ($mn): Reserves 120, Loans 880, Deposits 1000. Legal RR 10%. (a) Calculate amount of excess reserve of banking system. (b) Suppose all banks lend out all excess reserves. Calculate maximum possible amount of total deposits in banking system.", "bs": {"reserves": 120, "loans": 880, "deposits": 1000, "unit": "$mn"}, "ans_zh": ["(a) 超額儲備 = $[120 - (1000 × 10%)]m = $20m", "(b) 最大可能銀行存款 = $120m × (1 / 10%) = $1200m"], "ans_en": ["(a) Excess reserve = $[120 - (1000 × 10%)]m = $20m", "(b) Maximum possible amount of bank deposits = $120m × (1/10%) = $1200m"], "tip_zh": "💡 有超額儲備時，最大存款=實際儲備÷法定儲備率。", "tip_en": "💡 With excess reserves, max deposits = actual reserves ÷ required RR."},
{"year": "2006/CE/I/6", "marks": "4 marks", "type": "type2", "q_zh": "銀行體系資產負債表：儲備$500、貸款$1000、存款$1500。(a) 假設銀行超額儲備$350，法定儲備率是多少？(b) 假設從銀行提取$350現金。解釋提款後銀行是否仍有超額儲備。", "q_en": "BS: Reserves $500, Loans $1000, Deposits $1500. (a) Suppose excess reserve of banks is $350. What is required reserve ratio? (b) Suppose there is a cash withdrawal of $350 from banks. Explain whether banks still have excess reserves immediately after withdrawal.", "bs": {"reserves": 500, "loans": 1000, "deposits": 1500}, "ans_zh": ["(a) 10%", "(b) 是的，因為當總存款減少到$1150（= $1500 - $350）時，只需要$115（= $1150 × 10%）的儲備來支持存款。由於儲備資產只減少到$150（= $500 - $350），仍有超額儲備$35。"], "ans_en": ["(a) 10%", "(b) Yes because when total deposits reduce to $1150 (= $1500 - $350), it only needs a reserve of $115 (= $1150 × 10%) to back up the deposits. Since reserve assets only reduce to $150 (= $500 - $350), there is still an excess reserve of $35."], "tip_zh": "💡 提款後要重新計算超額儲備=實際儲備-新存款×法定儲備率。", "tip_en": "💡 After W/D, recalculate excess = actual - new deposits × RR."},
{"year": "2007/CE/I/7", "marks": "4 marks", "type": "type3", "q_zh": "銀行體系資產負債表：儲備$1700、貸款$5800、存款$7500。法定儲備率20%。(a) 銀行體系的超額儲備是$______。(b) 假設陳先生從銀行體系提取$100，其中70%持有為現金，其餘匯款海外。(i) 銀行體系總存款的即時變化是______。(ii) 因此，整體貨幣供應的即時變化是______。", "q_en": "BS: Reserves $1700, Loans $5800, Deposits $7500. Legal RR 20%. (a) Excess reserve of banking system is $______. (b) Suppose Mr Chan withdraws $100 from banking system, of which 70% is held as cash and rest remitted overseas. (i) Immediate change in total deposits of banking system is ______. (ii) Therefore, immediate change in overall amount of money supply is ______.", "bs": {"reserves": 1700, "loans": 5800, "deposits": 7500}, "ans_zh": ["(a) $200", "(b)(i) -$100", "(b)(ii) -$30"], "ans_en": ["(a) $200", "(b)(i) -$100", "(b)(ii) -$30"], "tip_zh": "💡 注意區分即時變化和最大變化。70%持有現金=Cp↑$70，30%匯款海外=流出。MS變化=Cp變化+Dd變化=+$70-$100=-$30。", "tip_en": "💡 Distinguish immediate vs max change. 70% held as cash = Cp↑$70, 30% remitted overseas = outflow. ΔMS=ΔCp+ΔDd=+$70-$100=-$30."},
{"year": "2008/CE/I/10", "marks": "9 marks", "type": "type4", "q_zh": "政府可能減少貨幣供應以冷卻過熱經濟。銀行體系資產負債表（$million）：儲備1000、貸款4000、存款5000。假設公眾總是持有相同金額現金，銀行體系從不持有超額儲備。央行將銀行最低儲備率提高5%。(a) 簡要解釋上述儲備率變化導致的存款收縮過程。(b) 計算並解釋上述存款收縮導致的經濟體系貨幣供應變化。", "q_en": "Government may reduce MS to cool overheated economy. BS ($million): Reserves 1000, Loans 4000, Deposits 5000. Suppose public always holds same amount of cash and banking system never holds excess reserves. Central bank increases minimum RR of banks by 5%. (a) Explain briefly process of deposit contraction resulting from above change in RR. (b) Calculate and explain change in MS in economy resulting from above deposit contraction.", "bs": {"reserves": 1000, "loans": 4000, "deposits": 5000, "unit": "$million"}, "ans_zh": ["(a) 儲備率提高 → 儲備不足 / 實際儲備小於要求儲備 → 銀行須收回貸款 / 向公眾出售資產 → 提取存款 → 過程持續（直到實際儲備=要求儲備）", "(b) 新法定儲備率 = 0.2 + 0.05 = 0.25", "$1000m儲備可支持的存款 = $1000m × (1 / 25%) = $4000m", "或者：銀行存款變化 = -$250m × (1 / 25%) = -$1000m", "MS變化 = Cp變化 + Dd變化 / Cp不變 / MS=Cp+Dd", "MS變化 = -$1000m"], "ans_en": ["(a) Increase in RR → insufficient reserves / actual smaller than required → banks call back loans / sell assets to public → withdrawals of deposits → process goes on (until actual = required)", "(b) New required RR = 0.2 + 0.05 = 0.25", "Amount of bank deposits that $1000m reserve can back up = $1000m × (1/25%) = $4000m", "OR: Change of bank deposits = -$250m × (1/25%) = -$1000m", "Change in MS = Change in Cp + change in Dd / No change in Cp / MS=Cp+Dd", "Change in MS = -$1000m"], "tip_zh": "💡 提高儲備率不會即時改變儲備金額！是要求儲備增加了。收縮過程步驟順序必須正確。", "tip_en": "💡 Raising RR does NOT immediately change reserve amount! It increases REQUIRED reserves. Contraction sequence must be correct."},
{"year": "2009/CE/I/6", "marks": "4 marks", "type": "type5", "q_zh": "銀行體系資產負債表：儲備$300、貸款$700、存款$1000。法定儲備率20%。(a) 計算銀行體系的超額儲備。(b) 假設所有超額儲備都被貸出。計算銀行體系最大可能總存款。", "q_en": "BS: Reserves $300, Loans $700, Deposits $1000. Legal RR 20%. (a) Calculate excess reserve of banking system. (b) Suppose all excess reserve is loaned out. Calculate maximum possible amount of total deposits in banking system.", "bs": {"reserves": 300, "loans": 700, "deposits": 1000}, "ans_zh": ["(a) 最低要求儲備 = $1000 × 20% = $200", "超額儲備 = $100", "(b) 最大總存款 = $300 × (1 / 20%) = $1500", "或者：額外存款創造 = $100 × (1 / 20%) = $500", "因此，最大總存款 = $1000 + $500 = $1500"], "ans_en": ["(a) Minimum required reserve = $1000 × 20% = $200", "Excess reserve = $100", "(b) Total amount of deposits at maximum = $300 × (1/20%) = $1500", "OR: Amount of extra deposits created = $100 × (1/20%) = $500", "Therefore, total amount of deposits at maximum = $1000 + $500 = $1500"], "tip_zh": "💡 最大總存款=原存款+超額儲備×乘數。或直接=實際儲備÷法定儲備率。", "tip_en": "💡 Max total deposits = original + excess × multiplier. Or directly = actual reserves ÷ required RR."},
{"year": "2010/CE/I/11(b)", "marks": "7 marks", "type": "type4", "q_zh": "2008金融海嘯對A國經濟造成巨大衝擊。銀行體系資產負債表（$million）：儲備2000、貸款6000、存款8000。金融危機期間，銀行為安全起見將儲備率提高到40%，導致銀行存款變化。(i) 計算銀行存款的最大可能變化。(ii) 簡要解釋上述儲備率變化導致的存款收縮過程。", "q_en": "2008 financial tsunami had huge impact on Economy A. BS ($million): Reserves 2000, Loans 6000, Deposits 8000. During credit crisis, banks increased reserve ratio to 40% for safety, resulting in change in bank deposits. (i) Calculate maximum possible change in bank deposits. (ii) Explain briefly process of deposit contraction resulting from above change in reserve ratio.", "bs": {"reserves": 2000, "loans": 6000, "deposits": 8000, "unit": "$million"}, "ans_zh": ["(i) 銀行乘數 = 1 / 40% = 2.5", "$2000m儲備在40%儲備率下可支持的最大存款 = $2000m × (1 / 0.4) = $5000m", "因此，銀行存款最大變化 = $5000m - $8000m = -$3000m", "(ii) 儲備率提高 → 實際儲備小於期望儲備 → 銀行須收回貸款 / 出售資產 → 提取存款 → 過程持續（直到實際儲備=期望儲備）", "※注意：如果過程從「提取存款」開始，最多只給2分"], "ans_en": ["(i) Banking multiplier = 1/40% = 2.5", "Max amount of deposits that can be supported by $2000m reserve at 40% = $2000m × (1/0.4) = $5000m", "Therefore, max change in bank deposits = $5000m - $8000m = -$3000m", "(ii) Increase in reserve ratio → actual smaller than desired reserve → banks call back loans / sell assets → withdrawals of deposits → process goes on (until actual = desired)", "※Note: If process starts with 'withdrawals of deposits', award max 2 marks only"], "tip_zh": "💡 DSE經典題。銀行自發提高儲備率=央行提高法定儲備率效果相同。評分強調步驟順序。", "tip_en": "💡 DSE classic. Banks voluntarily raising RR = same as central bank raising required RR. Marking emphasizes sequence."},
{"year": "2017/DSE/I/8", "marks": "3 marks", "type": "type2", "q_zh": "銀行體系資產負債表（$million）：儲備1000、貸款2000、存款3000，有超額儲備$250。(a) 求法定儲備率。(b) 假設銀行貸出所有超額儲備，公眾不持有現金。計算存款創造後的存款變化。顯示計算步驟。", "q_en": "BS ($million): Reserves 1000, Loans 2000, Deposits 3000, has excess reserves of $250. (a) Find required reserve ratio. (b) Suppose banks lend out all excess reserves and public does not hold cash. Calculate change in deposits after credit creation. Show working.", "bs": {"reserves": 1000, "loans": 2000, "deposits": 3000, "unit": "$million"}, "ans_zh": ["(a) RRR = ($1000 - $250) / $3000 = 0.25", "(b) 存款變化 = $250 × (1 / 0.25) = $1000"], "ans_en": ["(a) RRR = ($1000 - $250) / $3000 = 0.25", "(b) Change in deposits = $250 × (1/0.25) = $1000"], "tip_zh": "💡 有超額儲備時，法定儲備率=(實際儲備-超額儲備)÷存款。", "tip_en": "💡 With excess reserves, required RR = (actual - excess) ÷ deposits."},
{"year": "2019/DSE/II/7", "marks": "5 marks", "type": "type6", "q_zh": "銀行體系資產負債表（$million）：儲備300、貸款700、存款1000。法定儲備率20%，公眾持有$200m現金。(a) 計算銀行體系的超額儲備。(b) 假設公眾不再持有現金，所有銀行貸出所有超額儲備。計算貨幣供應的最大可能變化。顯示計算步驟。", "q_en": "BS ($million): Reserves 300, Loans 700, Deposits 1000. Legal RR 20%, public holds $200m cash. (a) Calculate excess reserves of banking system. (b) Suppose public no longer holds cash and all banks lend out all excess reserves. Calculate maximum possible change in money supply. Show workings.", "bs": {"reserves": 300, "loans": 700, "deposits": 1000, "unit": "$million"}, "ans_zh": ["(a) 超額儲備 = $300m - $1000m × 20% = $100m", "(b) 原貨幣供應 = $1000m + $200m = $1200m", "新貨幣供應 = ($300m + $200m) × (1 / 20%) + $0 = $2500m", "最大可能貨幣供應變化 = $2500m - $1200m = $1300m"], "ans_en": ["(a) Excess reserves = $300m - $1000m × 20% = $100m", "(b) Old money supply = $1000m + $200m = $1200m", "New money supply = ($300m + $200m) × (1/20%) + $0 = $2500m", "Maximum possible change in money supply = $2500m - $1200m = $1300m"], "tip_zh": "💡 公眾不再持有現金=原$200m現金全部存入銀行，儲備增加$200m。MS=Cp+Dd，Cp從$200m變為0。", "tip_en": "💡 Public no longer holds cash = original $200m cash all deposited, reserves increase by $200m. MS=Cp+Dd, Cp changes from $200m to 0."},
{"year": "2021/DSE/II/6", "marks": "4 marks", "type": "type4", "q_zh": "銀行體系資產負債表（$million）：儲備600、貸款1200、存款1500。最初銀行持有$300m超額儲備，公眾總是持有$100m現金。(a) 求法定儲備率。(b) 假設法定儲備率降低5%，銀行貸出所有超額儲備。計算存款創造/收縮後的新貨幣供應。顯示計算步驟。", "q_en": "BS ($million): Reserves 600, Loans 1200, Deposits 1500. Initially banks hold excess reserves of $300m and public always holds $100m cash. (a) Find required reserve ratio. (b) Suppose required reserve ratio is reduced by 5% and banks lend out all excess reserves. Calculate new money supply after credit creation/contraction. Show workings.", "bs": {"reserves": 600, "loans": 1200, "deposits": 1500, "unit": "$million"}, "ans_zh": ["(a) 法定儲備率 = (600 - 300) / 1500 = 20%", "(b) 新法定儲備率 = 20 - 5 = 15(%)", "新存款 = 1500 + (600 - 0.15×1500) / 0.15 = 1500 + (600-225)/0.15 = 1500 + 2500 = 4000 ($million)", "新貨幣供應 = 4000 + 100 = 4100 ($million)", "※另解（誤解5%為百分比變化）：新rr=20%×(1-5%)=19%，新存款=$3157.89m，新MS=$3257.89m"], "ans_en": ["(a) Required reserve ratio = (600-300)/1500 = 20%", "(b) New required RR = 20-5 = 15(%)", "New deposit = 1500 + (600-0.15×1500)/0.15 = 4000 ($million)", "New money supply = 4000 + 100 = 4100 ($million)", "※Alternative (misread 5% as percentage change): new RR=19%, deposits=$3157.89m, MS=$3257.89m"], "tip_zh": "💡 「降低5個百分點」=20%-5%=15%，不是20%×(1-5%)。評分接受兩種理解。", "tip_en": "💡 'Reduced by 5 percentage points' = 20%-5%=15%, NOT 20%×(1-5%). Marking accepts both if explained."},
{"year": "2022/DSE/IB/8", "marks": "4 marks", "type": "type6", "q_zh": "銀行體系資產負債表（$million）：儲備1000、貸款3000、存款4000。公眾最初持有$1000m現金，銀行完全貸盡。(a) 計算法定儲備率。(b) 假設公眾只想持有$400m現金，把其餘現金存入銀行。計算貨幣供應的最大變化。顯示計算步驟。", "q_en": "BS ($million): Reserves 1000, Loans 3000, Deposits 4000. Public initially holds $1000m cash and banks are fully loaned up. (a) Calculate required reserve ratio. (b) Suppose public only wants to hold $400m cash and deposits remaining cash into banks. Calculate maximum change in money supply. Show workings.", "bs": {"reserves": 1000, "loans": 3000, "deposits": 4000, "unit": "$million"}, "ans_zh": ["(a) 25%", "(b) 原貨幣供應 = 4000 + 1000 = 5000 ($million)", "新存款 = (1000 + 600) × 1 / 25% = 6400 ($million)", "新貨幣供應 = 6400 + 400 = 6800 ($million)", "貨幣供應變化 = 6800 - 5000 = 1800 ($million)"], "ans_en": ["(a) 25%", "(b) Original money supply = 4000+1000 = 5000 ($million)", "New deposit = (1000+600) × 1/25% = 6400 ($million)", "New money supply = 6400+400 = 6800 ($million)", "Change in Ms = 6800-5000 = 1800 ($million)"], "tip_zh": "💡 公眾存款$600m：Cp減少$600m，但Dd增加$600m×乘數。MS變化=Dd變化-Cp變化。", "tip_en": "💡 Public deposits $600m: Cp falls $600m, but Dd rises $600m×multiplier. ΔMS=ΔDd-ΔCp."},
{"year": "2023/DSE/II/10(c)", "marks": "5 marks", "type": "type3", "q_zh": "2022年香港財政司司長宣布發行銀色債券供60歲或以上市民認購。銀色債券名義利率等於香港實際通脹率，最低4%。(c) 假設大量長者從銀行戶口提款購買銀色債券。(i) 描述上述提款可能導致的存款創造/收縮過程。(ii) 用一個原因解釋為什麼上述提款在現實中不一定導致存款創造/收縮。", "q_en": "In 2022, HK Financial Secretary announced issuance of Silver Bonds for citizens aged 60+. Nominal interest rate equals actual inflation rate in HK, subject to minimum of 4%. (c) Suppose a large number of senior citizens withdraw money from bank accounts to purchase Silver Bonds. (i) Describe process of deposit creation/contraction which may result from above withdrawal. (ii) Explain with ONE reason why above withdrawal does not necessarily lead to deposit creation/contraction in reality.", "bs": null, "ans_zh": ["(i) 提款 → 銀行儲備減少 → 如果銀行儲備不足，須收回貸款/出售資產 → 進一步提款 → 存款收縮過程持續", "或者：如果銀行有超額儲備，提款後仍有超額儲備，不會引發收縮", "(ii) 原因：銀行可能有足夠超額儲備應對提款 / 政府發行債券所得資金可能重新存入銀行體系 / 公眾可能用其他資金購買而不提款"], "ans_en": ["(i) Withdrawal → bank reserves decrease → if banks face reserve shortage, must call back loans/sell assets → further withdrawals → deposit contraction process continues", "OR: if banks have excess reserves, after withdrawal still have excess, no contraction triggered", "(ii) Reason: banks may have sufficient excess reserves to handle withdrawal / funds from bond issuance may be redeposited into banking system / public may use other funds to purchase without withdrawing"], "tip_zh": "💡 這題結合了貨幣政策和存款創造。注意(c)部分才是存款創造，(a)(b)是實際利率。提款不一定導致收縮，取決於銀行是否有超額儲備。", "tip_en": "💡 This question combines monetary policy and deposit creation. Note only part (c) is deposit creation. Withdrawal doesn't necessarily lead to contraction, depends on whether banks have excess reserves."},
{"year": "2024/DSE/II/8", "marks": "4 marks", "type": "type3", "q_zh": "假設在某經濟體系，公眾通過提取銀行存款增加現金持有。提款後即時，銀行體系面對$100m儲備不足。提款後資產負債表（$million）：儲備600、貸款2900、存款3500。(a) 求法定儲備率。(b) 假設法定儲備率降低5個百分點，計算存款創造/收縮後存款的最大可能變化。顯示計算步驟。", "q_en": "Suppose in an economy, public increases cash holding by withdrawing bank deposits. Immediately after withdrawal, banking system faces $100m reserve shortage. BS after W/D ($million): Reserves 600, Loans 2900, Deposits 3500. (a) Find required reserve ratio. (b) Suppose required reserve ratio is reduced by 5 percentage points. Calculate max possible change in deposits after credit creation/contraction. Show workings.", "bs": {"reserves": 600, "loans": 2900, "deposits": 3500, "unit": "$million"}, "ans_zh": ["(a) 法定儲備率 = [($600m + $100m) / $3500m] × 100% = 20%", "(b) 新法定儲備率 = 20% - 5% = 15%", "存款創造後最大存款 = $600m / 15% = $4000m", "存款最大變化 = $4000m - $3500m = $500m"], "ans_en": ["(a) Required RR = [($600m + $100m) / $3500m] × 100% = 20%", "(b) New required RR = 20% - 5% = 15%", "Max deposits after creation = $600m / 15% = $4000m", "Max change in deposits = $4000m - $3500m = $500m"], "tip_zh": "💡 「儲備不足$100m」是關鍵線索——要求儲備比實際儲備多$100m。降低儲備率會釋放儲備，引發擴張。", "tip_en": "💡 '$100m reserve shortage' is key — required reserves are $100m MORE than actual. Lowering RR releases reserves, causing expansion."}
];

// ===== 關鍵概念（10個）=====
const CONCEPTS=[
{title:"法定儲備率",en:"Required Reserve Ratio",
def:"央行規定銀行必須保留的存款比例，不能貸出。是決定最大存款乘數的關鍵因素。",
formula:"法定儲備率 = 法定要求儲備 ÷ 存款總額",
example:"1994/CE/I/5：銀行儲備$240、存款$1200，實際儲備率=20%。若無超額儲備，法定儲備率=實際儲備率=20%，最大乘數=1/20%=5。"},
{title:"實際儲備率",en:"Actual Reserve Ratio",
def:"銀行實際持有的儲備佔存款的比例。可能高於（有超額儲備）或等於法定儲備率。",
formula:"實際儲備率 = 實際儲備 ÷ 存款總額",
example:"1992/CE/II/35：儲備$200、存款$500，實際儲備率=40%。如果法定儲備率是20%，則銀行持有超額儲備。"},
{title:"超額儲備",en:"Excess Reserves",
def:"實際儲備超過法定要求儲備的部分。銀行可以選擇貸出（創造存款）或持有（防範風險）。",
formula:"超額儲備 = 實際儲備 - 存款 × 法定儲備率",
example:"2001/CE/I/10(b)：儲備$250m、存款$1000m、法定儲備率20%。超額儲備=250-1000×20%=$50m。貸出超額儲備可創造更多存款。"},
{title:"最大存款乘數",en:"Maximum Deposit Multiplier",
def:"在無超額儲備、無現金外流的理想情況下，存款創造的乘數。只取決於法定儲備率。",
formula:"最大存款乘數 = 1 ÷ 法定儲備率",
example:"2010/CE/II/35：只有法定儲備率增加會使最大乘數減小。超額儲備、現金外流、貸款需求只影響實際乘數，不影響最大乘數。"},
{title:"實際存款乘數",en:"Actual Deposit Multiplier",
def:"考慮超額儲備和現金外流後的實際乘數。通常小於最大乘數。",
formula:"實際乘數 = 1 ÷ (法定儲備率 + 超額儲備率 + 現金外流率)",
example:"2009/CE/II/38：實際乘數<最大乘數的可能原因是貸款需求不足（銀行持有超額儲備）或現金外流。"},
{title:"存款創造",en:"Deposit Creation",
def:"銀行將超額儲備貸出，貸款重新存入銀行體系，形成新一輪存款，如此循環，使總存款成倍增加。",
formula:"最大存款總額 = 初始存款 × 最大乘數",
example:"1994/CE/I/5：初始存款$100，乘數=5，最大存款總額=$500。每輪：存款→計提儲備→貸出→重新存入。"},
{title:"存款收縮",en:"Deposit Contraction",
def:"提款或提高儲備率導致銀行儲備不足，銀行收回貸款，存款被提取，如此循環，使總存款成倍減少。",
formula:"收縮後最大存款 = 提款後儲備 ÷ 法定儲備率",
example:"2010/CE/I/11(b)：儲備率從25%提高到40%，$2000m儲備只能支持$5000m存款（原$8000m），存款收縮$3000m。"},
{title:"貨幣供應",en:"Money Supply (MS)",
def:"經濟體系中的貨幣總量，包括公眾持有的現金和銀行存款。",
formula:"MS = Cp（公眾持有現金）+ Dd（銀行存款）",
example:"2019/DSE/I/28：MS=$2800=Cp+$2500→Cp=$300。公眾存款$200後：Cp=$100，Dd最大=$3500，MS=$3600，增加$800。"},
{title:"現金外流/漏出",en:"Cash Leakage",
def:"貸出的款項沒有全部重新存入銀行，部分被公眾以現金形式持有。現金外流會減少可貸出金額，降低實際乘數。",
formula:"實際乘數（有現金外流）= 1 ÷ (法定儲備率 + 現金外流率)",
example:"1999/CE/II/38：公眾持有更多現金會增加現金外流，減少存款創造。八達通/信用卡普及會減少公眾現金持有，增加存款創造。"},
{title:"100%儲備率",en:"100% Reserve Ratio",
def:"銀行必須將所有存款作為儲備，不能貸出任何款項。此時沒有存款創造，乘數=1。",
formula:"100%儲備率下：最大乘數 = 1，貸款 = 0，MS = Cp + Dd（存款只是現金的替代）",
example:"1994/CE/II/40：100%儲備率下，銀行接受存款只是Cp→Dd，MS不變。2022/DSE/I/32：100%儲備率下最大乘數=1（不是0），貨幣創造能力<部分儲備制。"}
];

  <div class="ratio-row"><label>${t("labelCL")}</label><div class="ratio-inputs"><input type="number" id="${prefix}-cl-pct" value="${cl}" step="0.01"><span>%</span><input type="number" id="${prefix}-cl-amt" value="${init*cl/100}" step="0.01"><span>$</span></div></div>`;

function cmpConHTML(prefix,bd,br,wd,rr){

function initSync(){
  ["rr","er","cl"].forEach(type=>{
    const pct=$("exp-"+type+"-pct"),amt=$("exp-"+type+"-amt"),init=$("exp-init");
    pct.addEventListener("input",()=>{amt.value=(Number(init.value)*Number(pct.value)/100).toFixed(2);runSim();});
    amt.addEventListener("input",()=>{const i=Number(init.value);if(i>0){pct.value=(Number(amt.value)/i*100).toFixed(2);runSim();}});
  });
  $("exp-init").addEventListener("input",()=>{
    const i=Number($("exp-init").value);
    ["rr","er","cl"].forEach(type=>{$("exp-"+type+"-amt").value=(i*Number($("exp-"+type+"-pct").value)/100).toFixed(2);});
    runSim();
  });
  ["con-bd","con-br","con-wd","con-rr-pct","con-er-pct","con-cl-pct","displayRounds"].forEach(id=>{
    const el=$(id);if(el)el.addEventListener("input",runSim);
  });
}
function initCmpSync(){
  ["cmp-cur","cmp-new"].forEach(p=>{
    const init=$(p+"-init");if(!init)return;
    ["rr","er","cl"].forEach(type=>{
      const pct=$(p+"-"+type+"-pct"),amt=$(p+"-"+type+"-amt");
      pct.addEventListener("input",()=>{amt.value=(Number(init.value)*Number(pct.value)/100).toFixed(2);runSim();});
      amt.addEventListener("input",()=>{const i=Number(init.value);if(i>0){pct.value=(Number(amt.value)/i*100).toFixed(2);runSim();}});
    });
    init.addEventListener("input",()=>{
      const i=Number(init.value);
      ["rr","er","cl"].forEach(type=>{$(p+"-"+type+"-amt").value=(i*Number($(p+"-"+type+"-pct").value)/100).toFixed(2);});
      runSim();
    });
    [p+"-bd",p+"-br",p+"-wd",p+"-rr-pct"].forEach(id=>{const el=$(id);if(el)el.addEventListener("input",runSim);});
  });
}
function getExp(p){return{init:Number($(p+"-init").value),rr:Number($(p+"-rr-pct").value)/100,er:Number($(p+"-er-pct").value)/100,cl:Number($(p+"-cl-pct").value)/100};}
function getCon(p){return{bd:Number($(p+"-bd").value),br:Number($(p+"-br").value),wd:Number($(p+"-wd").value),rr:Number($(p+"-rr-pct").value)/100,er:Number($(p+"-er-pct")?.value||0)/100,cl:Number($(p+"-cl-pct")?.value||0)/100};}
function calcExp(p,rounds){
  const{init,rr,er,cl}=p;
  if(rr<=0||rr>=1||er<0||er>=1||cl<0||cl>=1)return null;
  const maxDM=1/rr,maxLM=maxDM-1,actDM=1/(rr+er+cl),actLM=actDM-1;
  const totalDep=init*actDM,totalRes=totalDep*(rr+er),totalLoan=totalDep-totalRes;
  let cur=init,cumD=0,cumR=0,cumE=0,cumC=0,cumL=0,rows=[];
  for(let r=1;r<=50;r++){
    const req=cur*rr,exc=cur*er,cash=cur*cl,lend=cur-req-exc-cash;
    cumD+=cur;cumR+=req;cumE+=exc;cumC+=cash;cumL+=lend;
    if(r<=rounds)rows.push({r,newD:cur,req,exc,cash,lend});
    cur=lend;if(cur<0.01)break;
  }
  return{maxDM,maxLM,actDM,actLM,totalDep,totalRes,totalLoan,cumD,cumR,cumE,cumC,cumL,rows};
}
function calcCon(p,rounds){
  const{bd,br,wd,rr,er,cl}=p;
  if(rr<=0||rr>=1)return null;
  const actRR=bd>0?br/bd:0,d1=bd-wd,r1=br-wd,tot=rr+er+cl;
  const finalDep=tot>0?r1/tot:d1,finalRes=finalDep*(rr+er),finalLoan=finalDep-finalRes,depChg=finalDep-bd;
  let cRows=[],curD=d1,curR=r1,rn=1;
  const req1=curD*rr,sh1=curR-req1;
  let desc0;
  if(wd>0){
    desc0=t("descWithdrawD").replace(/\$\$\{wd\}/g,"$"+fmt(wd)).replace(/\$\$\{bd\}/g,"$"+fmt(bd)).replace(/\$\$\{d1\}/g,"$"+fmt(d1)).replace(/\$\$\{br\}/g,"$"+fmt(br)).replace(/\$\$\{r1\}/g,"$"+fmt(r1));
  }else{
    desc0=t("descShortfallD").replace(/\$\$\{sh\}/g,"$"+fmt(Math.abs(sh1))).replace(/\$\$\{res\}/g,"$"+fmt(curR)).replace(/\$\$\{req\}/g,"$"+fmt(req1));
  }
  cRows.push({r:rn,curD,req:req1,res:curR,sh:sh1,call:0,desc:desc0});
  while(rn<rounds&&curD*rr>curR+0.01){
    rn++;const req=curD*rr,short=req-curR,call=Math.min(short,curD*0.5);
    curD-=call;const nreq=curD*rr,nsh=curR-nreq;
    let descC=t("descContractionD").replace(/\$\$\{call\}/g,"$"+fmt(call)).replace(/\$\$\{curD\}/g,"$"+fmt(curD)).replace(/\$\$\{res\}/g,"$"+fmt(curR));
    cRows.push({r:rn,curD,req:nreq,res:curR,sh:nsh,call,desc:descC});
  }
  if(cRows.length<rounds&&Math.abs(curD-finalDep)>1){
    rn++;
    let descB=t("descBalanceD").replace(/\$\$\{res\}/g,"$"+fmt(finalRes)).replace(/\$\$\{curD\}/g,"$"+fmt(finalDep)).replace(/\$\{rr\}/g,(rr*100).toFixed(1));
    cRows.push({r:rn,curD:finalDep,req:finalDep*rr,res:finalRes,sh:0,call:curD-finalDep,desc:descB});
  }
  return{bd,br,actRR,wd,d1,r1,finalDep,finalRes,finalLoan,depChg,maxDM:1/rr,actDM:tot>0?1/tot:0,rr,er,cl,cRows};
}
function renderBS(dep,res,loan){
  return `<table class="bs-table"><tr><th>${t("assets")}</th><th>${t("amount")}</th><th>${t("liabilities")}</th><th>${t("amount")}</th></tr>
  <tr><td>${t("totalReservesBS")}</td><td>$${fmt(res)}</td><td>${t("totalDepositsBS")}</td><td>$${fmt(dep)}</td></tr>
  <tr><td>${t("totalLoansBS")}</td><td>$${fmt(loan)}</td><td></td><td></td></tr>
  <tr><th>${t("totalAssets")}</th><th>$${fmt(res+loan)}</th><th>${t("totalLiabilities")}</th><th>$${fmt(dep)}</th></tr></table>`;
}
function renderProcTable(d){
  let h=`<table><thead><tr><th>${t("thRound")}</th><th>${t("thNewDep")}</th><th>${t("thReqRes")}</th><th>${t("thExcessRes")}</th><th>${t("thCashLeak")}</th><th>${t("thLend")}</th><th>${t("thDesc")}</th></tr></thead><tbody>`;
  d.rows.forEach((row,i)=>{
    let desc=i===0?t("descFirstD"):t("descOtherD");
    desc=desc.replace(/\$\$\{newD\}/g,"$"+fmt(row.newD)).replace(/\$\$\{req\}/g,"$"+fmt(row.req)).replace(/\$\$\{exc\}/g,"$"+fmt(row.exc)).replace(/\$\$\{cash\}/g,"$"+fmt(row.cash)).replace(/\$\$\{lend\}/g,"$"+fmt(row.lend));
    h+=`<tr><td>${row.r}</td><td>$${fmt(row.newD)}</td><td>$${fmt(row.req)}</td><td>$${fmt(row.exc)}</td><td>$${fmt(row.cash)}</td><td>$${fmt(row.lend)}</td><td>${desc}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td>${t("totalRow")}</td><td>$${fmt(d.cumD)}</td><td>$${fmt(d.cumR)}</td><td>$${fmt(d.cumE)}</td><td>$${fmt(d.cumC)}</td><td>$${fmt(d.cumL)}</td><td></td></tr></tfoot></table>`;
  return h;
}
function renderConTable(d){
  let h=`<h4>${t("contractionProcessTitle")}</h4><table><thead><tr><th>${t("thRound")}</th><th>${t("thCurDep")}</th><th>${t("thReqReserve")}</th><th>${t("thActReserve")}</th><th>${t("thShortfall")}</th><th>${t("thCallLoan")}</th><th>${t("thDesc")}</th></tr></thead><tbody>`;
  d.cRows.forEach(row=>{
    const sh=row.sh>=0?`+$${fmt(row.sh)}`:`-$${fmt(Math.abs(row.sh))}`;
    const cls=row.sh>=0?"change-down":"change-up";
    h+=`<tr><td>${row.r}</td><td>$${fmt(row.curD)}</td><td>$${fmt(row.req)}</td><td>$${fmt(row.res)}</td><td class="${cls}">${sh}</td><td>$${fmt(row.call)}</td><td>${row.desc}</td></tr>`;
  });
  h+=`</tbody></table>`;return h;
}
function runSim(){
  const rounds=Math.max(1,Math.min(50,Number($("displayRounds").value)||20));
  let h="";
  if(curMode==="expansion"){
    const d=calcExp(getExp("exp"),rounds);
    if(!d){h=`<div class="box"><p class="error">${t("errorMsg")}</p></div>`;$("output").innerHTML=h;return;}
    h=`<div class="box"><div class="multiplier-grid">
      <div class="multi-card max"><h4>${t("maxMultTitle")}</h4><p>${t("maxDepMult")}<strong>${d.maxDM.toFixed(3)}</strong></p><p>${t("maxLoanMult")}<strong>${d.maxLM.toFixed(3)}</strong></p></div>
      <div class="multi-card"><h4>${t("actualMultTitle")}</h4><p>${t("actualDepMult")}<strong>${d.actDM.toFixed(3)}</strong></p><p>${t("actualLoanMult")}<strong>${d.actLM.toFixed(3)}</strong></p></div></div>
      <h4>${t("bsTitleCurrent")}</h4>${renderBS(d.totalDep,d.totalRes,d.totalLoan)}
      <h4>${t("processTitle")}</h4>${renderProcTable(d)}</div>`;
    if(cmpOn){
      const c=calcExp(getExp("cmp-cur"),rounds),n=calcExp(getExp("cmp-new"),rounds);
      if(c&&n){
        h+=`<div class="box"><h3>${t("comparisonTitle")}</h3><table class="comparison-table"><thead><tr><th>${t("indicator")}</th><th>${t("currentVal")}</th><th>${t("newVal")}</th><th>${t("change")}</th></tr></thead><tbody>
        <tr><td>${t("depMult")}</td><td>${c.actDM.toFixed(3)}</td><td>${n.actDM.toFixed(3)}</td><td>${n.actDM-c.actDM>=0?'+':''}${(n.actDM-c.actDM).toFixed(3)}</td></tr>
        <tr><td>${t("totalDeposit")}</td><td>$${fmt(c.totalDep)}</td><td>$${fmt(n.totalDep)}</td><td class="${n.totalDep-c.totalDep>=0?'change-up':'change-down'}">${n.totalDep-c.totalDep>=0?'+':''}$${fmt(n.totalDep-c.totalDep)}</td></tr>
        <tr><td>${t("totalLoan")}</td><td>$${fmt(c.totalLoan)}</td><td>$${fmt(n.totalLoan)}</td><td class="${n.totalLoan-c.totalLoan>=0?'change-up':'change-down'}">${n.totalLoan-c.totalLoan>=0?'+':''}$${fmt(n.totalLoan-c.totalLoan)}</td></tr>
        </tbody></table></div>`;
      }
    }
  }else{
    const d=calcCon(getCon("con"),rounds);
    if(!d){h=`<div class="box"><p class="error">${t("errorMsg")}</p></div>`;$("output").innerHTML=h;return;}
    const bl=d.bd-d.br,la=d.d1-d.r1;
    h=`<div class="box"><h3>${t("contractionTitle")}</h3><p><strong>${t("actualRR")}：</strong>${(d.actRR*100).toFixed(2)}%</p>
      <div class="contraction-stages">
      <div class="stage-card"><h5>${t("stageBaseline")}</h5><p>${t("totalDepositsBS")}: $${fmt(d.bd)}</p><p>${t("totalReservesBS")}: $${fmt(d.br)}</p><p>${t("totalLoansBS")}: $${fmt(bl)}</p></div>
      <div class="stage-card"><h5>${t("stageAfterWithdraw")}</h5><p>${t("totalDepositsBS")}: $${fmt(d.d1)}</p><p>${t("totalReservesBS")}: $${fmt(d.r1)}</p><p>${t("totalLoansBS")}: $${fmt(la)}</p></div>
      <div class="stage-card stage-final"><h5>${t("stageFinal")}</h5><p>${t("totalDepositsBS")}: $${fmt(d.finalDep)}</p><p>${t("totalReservesBS")}: $${fmt(d.finalRes)}</p><p>${t("totalLoansBS")}: $${fmt(d.finalLoan)}</p></div></div>
      <p><strong>${t("change")}：</strong><span class="${d.depChg<0?'change-down':'change-up'}">$${fmt(d.depChg)}</span></p>
      <p>${t("maxDepMult")}<strong>${d.maxDM.toFixed(3)}</strong>　${t("actualDepMult")}<strong>${d.actDM.toFixed(3)}</strong></p>
      ${renderConTable(d)}
      <h4>${t("bsTitleCurrent")}</h4>${renderBS(d.finalDep,d.finalRes,d.finalLoan)}</div>`;
    if(cmpOn){
      const c=calcCon(getCon("cmp-cur"),rounds),n=calcCon(getCon("cmp-new"),rounds);
      if(c&&n){
        h+=`<div class="box"><h3>${t("comparisonTitle")}</h3><table class="comparison-table"><thead><tr><th>${t("indicator")}</th><th>${t("currentVal")}</th><th>${t("newVal")}</th><th>${t("change")}</th></tr></thead><tbody>
        <tr><td>${t("totalDeposit")}</td><td>$${fmt(c.finalDep)}</td><td>$${fmt(n.finalDep)}</td><td class="${n.finalDep-c.finalDep>=0?'change-up':'change-down'}">${n.finalDep-c.finalDep>=0?'+':''}$${fmt(n.finalDep-c.finalDep)}</td></tr>
        <tr><td>${t("totalReserve")}</td><td>$${fmt(c.finalRes)}</td><td>$${fmt(n.finalRes)}</td><td class="${n.finalRes-c.finalRes>=0?'change-up':'change-down'}">${n.finalRes-c.finalRes>=0?'+':''}$${fmt(n.finalRes-c.finalRes)}</td></tr>
        </tbody></table></div>`;
      }
    }
  }
  h+=`<div class="box note"><strong>${t("noteTitle")}</strong>${t("noteContent")}</div>`;
  $("output").innerHTML=h;
  renderSkill();
}

  // 重置渲染狀態（參數變化時重新渲染）
  skillTabRendered=[false,false,false,false,false];
  mcqPage=0;structPage=0;
  
  // 只渲染當前激活的標籤頁
  const activeIdx=Array.from(document.querySelectorAll('.skill-tab')).findIndex(t=>t.classList.contains('active'));
  renderSkillTab(activeIdx>=0?activeIdx:0);
}

function renderSkillTab(idx){
  if(idx===0)renderStepsTab();
  else if(idx===1)renderFormulaTab();
  else if(idx===2)renderExamTab();
  else if(idx===3)renderErrorTab();
  else if(idx===4)renderConceptTab();
  skillTabRendered[idx]=true;
}

function switchSkillTab(idx){
  document.querySelectorAll(".skill-tab").forEach((t,i)=>t.classList.toggle("active",i===idx));
  document.querySelectorAll(".skill-tab-content").forEach((c,i)=>c.classList.toggle("active",i===idx));
  if(!skillTabRendered[idx])renderSkillTab(idx);
}

// 標籤頁1：答題步驟
function renderStepsTab(){
  const steps=[
    {title:t("type1"),steps:["辨認題目屬於基礎存款創造（無超額儲備、無現金外流）","從資產負債表計算實際儲備率 = 儲備 ÷ 存款","計算最大存款乘數 = 1 ÷ 法定儲備率（或實際儲備率）","計算最大存款總額 = 初始存款 × 乘數","若問貨幣供應變化：MS = Cp + Dd，注意Cp是否變化"]},
    {title:t("type2"),steps:["從資產負債表計算實際儲備率 = 儲備 ÷ 存款","計算超額儲備 = 實際儲備 - 存款 × 法定儲備率","判斷是否有超額儲備（實際 > 法定）","若貸出超額儲備：可創造存款 = 超額儲備 × 乘數","注意：實際乘數 = 1 ÷ 實際儲備率，可能小於最大乘數"]},
    {title:t("type3"),steps:["確認提款金額，更新提款後的儲備和存款（兩者同時減少提款額）","計算提款後儲備 = 原儲備 - 提款額","計算提款後存款 = 原存款 - 提款額","計算最大存款 = 提款後儲備 ÷ 法定儲備率","計算存款變化 = 最大存款 - 原存款","若問貨幣供應：MS變化 = Cp變化 + Dd變化"]},
    {title:t("type4"),steps:["確認新法定儲備率（提高後）","計算新要求儲備 = 存款 × 新法定儲備率","判斷是否儲備不足（實際儲備 < 新要求儲備）","解釋收縮過程：儲備不足 → 收回貸款/出售資產 → 存款被提取 → 持續直至平衡","計算最大存款 = 實際儲備 ÷ 新法定儲備率","計算存款變化 = 新最大存款 - 原存款","注意：步驟順序必須正確，否則不給分"]},
    {title:t("type5"),steps:["計算超額儲備 = 實際儲備 - 存款 × 法定儲備率","確認所有銀行貸出超額儲備，所有貸款重新存入","計算可創造存款 = 超額儲備 × 乘數","計算最終總存款 = 原存款 + 可創造存款","儲備總額在過程中不變（因為所有貸款重新存入）","最終貸款 = 最終存款 - 儲備總額"]},
    {title:t("type6"),steps:["確認貨幣供應定義：MS = Cp（公眾現金）+ Dd（銀行存款）","判斷Cp是否變化（提款→Cp↑；存款→Cp↓）","計算Dd變化（存款創造/收縮後的存款變化）","計算MS變化 = ΔCp + ΔDd","注意：若題目說「公眾持有固定現金」，則ΔCp=0","若為外國流入/新印貨幣，Cp不變，MS變化=存款變化"]}
  ];
  let sh=`<h4>${t("stepsTitle")}</h4>`;
  steps.forEach(s=>{
    sh+=`<div class="type-group-title">${s.title}</div><ol style="padding-left:20px;line-height:1.8;font-size:14px;">`;
    s.steps.forEach(st=>{sh+=`<li>${st}</li>`;});
    sh+=`</ol>`;
  });
  $("tabcontent-0").innerHTML=sh;
}

// 標籤頁2：公式速查
function renderFormulaTab(){
  let fh="";
  for(let i=1;i<=8;i++){fh+=`<div class="formula-card"><div class="formula-title">${t("formulaTitle"+i)}</div><span class="formula-text">${t("formulaText"+i)}</span></div>`;}
  $("tabcontent-1").innerHTML=fh;
}

// 標籤頁3：歷屆真題（分頁 + 折疊）
function renderExamTab(){
  let eh=`<h4>${t("mcqTitle")}</h4><div class="mcq-filter">
    <button class="${mcqFilter===0?'active':''}" onclick="setMcqFilter(0)">${t("filterAll")}</button>`;
  for(let i=1;i<=6;i++){eh+=`<button class="${mcqFilter===i?'active':''}" onclick="setMcqFilter(${i})">${t("type"+i)}</button>`;}
  eh+=`</div>`;
  
  // MC題分頁
  const filtered=mcqFilter===0?MCQ:MCQ.filter(m=>m.t===mcqFilter);
  const mcqTotalPages=Math.ceil(filtered.length/MCQ_PER_PAGE);
  if(mcqPage>=mcqTotalPages)mcqPage=0;
  const mcqStart=mcqPage*MCQ_PER_PAGE;
  const mcqEnd=Math.min(mcqStart+MCQ_PER_PAGE,filtered.length);
  
  for(let i=mcqStart;i<mcqEnd;i++){
    const m=filtered[i];
    const globalIdx=i;
    eh+=`<div class="mcq-item"><div class="mcq-year">${m.y}</div><div class="mcq-q">${m.q}</div><ul class="mcq-options">`;
    m.o.forEach((op,j)=>{eh+=`<li>${String.fromCharCode(65+j)}. ${op}</li>`;});
    eh+=`</ul><button class="toggle-answer" onclick="toggleMcqAns(${globalIdx},this)">${t("showAnswer")}</button>
    <div class="mcq-ans-area" id="mcq-ans-${globalIdx}" style="display:none;"><span class="mcq-ans-label">答案：${m.a}</span><div class="mcq-explain">${m.e}</div></div></div>`;
  }
  
  // MC題分頁按鈕
  if(mcqTotalPages>1){
    eh+=`<div class="pagination">`;
    eh+=`<button class="page-btn" ${mcqPage===0?'disabled':''} onclick="goMcqPage(${mcqPage-1})">←</button>`;
    eh+=`<span class="page-info">${mcqPage+1} / ${mcqTotalPages}</span>`;
    eh+=`<button class="page-btn" ${mcqPage===mcqTotalPages-1?'disabled':''} onclick="goMcqPage(${mcqPage+1})">→</button>`;
    eh+=`</div>`;
  }
  
  // 結構題分頁
  eh+=`<div class="section-divider" style="border-top:2px dashed #cbd5e1;margin:24px 0;padding-top:8px;"></div><h4>${t("structTitle")}（${STRUCTS.length}題）</h4>`;
  const structTotalPages=Math.ceil(STRUCTS.length/STRUCT_PER_PAGE);
  if(structPage>=structTotalPages)structPage=0;
  const structStart=structPage*STRUCT_PER_PAGE;
  const structEnd=Math.min(structStart+STRUCT_PER_PAGE,STRUCTS.length);
  const isZh=curLang==="zh-HK"||curLang==="zh-CN";
  
  for(let i=structStart;i<structEnd;i++){
    const sq=STRUCTS[i];
    const q=isZh?sq.q_zh:sq.q_en,ans=isZh?sq.ans_zh:sq.ans_en,tip=isZh?sq.tip_zh:sq.tip_en;
    let bsHTML="";
    if(sq.bs){
      const unit=sq.bs.unit||"$";
      bsHTML=`<div class="exam-bs"><table class="bs-table" style="max-width:500px;">
      <tr><th>${t("assets")}</th><th>${t("amount")}</th><th>${t("liabilities")}</th><th>${t("amount")}</th></tr>
      <tr><td>${t("totalReservesBS")}</td><td>${unit}${sq.bs.reserves.toLocaleString()}</td><td>${t("totalDepositsBS")}</td><td>${unit}${sq.bs.deposits.toLocaleString()}</td></tr>
      <tr><td>${t("totalLoansBS")}</td><td>${unit}${sq.bs.loans.toLocaleString()}</td><td></td><td></td></tr>
      <tr><th>${t("totalAssets")}</th><th>${unit}${(sq.bs.reserves+sq.bs.loans).toLocaleString()}</th><th>${t("totalLiabilities")}</th><th>${unit}${sq.bs.deposits.toLocaleString()}</th></tr>
    </table></div>`;
    }
    eh+=`<div class="exam-question"><div class="exam-year">${sq.year}<span class="exam-type">${sq.marks}</span></div><div class="exam-text">${q}</div>
    ${bsHTML}
    <button class="toggle-answer" onclick="toggleStructAns(this)">${t("showAnswer")}</button>
    <div class="exam-answer" style="display:none;">${ans.map(a=>`<div class="ans-step">${a}</div>`).join('')}<div class="ans-tip">${tip}</div></div></div>`;
  }
  
  // 結構題分頁按鈕
  if(structTotalPages>1){
    eh+=`<div class="pagination">`;
    eh+=`<button class="page-btn" ${structPage===0?'disabled':''} onclick="goStructPage(${structPage-1})">←</button>`;
    eh+=`<span class="page-info">${structPage+1} / ${structTotalPages}</span>`;
    eh+=`<button class="page-btn" ${structPage===structTotalPages-1?'disabled':''} onclick="goStructPage(${structPage+1})">→</button>`;
    eh+=`</div>`;
  }
  
  $("tabcontent-2").innerHTML=eh;
}

function goMcqPage(page){
  mcqPage=page;
  renderExamTab();
}

function goStructPage(page){
  structPage=page;
  renderExamTab();
}

function setMcqFilter(f){mcqFilter=f;mcqPage=0;renderExamTab();switchSkillTab(2);}

function toggleMcqAns(idx,btn){
  const el=$("mcq-ans-"+idx);
  if(!el)return;
  const isShow=el.style.display==="block";
  el.style.display=isShow?"none":"block";
  btn.innerText=isShow?t("showAnswer"):t("hideAnswer");
}

function toggleStructAns(btn){
  const ans=btn.nextElementSibling;
  const isShow=ans.style.display==="block";
  ans.style.display=isShow?"none":"block";
  btn.innerText=isShow?t("showAnswer"):t("hideAnswer");
}

// 標籤頁4：常見錯誤
function renderErrorTab(){
  const errors=[
    ["把「實際儲備率」當成「法定儲備率」直接用","先從資產負債表計算實際儲備率 = 儲備÷存款，再與法定儲備率比較"],
    ["提款時只減存款不減儲備（或只減儲備不減存款）","提款會同時減少銀行的儲備和存款，兩者都要更新"],
    ["解釋收縮過程時步驟順序錯亂","必須按因果鏈順序：儲備不足→收回貸款→存款被提→繼續循環，順序錯不給分"],
    ["計算貨幣供應變化時直接寫答案，不說明假設","必須寫明 MS = Cp + Dd，並說明 Cp 是否變化"],
    ["超額儲備計算公式用錯","超額儲備 = 實際儲備 - 存款 × 法定儲備率，不要用初始存款去乘"],
    ["以為「最大存款乘數」等於「實際存款乘數」","最大乘數=1/法定儲備率；實際乘數=1/(法定+超額+現金外流)，實際更小"],
    ["提高儲備率時，以為儲備金額會改變","提高法定儲備率不會即時改變儲備金額，只會令「實際儲備 < 要求儲備」"],
    ["計算提款後最大存款時，用原儲備去乘乘數","必須用「提款後的儲備」= 原儲備 - 提款額，再除以儲備率"],
    ["以為公眾持有現金增加會增加貨幣供應","公眾從銀行提款：Cp↑但Dd↓，若銀行收縮，MS可能不變甚至減少"],
    ["結構題只寫答案不寫步驟","DSE結構題按步驟給分，必須寫出公式→代入數字→結果"]
  ];
  let eh2=`<h4>${t("errorTitle")}</h4><ul class="error-list">`;
  errors.forEach(e=>{eh2+=`<li><span class="wrong">✗ ${e[0]}</span><br><span class="right">✓ ${e[1]}</span></li>`;});
  eh2+=`</ul>`;
  $("tabcontent-3").innerHTML=eh2;
}

// 標籤頁5：關鍵概念
function renderConceptTab(){
  let ch=`<h4>${t("conceptTitle")}</h4>`;
  CONCEPTS.forEach(c=>{
    ch+=`<div class="concept-card"><div class="concept-title">${c.title}<span class="concept-en">${c.en}</span></div>
      <p><strong>${t("conceptDef")}：</strong>${c.def}</p>
      <div class="concept-formula"><strong>${t("conceptFormula")}：</strong>${c.formula}</div>
      <div class="concept-example"><strong>${t("conceptExample")}：</strong>${c.example}</div></div>`;
  });
  $("tabcontent-4").innerHTML=ch;
}

function toggleSkill(){
  $("skill-content").classList.toggle("show");
  $("skill-toggle").classList.toggle("open");
  // 第一次展開時渲染當前標籤頁
  if($("skill-content").classList.contains("show")){
    const activeIdx=Array.from(document.querySelectorAll('.skill-tab')).findIndex(t=>t.classList.contains('active'));
    if(!skillTabRendered[activeIdx])renderSkillTab(activeIdx);
  }
}

function switchLanguage(lang){
  const langMap={'zh-hk':'zh-HK','zh-cn':'zh-CN','en':'en'};
  const targetLang=langMap[lang]||lang;
  curLang=targetLang;
  if(i18nReady)i18next.changeLanguage(targetLang);
  document.title=t("htmlTitle");
  $("page-title").innerText=t("pageTitle");
  $("assumption-text").innerText=t("assumption");
  $("label-rounds").innerText=t("labelRounds");
  $("btn-run").innerText=t("btnRun");
  $("skill-title").innerText=t("skillTitle");
  $("tab-0").innerText=t("tabSteps");
  $("tab-1").innerText=t("tabFormula");
  $("tab-2").innerText=t("tabExam");
  $("tab-3").innerText=t("tabError");
  $("tab-4").innerText=t("tabConcept");
  $("mode-expansion").innerText=t("modeExpansion");
  $("mode-contraction").innerText=t("modeContraction");
  $("toggle-compare").innerText=cmpOn?t("toggleCompareOff"):t("toggleCompareOn");
  $("title-current").innerText=t("titleCurrent");
  $("title-new").innerText=t("titleNew");
  $("label-init-e").innerText=t("labelInit");
  $("label-rr-e").innerText=t("labelRR");
  $("label-er-e").innerText=t("labelER");
  $("label-cl-e").innerText=t("labelCL");
  $("label-bd").innerText=t("labelBaselineDep");
  $("label-br").innerText=t("labelBaselineRes");
  $("label-wd").innerText=t("labelWithdrawal");
  $("label-rr-c").innerText=t("labelRRC");
  $("label-er-c").innerText=t("labelERC");
  $("label-cl-c").innerText=t("labelCLC");
  document.querySelectorAll(".lang-bar button").forEach(b=>b.classList.remove("active"));
  $("btn-"+lang).classList.add("active");
  if(cmpOn)renderCmpParams();
  runSim();
}
// 頁面初始化（i18next就緒後執行）
function initApp(){
  initSync();
  const params=new URLSearchParams(window.location.search);
  const lang=params.get("lang");
  const validLangs=['zh-hk','zh-cn','en'];
  switchLanguage(validLangs.includes(lang)?lang:'zh-hk');
}
window.onload=function(){
  if(i18nReady)initApp();
  // 否則等待i18next回調調用initApp
};
</script>
