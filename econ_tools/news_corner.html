<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>新聞角</title>
<style>
:root{
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1e40af;
  --danger:#dc2626;--success:#16a34a;--warning:#f59e0b;--purple:#7c3aed;
  --bg:#f7f9fc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text-light:#64748b;
  --radius:12px;--shadow:0 2px 8px rgba(0,0,0,.06);--shadow-hover:0 8px 24px rgba(37,99,235,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,#f0f4ff 0%,#f7f9fc 50%,#fef3c7 100%);min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 64px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:28px;flex:1;background:linear-gradient(135deg,var(--primary),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.back,.ghost,.primary,.danger{border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 14px}
.back,.ghost{border:1px solid var(--border);background:#fff;color:var(--primary-dark)}
.primary{border:0;background:var(--primary);color:#fff}
.primary:hover{background:var(--primary-dark)}
.danger{border:1px solid #fecaca;background:#fff;color:var(--danger)}
button:disabled{opacity:.6;cursor:wait}
.lang button{padding:8px 14px;border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;font-weight:600}
.lang button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.lead{margin:0 0 16px;color:var(--text-light);line-height:1.6}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.bar input[type="search"]{flex:1;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;cursor:pointer;color:var(--text-light)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.panel h2{margin:0 0 8px;font-size:18px}
.hint{margin:0 0 12px;color:var(--text-light);font-size:13px;line-height:1.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:1 / -1}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--primary-dark)}
input[type="text"],input[type="url"],input[type="date"],input[type="password"],select,textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;font-weight:500;color:var(--text);background:#fff
}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.url-row{display:flex;gap:8px}
.url-row input{flex:1}
.check{flex-direction:row;align-items:center;font-weight:600;color:var(--text)}
.proposal{max-height:240px;overflow:auto;background:#fff;border-radius:8px;padding:10px 12px;line-height:1.65;white-space:pre-wrap;margin:0 0 8px}
.review{margin-top:12px;padding:12px;border:1px solid var(--primary);border-radius:8px;background:var(--primary-light)}
.review h3{margin:0 0 8px;font-size:15px;color:var(--primary-dark)}
.review .hint{margin:0 0 10px}
.status.bad{color:var(--danger)}
.who{margin-left:auto;color:var(--text-light);font-size:13px;font-weight:700}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--warning),var(--success))}
.card.econ::before{background:linear-gradient(var(--primary),var(--purple))}
.card.bafs::before{background:linear-gradient(var(--success),var(--primary))}
.card-body{padding:16px 16px 14px 18px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--bg);color:var(--text-light)}
.tag.econ{background:var(--primary-light);color:var(--primary-dark)}
.tag.bafs{background:#ecfdf5;color:#166534}
.tag.pin{background:#fff7ed;color:#c2410c}
.card h3{margin:0 0 6px;font-size:20px;line-height:1.35}
.by{margin:0 0 8px;color:var(--text-light);font-size:13px}
.sum{margin:0 0 .85em;line-height:1.75;white-space:pre-wrap}
.ask{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--primary-light);color:var(--primary-dark);line-height:1.55}
.ask b{display:block;font-size:12px;letter-spacing:.04em;margin-bottom:4px}
.shots{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.shots a{display:block}
.shot{display:block;width:100%;max-height:440px;object-fit:contain;background:#f8fafc;border-radius:8px}
.disclaimer{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:#fff7ed;color:#9a3412;font-size:12px;line-height:1.55}
.xref{margin-top:12px;border:1px dashed var(--border);border-radius:8px;padding:8px 12px;background:#f8fafc}
.xref summary{cursor:pointer;font-weight:800;color:var(--primary-dark)}
.xref p{margin:.7em 0 0;line-height:1.7;white-space:pre-wrap}
.file-field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--primary-dark)}
.file-field input{font-weight:500}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb-card{position:relative}
.thumb-card img{width:132px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:#f8fafc}
.thumb-card button{position:absolute;top:4px;right:4px;min-height:26px;padding:2px 6px;font-size:11px}
.source-text{max-height:280px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions a,.actions button{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--text-light);background:#fff;border:1px dashed var(--border);border-radius:var(--radius)}
.lang-mini button{padding:4px 8px;min-height:28px;font-size:12px}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .top h1{font-size:24px}
  .who{margin-left:0}
}
</style>
</head>

<div class="wrap">
  <div class="top">
    <a class="back" id="home-link" href="../index.html?sec=tools">←</a>
    <h1 id="page-title">新聞角</h1>

    <button type="button" class="chip" data-filter="bafs" id="filter-bafs">BAFS</button>
    <input type="search" id="q" autocomplete="off">
    <span class="who" id="who" hidden></span>
    <button type="button" class="ghost" id="btn-teacher"></button>
    <button type="button" class="ghost" id="btn-logout" hidden></button>
    <button type="button" class="primary" id="btn-add" hidden></button>
  </div>

  <form class="panel" id="login-box" hidden autocomplete="off">
    <h2 id="login-title"></h2>
    <p class="hint" id="login-hint"></p>
    <div class="grid">
      <label><span id="lab-account"></span><input id="login-account" type="text" autocomplete="username"></label>
      <label><span id="lab-password"></span><input id="login-password" type="password" autocomplete="current-password"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" type="submit" id="btn-login"></button>
      <button class="ghost" type="button" id="btn-login-cancel"></button>
    </div>
    <p class="status" id="login-status" role="status"></p>
  </form>

  <form class="panel" id="editor" hidden>
    <h2 id="editor-title"></h2>
    <p class="hint" id="editor-hint"></p>
    <div class="url-row">
      <input id="f-url" type="url" inputmode="url" placeholder="https://">
      <button class="ghost" type="button" id="btn-preview"></button>
    </div>
    <div class="review" id="sum-review" hidden>
      <h3 id="review-title"></h3>
      <div class="proposal" id="sum-proposal"></div>
      <h3 id="review-body-title"></h3>
      <div class="proposal source-text" id="body-proposal"></div>
      <p class="hint" id="review-note"></p>
      <div class="row">
        <button class="primary" type="button" id="btn-sum-yes"></button>
        <button class="ghost" type="button" id="btn-sum-no"></button>
      </div>
    </div>
    <div class="grid" style="margin-top:12px">
      <label><span id="lab-source"></span><input id="f-source" type="text" maxlength="80"></label>
      <label><span id="lab-writer"></span><input id="f-writer" type="text" maxlength="80"></label>
      <label><span id="lab-date"></span><input id="f-date" type="date"></label>
      <label><span id="lab-subject"></span>
        <select id="f-subject">
          <option value="both"></option>
          <option value="econ">ECON</option>
          <option value="bafs">BAFS</option>
        </select>
      </label>
      <label class="check"><input id="f-pin" type="checkbox"><span id="lab-pin"></span></label>
      <label><span id="lab-title-zh"></span><input id="f-title-zh" type="text" maxlength="180"></label>
      <label><span id="lab-title-en"></span><input id="f-title-en" type="text" maxlength="180"></label>
      <label><span id="lab-sum-zh"></span><textarea id="f-sum-zh" maxlength="8000"></textarea></label>
      <label><span id="lab-sum-en"></span><textarea id="f-sum-en" maxlength="8000"></textarea></label>
      <label><span id="lab-prompt-zh"></span><textarea id="f-prompt-zh" maxlength="300"></textarea></label>
      <label><span id="lab-prompt-en"></span><textarea id="f-prompt-en" maxlength="300"></textarea></label>
      <div class="span2 file-field">
        <span id="lab-images"></span>
        <input id="f-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif,.png,.jpg,.jpeg,.webp,.gif">
        <div class="thumbs" id="image-list"></div>
        <p class="hint" id="image-hint"></p>
      </div>
    </div>
    <textarea id="f-body-zh" hidden></textarea>
    <textarea id="f-body-en" hidden></textarea>
    <div class="row" style="margin-top:12px">
      <button class="ghost" type="button" id="btn-translate"></button>
      <button class="primary" type="submit" id="btn-save"></button>
      <button class="ghost" type="button" id="btn-cancel"></button>
    </div>
    <p class="disclaimer" id="translate-disclaimer"></p>
    <p class="status" id="edit-status" role="status"></p>
  </form>

  <p class="status" id="page-status" role="status"></p>
  <div class="list" id="list"></div>
</div>

let lang = "zh-HK";
let items = [];
let filter = "all";
let editingId = "";
let pendingText = null;
let pageSignedOut = false;
let cardLang = {};

function t(key) { return (COPY[lang] && COPY[lang][key]) || key; }
function $(id) { return document.getElementById(id); }

function readLang() {
  const q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase();
  if (q === "en") return "en";
  if (q === "zh-hk" || q === "zh") return "zh-HK";
  try {
    if (localStorage.getItem("dse-econ-bafs-lang") === "en") return "en";
  } catch {}
  return "zh-HK";
}

function readSession() {
  try {
    const raw = JSON.parse(sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY) || "null");
    if (raw && raw.token && raw.role === "teacher") return raw;
  } catch {}
  return null;
}

function writeSession(sess) {
  pageSignedOut = false;
  const json = JSON.stringify(sess);
  try {
    sessionStorage.setItem(SESSION_KEY, json);
    localStorage.setItem(SESSION_KEY, json);
  } catch {}
}

function clearSession() {
  try {
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
  } catch {}
}

function session() {
  if (pageSignedOut) return null;
  return readSession();
}

function setLang(next) {
  lang = next === "en" ? "en" : "zh-HK";
  try { localStorage.setItem("dse-econ-bafs-lang", lang === "en" ? "en" : "zh-HK"); } catch {}
  const url = new URL(location.href);
  url.searchParams.set("lang", lang === "en" ? "en" : "zh-hk");
  history.replaceState(null, "", url);
  document.documentElement.lang = lang === "en" ? "en" : "zh-HK";
  document.title = t("title");
  $("btn-zh").classList.toggle("on", lang !== "en");
  $("btn-en").classList.toggle("on", lang === "en");
  $("page-title").textContent = t("title");
  $("lead").textContent = t("lead");
  $("home-link").textContent = "← " + t("back");

function safeHttp(raw) {
  try {
    const u = new URL(String(raw || "").trim());
    if (u.protocol !== "http:" && u.protocol !== "https:") return "";
    return u.href;
  } catch { return ""; }
}

function safePicture(raw) {
  const s = String(raw || "").trim();
  if (/^data:image\/(jpeg|png|webp|gif);base64,/i.test(s) && s.length <= 1800000) return s;
  return safeHttp(s);
}

function appendParagraphs(parent, text, className) {
  String(text || "").split(/\n{2,}/).forEach((para) => {
    const line = para.trim();
    if (line) parent.appendChild(el("p", className, line));
  });
}

function readImages() {
  try {
    const list = JSON.parse($("editor").dataset.images || "[]");
    return Array.isArray(list) ? list.filter(Boolean).slice(0, 4) : [];
  } catch {
    return [];
  }
}

function setImages(list) {
  const next = (list || []).filter(Boolean).slice(0, 4);
  $("editor").dataset.images = JSON.stringify(next);
  $("editor").dataset.image = next[0] || "";
  paintImages();
}

function paintImages() {
  const box = $("image-list");
  if (!box) return;
  box.replaceChildren();
  readImages().forEach((url, index) => {
    const card = el("div", "thumb-card");
    const img = document.createElement("img");
    img.alt = "";
    img.src = url;
    card.appendChild(img);
    const btn = el("button", "danger", t("imageRemove"));
    btn.type = "button";
    btn.addEventListener("click", function () {
      const all = readImages();
      all.splice(index, 1);
      setImages(all);
    });
    card.appendChild(btn);
    box.appendChild(card);
  });
}

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      if (!w || !h) {
        URL.revokeObjectURL(url);
        reject(new Error("image"));
        return;
      }
      const scale = Math.min(1, 1600 / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const preferPng = /png/i.test(file.type);
      const finish = (blob) => {
        if (!blob || blob.size > 1200000) reject(new Error("image"));
        else resolve(blob);
      };
      canvas.toBlob(function (blob) {
        if (blob && blob.size <= 1200000) {
          resolve(blob);
          return;
        }
        canvas.toBlob(finish, "image/jpeg", 0.72);
      }, preferPng ? "image/png" : "image/jpeg", 0.86);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error("image"));
    };
    img.src = url;
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function () {
      const s = String(reader.result || "");
      const i = s.indexOf(",");
      resolve(i >= 0 ? s.slice(i + 1) : s);
    };
    reader.onerror = function () { reject(new Error("image")); };
    reader.readAsDataURL(blob);
  });
}

function markMachine(code) {
  const cur = $("editor").dataset.machineLang || "";
  if (!cur) $("editor").dataset.machineLang = code;
  else if (cur !== code) $("editor").dataset.machineLang = "both";
}

function errText(code) {
  if (code === "auth") return t("authGone");
  if (code === "url") return t("urlBad");
  if (code === "type") return t("typeBad");
  if (code === "empty") return t("emptyPage");
  if (code === "fetch") return t("previewBad");
  if (code === "translate") return t("translateBad");
  if (code === "image" || code === "imageBig") return t("imageBad");
  if (code === "fields") return t("needTitle");
  if (code === "limit") return t("limit");
  if (code === "server") return t("server");
  return t("net");
}

function setStatus(id, message, bad) {
  const el = $(id);
  el.textContent = message || "";
  el.classList.toggle("bad", !!bad);
}

async function api(path, body) {
  const headers = { "content-type": "application/json" };
  const me = session();
  if (me && me.token && path.indexOf("/api/news") === 0) headers["x-mc-session"] = me.token;
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers,
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store"
  });
  let data = null;
  try { data = await res.json(); } catch { data = { ok: false, error: "net" }; }
  if (res.status === 401 || (data && data.error === "auth")) {
    const me = readSession();
    if (me && String(me.token || "").indexOf(".") >= 0) clearSession();
    else pageSignedOut = true;
    paintWho();
    $("login-box").hidden = false;
    $("editor").hidden = true;
  }
  return data || { ok: false, error: "net" };
}

function showDate(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return "";
  const [y, m, d] = iso.split("-");
  if (lang === "en") {
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return Number(d) + " " + months[Number(m) - 1] + " " + y;
  }
  return y + "年" + Number(m) + "月" + Number(d) + "日";
}

function preferredLang(item) {
  const chosen = cardLang[item.id];
  if (chosen === "zh" && item.titleZh) return "zh";
  if (chosen === "en" && item.titleEn) return "en";
  if (lang === "en" && item.titleEn) return "en";
  if (lang !== "en" && item.titleZh) return "zh";
  return item.titleEn ? "en" : "zh";
}

function matches(item) {
  if (filter === "econ" && item.subject === "bafs") return false;
  if (filter === "bafs" && item.subject === "econ") return false;
  const q = $("q").value.trim().toLowerCase();
  if (!q) return true;
  const blob = [item.titleZh, item.titleEn, item.summaryZh, item.summaryEn, item.source, item.writer, item.promptZh, item.promptEn].join(" ").toLowerCase();
  return blob.indexOf(q) >= 0;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function renderList() {
  const list = $("list");
  list.replaceChildren();
  const shown = items.filter(matches);
  if (!shown.length) {
    list.appendChild(el("div", "empty", items.length ? t("emptyFilter") : t("empty")));
    return;
  }
  const me = session();
  shown.forEach((item) => {
    const side = preferredLang(item);
    const card = el("article", "card" + (item.subject === "econ" || item.subject === "bafs" ? " " + item.subject : ""));
    const body = el("div", "card-body");
    const meta = el("div", "meta");
    if (item.pinned) meta.appendChild(el("span", "tag pin", t("pin")));
    if (item.subject === "econ" || item.subject === "both") meta.appendChild(el("span", "tag econ", "ECON"));
    if (item.subject === "bafs" || item.subject === "both") meta.appendChild(el("span", "tag bafs", "BAFS"));
    const mini = el("span", "lang lang-mini");
    ["zh", "en"].forEach((code) => {
      const has = code === "zh" ? item.titleZh || item.summaryZh : item.titleEn || item.summaryEn;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = code === "zh" ? "中" : "EN";
      btn.disabled = !has;
      btn.classList.toggle("on", side === code);
      btn.addEventListener("click", function () {
        cardLang[item.id] = code;
        renderList();
      });
      mini.appendChild(btn);
    });
    if (item.sourceLang && item.sourceLang === side) meta.appendChild(el("span", "tag", t("original")));
    meta.appendChild(mini);
    body.appendChild(meta);
    body.appendChild(el("h3", "", (side === "en" ? item.titleEn : item.titleZh) || item.titleZh || item.titleEn));
    const bits = [];
    if (item.writer && item.writer !== item.source) bits.push(t("credit") + item.writer);
    if (item.source) bits.push(item.source);
    else if (item.writer) bits.push(item.writer);
    if (item.publishedAt) bits.push(showDate(item.publishedAt));
    if (item.author) bits.push((lang === "en" ? t("by") + " " : t("by")) + item.author + (lang === "en" ? "" : t("added")));
    if (bits.length) body.appendChild(el("p", "by", bits.join(" · ")));
    const pictures = (Array.isArray(item.images) && item.images.length ? item.images : (item.image ? [item.image] : []))
      .map(safePicture)
      .filter(Boolean);
    if (pictures.length) {
      const shots = el("div", "shots");
      pictures.forEach((url) => {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        const img = document.createElement("img");
        img.className = "shot";
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.src = url;
        img.addEventListener("error", function () { link.remove(); });
        link.appendChild(img);
        shots.appendChild(link);
      });
      body.appendChild(shots);
    }
    const summary = side === "en" ? (item.summaryEn || item.summaryZh) : (item.summaryZh || item.summaryEn);
    appendParagraphs(body, summary, "sum");
    const machine = item.machineLang || "";
    const showingTranslation = (side === "en" && (machine === "en" || machine === "both"))
      || (side === "zh" && (machine === "zh" || machine === "both"));
    if (showingTranslation) body.appendChild(el("p", "disclaimer", t("disclaimer")));
    if (me) {
      const xref = item.sourceLang === "en" ? (item.bodyEn || item.bodyZh || "") : (item.bodyZh || item.bodyEn || "");
      if (xref && xref.trim() !== String(summary || "").trim()) {
        const box = el("details", "xref");
        const label = document.createElement("summary");
        label.textContent = t("xref");
        box.appendChild(label);
        appendParagraphs(box, xref, "xref-p");
        body.appendChild(box);
      }
    }
    const prompt = side === "en" ? (item.promptEn || item.promptZh) : (item.promptZh || item.promptEn);
    if (prompt) {
      const ask = el("div", "ask");
      ask.appendChild(el("b", "", t("ask")));
      ask.appendChild(document.createTextNode(prompt));
      body.appendChild(ask);
    }
    const actions = el("div", "actions");
    const href = safeHttp(item.url);
    if (href) {
      const a = el("a", "primary", t("open"));
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      actions.appendChild(a);
    }
    if (me) {
      const edit = el("button", "ghost", t("edit"));
      edit.type = "button";
      edit.addEventListener("click", function () { startEdit(item); });
      const del = el("button", "danger", t("del"));
      del.type = "button";
      del.addEventListener("click", function () { removeItem(item); });
      actions.appendChild(edit);
      actions.appendChild(del);
    }
    if (actions.childNodes.length) body.appendChild(actions);
    card.appendChild(body);
    list.appendChild(card);
  });
}

function fieldValues() {
  return {
    id: editingId,
    url: $("f-url").value.trim(),
    source: $("f-source").value.trim(),
    writer: $("f-writer").value.trim(),
    publishedAt: $("f-date").value,
    subject: $("f-subject").value,
    pinned: $("f-pin").checked,
    titleZh: $("f-title-zh").value.trim(),
    titleEn: $("f-title-en").value.trim(),
    summaryZh: $("f-sum-zh").value.trim(),
    summaryEn: $("f-sum-en").value.trim(),
    bodyZh: $("f-body-zh").value.trim(),
    bodyEn: $("f-body-en").value.trim(),
    promptZh: $("f-prompt-zh").value.trim(),
    promptEn: $("f-prompt-en").value.trim(),
    image: readImages()[0] || "",
    images: readImages(),
    machineLang: $("editor").dataset.machineLang || "",
    sourceLang: $("editor").dataset.sourceLang || ""
  };
}

function fillFields(item) {
  $("f-url").value = item.url || "";
  $("f-source").value = item.source || "";
  $("f-writer").value = item.writer || "";
  $("f-date").value = item.publishedAt || "";
  $("f-subject").value = item.subject || "both";
  $("f-pin").checked = !!item.pinned;
  $("f-title-zh").value = item.titleZh || "";
  $("f-title-en").value = item.titleEn || "";
  $("f-sum-zh").value = item.summaryZh || "";
  $("f-sum-en").value = item.summaryEn || "";
  $("f-body-zh").value = item.bodyZh || "";
  $("f-body-en").value = item.bodyEn || "";
  $("f-prompt-zh").value = item.promptZh || "";
  $("f-prompt-en").value = item.promptEn || "";
  $("editor").dataset.sourceLang = item.sourceLang || "";
  $("editor").dataset.machineLang = item.machineLang || "";
  const pictures = Array.isArray(item.images) && item.images.length ? item.images : (item.image ? [item.image] : []);
  setImages(pictures);
}

function openEditor(item) {
  if (!session()) {
    $("login-box").hidden = false;
    $("login-account").focus();
    return;
  }
  editingId = item && item.id ? item.id : "";
  fillFields(item || {});
  $("editor-title").textContent = editingId ? t("editorEdit") : t("editorNew");
  $("editor").hidden = false;
  $("login-box").hidden = true;
  pendingText = null;
  $("sum-review").hidden = true;
  setStatus("edit-status", "");
  setStatus("page-status", "");
  $("editor").scrollIntoView({ behavior: "smooth", block: "start" });
}

function startEdit(item) { openEditor(item); }

function closeEditor() {
  editingId = "";
  pendingText = null;
  $("sum-review").hidden = true;
  $("editor").hidden = true;
  setStatus("edit-status", "");
}

async function loadList() {
  try {
    const data = await api("/api/news");
    if (!data.ok) {
      setStatus("page-status", errText(data.error), true);
      $("list").replaceChildren(el("div", "empty", t("loadBad")));
      return;
    }
    items = Array.isArray(data.items) ? data.items : [];
    setStatus("page-status", "");
    renderList();
  } catch {
    setStatus("page-status", t("loadBad"), true);
    $("list").replaceChildren(el("div", "empty", t("loadBad")));
  }
}

function paintReviewNote() {
  if (!pendingText) return;
  const same = !pendingText.body || pendingText.body === pendingText.summary;
  $("btn-sum-no").disabled = same;
  $("review-body-title").hidden = same;
  $("body-proposal").hidden = same;
  $("body-proposal").textContent = pendingText.body || "";
  $("review-note").textContent = same
    ? t("reviewSame")
    : t("reviewNote").replace("{n}", String(pendingText.body.length));
}

function stashBody(side, body) {
  if (side === "en") {
    $("f-body-en").value = body || "";
    $("f-body-zh").value = "";
  } else {
    $("f-body-zh").value = body || "";
    $("f-body-en").value = "";
  }
}

function applyChoice(useBody) {
  if (!pendingText) return;
  const text = useBody ? (pendingText.body || pendingText.summary) : pendingText.summary;
  if (pendingText.side === "en") {
    $("f-sum-en").value = text;
    $("f-sum-zh").value = "";
  } else {
    $("f-sum-zh").value = text;
    $("f-sum-en").value = "";
  }
  $("sum-review").hidden = true;
  pendingText = null;
  setStatus("edit-status", useBody ? t("pastedBody") : t("pastedSummary"));
}

async function onPreview() {
  const url = $("f-url").value.trim();
  if (!safeHttp(url)) {
    setStatus("edit-status", t("urlBad"), true);
    return;
  }
  $("btn-preview").disabled = true;
  $("btn-preview").textContent = t("previewRun");
  pendingText = null;
  $("sum-review").hidden = true;
  setStatus("edit-status", t("previewRun"));
  try {
    const data = await api("/api/news", { op: "preview", url });
    if (!data.ok || !data.article) {
      setStatus("edit-status", errText((data && data.error) || "fetch"), true);
      return;
    }
    const article = data.article;
    const side = article.lang === "en" ? "en" : "zh";
    if (article.source) $("f-source").value = article.source;
    $("f-writer").value = article.writer || article.source || "";
    if (article.publishedAt) $("f-date").value = article.publishedAt;
    if (article.image && !readImages().length) setImages([article.image]);
    if (article.lang) $("editor").dataset.sourceLang = article.lang;
    $("editor").dataset.machineLang = "";
    const titleBox = side === "en" ? $("f-title-en") : $("f-title-zh");
    if (article.title) titleBox.value = article.title;
    const summary = article.summary || "";
    const body = article.body || summary;
    pendingText = summary || body ? { side, summary: summary || body, body } : null;
    stashBody(side, body);
    if (pendingText) {
      $("sum-proposal").textContent = pendingText.summary;
      $("review-title").textContent = t("reviewTitle");
      $("review-body-title").textContent = t("reviewBody");
      $("btn-sum-yes").textContent = t("reviewYes");
      $("btn-sum-no").textContent = t("reviewNo");
      paintReviewNote();
      $("sum-review").hidden = false;
    } else {
      $("sum-review").hidden = true;
    }
    const dup = !editingId && items.some((item) => item.url && item.url === article.url);
    const note = article.partial ? t("previewPartial") : t("previewOk");
    setStatus("edit-status", note + (dup ? " " + t("dup") : ""), article.partial);
  } catch {
    setStatus("edit-status", t("net"), true);
  } finally {
    $("btn-preview").disabled = false;
    $("btn-preview").textContent = t("preview");
  }
}

async function onTranslate() {
  const fields = fieldValues();
  $("btn-translate").disabled = true;
  $("btn-translate").textContent = t("translateRun");
  setStatus("edit-status", t("translateRun"));
  try {
    const data = await api("/api/news", Object.assign({ op: "translate" }, fields));
    if (!data.ok) {
      setStatus("edit-status", errText(data.error || "translate"), true);
      return;
    }
    if (!data.translated) {
      setStatus("edit-status", t("translateNone"), false);
      return;
    }
    const next = data.fields || {};
    ["titleZh", "titleEn", "summaryZh", "summaryEn", "promptZh", "promptEn"].forEach((key) => {
      const id = {
        titleZh: "f-title-zh",
        titleEn: "f-title-en",
        summaryZh: "f-sum-zh",
        summaryEn: "f-sum-en",
        promptZh: "f-prompt-zh",
        promptEn: "f-prompt-en"
      }[key];
      if (next[key] && !$(id).value.trim()) {
        $(id).value = next[key];
        markMachine(/En$/.test(key) ? "en" : "zh");
      }
    });
    setStatus("edit-status", t("translateOk"));
  } catch {
    setStatus("edit-status", t("net"), true);
  } finally {
    $("btn-translate").disabled = false;
    $("btn-translate").textContent = t("translate");
  }
}

async function onSave(e) {
  e.preventDefault();
  const item = fieldValues();
  if (!item.titleZh && !item.titleEn) {
    setStatus("edit-status", t("needTitle"), true);
    return;
  }
  $("btn-save").disabled = true;
  $("btn-save").textContent = t("saveRun");
  try {
    const data = await api("/api/news", { op: "save", item });
    if (!data.ok) {
      setStatus("edit-status", errText(data.error || "server"), true);
      return;
    }
    items = Array.isArray(data.items) ? data.items : items;
    closeEditor();
    renderList();
    setStatus("page-status", t("saveOk"));
  } catch {
    setStatus("edit-status", t("net"), true);
  } finally {
    $("btn-save").disabled = false;
    $("btn-save").textContent = t("save");
  }
}

async function removeItem(item) {
  if (!confirm(t("delAsk"))) return;
  const data = await api("/api/news", { op: "delete", id: item.id });
  if (!data.ok) {
    alert(errText(data.error || "server"));
    return;
  }
  items = Array.isArray(data.items) ? data.items : items.filter((row) => row.id !== item.id);
  if (editingId === item.id) closeEditor();
  renderList();
}

  paintWho();
  loadList();
});
$("btn-add").addEventListener("click", function () { openEditor(null); });
$("btn-cancel").addEventListener("click", closeEditor);
$("btn-preview").addEventListener("click", onPreview);
$("btn-sum-yes").addEventListener("click", function () { applyChoice(false); });
$("btn-sum-no").addEventListener("click", function () { applyChoice(true); });
$("btn-translate").addEventListener("click", onTranslate);
$("f-image").addEventListener("change", async function () {
  const file = $("f-image").files && $("f-image").files[0];
  $("f-image").value = "";
  if (!file) return;
  if (readImages().length >= 4) {
    setStatus("edit-status", t("imageLimit"), true);
    return;
  }
  $("f-image").disabled = true;
  setStatus("edit-status", t("imageRun"));
  try {
    const blob = await shrinkImage(file);
    const data = await blobToBase64(blob);
    const res = await api("/api/news", { op: "uploadImage", data });
    if (!res.ok || !res.image) {
      setStatus("edit-status", errText((res && res.error) || "image"), true);
      return;
    }
    setImages(readImages().concat([res.image]));
    setStatus("edit-status", "");
  } catch {
    setStatus("edit-status", t("imageBad"), true);
  } finally {
    $("f-image").disabled = false;
  }
});
$("f-url").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    onPreview();
  }
});
$("editor").addEventListener("submit", onSave);
$("login-box").addEventListener("submit", async function (e) {
  e.preventDefault();
  $("btn-login").disabled = true;
  setStatus("login-status", "");
  try {
    const res = await fetch("/api/mc", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        op: "teacherLogin",
        account: $("login-account").value.trim(),
        password: $("login-password").value
      })
    });
    const data = await res.json();
    if (!data || !data.ok || data.role !== "teacher" || !data.token) {
      setStatus("login-status", t("authBad"), true);
      return;
    }
    writeSession({ token: data.token, role: "teacher", account: data.account || "", name: data.name || "" });
    $("login-password").value = "";
    $("login-box").hidden = true;
    paintWho();
    loadList();
  } catch {
    setStatus("login-status", t("net"), true);
  } finally {
    $("btn-login").disabled = false;
  }
});
document.querySelectorAll("[data-filter]").forEach((btn) => {
  btn.addEventListener("click", function () {
    filter = btn.getAttribute("data-filter");
    document.querySelectorAll("[data-filter]").forEach((chip) => chip.classList.toggle("on", chip === btn));
    renderList();
  });
});
$("q").addEventListener("input", renderList);

setLang(readLang());
loadList();
</script>
</body>
</html>
