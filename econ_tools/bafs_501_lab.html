<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.HTMS_PAGE="app";</script>
<script src="../lib/htms-gate.js"></script>
<title>DSE BAFS｜501 財務分析教具</title>
<style>
:root{
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1e40af;
  --danger:#dc2626;--success:#16a34a;--warning:#f59e0b;--purple:#7c3aed;
  --bg:#f7f9fc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --radius:12px;
}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;color:var(--text);background:var(--bg);line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:16px 18px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.back-link{color:var(--primary);text-decoration:none;font-size:14px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:44px;touch-action:manipulation}
.seg button+button{border-left:1px solid var(--border)}
.seg button.active{background:var(--primary);color:#fff}
h1{font-size:24px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:44px;touch-action:manipulation}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.panel{display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.panel.active{display:block}
h2{font-size:20px;margin:0 0 8px;color:var(--primary-dark)}
h3{font-size:15px;margin:14px 0 8px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fafafa}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px}
input[type=range]{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
button.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;min-height:44px;touch-action:manipulation}
button.btn.primary{background:var(--primary);color:#fff}
button.btn.ghost{background:#fff;border:1px solid var(--border)}
.result{margin-top:14px;padding:14px;border-radius:10px;background:var(--primary-light);border:1px solid #bfdbfe}
.result.warn{background:#fff7ed;border-color:#fdba74}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.ok{background:#ecfdf5;border-color:#86efac}
.big{font-size:22px;font-weight:800;margin:4px 0}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
th,td{border:1px solid #dbe3ee;padding:8px 10px;vertical-align:top}
th[colspan]{background:#dbeafe;color:var(--primary-dark);font-size:13px}
.moved{font-weight:800;color:#c2410c}
.same{color:var(--muted)}
.en[hidden],.zh[hidden]{display:none!important}
.muted{color:var(--muted);font-size:12px}
.result ul{margin:8px 0 0;padding-left:1.2em}
.result li{margin:0 0 6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp .box h3{margin:0 0 8px}
@media(max-width:900px){
  .grid-2,.grid-3,.cmp{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back-link" id="link-home" href="../index.html"><span class="zh">← 返回首頁</span><span class="en" hidden>← Home</span></a>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="back-link" id="link-notes" href="../econ_notes/bafs_501_financial_analysis.html"><span class="zh">開啟筆記</span><span class="en" hidden>Open notes</span></a>
      <div class="seg">
        <button type="button" id="btn-zh" class="active">繁</button>
        <button type="button" id="btn-en">EN</button>
      </div>
    </div>
  </div>
  <h1><span class="zh">501 財務分析教具</span><span class="en" hidden>501 Financial Analysis lab</span></h1>
  <p class="lead"><span class="zh">課堂投影或學生自用。先選一個教具。繁／EN 會切換全部介面。</span><span class="en" hidden>For projection or student use. Pick a tool. 繁 / EN switches the whole interface.</span></p>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<script>
const TOOLS = [
  {id:"ratios", zh:"報表 → 四類比率", en:"Statements → four ratio types"},
  {id:"profit", zh:"盈利能力高低", en:"Profitability high / low"},
  {id:"liquidity", zh:"變現能力過高／過低", en:"Liquidity too high / too low"},
  {id:"solvency", zh:"償債能力／槓桿", en:"Solvency / gearing"},
  {id:"efficiency", zh:"管理效率高低", en:"Management efficiency"}
];
let lang = "zh";
const t = (zh, en) => lang === "en" ? en : zh;
const $ = (id) => document.getElementById(id);
const n = (id) => Number($(id).value || 0);
const pct = (x) => isFinite(x) ? (x * 100).toFixed(2) + "%" : "—";
const times = (x) => isFinite(x) ? x.toFixed(2) + (lang === "en" ? " times" : " 次") : "—";
const days = (x) => isFinite(x) ? x.toFixed(1) + (lang === "en" ? " days" : " 日") : "—";
const ratio1 = (x) => isFinite(x) ? x.toFixed(2) + " : 1" : "—";

function setLang(en, keepTool){
  lang = en ? "en" : "zh";
  document.documentElement.lang = en ? "en" : "zh-HK";
  document.querySelectorAll(".zh").forEach(el => { el.hidden = !!en; });
  document.querySelectorAll(".en").forEach(el => { el.hidden = !en; });
  $("btn-en").classList.toggle("active", en);
  $("btn-zh").classList.toggle("active", !en);
  const params = new URLSearchParams(location.search);
  params.set("lang", en ? "en" : "zh-hk");
  const active = document.querySelector(".tabs button.active");
  const id = (keepTool && active) ? active.dataset.id : ((location.hash||"#ratios").replace("#","") || "ratios");
  history.replaceState(null, "", "?" + params.toString() + "#" + id);
  $("link-home").href = "../index.html?lang=" + (en ? "en" : "zh-hk");
  $("link-notes").href = "../econ_notes/bafs_501_financial_analysis.html?lang=" + (en ? "en" : "zh-hk");
  document.title = t("DSE BAFS｜501 財務分析教具","DSE BAFS | 501 Financial Analysis lab");
  renderShell();
  show(TOOLS.some(x=>x.id===id)?id:"ratios");
}

function renderShell(){
  $("tabs").innerHTML = TOOLS.map(x =>
    `<button type="button" data-id="${x.id}">${t(x.zh, x.en)}</button>`
  ).join("");
  $("tabs").onclick = (e) => {
    const b = e.target.closest("button");
    if(b) show(b.dataset.id);
  };
}

function slider(id, zh, en, min, max, step, val){
  return `<div class="box">
    <label>${t(zh,en)} <span id="${id}-v"></span></label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">
  </div>`;
}
function showMoney(id){ $(id+"-v").textContent = "$" + n(id).toLocaleString(); }
function showPct(id){ $(id+"-v").textContent = n(id).toFixed(0) + "%"; }
function showTimes(id){ $(id+"-v").textContent = n(id).toFixed(1) + (lang==="en"?" times":" 次"); }

function show(id){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const mount = $("panels");
  mount.oninput = null;
  mount.onclick = null;
  const pages = {
    ratios: [ratiosHTML, initRatios],
    profit: [profitHTML, initProfit],
    liquidity: [liquidityHTML, initLiquidity],
    solvency: [solvencyHTML, initSolvency],
    efficiency: [efficiencyHTML, initEfficiency]
  };
  const page = pages[id] || pages.ratios;
  mount.innerHTML = page[0]();
  mount.querySelector(".panel").classList.add("active");
  page[1]();
  const params = new URLSearchParams(location.search);
  history.replaceState(null, "", "?" + params.toString() + "#" + id);
}

function field(id, zh, en, val){
  return `<div><label>${t(zh,en)}</label><input type="number" id="${id}" value="${val}"></div>`;
}

function ratiosHTML(){
  return `<div class="panel">
    <h2>${t("同一張表，四類故事","One set of statements, four stories")}</h2>
    <p class="hint">${t("預設是澄茶有限公司。四類比率連同應收／應付／存貨周轉日數一併計算。改一個數字，看哪幾條動、哪幾條不變。","Preset: Ching Cha Limited. All four types of ratios, plus days’ sales / purchases / inventory. Change one figure and see which ratios move.")}</p>
    <div class="row">
      <button class="btn ghost" id="r-reset">${t("還原澄茶預設","Reset Ching Cha preset")}</button>
    </div>
    <div class="grid grid-2">
      <div class="box">
        <h3>${t("損益表","Income statement")}</h3>
        <div class="grid grid-2">
          ${field("sales", "銷貨", "Sales", 500000)}
          ${field("cogs", "銷貨成本", "Cost of goods sold", 300000)}
          ${field("opex", "營業費用", "Operating expenses", 120000)}
          ${field("interest", "利息", "Interest", 10000)}
          ${field("tax", "稅項", "Tax", 14000)}
          ${field("inv0", "期初存貨", "Opening inventory", 40000)}
          ${field("inv1", "期末存貨", "Closing inventory", 50000)}
          ${field("csales", "賒銷（可等於銷貨）", "Credit sales", 500000)}
          ${field("cpur", "賒購", "Credit purchases", 310000)}
        </div>
      </div>
      <div class="box">
        <h3>${t("財務狀況表","Statement of financial position")}</h3>
        <div class="grid grid-2">
          ${field("nca", "非流動資產", "Non-current assets", 400000)}
          ${field("rec0", "期初應收貨款", "Opening trade receivables", 60000)}
          ${field("rec1", "期末應收貨款", "Closing trade receivables", 60000)}
          ${field("cash", "現金及其他流動資產", "Cash and other current assets", 40000)}
          ${field("pay0", "期初應付貨款", "Opening trade payables", 45000)}
          ${field("pay1", "期末應付貨款", "Closing trade payables", 45000)}
          ${field("ocl", "其他流動負債", "Other current liabilities", 30000)}
          ${field("ncl", "非流動負債", "Non-current liabilities", 100000)}
          ${field("sc", "股本", "Share capital", 200000)}
          ${field("prem", "股本溢價", "Share premium", 50000)}
          ${field("re", "留存利潤", "Retained profits", 125000)}
          ${field("pref", "優先股本", "Preference share capital", 0)}
        </div>
      </div>
    </div>
    <div class="result" id="r-out"></div>
  </div>`;
}

function snapshotRatios(){
  const sales = n("sales"), cogs = n("cogs"), opex = n("opex"), interest = n("interest"), tax = n("tax");
  const inv0 = n("inv0"), inv1 = n("inv1"), csales = n("csales"), cpur = n("cpur");
  const nca = n("nca"), rec0 = n("rec0"), rec1 = n("rec1"), cash = n("cash"), pay0 = n("pay0"), pay1 = n("pay1"), ocl = n("ocl");
  const ncl = n("ncl"), sc = n("sc"), prem = n("prem"), re = n("re"), pref = n("pref");
  const gp = sales - cogs;
  const ebit = gp - opex;
  const pbt = ebit - interest;
  const pat = pbt - tax;
  const ca = inv1 + rec1 + cash;
  const cl = pay1 + ocl;
  const equity = sc + prem + re;
  const ta = nca + ca;
  const ce = ncl + equity;
  const avgInv = (inv0 + inv1) / 2;
  const avgRec = (rec0 + rec1) / 2;
  const avgPay = (pay0 + pay1) / 2;
  const invt = avgInv ? cogs / avgInv : NaN;
  const art = avgRec ? csales / avgRec : NaN;
  const apt = avgPay ? cpur / avgPay : NaN;
  return {
    gp, ebit, pbt, pat, ca, cl, equity, ta, ce, avgInv, avgRec, avgPay,
    gpr: sales ? gp / sales : NaN,
    npr: sales ? pbt / sales : NaN,
    roce: ce ? ebit / ce : NaN,
    current: cl ? ca / cl : NaN,
    quick: cl ? (ca - inv1) / cl : NaN,
    gear: ce ? (ncl + pref) / ce : NaN,
    invt,
    invd: invt ? 365 / invt : NaN,
    art,
    ard: art ? 365 / art : NaN,
    apt,
    apd: apt ? 365 / apt : NaN,
    tat: ta ? sales / ta : NaN
  };
}

let baseSnap = null;
function paintRatios(){
  const s = snapshotRatios();
  const b = baseSnap || s;
  const mark = (now, was) => {
    if(!isFinite(now) || !isFinite(was)) return "";
    return Math.abs(now - was) > 1e-6 ? "moved" : "same";
  };
  const row = (zh, en, key, fmt, fzh, fen) => {
    const cls = mark(s[key], b[key]);
    const tag = cls === "moved" ? t("變了","changed") : t("沒變","unchanged");
    return `<tr><td>${t(zh,en)}</td><td class="muted">${t(fzh,fen)}</td><td class="${cls}">${fmt(s[key])}</td><td class="${cls}">${tag}</td></tr>`;
  };
  const head = (zh, en) => `<tr><th colspan="4">${t(zh,en)}</th></tr>`;
  $("r-out").innerHTML = `
    <p><strong>${t("先核對中間數","Check the stepping stones first")}</strong> —
      ${t("毛利","Gross profit")} $${Math.round(s.gp).toLocaleString()} ·
      ${t("營業利潤","Operating profit")} $${Math.round(s.ebit).toLocaleString()} ·
      ${t("稅前利潤","Profit before tax")} $${Math.round(s.pbt).toLocaleString()} ·
      ${t("稅後利潤","Profit after tax")} $${Math.round(s.pat).toLocaleString()} ·
      ${t("運用資金","Capital employed")} $${Math.round(s.ce).toLocaleString()}
    </p>
    <table>
      <thead><tr><th>${t("比率","Ratio")}</th><th>${t("公式","Formula")}</th><th>${t("現值","Now")}</th><th>${t("相對預設","vs preset")}</th></tr></thead>
      <tbody>
        ${head("盈利能力","Profitability")}
        ${row("毛利率","Gross profit ratio", "gpr", pct, "毛利 ÷ 銷貨 × 100%", "Gross profit ÷ Sales × 100%")}
        ${row("淨利率","Net profit ratio", "npr", pct, "稅前淨利 ÷ 銷貨 × 100%", "Net profit before tax ÷ Sales × 100%")}
        ${row("運用資金報酬率","ROCE", "roce", pct, "息稅前利潤 ÷ 運用資金 × 100%", "Profit before interest and tax ÷ Capital employed × 100%")}
        ${head("變現能力","Liquidity")}
        ${row("流動比率","Current ratio", "current", ratio1, "流動資產 ÷ 流動負債", "Current assets ÷ Current liabilities")}
        ${row("速動比率","Quick / acid-test ratio", "quick", ratio1, "（流動資產 − 存貨）÷ 流動負債", "(Current assets − Inventory) ÷ Current liabilities")}
        ${head("償債能力","Solvency")}
        ${row("槓桿比率","Gearing ratio", "gear", pct, "（非流動負債 + 優先股本）÷ 運用資金 × 100%", "(NCL + preference share capital) ÷ Capital employed × 100%")}
        ${head("管理效率","Management efficiency")}
        ${row("存貨周轉率","Inventory turnover", "invt", times, "銷貨成本 ÷ 平均存貨", "COGS ÷ Average inventory")}
        ${row("存貨周轉日數","Days’ inventory", "invd", days, "365 ÷ 存貨周轉率", "365 ÷ Inventory turnover")}
        ${row("應收貨款周轉率","Trade receivables turnover", "art", times, "賒銷 ÷ 平均應收貨款", "Credit sales ÷ Average trade receivables")}
        ${row("應收貨款周轉日數","Days’ sales in accounts receivable", "ard", days, "365 ÷ 應收貨款周轉率", "365 ÷ Trade receivables turnover")}
        ${row("應付貨款周轉率","Trade payables turnover", "apt", times, "賒購 ÷ 平均應付貨款", "Credit purchases ÷ Average trade payables")}
        ${row("應付貨款周轉日數","Days’ purchases in accounts payable", "apd", days, "365 ÷ 應付貨款周轉率", "365 ÷ Trade payables turnover")}
        ${row("總資產周轉率","Total assets turnover", "tat", times, "銷貨 ÷ 資產總額", "Sales ÷ Total assets")}
      </tbody>
    </table>
    <p class="muted">${t("橙字＝這次改動令它變了。試只改期末存貨：毛利率應沒變，流動／速動／存貨周轉及周轉日數應變了。","Orange = this edit moved the ratio. Try changing closing inventory only: gross profit ratio should stay put; current, quick, inventory turnover and days’ inventory should move.")}</p>
  `;
}
function initRatios(){
  baseSnap = snapshotRatios();
  paintRatios();
  $("panels").oninput = () => paintRatios();
  $("r-reset").onclick = () => {
    show("ratios");
  };
}

function liquidityHTML(){
  return `<div class="panel">
    <h2>${t("變現能力：1 到 2 最好","Liquidity: between 1 and 2 is best")}</h2>
    <p class="hint">${t("這個工具證明：流動／速動比率不是越高越好。拉到遠高於 1，資本可能閒置在流動資產；拉到低於 1，短期償債或有困難。","This tool shows current / quick ratios are not ‘higher is always better’. Far above 1 can mean idle current assets; below 1 can mean trouble paying short-term debts.")}</p>
    <div class="grid grid-3">
      <div class="box">
        <label>${t("流動資產（$）","Current assets ($)")} <span id="l-ca-v"></span></label>
        <input type="range" id="l-ca" min="20000" max="400000" step="5000" value="150000">
      </div>
      <div class="box">
        <label>${t("其中存貨（$）","of which inventory ($)")} <span id="l-inv-v"></span></label>
        <input type="range" id="l-inv" min="0" max="300000" step="5000" value="50000">
      </div>
      <div class="box">
        <label>${t("流動負債（$）","Current liabilities ($)")} <span id="l-cl-v"></span></label>
        <input type="range" id="l-cl" min="20000" max="250000" step="5000" value="75000">
      </div>
    </div>
    <div class="result" id="l-out"></div>
  </div>`;
}
function band(x){
  if(!isFinite(x)) return "na";
  if(x < 1) return "low";
  if(x > 2) return "high";
  return "ok";
}
function initLiquidity(){
  function paint(){
    let ca = n("l-ca"), inv = n("l-inv"), cl = n("l-cl");
    if(inv > ca){ inv = ca; $("l-inv").value = ca; }
    $("l-ca-v").textContent = "$" + ca.toLocaleString();
    $("l-inv-v").textContent = "$" + inv.toLocaleString();
    $("l-cl-v").textContent = "$" + cl.toLocaleString();
    const current = cl ? ca / cl : NaN;
    const quick = cl ? (ca - inv) / cl : NaN;
    const cb = band(current), qb = band(quick);
    let cls = "ok";
    if(cb === "low" || qb === "low") cls = "bad";
    else if(cb === "high" || qb === "high") cls = "warn";
    let comment;
    if(cb === "low" || qb === "low"){
      comment = t("過低：可能沒有足夠流動資產償還短期債務（即使有固定資產）。","Too low: the firm may have difficulty repaying short-term debts with current assets, even if it has valuable fixed assets.");
    } else if(cb === "high"){
      comment = t("過高：持有太多流動資產，沒有好好用來賺取利潤（例如購買非流動資產），長遠盈利能力或會降低。","Too high: capital is tied up in current assets, so the firm may not generate profit efficiently in the long term (e.g. should acquire non-current assets).");
    } else {
      comment = t("大約在 1 到 2：變現能力位置較理想。","Around 1 to 2: a better liquidity position.");
    }
    if(current > 2 && quick < 1){
      comment += " " + t("高流動但低速動：存貨佔流動資產比例較高，把存貨變現需要時間。","High current but low quick: a higher proportion of inventory; it takes time to convert inventory into cash.");
    }
    if(qb === "high"){
      comment += " " + t("速動比率高有兩個角度：變現能力較好，但管理效率上可能有過多閒置流動資產。","A high quick ratio has two lenses: better liquidity, but management efficiency may be weaker if current assets sit idle.");
    }
    $("l-out").className = "result " + cls;
    $("l-out").innerHTML = `
      <p class="big">${t("流動比率","Current ratio")} ${ratio1(current)}</p>
      <p class="big">${t("速動比率","Quick ratio")} ${ratio1(quick)}</p>
      <p>${comment}</p>
    `;
  }
  $("panels").oninput = paint;
  paint();
}

function firmFrom(prefix){
  const sales = n(prefix+"-sales");
  if(n(prefix+"-cogs") > sales) $(prefix+"-cogs").value = sales;
  const cogs = n(prefix+"-cogs"), opex = n(prefix+"-opex");
  const interest = n(prefix+"-int"), ce = n(prefix+"-ce");
  const gp = Math.max(0, sales - cogs);
  const ebit = gp - opex;
  const pbt = ebit - interest;
  return {
    sales, gp, ebit, pbt, ce,
    gpr: sales ? gp / sales : NaN,
    npr: sales ? pbt / sales : NaN,
    roce: ce ? ebit / ce : NaN
  };
}

function profitHTML(){
  return `<div class="panel">
    <h2>${t("盈利能力：毛利、淨利、ROCE 不是同一句","Profitability: GP, NP and ROCE are not the same sentence")}</h2>
    <p class="hint">${t("這個工具證明：淨利率較高不等於運用資金報酬率較高；從股東角度看要看 ROCE。毛利率較低但淨利率較高，通常是營業費用控制較好。預設：澄茶對軒茶。","This tool shows a higher net profit ratio does not mean a higher ROCE; from stockholders’ view look at ROCE. Lower gross profit ratio but higher net profit ratio usually means better operating-cost control. Preset: Ching Cha vs Hin Cha.")}</p>
    <div class="cmp">
      <div>
        <h3>${t("澄茶有限公司","Ching Cha Limited")}</h3>
        <div class="grid">
          ${slider("pa-sales","銷貨","Sales",100000,1200000,10000,500000)}
          ${slider("pa-cogs","銷貨成本","Cost of goods sold",50000,900000,10000,300000)}
          ${slider("pa-opex","營業費用","Operating expenses",10000,400000,5000,120000)}
          ${slider("pa-int","利息","Interest",0,80000,1000,10000)}
          ${slider("pa-ce","運用資金","Capital employed",80000,900000,5000,475000)}
        </div>
      </div>
      <div>
        <h3>${t("軒茶有限公司（梓軒家）","Hin Cha Limited (Tsz Hin’s family)")}</h3>
        <div class="grid">
          ${slider("pb-sales","銷貨","Sales",100000,1200000,10000,600000)}
          ${slider("pb-cogs","銷貨成本","Cost of goods sold",50000,900000,10000,420000)}
          ${slider("pb-opex","營業費用","Operating expenses",10000,400000,5000,100000)}
          ${slider("pb-int","利息","Interest",0,80000,1000,20000)}
          ${slider("pb-ce","運用資金","Capital employed",80000,900000,5000,360000)}
        </div>
      </div>
    </div>
    <div class="result" id="p-out"></div>
  </div>`;
}
function initProfit(){
  function paint(){
    ["pa","pb"].forEach(p => {
      if(n(p+"-cogs") > n(p+"-sales")) $(p+"-cogs").value = n(p+"-sales");
      ["sales","cogs","opex","int","ce"].forEach(k => showMoney(p+"-"+k));
    });
    const a = firmFrom("pa"), b = firmFrom("pb");
    const pts = [];
    if(a.gpr > b.gpr) pts.push(t("澄茶毛利率較高：扣除銷貨成本後、扣除費用前的盈利能力較高。","Ching Cha’s gross profit ratio is higher: profitability after COGS but before expenses is higher."));
    else if(a.gpr < b.gpr) pts.push(t("軒茶毛利率較高：扣除銷貨成本後、扣除費用前的盈利能力較高。","Hin Cha’s gross profit ratio is higher: profitability after COGS but before expenses is higher."));
    if(a.npr > b.npr) pts.push(t("澄茶淨利率較高：扣除所有成本和費用後，每一元銷貨賺得較多。","Ching Cha’s net profit ratio is higher: after all costs and expenses, each dollar of sales earns more."));
    else if(a.npr < b.npr) pts.push(t("軒茶淨利率較高：扣除所有成本和費用後，每一元銷貨賺得較多。","Hin Cha’s net profit ratio is higher: after all costs and expenses, each dollar of sales earns more."));
    if(a.gpr < b.gpr && a.npr > b.npr) pts.push(t("澄茶毛利率較低但淨利率較高：營業費用較少，管理費用效率較高。","Ching Cha has a lower gross profit ratio but a higher net profit ratio: operating expenses are lower / cost control is more efficient."));
    if(b.gpr < a.gpr && b.npr > a.npr) pts.push(t("軒茶毛利率較低但淨利率較高：營業費用較少，管理費用效率較高。","Hin Cha has a lower gross profit ratio but a higher net profit ratio: operating expenses are lower / cost control is more efficient."));
    if(a.roce > b.roce) pts.push(t("澄茶運用資金報酬率較高：運用資金賺取利潤的效率較高。從股東角度看，澄茶通常是較佳投資。","Ching Cha’s ROCE is higher: it uses capital more efficiently. From stockholders’ view Ching Cha is usually the better investment."));
    else if(a.roce < b.roce) pts.push(t("軒茶運用資金報酬率較高：運用資金賺取利潤的效率較高。從股東角度看，軒茶通常是較佳投資（即使淨利率未必較高）。","Hin Cha’s ROCE is higher: it uses capital more efficiently. From stockholders’ view Hin Cha is usually the better investment (even if its net profit ratio is not higher)."));
    if((a.npr > b.npr) && (a.roce < b.roce)) pts.push(t("陷阱：淨利率較高的公司，ROCE 也可以較低。考試不要只看淨利率就說「較佳投資」。","Trap: the firm with the higher net profit ratio can still have a lower ROCE. Do not pick the ‘better investment’ from net profit ratio alone."));
    let cls = "ok";
    if((a.npr > b.npr) && (a.roce < b.roce)) cls = "warn";
    $("p-out").className = "result " + cls;
    $("p-out").innerHTML = `
      <table>
        <thead><tr><th></th><th>${t("澄茶","Ching Cha")}</th><th>${t("軒茶","Hin Cha")}</th></tr></thead>
        <tbody>
          <tr><td>${t("毛利率","Gross profit ratio")}</td><td>${pct(a.gpr)}</td><td>${pct(b.gpr)}</td></tr>
          <tr><td>${t("淨利率","Net profit ratio")}</td><td>${pct(a.npr)}</td><td>${pct(b.npr)}</td></tr>
          <tr><td>${t("運用資金報酬率","ROCE")}</td><td>${pct(a.roce)}</td><td>${pct(b.roce)}</td></tr>
        </tbody>
      </table>
      <ul>${pts.map(x=>`<li>${x}</li>`).join("")}</ul>
    `;
  }
  $("panels").oninput = paint;
  paint();
}

function solvencyHTML(){
  return `<div class="panel">
    <h2>${t("償債能力：槓桿越高越危險","Solvency: higher gearing is riskier")}</h2>
    <p class="hint">${t("這個工具證明：槓桿比率越高，償還到期債務的能力越低。高於 50% 視為高槓桿；還要跟往年及同行比。無論賺蝕都要付利息。","This tool shows the higher the gearing, the lower the ability to repay debts when due. Above 50% is highly geared; still compare with last year and the industry. Interest must be paid even in a loss.")}</p>
    <div class="grid grid-3">
      ${slider("s-ncl","非流動負債（$）","Non-current liabilities ($)",0,800000,5000,100000)}
      ${slider("s-eq","股東資本（$）","Shareholders’ equity ($)",50000,800000,5000,375000)}
      ${slider("s-pref","優先股本（$）","Preference share capital ($)",0,200000,5000,0)}
      ${slider("s-ly","上年槓桿（%）","Last year’s gearing (%)",5,90,1,28)}
      ${slider("s-ind","同行槓桿（%）","Industry gearing (%)",5,90,1,45)}
    </div>
    <div class="result" id="s-out"></div>
  </div>`;
}
function initSolvency(){
  function paint(){
    showMoney("s-ncl"); showMoney("s-eq"); showMoney("s-pref");
    showPct("s-ly"); showPct("s-ind");
    const ncl = n("s-ncl"), eq = n("s-eq"), pref = n("s-pref");
    const ce = ncl + eq;
    const gear = ce ? (ncl + pref) / ce : NaN;
    const ly = n("s-ly") / 100, ind = n("s-ind") / 100;
    const pts = [];
    let cls = "ok";
    if(gear > 0.5){
      cls = "bad";
      pts.push(t("高於 50%：高槓桿。負債比重高，償債能力較低，財務危機較高。","Greater than 50%: highly geared. More debt in the capital structure, lower solvency, higher financial risk."));
      pts.push(t("無論獲利還是虧損，都必須定期支付利息（及優先股股息）和償還本金。經濟衰退時容易出現虧損，投資者視為高破產風險。","The firm must pay interest (and preference dividends) and repay principal even if it makes a loss. It is vulnerable in a downturn, so investors see high bankruptcy risk."));
    } else {
      pts.push(t("低於 50%：負債比重未視為高。槓桿越低，償還到期債務的能力通常越高。","Below 50%: not regarded as highly geared. Lower gearing usually means a stronger ability to repay debts when due."));
    }
    if(gear > ly) pts.push(t("對比上年：槓桿上升，償債能力變差，債務佔資本的比重增加。","Versus last year: gearing rose, so solvency worsened and debt is a larger share of capital."));
    else if(gear < ly) pts.push(t("對比上年：槓桿下降，償債能力改善。","Versus last year: gearing fell, so solvency improved."));
    if(gear > ind){ pts.push(t("對比同行：槓桿高於行業，相對同業財務風險較高。","Versus industry: gearing is above the norm, so financial risk is higher than peers.")); if(cls==="ok") cls="warn"; }
    else if(gear < ind) pts.push(t("對比同行：槓桿低於行業，相對同業較保守。","Versus industry: gearing is below the norm, so the firm is more conservative than peers."));
    $("s-out").className = "result " + cls;
    $("s-out").innerHTML = `
      <p class="big">${t("槓桿比率","Gearing ratio")} ${pct(gear)}</p>
      <p class="muted">${t("公式：（非流動負債 + 優先股本）÷（非流動負債 + 股東資本）","Formula: (NCL + preference share capital) ÷ (NCL + equity)")} · ${t("50% 線","50% line")} ${gear>0.5?t("已越過","crossed"):t("未越過","not crossed")}</p>
      <ul>${pts.map(x=>`<li>${x}</li>`).join("")}</ul>
    `;
  }
  $("panels").oninput = paint;
  paint();
}

function efficiencyHTML(){
  return `<div class="panel">
    <h2>${t("管理效率：越高越好，但存貨可以「高得異常」","Management efficiency: higher is better, except abnormally high inventory turnover")}</h2>
    <p class="hint">${t("這個工具證明：周轉率一般越高代表運用資產越有效率；存貨周轉異常高可能缺貨。應付貨款周轉低不一定是壞事（可能洽商到更佳賒帳期）。預設對照行業平均。","This tool shows higher turnover usually means assets are used more efficiently; abnormally high inventory turnover may mean a shortage. Low payables turnover is not always bad (better credit terms). Preset compared with industry averages.")}</p>
    <div class="grid grid-2">
      ${slider("e-cogs","銷貨成本（$）","COGS ($)",50000,600000,5000,300000)}
      ${slider("e-inv","平均存貨（$）","Average inventory ($)",5000,200000,1000,45000)}
      ${slider("e-csales","賒銷（$）","Credit sales ($)",50000,800000,5000,500000)}
      ${slider("e-rec","平均應收貨款（$）","Average trade receivables ($)",5000,250000,1000,60000)}
      ${slider("e-cpur","賒購（$）","Credit purchases ($)",50000,600000,5000,310000)}
      ${slider("e-pay","平均應付貨款（$）","Average trade payables ($)",5000,200000,1000,45000)}
      ${slider("e-sales","銷貨（$）","Sales ($)",50000,900000,5000,500000)}
      ${slider("e-ta","資產總額（$）","Total assets ($)",100000,1500000,10000,550000)}
    </div>
    <h3>${t("行業平均（次）","Industry average (times)")}</h3>
    <div class="grid grid-2">
      ${slider("e-i-inv","行業存貨周轉","Industry inventory turnover",1,25,0.5,8)}
      ${slider("e-i-ar","行業應收周轉","Industry receivables turnover",1,20,0.5,10)}
      ${slider("e-i-ap","行業應付周轉","Industry payables turnover",1,20,0.5,6)}
      ${slider("e-i-ta","行業總資產周轉","Industry total-assets turnover",0.2,3,0.1,1.2)}
    </div>
    <div class="result" id="e-out"></div>
  </div>`;
}
function initEfficiency(){
  function paint(){
    ["e-cogs","e-inv","e-csales","e-rec","e-cpur","e-pay","e-sales","e-ta"].forEach(showMoney);
    ["e-i-inv","e-i-ar","e-i-ap","e-i-ta"].forEach(showTimes);
    const invt = n("e-inv") ? n("e-cogs") / n("e-inv") : NaN;
    const art = n("e-rec") ? n("e-csales") / n("e-rec") : NaN;
    const apt = n("e-pay") ? n("e-cpur") / n("e-pay") : NaN;
    const tat = n("e-ta") ? n("e-sales") / n("e-ta") : NaN;
    const iInv = n("e-i-inv"), iAr = n("e-i-ar"), iAp = n("e-i-ap"), iTa = n("e-i-ta");
    const pts = [];
    let cls = "ok";
    if(invt > 18 || (isFinite(invt) && invt > iInv * 2)){
      cls = "warn";
      pts.push(t("存貨周轉異常高：可能存貨嚴重不足；突然有大量銷貨時會缺貨，最終損害銷貨。","Abnormally high inventory turnover: inventory may be too low. A sudden large sale can cause shortage and hurt sales."));
    } else if(invt > iInv) pts.push(t("存貨周轉高於行業：出售存貨較快，運用存貨效率較高。","Inventory turnover above industry: the firm sells inventory more quickly and uses it more efficiently."));
    else pts.push(t("存貨周轉低於行業：出售較慢，要支付更多持有成本，例如倉庫租金。","Inventory turnover below industry: sales are slower and holding costs (e.g. warehouse) are higher."));
    if(art < iAr){ pts.push(t("應收貨款周轉低於行業：很多應收未收回，壞帳機會上升。","Receivables turnover below industry: many slow-paying customers; bad-debt risk rises.")); if(cls==="ok") cls="warn"; }
    else pts.push(t("應收貨款周轉高於行業：收回應收貨款的效率較高。","Receivables turnover above industry: collections are more efficient."));
    if(apt < iAp) pts.push(t("應付貨款周轉低於行業：很多未償還應付，可能影響聲譽。但若能洽商更佳賒帳條款而較遲付款，周轉率下降不一定是壞事。","Payables turnover below industry: many unpaid payables, which may hurt reputation. If the firm negotiated better credit terms and pays later, a lower turnover is not necessarily bad."));
    else pts.push(t("應付貨款周轉高於行業：支付應付貨款較快。","Payables turnover above industry: the firm pays suppliers more quickly."));
    if(tat < 0.4 || tat < iTa * 0.5){
      cls = cls==="ok" ? "warn" : cls;
      pts.push(t("總資產周轉太低：太多閒置資產，運用資產賺取銷售收益的效率過低。","Total assets turnover too low: too many idle assets; efficiency in generating sales is weak."));
    } else if(tat > iTa) pts.push(t("總資產周轉高於行業：用較少資產賺取相同（或更多）銷售收益。","Total assets turnover above industry: fewer assets are used to generate the same (or more) sales."));
    else pts.push(t("總資產周轉低於行業：運用資產賺取銷售收益的效率較同行低。","Total assets turnover below industry: assets generate sales less efficiently than peers."));
    $("e-out").className = "result " + cls;
    $("e-out").innerHTML = `
      <table>
        <thead><tr><th>${t("比率","Ratio")}</th><th>${t("本公司","This firm")}</th><th>${t("周轉日數","Days")}</th><th>${t("行業","Industry")}</th></tr></thead>
        <tbody>
          <tr><td>${t("存貨周轉","Inventory turnover")}</td><td>${times(invt)}</td><td>${days(invt?365/invt:NaN)}</td><td>${times(iInv)}</td></tr>
          <tr><td>${t("應收貨款周轉","Receivables turnover")}</td><td>${times(art)}</td><td>${days(art?365/art:NaN)}</td><td>${times(iAr)}</td></tr>
          <tr><td>${t("應付貨款周轉","Payables turnover")}</td><td>${times(apt)}</td><td>${days(apt?365/apt:NaN)}</td><td>${times(iAp)}</td></tr>
          <tr><td>${t("總資產周轉","Total assets turnover")}</td><td>${times(tat)}</td><td class="muted">—</td><td>${times(iTa)}</td></tr>
        </tbody>
      </table>
      <ul>${pts.map(x=>`<li>${x}</li>`).join("")}</ul>
    `;
  }
  $("panels").oninput = paint;
  paint();
}
