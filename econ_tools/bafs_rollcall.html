<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.HTMS_PAGE="app";</script>
<script src="../lib/htms-gate.js"></script>
<title>金融啟航 BAFS銀行家體驗日 點名表</title>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1e40af;--bg:#f7f9fc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text-light:#64748b;
}
*{box-sizing:border-box}
body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:24px auto;background:var(--card);padding:24px;border-radius:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav{margin:0 0 12px}
.back{color:var(--primary-dark);font-weight:700;text-decoration:none}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.top h2{margin:0}
.sub{color:var(--text-light);margin-top:4px}
.stats{font-weight:700;text-align:right}
.meta{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 0}
.meta label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--primary-dark)}
.meta input{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;min-width:180px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button{padding:9px 13px;border:0;border-radius:8px;cursor:pointer;font-weight:700;font:inherit}
.primary{background:var(--primary);color:#fff}
.primary:hover{background:var(--primary-dark)}
.light{background:#e8edf3;color:var(--text)}
.status{min-height:1.3em;margin:0 0 12px;font-size:13px;color:var(--text-light)}
.status.ok{color:#166534;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.student{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #ddd;cursor:pointer}
.student input{width:19px;height:19px}
.id{font-weight:700;min-width:46px}
.print-only{display:none}
.missing{margin-top:16px;padding:12px;background:#fff6d8;border-radius:8px}
@media(max-width:560px){
  .wrap{margin:0;padding:16px;border-radius:0}
  .grid{grid-template-columns:1fr}
  .stats{text-align:left}
}
@media print{
  body{background:#fff;font-size:11pt}
  .wrap{max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}
  .nav,.tools,.missing,.meta,.status{display:none!important}
  .grid{grid-template-columns:1fr 1fr;gap:0 28px}
  .student{padding:5px 2px;break-inside:avoid}
  .student input{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid #000;border-radius:0}
  .student input:checked:after{content:"✓";display:block;font-size:14px;line-height:11px}
  .print-only{display:block}
  .top{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<main class="wrap">
<div class="nav"><a class="back" href="../index.html?sec=tools">← 返回工具</a></div>
<div class="top">
<div>
<h2>「金融啟航」BAFS銀行家體驗日</h2>
<div class="sub">中銀大廈參觀活動 · 學生點名表</div>
</div>
<div class="stats">總人數 39 ｜ 已到 <span id="present">0</span> ｜ 未到 <span id="absent">39</span></div>
</div>
<div class="meta">
<label>日期<input id="date" type="date"></label>
<label>負責老師<input id="teacher" type="text" autocomplete="name"></label>
</div>
<div class="print-only" id="print-meta"></div>
<div class="tools">
<button class="primary" id="save" type="button">儲存</button>
<button class="light" id="download" type="button">下載紀錄</button>
<button class="light" id="print" type="button">列印 / 儲存 PDF</button>
<button class="light" id="all" type="button">全部已到</button>
<button class="light" id="clear" type="button">清除全部</button>
<button class="light" id="copy" type="button">複製未到名單</button>
</div>
<p class="status" id="status"></p>
<div class="grid" id="list"></div>
<div class="missing"><b>未到學生：</b><span id="missing"></span></div>
</main>
<script>
const KEY = "bafs-boc-rollcall-v1";
const data = [
  ["3305","鄺浩暉"],["3313","熊啟男"],["4117","張恩瑜"],["4120","陳忻汝"],["4206","何逸坤"],
  ["4221","陳南茜"],["4224","周嘉慧"],["4231","譚思雅"],["4240","彭詩琦"],["4306","林昭穎"],
  ["4338","黃茵"],["4404","靳培軒"],["4413","彭敏哲"],["4416","葉瑋諾"],["4419","曾煒權"],
  ["4422","趙安妮"],["4426","簡梓茵"],["4427","林善恩"],["4437","王海澄"],["5102","陳柏霖"],
  ["5108","莊銘希"],["5131","李紫涵"],["5132","李明霏"],["5133","林炫佳"],["5208","紀鳴"],
  ["5213","劉望涵"],["5236","楊淇淇"],["5334","劉欣怡"],["5339","余諾圩"],["5410","康益晨"],
  ["5418","謝永成"],["5433","李思哲"],["5434","劉沛琪"],["5436","謝一心"],["5437","胡斯翹"],
  ["6329","鄺婥弦"],["6331","李莉筠"],["6335","施靜怡"],["6431","李芍頤"]
];
const list = document.getElementById("list");
const dateEl = document.getElementById("date");
const teacherEl = document.getElementById("teacher");
const statusEl = document.getElementById("status");
const printMeta = document.getElementById("print-meta");

data.forEach(([id, name], i) => {
  const label = document.createElement("label");
  label.className = "student";
  label.innerHTML = `<input type="checkbox" data-i="${i}" data-id="${id}"><span class="id">${id}</span><span>${name}</span>`;
  list.appendChild(label);
});

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function checks() {
  return [...list.querySelectorAll("input")];
}

function presentIds() {
  return checks().filter((box) => box.checked).map((box) => box.dataset.id);
}

function stamp(iso) {
  try {
    return new Date(iso).toLocaleString("zh-HK", {hour12: false});
  } catch {
    return "";
  }
}

function markStatus(ok, text) {
  statusEl.textContent = text;
  statusEl.classList.toggle("ok", ok);
}

function recordText() {
  const boxes = checks();
  const here = boxes.filter((box) => box.checked).map((box) => data[+box.dataset.i].join(" "));
  const away = boxes.filter((box) => !box.checked).map((box) => data[+box.dataset.i].join(" "));
  return [
    "「金融啟航」BAFS銀行家體驗日 點名表",
    "中銀大廈參觀活動",
    "日期：" + (dateEl.value || ""),
    "負責老師：" + (teacherEl.value || ""),
    "總人數 " + data.length + "｜已到 " + here.length + "｜未到 " + away.length,
    "",
    "已到：",
    here.length ? here.join("\n") : "（沒有）",
    "",
    "未到：",
    away.length ? away.join("\n") : "全部學生已到場"
  ].join("\n");
}

function syncPrintMeta() {
  printMeta.textContent = "日期：" + (dateEl.value || "________________") + "　負責老師：" + (teacherEl.value || "________________");
}

function update() {
  const boxes = checks();
  const present = boxes.filter((box) => box.checked).length;
  const missing = boxes.filter((box) => !box.checked).map((box) => data[+box.dataset.i].join(" "));
  document.getElementById("present").textContent = present;
  document.getElementById("absent").textContent = data.length - present;
  document.getElementById("missing").textContent = missing.length ? missing.join("、") : "全部學生已到場 ✓";
  syncPrintMeta();
}

function payload() {
  return {
    date: dateEl.value,
    teacher: teacherEl.value,
    present: presentIds(),
    savedAt: new Date().toISOString()
  };
}

function save(silent) {
  try {
    const rec = payload();
    localStorage.setItem(KEY, JSON.stringify(rec));
    if (!silent) markStatus(true, "已儲存於這部裝置 · " + stamp(rec.savedAt));
    return true;
  } catch {
    if (!silent) markStatus(false, "這部瀏覽器未能儲存。請按「下載紀錄」留下檔案。");
    return false;
  }
}

function restore() {
  let rec = null;
  try { rec = JSON.parse(localStorage.getItem(KEY) || "null"); } catch { rec = null; }
  dateEl.value = rec && rec.date ? rec.date : today();
  teacherEl.value = rec && rec.teacher ? rec.teacher : "";
  const ids = new Set(Array.isArray(rec && rec.present) ? rec.present : []);
  checks().forEach((box) => { box.checked = ids.has(box.dataset.id); });
  update();
  if (rec && rec.savedAt) markStatus(true, "已載入上次儲存 · " + stamp(rec.savedAt));
}

function downloadRecord() {
  save(true);
  const blob = new Blob([recordText()], {type: "text/plain;charset=utf-8"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "BAFS_rollcall_" + (dateEl.value || today()) + ".txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  markStatus(true, "已下載點名紀錄，並儲存於這部裝置。");
}

list.addEventListener("change", () => { update(); save(false); });
dateEl.addEventListener("input", () => { update(); save(false); });
teacherEl.addEventListener("input", () => { update(); save(false); });
document.getElementById("save").onclick = () => save(false);
document.getElementById("download").onclick = downloadRecord;
document.getElementById("print").onclick = () => { save(true); window.print(); };
document.getElementById("all").onclick = () => { checks().forEach((box) => { box.checked = true; }); update(); save(false); };
document.getElementById("clear").onclick = () => { checks().forEach((box) => { box.checked = false; }); update(); save(false); };
document.getElementById("copy").onclick = async () => {
  const text = checks().filter((box) => !box.checked).map((box) => data[+box.dataset.i].join(" ")).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    markStatus(true, text ? "已複製未到名單。" : "全部學生已到場，未到名單是空白。");
  } catch {
    markStatus(false, "未能複製。請改用「下載紀錄」。");
  }
};
restore();
</script>
</body>
</html>
