<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="htmlTitle">DSE ECON 貨幣市場均衡模擬器</title>
<style>
:root{
  --primary:#2563eb;
  --primary-light:#eff6ff;
  --primary-dark:#1e40af;
  --danger:#dc2626;
  --danger-light:#fef2f2;
  --success:#16a34a;
  --success-light:#f0fdf4;
  --warning:#f59e0b;
  --warning-light:#fffbeb;
  --purple:#7c3aed;
  --purple-light:#f5f3ff;
  --bg:#f7f9fc;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#1e293b;
  --text-light:#64748b;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:1200px;margin:24px auto;padding:0 16px;color:var(--text);background:#fff}
.lang-bar{text-align:right;margin-bottom:12px}
.lang-bar button{padding:6px 14px;margin-left:6px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:14px}
.lang-bar button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
h1{font-size:24px;margin:0 0 16px 0}
h2{font-size:18px;margin:0 0 12px 0}
h3{font-size:16px;margin:16px 0 8px 0}
h4{font-size:14px;margin:12px 0 6px 0}
.box{background:var(--bg);padding:20px;border-radius:var(--radius);margin-bottom:16px;border:1px solid var(--border)}
.card{background:var(--card);padding:16px;border-radius:10px;border:1px solid var(--border);margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}
.param-row{margin:10px 0}
.param-row label{display:block;font-size:14px;margin-bottom:4px;font-weight:500}
.param-row input[type=number]{padding:6px 10px;width:100%;font-size:14px;border:1px solid var(--border);border-radius:6px}
.param-row input[type=range]{width:100%;cursor:pointer}
.param-val{font-size:13px;color:var(--text-light);float:right}
.mode-bar{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{flex:1;padding:10px;border:2px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;transition:all .2s}
.mode-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:6px 12px;font-size:13px}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.scenario-btn{padding:8px 10px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;text-align:left;transition:all .15s;line-height:1.4}
.scenario-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.scenario-btn:active{transform:scale(.98)}
.canvas-wrap{background:#fff;border-radius:10px;border:1px solid var(--border);padding:12px;overflow-x:auto}
canvas{display:block;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:13px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-line{width:24px;height:3px;border-radius:2px}
.legend-dash{width:24px;height:0;border-top:3px dashed}
.eq-display{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.eq-card{padding:14px;border-radius:8px;text-align:center}
.eq-card.rate{background:var(--primary-light);border:1px solid #bfdbfe}
.eq-card.qty{background:var(--success-light);border:1px solid #bbf7d0}
.eq-card .label{font-size:13px;color:var(--text-light);margin-bottom:4px}
.eq-card .value{font-size:24px;font-weight:bold}
.eq-card .unit{font-size:14px;font-weight:normal;color:var(--text-light)}
.status-bar{padding:10px 14px;border-radius:8px;font-size:14px;margin-top:10px;display:none}
.status-bar.show{display:block}
.status-excess-supply{background:var(--danger-light);border-left:4px solid var(--danger);color:#991b1b}
.status-excess-demand{background:var(--warning-light);border-left:4px solid var(--warning);color:#92400e}
.status-equilibrium{background:var(--success-light);border-left:4px solid var(--success);color:#166534}
.compare-toggle{margin:12px 0}
.compare-area{display:none;margin-top:12px;padding:14px;background:var(--purple-light);border-radius:8px;border:1px solid #ddd6fe}
.compare-area.show{display:block}
.transmission-flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}
.trans-node{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;text-align:center;min-width:80px}
.trans-node.rate-up{background:var(--danger-light);border:1px solid #fecaca;color:#991b1b}
.trans-node.rate-down{background:var(--success-light);border:1px solid #bbf7d0;color:#166534}
.trans-node.neutral{background:var(--bg);border:1px solid var(--border);color:var(--text-light)}
.trans-arrow{font-size:18px;color:var(--text-light)}
.trans-detail{font-size:13px;color:var(--text-light);line-height:1.7;margin-top:8px}
.trans-detail .up{color:var(--danger);font-weight:bold}
.trans-detail .down{color:var(--success);font-weight:bold}
.skill-section{background:var(--warning-light);border:2px solid #fbbf24;border-radius:var(--radius);padding:20px;margin-bottom:16px}
.skill-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.skill-header h2{margin:0;font-size:20px;color:#92400e}
.skill-toggle{font-size:24px;color:#92400e;transition:transform .3s}
.skill-toggle.open{transform:rotate(45deg)}
.skill-content{display:none;margin-top:16px}
.skill-content.show{display:block}
.skill-tabs{display:flex;gap:4px;margin:16px 0;flex-wrap:wrap}
.skill-tab{padding:8px 16px;background:#e5e7eb;border:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:500}
.skill-tab.active{background:#fbbf24;color:#78350f}
.skill-tab-content{display:none;background:#fff;padding:16px;border-radius:0 8px 8px 8px;border:1px solid #e5e7eb;max-height:70vh;overflow-y:auto}
.skill-tab-content.active{display:block}
.concept-card{background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:14px;margin:10px 0}
.concept-card .concept-title{font-weight:bold;color:var(--primary-dark);font-size:15px;margin-bottom:6px}
.concept-card .concept-en{color:var(--text-light);font-size:12px;margin-left:8px}
.concept-card .concept-def{margin:6px 0;line-height:1.7;font-size:14px}
.concept-card .concept-formula{background:var(--primary-light);padding:8px 12px;border-radius:4px;font-family:monospace;margin:6px 0;font-size:13px}
.formula-card{background:var(--primary-light);border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin:8px 0}
.formula-card .formula-title{font-weight:bold;color:var(--primary-dark);margin-bottom:4px;font-size:14px}
.formula-card .formula-text{font-family:monospace;font-size:14px;background:#fff;padding:6px 10px;border-radius:4px;display:block}
.error-list{list-style:none;padding:0}
.error-list li{background:var(--danger-light);border-left:4px solid var(--danger);padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0;font-size:14px;line-height:1.6}
.error-list li .wrong{color:var(--danger);font-weight:bold}
.error-list li .right{color:var(--success);font-weight:bold}
.hidden{display:none!important}
.note{background:var(--warning-light);padding:12px;border-radius:8px;margin-top:12px;font-size:13px;line-height:1.6}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
th,td{border:1px solid var(--border);padding:8px;text-align:center}
th{background:var(--bg);font-weight:600}
</style>
<script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/dist/umd/i18next.min.js"></script>
</head>
<body>

<div class="lang-bar">
<button onclick="switchLanguage('zh-hk')" id="btn-zh-hk">繁</button>
<button onclick="switchLanguage('en')" id="btn-en">EN</button>
</div>

<h1 data-i18n="pageTitle">💰 DSE ECON｜貨幣市場均衡模擬器</h1>

<!-- 參數輸入區 -->
<div class="box">
<p data-i18n="assumption" style="margin:0 0 12px 0;font-size:14px;color:var(--text-light)">✅ 基礎假設：貨幣供應由政府決定，與利率無關；持有貨幣沒有利息收入</p>

<div class="mode-bar">
<button class="mode-btn active" id="mode-simple" onclick="switchMode('simple')" data-i18n="modeSimple">📊 簡單模式（淨顯示 Md）</button>
<button class="mode-btn" id="mode-decompose" onclick="switchMode('decompose')" data-i18n="modeDecompose">🔬 分解模式（顯示 Mt+Ma）</button>
</div>

<div class="grid-2">
<div>
<h3 data-i18n="sectionParams">⚙️ 參數設定</h3>

<div class="param-row">
<label><span data-i18n="labelMs">貨幣供應 Ms</span> <span class="param-val" id="val-ms">500</span></label>
<input type="range" id="param-ms" min="100" max="1000" value="500" step="10">
</div>

<div class="param-row">
<label><span data-i18n="labelMt">交易性貨幣需求 Mt</span> <span class="param-val" id="val-mt">200</span></label>
<input type="range" id="param-mt" min="50" max="500" value="200" step="10">
</div>

<div class="param-row">
<label><span data-i18n="labelMaMax">資產需求最大值 Ma₀（利率=0時）</span> <span class="param-val" id="val-mamax">400</span></label>
<input type="range" id="param-mamax" min="100" max="800" value="400" step="10">
</div>

<div class="param-row">
<label><span data-i18n="labelMaSlope">資產需求斜率（每單位利率減少量）</span> <span class="param-val" id="val-maslope">40</span></label>
<input type="range" id="param-maslope" min="10" max="100" value="40" step="5">
</div>

<div style="margin-top:12px;display:flex;gap:8px">
<button class="btn btn-outline btn-sm" onclick="resetParams()" data-i18n="btnReset">↺ 重設參數</button>
</div>
</div>

<div>
<h3 data-i18n="sectionScenario">🎯 情境模擬（一鍵觸發）</h3>
<p style="font-size:13px;color:var(--text-light);margin:0 0 8px 0" data-i18n="scenarioHint">點擊以下情境，觀察曲線如何移動及均衡點變化</p>
<div class="scenario-grid">
<button class="scenario-btn" onclick="applyScenario('incomeUp')" data-i18n="scIncomeUp">📈 收入上升 → Mt↑</button>
<button class="scenario-btn" onclick="applyScenario('incomeDown')" data-i18n="scIncomeDown">📉 收入下降 → Mt↓</button>
<button class="scenario-btn" onclick="applyScenario('priceUp')" data-i18n="scPriceUp">💹 物價上升 → Mt↑</button>
<button class="scenario-btn" onclick="applyScenario('priceDown')" data-i18n="scPriceDown">📉 物價下降 → Mt↓</button>
<button class="scenario-btn" onclick="applyScenario('riskUp')" data-i18n="scRiskUp">⚠️ 債券風險上升 → Ma↑</button>
<button class="scenario-btn" onclick="applyScenario('riskDown')" data-i18n="scRiskDown">🛡️ 債券風險下降 → Ma↓</button>
<button class="scenario-btn" onclick="applyScenario('techUp')" data-i18n="scTechUp">💳 支付技術進步 → Mt↓</button>
<button class="scenario-btn" onclick="applyScenario('wealthUp')" data-i18n="scWealthUp">💰 財富增加 → Ma↑</button>
<button class="scenario-btn" onclick="applyScenario('msUp')" data-i18n="scMsUp">🏦 央行增加貨幣供應 → Ms↑</button>
<button class="scenario-btn" onclick="applyScenario('msDown')" data-i18n="scMsDown">🏦 央行減少貨幣供應 → Ms↓</button>
</div>
</div>
</div>

<!-- 對比模式 -->
<div class="compare-toggle">
<label style="font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px">
<input type="checkbox" id="compare-check" onchange="toggleCompare()">
<span data-i18n="compareLabel">🔍 開啟對比模式（記錄變化前狀態）</span>
</label>
<div class="compare-area" id="compare-area">
<p style="margin:0 0 8px 0;font-size:13px;color:var(--purple)" data-i18n="compareHint">已記錄基準狀態。調整參數後，圖中淺色曲線為基準，深色曲線為當前。</p>
<button class="btn btn-outline btn-sm" onclick="snapshotBaseline()" data-i18n="btnSnapshot">📸 重新記錄基準</button>
</div>
</div>
</div>

<!-- 圖形區 -->
<div class="box">
<h2 data-i18n="sectionChart">📈 貨幣市場圖形</h2>
<div class="canvas-wrap">
<canvas id="chart" width="820" height="520"></canvas>
</div>
<div class="legend" id="legend"></div>

<div class="eq-display">
<div class="eq-card rate">
<div class="label" data-i18n="eqRate">均衡利率（i*）</div>
<div class="value"><span id="eq-rate">2.50</span><span class="unit"> %</span></div>
</div>
<div class="eq-card qty">
<div class="label" data-i18n="eqQty">均衡貨幣數量（M*）</div>
<div class="value"><span id="eq-qty">500</span><span class="unit" data-i18n="unitMoney"> 單位</span></div>
</div>
</div>

<div class="status-bar" id="status-bar"></div>
</div>

<!-- 利率傳導機制 -->
<div class="box">
<h2 data-i18n="sectionTransmission">🔗 利率 → 產出傳導機制（9.5）</h2>
<p style="font-size:13px;color:var(--text-light);margin:0 0 12px 0" data-i18n="transIntro">利率變化會透過以下兩個渠道影響總需求及產出水平</p>

<div class="transmission-flow" id="trans-flow"></div>

<div class="grid-2">
<div class="card">
<h4 data-i18n="transChannel1">渠道一：投資與消費</h4>
<div class="trans-detail" id="trans-invest"></div>
</div>
<div class="card">
<h4 data-i18n="transChannel2">渠道二：淨出口</h4>
<div class="trans-detail" id="trans-export"></div>
</div>
</div>

<div class="note" id="trans-summary"></div>
</div>

<!-- 答題技巧區（基礎版，後續補充真題） -->
<div class="skill-section">
<div class="skill-header" onclick="toggleSkill()">
<h2 data-i18n="skillTitle">📝 答題技巧與概念精解</h2>
<span class="skill-toggle" id="skill-toggle">+</span>
</div>
<div class="skill-content" id="skill-content">
<div class="skill-tabs">
<button class="skill-tab active" onclick="switchSkillTab(0)" data-i18n="tabConcept">關鍵概念</button>
<button class="skill-tab" onclick="switchSkillTab(1)" data-i18n="tabFormula">公式速查</button>
<button class="skill-tab" onclick="switchSkillTab(2)" data-i18n="tabError">常見錯誤</button>
</div>
<div class="skill-tab-content active" id="tabcontent-0"></div>
<div class="skill-tab-content" id="tabcontent-1"></div>
<div class="skill-tab-content" id="tabcontent-2"></div>
</div>
</div>

<script>
// ===== 語言包 =====
const i18nResources={

// ===== 全局狀態 =====
let curLang='zh-hk';
let curMode='simple';
let compareOn=false;
let baseline=null;
let i18nReady=false;
let appInited=false;

// ===== i18next 初始化 =====
function tryInitApp(){
  if(appInited)return;
  appInited=true;
  if(typeof initApp==='function')initApp();
}
setTimeout(tryInitApp,3000);
if(typeof i18next!=='undefined'){
  i18next.init({lng:'zh-HK',fallbackLng:'en',resources:i18nResources,interpolation:{escapeValue:false}},function(){
    i18nReady=true;
    tryInitApp();
  });
}else{
  tryInitApp();
}

function t(k){
  if(i18nReady&&typeof i18next!=='undefined'&&i18next.exists(k))return i18next.t(k);
  const lang=curLang==='en'?'en':'zh-HK';
  if(i18nResources[lang]&&i18nResources[lang].translation&&i18nResources[lang].translation[k]!==undefined)return i18nResources[lang].translation[k];
  if(i18nResources['zh-HK']&&i18nResources['zh-HK'].translation&&i18nResources['zh-HK'].translation[k]!==undefined)return i18nResources['zh-HK'].translation[k];
  return k;
}

function $(id){return document.getElementById(id);}

// ===== data-i18n 自動翻譯 =====
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    el.textContent=t(key);
  });
  document.title=t('htmlTitle');
}

// ===== 語言切換 =====
function switchLanguage(lang){
  curLang=lang;
  const targetLang=lang==='en'?'en':'zh-HK';
  if(i18nReady&&typeof i18next!=='undefined')i18next.changeLanguage(targetLang);
  document.querySelectorAll('.lang-bar button').forEach(b=>b.classList.remove('active'));
  $('btn-'+lang).classList.add('active');
  applyI18n();
  renderAll();
}

// ===== 模式切換 =====
function switchMode(m){
  curMode=m;
  $('mode-simple').classList.toggle('active',m==='simple');
  $('mode-decompose').classList.toggle('active',m==='decompose');
  drawChart();
}

// ===== 參數讀取 =====
function getParams(){
  return{
    ms:Number($('param-ms').value),
    mt:Number($('param-mt').value),
    maMax:Number($('param-mamax').value),
    maSlope:Number($('param-maslope').value)
  };
}

function updateParamLabels(){
  const p=getParams();
  $('val-ms').textContent=p.ms;
  $('val-mt').textContent=p.mt;
  $('val-mamax').textContent=p.maMax;
  $('val-maslope').textContent=p.maSlope;
}

// ===== 核心計算 =====
function calcEquilibrium(p){
  const{ms,mt,maMax,maSlope}=p;
  // Ma(i) = max(0, maMax - maSlope * i)
  // Md(i) = mt + Ma(i)
  // 拐點利率：i_corner = maMax / maSlope（此時 Ma=0, Md=mt）
  const iCorner=maMax/maSlope;
  // 均衡：ms = md(i*)
  // 如果 ms > mt：相交於向下傾斜部分，i* = (mt + maMax - ms)/maSlope
  // 如果 ms = mt：相交於拐點，i* = iCorner
  // 如果 ms < mt：無正常均衡
  if(ms<mt)return{valid:false};
  if(ms===mt)return{valid:true,rate:iCorner,qty:ms,iCorner};
  const rate=(mt+maMax-ms)/maSlope;
  if(rate<0)return{valid:false};
  return{valid:true,rate,qty:ms,iCorner};
}

// ===== 對比模式 =====
function toggleCompare(){
  compareOn=$('compare-check').checked;
  $('compare-area').classList.toggle('show',compareOn);
  if(compareOn&&!baseline)snapshotBaseline();
  drawChart();
}

function snapshotBaseline(){
  baseline=getParams();
}

// ===== 情境模擬 =====
function applyScenario(type){
  const p=getParams();
  let ms=p.ms,mt=p.mt,maMax=p.maMax,maSlope=p.maSlope;
  switch(type){
    case'incomeUp':mt=Math.min(500,mt+50);break;
    case'incomeDown':mt=Math.max(50,mt-50);break;
    case'priceUp':mt=Math.min(500,mt+40);break;
    case'priceDown':mt=Math.max(50,mt-40);break;
    case'riskUp':maMax=Math.min(800,maMax+60);break;
    case'riskDown':maMax=Math.max(100,maMax-60);break;
    case'techUp':mt=Math.max(50,mt-40);break;
    case'wealthUp':maMax=Math.min(800,maMax+50);break;
    case'msUp':ms=Math.min(1000,ms+80);break;
    case'msDown':ms=Math.max(100,ms-80);break;
  }
  $('param-ms').value=ms;
  $('param-mt').value=mt;
  $('param-mamax').value=maMax;
  $('param-maslope').value=maSlope;
  updateParamLabels();
  renderAll();
}

function resetParams(){
  $('param-ms').value=500;
  $('param-mt').value=200;
  $('param-mamax').value=400;
  $('param-maslope').value=40;
  updateParamLabels();
  renderAll();
}

// ===== Canvas 繪圖 =====
function drawChart(){
  const canvas=$('chart');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);

  const p=getParams();
  const eq=calcEquilibrium(p);

  // 坐標系範圍
  const padL=70,padR=30,padT=30,padB=60;
  const plotW=W-padL-padR;
  const plotH=H-padT-padB;

  // 動態範圍
  const maxX=Math.max(p.ms,p.mt+p.maMax,baseline?baseline.ms:0,baseline?baseline.mt+baseline.maMax:0)*1.15;
  const maxY=Math.max(p.iCorner||(p.maMax/p.maSlope),baseline?baseline.maMax/baseline.maSlope:0)*1.2;
  const xScale=plotW/maxX;
  const yScale=plotH/maxY;

  const X=x=>padL+x*xScale;
  const Y=y=>padT+plotH-y*yScale;

  // 網格
  ctx.strokeStyle='#e2e8f0';
  ctx.lineWidth=1;
  ctx.font='12px system-ui';
  ctx.fillStyle='#64748b';
  ctx.textAlign='center';
  const xStep=Math.ceil(maxX/10/50)*50;
  for(let x=0;x<=maxX;x+=xStep){
    ctx.beginPath();ctx.moveTo(X(x),Y(0));ctx.lineTo(X(x),Y(maxY));ctx.stroke();
    ctx.fillText(x,X(x),Y(0)+18);
  }
  ctx.textAlign='right';
  const yStep=Math.ceil(maxY/8);
  for(let y=0;y<=maxY;y+=yStep){
    ctx.beginPath();ctx.moveTo(X(0),Y(y));ctx.lineTo(X(maxX),Y(y));ctx.stroke();
    ctx.fillText(y.toFixed(0)+'%',X(0)-8,Y(y)+4);
  }

  // 坐標軸
  ctx.strokeStyle='#334155';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(maxX),Y(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),Y(maxY));ctx.stroke();

  // 軸標籤
  ctx.fillStyle='#1e293b';
  ctx.font='bold 14px system-ui';
  ctx.textAlign='center';
  ctx.fillText(curLang==='en'?'Quantity of Money':'貨幣數量',X(maxX/2),H-10);
  ctx.save();
  ctx.translate(18,Y(maxY/2));
  ctx.rotate(-Math.PI/2);
  ctx.fillText(curLang==='en'?'Nominal Interest Rate (i)':'名義利率 (i)',0,0);
  ctx.restore();

  // 畫曲線函數
  function drawCurves(params,alpha,isBaseline){
    const{ms,mt,maMax,maSlope}=params;
    const iCorner=maMax/maSlope;
    const lineW=isBaseline?2:3;

    // Ms 垂直線（藍色）
    ctx.strokeStyle=isBaseline?'rgba(37,99,235,'+alpha*0.4+')':'rgba(37,99,235,'+alpha+')';
    ctx.lineWidth=lineW;
    ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(X(ms),Y(0));ctx.lineTo(X(ms),Y(maxY));ctx.stroke();
    // Ms 標籤
    if(!isBaseline){ctx.fillStyle='rgba(37,99,235,'+alpha+')';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText('Ms',X(ms)+4,Y(maxY)-8);}

    if(curMode==='decompose'){
      // Mt 垂直線（綠色，虛線）
      ctx.strokeStyle=isBaseline?'rgba(22,163,74,'+alpha*0.4+')':'rgba(22,163,74,'+alpha+')';
      ctx.lineWidth=lineW;
      ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(X(mt),Y(0));ctx.lineTo(X(mt),Y(maxY));ctx.stroke();
      if(!isBaseline){ctx.fillStyle='rgba(22,163,74,'+alpha+')';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText('Mt',X(mt)+4,Y(maxY*0.5));}

      // Ma 向下斜線（橙色，虛線）
      ctx.strokeStyle=isBaseline?'rgba(245,158,11,'+alpha*0.4+')':'rgba(245,158,11,'+alpha+')';
      ctx.lineWidth=lineW;
      ctx.setLineDash([6,4]);
      ctx.beginPath();
      ctx.moveTo(X(0),Y(iCorner));
      ctx.lineTo(X(maMax),Y(0));
      ctx.stroke();
      if(!isBaseline){ctx.fillStyle='rgba(245,158,11,'+alpha+')';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText('Ma',X(maMax*0.5),Y(iCorner*0.5)-8);}
    }

    // Md 曲線（紅色，粗實線）
    // 垂直部分：x=mt, y從iCorner到maxY
    // 傾斜部分：從(mt, iCorner)到(mt+maMax, 0)
    ctx.strokeStyle=isBaseline?'rgba(220,38,38,'+alpha*0.4+')':'rgba(220,38,38,'+alpha+')';
    ctx.lineWidth=isBaseline?2:3.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(X(mt),Y(maxY));
    ctx.lineTo(X(mt),Y(iCorner));
    ctx.lineTo(X(mt+maMax),Y(0));
    ctx.stroke();
    if(!isBaseline){ctx.fillStyle='rgba(220,38,38,'+alpha+')';ctx.font='bold 14px system-ui';ctx.textAlign='left';ctx.fillText('Md',X(mt+maMax*0.6),Y(iCorner*0.4)-8);}
  }

  // 基準曲線（對比模式）
  if(compareOn&&baseline){
    drawCurves(baseline,0.5,true);
  }
  // 當前曲線
  drawCurves(p,1,false);

  // 均衡點
  if(eq.valid){
    // 均衡虛線
    ctx.strokeStyle='rgba(124,58,237,0.5)';
    ctx.lineWidth=1.5;
    ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(X(eq.qty),Y(0));ctx.lineTo(X(eq.qty),Y(eq.rate));ctx.stroke();
    ctx.beginPath();ctx.moveTo(X(0),Y(eq.rate));ctx.lineTo(X(eq.qty),Y(eq.rate));ctx.stroke();
    ctx.setLineDash([]);

    // 均衡點
    ctx.fillStyle='#7c3aed';
    ctx.beginPath();ctx.arc(X(eq.qty),Y(eq.rate),7,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

    // 均衡標籤
    ctx.fillStyle='#7c3aed';
    ctx.font='bold 13px system-ui';
    ctx.textAlign='left';
    ctx.fillText('E ('+eq.qty+', '+eq.rate.toFixed(2)+'%)',X(eq.qty)+10,Y(eq.rate)-10);
  }

  // 基準均衡點
  if(compareOn&&baseline){
    const bEq=calcEquilibrium(baseline);
    if(bEq.valid){
      ctx.fillStyle='rgba(124,58,237,0.4)';
      ctx.beginPath();ctx.arc(X(bEq.qty),Y(bEq.rate),6,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.stroke();
    }
  }
}

// ===== 圖例 =====
function renderLegend(){
  const items=[
    {color:'#2563eb',dash:false,label:t('legendMs')},
    {color:'#dc2626',dash:false,label:t('legendMd')},
    {color:'#7c3aed',dot:true,label:t('legendEq')}
  ];
  if(curMode==='decompose'){
    items.splice(1,0,{color:'#16a34a',dash:true,label:t('legendMt')});
    items.splice(2,0,{color:'#f59e0b',dash:true,label:t('legendMa')});
  }
  if(compareOn&&baseline){
    items.push({color:'#94a3b8',dash:false,label:t('legendBaseline'),alpha:true});
  }
  let h='';
  items.forEach(it=>{
    if(it.dot){
      h+='<div class="legend-item"><span style="width:14px;height:14px;border-radius:50%;background:'+it.color+';display:inline-block"></span>'+it.label+'</div>';
    }else if(it.dash){
      h+='<div class="legend-item"><span class="legend-dash" style="border-top-color:'+it.color+'"></span>'+it.label+'</div>';
    }else{
      h+='<div class="legend-item"><span class="legend-line" style="background:'+it.color+(it.alpha?';opacity:0.4':'')+'"></span>'+it.label+'</div>';
    }
  });
  $('legend').innerHTML=h;
}

// ===== 均衡顯示 =====
function renderEquilibrium(){
  const p=getParams();
  const eq=calcEquilibrium(p);
  const bar=$('status-bar');
  if(!eq.valid){
    $('eq-rate').textContent='—';
    $('eq-qty').textContent='—';
    bar.className='status-bar show status-excess-demand';
    bar.textContent=t('statusInvalid');
    return;
  }
  $('eq-rate').textContent=eq.rate.toFixed(2);
  $('eq-qty').textContent=eq.qty;
  bar.className='status-bar show status-equilibrium';
  bar.textContent=t('statusEquilibrium');
}

// ===== 傳導機制 =====
function renderTransmission(){
  const p=getParams();
  const eq=calcEquilibrium(p);
  const baselineRate=compareOn&&baseline?calcEquilibrium(baseline):null;
  const refRate=baselineRate&&baselineRate.valid?baselineRate.rate:2.5;
  const curRate=eq.valid?eq.rate:refRate;
  const diff=curRate-refRate;
  const isUp=diff>0.05;
  const isDown=diff<-0.05;

  // 流程圖
  const rateClass=isUp?'rate-up':(isDown?'rate-down':'neutral');
  const rateText=isUp?t('transRateUp'):(isDown?t('transRateDown'):t('transRateSame'));
  const arrow='<span class="trans-arrow">→</span>';

  let flow='<div class="trans-node '+rateClass+'">'+rateText+'</div>';
  flow+=arrow;
  flow+='<div class="trans-node neutral">'+t('transBorrowCost')+(isUp?' <span class="up">↑</span>':(isDown?' <span class="down">↓</span>':''))+'</div>';
  flow+=arrow;
  flow+='<div class="trans-node neutral">'+t('transInvest')+(isUp?' <span class="down">↓</span>':(isDown?' <span class="up">↑</span>':''))+'<br>'+t('transConsume')+(isUp?' <span class="down">↓</span>':(isDown?' <span class="up">↑</span>':''))+'</div>';
  flow+=arrow;
  flow+='<div class="trans-node neutral">'+t('transAD')+(isUp?' <span class="down">↓</span>':(isDown?' <span class="up">↑</span>':''))+'</div>';
  flow+=arrow;
  flow+='<div class="trans-node '+(isUp?'rate-down':(isDown?'rate-up':'neutral'))+'">'+t('transOutput')+(isUp?' <span class="down">↓</span>':(isDown?' <span class="up">↑</span>':''))+'</div>';
  $('trans-flow').innerHTML=flow;

  // 渠道一
  let inv='';
  if(isUp){
    inv+='<p><span class="up">↑</span> '+t('transBorrowCost')+' → 借貸變得更貴</p>';
    inv+='<p><span class="down">↓</span> '+t('transInvest')+'：企業減少投資</p>';
    inv+='<p><span class="down">↓</span> '+t('transConsume')+'：家庭減少耐用品消費</p>';
  }else if(isDown){
    inv+='<p><span class="down">↓</span> '+t('transBorrowCost')+' → 借貸變得便宜</p>';
    inv+='<p><span class="up">↑</span> '+t('transInvest')+'：企業增加投資</p>';
    inv+='<p><span class="up">↑</span> '+t('transConsume')+'：家庭增加耐用品消費</p>';
  }else{
    inv+='<p style="color:var(--text-light)">利率沒有明顯變化，對投資同消費冇直接影響。</p>';
  }
  $('trans-invest').innerHTML=inv;

  // 渠道二
  let exp='';
  if(isUp){
    exp+='<p><span class="up">↑</span> '+t('transCapitalFlow')+'：外資流入賺高息</p>';
    exp+='<p><span class="up">↑</span> '+t('transCurrency')+'：本幣需求增加</p>';
    exp+='<p><span class="down">↓</span> '+t('transExport')+'：出口貨變貴</p>';
    exp+='<p><span class="up">↑</span> '+t('transImport')+'：進口貨變平</p>';
    exp+='<p><span class="down">↓</span> '+t('transNetExport')+' = 出口 - 進口</p>';
  }else if(isDown){
    exp+='<p><span class="down">↓</span> 資金流出：低息令資金撤離</p>';
    exp+='<p><span class="down">↓</span> 本幣貶值：本幣需求減少</p>';
    exp+='<p><span class="up">↑</span> '+t('transExport')+'：出口貨變平</p>';
    exp+='<p><span class="down">↓</span> '+t('transImport')+'：進口貨變貴</p>';
    exp+='<p><span class="up">↑</span> '+t('transNetExport')+' = 出口 - 進口</p>';
  }else{
    exp+='<p style="color:var(--text-light)">利率沒有明顯變化，對匯率同淨出口冇直接影響。</p>';
  }
  $('trans-export').innerHTML=exp;

  // 總結
  const sumId=isUp?'transSummaryUp':(isDown?'transSummaryDown':'transSummarySame');
  $('trans-summary').innerHTML='<strong>'+t('sectionTransmission')+'：</strong>'+t(sumId);
}

function switchSkillTab(idx){
  document.querySelectorAll('.skill-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.skill-tab-content').forEach((c,i)=>c.classList.toggle('active',i===idx));
}

function toggleSkill(){
  $('skill-content').classList.toggle('show');
  $('skill-toggle').classList.toggle('open');
}

// ===== 總渲染 =====
function renderAll(){
  updateParamLabels();
  drawChart();
  renderLegend();
  renderEquilibrium();
  renderTransmission();
  renderSkill();
}

// ===== 初始化 =====
function initApp(){
  // 綁定參數事件
  ['param-ms','param-mt','param-mamax','param-maslope'].forEach(id=>{
    $(id).addEventListener('input',renderAll);
  });
  // URL 參數
  const params=new URLSearchParams(window.location.search);
  const lang=params.get('lang');
  switchLanguage((lang==='en'||lang==='zh-hk')?lang:'zh-hk');
}

window.onload=function(){
  if(i18nReady)initApp();
};
